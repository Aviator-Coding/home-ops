---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  chart:
    spec:
      chart: k8tz
      version: 0.19.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: k8tz
  interval: 30m
  values:
    namespace: system-controller

    replicaCount: 2

    timezone: America/New_York
    cronJobTimeZone: true

    # Injected bootstrap initContainers get requests==limits so they never
    # disqualify a pod from Guaranteed QoS (Talos runtime.OOMController skips
    # Guaranteed cgroups — the rook-ceph mons depend on this; a resource-less
    # k8tz init kept them Burstable despite requests==limits everywhere else).
    # Revisit when k8tz releases the imageVolume strategy (>0.19.0): it sets TZ
    # without any init container and K8s 1.36 already supports image volumes.
    initContainerResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-webhook-selfsign
          kind: Issuer

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8tz
              topologyKey: kubernetes.io/hostname

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Namespace
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: Namespace
              metadata:
                name: not-used
