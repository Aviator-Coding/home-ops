---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Homelab item `renovate` stores the key as a headerless one-line PKCS#1 body; the
# operator only parses a PEM, so the template wraps it. The installation is
# skrumbach's install of the `mortyops` App (not a secret).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-github-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-github-app
    template:
      engineVersion: v2
      metadata:
        labels:
          # Opt-in for githubAppReference once the operator's policy engine is on.
          renovate-operator.mogenius.com/allow-ref: "true"
      data:
        APP_ID: "{{ .BOT_APP_ID }}"
        INSTALL_ID: "78901211"
        # The PEM type sits in a variable so detect-private-key does not match the header.
        PEM: |-
          {{- $type := "RSA PRIVATE KEY" }}
          {{- if hasPrefix "-----BEGIN" .BOT_APP_PRIVATE_KEY }}
          {{ .BOT_APP_PRIVATE_KEY }}
          {{- else }}
          -----BEGIN {{ $type }}-----
          {{ .BOT_APP_PRIVATE_KEY }}
          -----END {{ $type }}-----
          {{- end }}
  dataFrom:
    - extract:
        key: renovate
