---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: home-ops
spec:
  schedule: "0 * * * *"
  # Self-update stays a reviewed PR: autoMerge path rule on kubernetes/apps/base/renovate/**.
  image: ghcr.io/renovatebot/renovate:44.221.1@sha256:e698014d6e64a8b8e096b624120dc4aa14b1cf0e5754fd86e3c38887de63f18a
  provider:
    name: github
  discoveryFilters:
    - skrumbach/home-ops
  githubAppReference:
    secretName: renovate-github-app
    appIdSecretKey: APP_ID
    installationIdSecretKey: INSTALL_ID
    pemSecretKey: PEM
  parallelism: 1
  renovateConfig:
    fileName: config.json
    inline: |
      {
        "onboarding": false,
        "requireConfig": "required",
        "internalChecksFilter": "strict",
        "platformCommit": "enabled",
        "configValidationError": true,
        "binarySource": "install",
        "gitNoVerify": ["commit", "push"]
      }
  extraEnv:
    - name: LOG_LEVEL
      value: info
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
