---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  values:
    fullnameOverride: *app
    config:
      # Match the retired CronJob: one attempt per run, the next hourly run is the retry.
      defaultJobBackoffLimit: 0
      jobTTLSecondsAfterFinished: 86400
    # Authentik OIDC (terraform/authentik/renovate-operator.tofu). authorization off: any
    # Authentik user who logs in is admin, as on the other household apps.
    auth:
      oidc:
        enabled: true
        issuerUrl: "https://auth.${SECRET_DOMAIN}/application/o/renovate-operator/"
        clientId: renovate-operator
        existingSecret: renovate-operator-oidc
        secretKey: client-secret
        sessionSecretKey: session-secret
        # TLS ends at envoy-internal; the auto-detected redirect would be http.
        redirectScheme: https
    authorization:
      enabled: false
    deployment:
      annotations:
        secret.reloader.stakater.com/reload: renovate-operator-oidc
    # Internal route only.
    route:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/description: Renovate runs and logs
        gethomepage.dev/group: observe
        gethomepage.dev/name: renovate
        gethomepage.dev/app: *app
        gethomepage.dev/pod-selector: app.kubernetes.io/name=renovate-operator
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
      hostnames:
        - "renovate.${SECRET_DOMAIN}"
      parentRefs:
        - name: envoy-internal
          namespace: network
          sectionName: https
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      dashboard:
        enabled: true
        labels:
          grafana_dashboard: "true"
        annotations:
          grafana_folder: Operators
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
