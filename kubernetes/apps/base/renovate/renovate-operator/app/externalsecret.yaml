---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Homelab item `renovate-operator-oidc`, copied once from the terraform/authentik outputs
# renovate_operator_client_secret / renovate_operator_session_secret. Skill `renovate`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate-operator-oidc
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-operator-oidc
  data:
    - secretKey: client-secret
      remoteRef:
        key: renovate-operator-oidc
        property: client-secret
    - secretKey: session-secret
      remoteRef:
        key: renovate-operator-oidc
        property: session-secret
