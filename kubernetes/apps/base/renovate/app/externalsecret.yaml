---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Homelab vault item `renovate` (BOT_APP_ID, BOT_APP_PRIVATE_KEY).
# Same GitHub App credentials as .github/workflows/renovate.yaml
# (actions/create-github-app-token). The private key may be a PEM or a
# headerless PKCS#1/PKCS#8 DER body; github-app-token.js accepts both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: renovate
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: renovate-secret
    template:
      engineVersion: v2
      data:
        GITHUB_APP_ID: "{{ .BOT_APP_ID }}"
        GITHUB_APP_PRIVATE_KEY: "{{ .BOT_APP_PRIVATE_KEY }}"
  dataFrom:
    - extract:
        key: renovate
