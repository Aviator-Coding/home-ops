---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app renovate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: renovate
  values:
    fullnameOverride: *app
    image:
      tag: 44.40.0
    cronjob:
      schedule: "0 */4 * * *"
      concurrencyPolicy: Forbid
      failedJobsHistoryLimit: 5
      successfulJobsHistoryLimit: 3
      startingDeadlineSeconds: 600
      jobBackoffLimit: "0"
      jobRestartPolicy: Never
      ttlSecondsAfterFinished: 86400
      activeDeadlineSeconds: 1800
      preCommand: |
        token="$(node /opt/github-app-token/github-app-token.js)"
        if [ -z "${token}" ]; then
          echo "github-app-token.js produced an empty token" >&2
          exit 1
        fi
        export RENOVATE_TOKEN="${token}"
    existingSecret: renovate-secret
    extraVolumes:
      - name: github-app-token
        configMap:
          name: renovate-github-app-token
    extraVolumeMounts:
      - name: github-app-token
        mountPath: /opt/github-app-token
        readOnly: true
    env:
      LOG_LEVEL: info
    renovate:
      config: |
        {
          "platform": "github",
          "autodiscover": true,
          "autodiscoverFilter": ["Aviator-Coding/home-ops"],
          "onboarding": false,
          "requireConfig": "required",
          "internalChecksFilter": "strict",
          "platformCommit": "enabled",
          "configValidationError": true,
          "binarySource": "install",
          "gitNoVerify": ["commit", "push"]
        }
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
    securityContext:
      runAsNonRoot: true
      runAsUser: 12021
      runAsGroup: 12021
      fsGroup: 12021
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi
    pod:
      annotations:
        secret.reloader.stakater.com/reload: renovate-secret
