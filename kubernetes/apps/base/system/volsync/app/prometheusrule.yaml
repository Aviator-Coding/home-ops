---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: volsync
spec:
  groups:
    - name: volsync.rules
      rules:
        - alert: VolSyncComponentAbsent
          expr: |
            absent(up{job="volsync-metrics"})
          annotations:
            summary: >-
              VolSync component has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        - alert: VolSyncVolumeOutOfSync
          expr: |
            volsync_volume_out_of_sync == 1
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} volume is out of sync
          for: 5m
          labels:
            severity: critical

        # No completed sync in the window. Synchronizing=True looks the same as a healthy mid-sync.
        # Skill `volsync-carveouts`.
        - alert: VolSyncSyncStalledCeph
          expr: |-
            label_replace(max by (obj_namespace, obj_name) (increase(volsync_sync_duration_seconds_count{role="source", obj_name=~".+-ceph$"}[6h])), "cachepvc", "volsync-src-$1-cache", "obj_name", "(.+)") == 0
            and on (obj_namespace, cachepvc) label_replace(label_replace(kube_persistentvolumeclaim_info, "obj_namespace", "$1", "namespace", "(.+)"), "cachepvc", "$1", "persistentvolumeclaim", "(.+)")
          for: 5m
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} has had no
              completed VolSync sync in over 6h (1.5x its 4h ceph schedule).
              Its ReplicationSource may still read Synchronizing=True the
              whole time, which looks identical to a healthy mid-sync. Check
              `kubectl -n {{ $labels.obj_namespace }} describe
              replicationsource {{ $labels.obj_name }}` for a wedged mover pod.
          labels:
            severity: critical

        - alert: VolSyncSyncStalledMinio
          expr: |-
            label_replace(max by (obj_namespace, obj_name) (increase(volsync_sync_duration_seconds_count{role="source", obj_name=~".+-minio$"}[9h])), "cachepvc", "volsync-src-$1-cache", "obj_name", "(.+)") == 0
            and on (obj_namespace, cachepvc) label_replace(label_replace(kube_persistentvolumeclaim_info, "obj_namespace", "$1", "namespace", "(.+)"), "cachepvc", "$1", "persistentvolumeclaim", "(.+)")
          for: 5m
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} has had no
              completed VolSync sync in over 9h (1.5x its 6h minio schedule).
              Check `kubectl -n {{ $labels.obj_namespace }} describe
              replicationsource {{ $labels.obj_name }}` for a wedged mover pod.
          labels:
            severity: critical

        - alert: VolSyncSyncStalledR2
          expr: |-
            label_replace(max by (obj_namespace, obj_name) (increase(volsync_sync_duration_seconds_count{role="source", obj_name=~".+-r2$"}[36h])), "cachepvc", "volsync-src-$1-cache", "obj_name", "(.+)") == 0
            and on (obj_namespace, cachepvc) label_replace(label_replace(kube_persistentvolumeclaim_info, "obj_namespace", "$1", "namespace", "(.+)"), "cachepvc", "$1", "persistentvolumeclaim", "(.+)")
          for: 5m
          annotations:
            summary: >-
              {{ $labels.obj_namespace }}/{{ $labels.obj_name }} has had no
              completed VolSync sync in over 36h (1.5x its daily r2
              schedule). Check `kubectl -n {{ $labels.obj_namespace }}
              describe replicationsource {{ $labels.obj_name }}` for a
              wedged mover pod.
          labels:
            severity: critical
