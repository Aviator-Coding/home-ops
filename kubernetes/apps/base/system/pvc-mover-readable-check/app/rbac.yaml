---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-mover-readable-check
  namespace: system
---
# Split-role design, copied deliberately from pvc-writable-check rather than invented here - see that app's rbac.
# Skill `pvc-integrity-checks`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-mover-readable-check-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  # Mover identities must come from the live CRs: KOPIUR_PUID/PGID are
  # overridden per claim and range from 0 to 10000 across the fleet, so a
  # component-default identity would measure the wrong thing entirely.
  - apiGroups: ["volsync.backube"]
    resources: ["replicationsources"]
    verbs: ["get", "list"]
  - apiGroups: ["kopiur.home-operations.com"]
    resources: ["snapshotpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-mover-readable-check-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-read
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-mover-readable-check-exec
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# One RoleBinding per namespace that holds a backup-covered claim. Keep in
# lockstep with EXCLUDED_NAMESPACES in cronjob.yaml: a namespace that gains a
# ReplicationSource or SnapshotPolicy and has no binding here is reported
# UNMEASURED (rbac) rather than silently passing.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-mover-readable-check-exec
  namespace: ai
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-mover-readable-check-exec
  namespace: downloads
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-mover-readable-check-exec
  namespace: home-automation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-mover-readable-check-exec
  namespace: media
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-mover-readable-check-exec
  namespace: selfhosted
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-mover-readable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-mover-readable-check
    namespace: system
