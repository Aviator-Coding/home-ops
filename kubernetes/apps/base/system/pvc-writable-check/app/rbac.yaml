---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: pvc-writable-check
  namespace: system
---
# Split-role design (captain decision after review of the first cut's cluster-wide pods/exec grant): (a) pvc-writable-check-read - pods get/list, ClusterRoleBinding, cluster-wide.
# Skill `pvc-integrity-checks`.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-writable-check-read
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: pvc-writable-check-read
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-writable-check-read
subjects:
  - kind: ServiceAccount
    name: pvc-writable-check
    namespace: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: pvc-writable-check-exec
rules:
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
# One RoleBinding per covered namespace. Excluded (no binding): rook-ceph,
# database, security. Keep in lockstep with EXCLUDED_NAMESPACES in cronjob.yaml.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pvc-writable-check-exec
  namespace: actions-runner-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: pvc-writable-check-exec
subjects:
  - kind: ServiceAccount
    name: pvc-writable-check
    namespace: system
