---
# Catches the bug class the 2026-08-30 empty-volume audit uncovered: an app
# whose pod securityContext/fsGroup doesn't match its volume's ownership can
# run Ready, pass every probe, stay Gatus-green, and get backed up on schedule
# while never actually writing a byte - because nothing checks that the
# container can *write* to the volume it mounts. VolSync backed up two such
# volumes (downloads/autobrr, selfhosted/rsshub-playwright) for months before
# it was noticed by chance. Design rationale, RBAC tradeoff, and the awkward
# cases this deliberately does NOT alert on: ../README.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: pvc-writable-check
  labels:
    app.kubernetes.io/name: pvc-writable-check
spec:
  # Every 6h: cheap enough (~1-3 min, read-only exec calls) to run often, and
  # frequent enough to catch a newly introduced permission bug within a
  # working day without adding meaningful load. Offset from the hour so it
  # doesn't pile onto the many other jobs scheduled exactly on :00.
  schedule: "17 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  # Keep failed Jobs around long enough for kube-state-metrics to keep
  # reporting kube_job_status_failed until an operator has seen the alert;
  # ttlSecondsAfterFinished below is the actual cleanup backstop.
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # One retry only: a real permission bug won't fix itself on retry, and
      # a single transient kubectl/API hiccup is already treated as a
      # per-target SKIP inside the script rather than a script failure, so a
      # whole-job retry is just insurance against something failing before
      # the per-target loop starts (e.g. the initial `kubectl get pods -A`).
      backoffLimit: 1
      ttlSecondsAfterFinished: 172800 # 48h - outlives the alert's `for:` window with room to investigate
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: pvc-writable-check
        spec:
          serviceAccountName: pvc-writable-check
          automountServiceAccountToken: true
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: check
              # renovate: datasource=docker depName=alpine/k8s
              image: alpine/k8s:1.36.2
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              env:
                - name: SKIP_ANNOTATION
                  value: pvc-writable-check.home-operations.com/skip
              command:
                - /bin/bash
                - -c
                - |
                  set -uo pipefail
                  # Deliberately not `set -e`: a single exec failure for one
                  # target must not abort the sweep of every other target.

                  echo "pvc-writable-check: sweep starting at $(date -u +%FT%TZ)"

                  PODS_JSON=$(kubectl get pods -A -o json)
                  if [[ -z "${PODS_JSON}" ]]; then
                    echo "FATAL: kubectl get pods -A returned no output" >&2
                    exit 1
                  fi

                  # One row per (pod, container, PVC volumeMount) that is not
                  # declared read-only and not opted out via SKIP_ANNOTATION.
                  # readOnly:true on the volumeMount is the primary way an app
                  # declares "this mount is expected to be read-only" - it is
                  # already how Kubernetes itself expresses that intent, so no
                  # new field is needed for it. SKIP_ANNOTATION is the escape
                  # hatch for the rarer case where an app can't express that
                  # at the volumeMount level (see README "Declaring expected
                  # read-only").
                  # Piped rather than a `<<<` here-string: this bash/image
                  # combination backs a here-string for a payload this size
                  # (a few hundred KB to multi-MB of pod JSON, cluster-sized)
                  # with an actual temp file, which fails outright under
                  # readOnlyRootFilesystem ("cannot create temp file for
                  # here-document") - found live while validating this check.
                  # A pipe never touches disk.
                  ROWS=$(printf '%s' "${PODS_JSON}" | jq -r --arg skipAnno "${SKIP_ANNOTATION}" '
                    .items[]
                    | select((.metadata.annotations // {})[$skipAnno] != "true")
                    | . as $pod
                    | (($pod.spec.volumes // [])
                        | map(select(.persistentVolumeClaim != null))
                        | map({(.name): .persistentVolumeClaim.claimName}) | add // {}) as $pvcVolumes
                    | (($pod.status.containerStatuses // [])
                        | map({(.name): (.state.running != null)}) | add // {}) as $running
                    | $pod.spec.containers[]
                    | . as $container
                    | (($container.volumeMounts // [])[]
                        | select($pvcVolumes[.name] != null)
                        | select(.readOnly != true)
                        | [$pod.metadata.namespace, $pod.metadata.name, $container.name,
                           $pvcVolumes[.name], .mountPath,
                           (($running[$container.name] // false) | tostring)]
                        | @tsv)
                  ')

                  CANDIDATES=0
                  CHECKED=0
                  WRITABLE=0
                  SKIPPED_NOT_RUNNING=0
                  SKIPPED_NO_EXEC_TOOL=0
                  SKIPPED_TRANSIENT=0
                  declare -a FAILURES=()

                  while IFS=$'\t' read -r ns pod container claim mountpath running; do
                    [[ -z "${ns}" ]] && continue
                    CANDIDATES=$((CANDIDATES + 1))

                    # Awkward case: scaled-to-zero apps and claims with no pod
                    # at all never produce a row here in the first place
                    # (discovery is pod-driven). This branch is specifically
                    # for a pod that exists but whose container isn't
                    # currently in a running state - e.g. CrashLoopBackOff,
                    # ContainerCreating, or a Job pod whose container already
                    # exited by the time we got to it. None of that is
                    # evidence the volume is unwritable, so it's a skip, not a
                    # failure.
                    if [[ "${running}" != "true" ]]; then
                      echo "SKIP  (container not running)      ${ns}/${pod} [${container}] ${mountpath} (claim=${claim})"
                      SKIPPED_NOT_RUNNING=$((SKIPPED_NOT_RUNNING + 1))
                      continue
                    fi

                    CHECKED=$((CHECKED + 1))

                    # `test -w <path>` as a direct argv exec (no shell
                    # invocation) is a single access(2)/stat(2)-style check:
                    # it does not write anything, so this is safe against
                    # every pod in the cluster including stateful storage
                    # (Ceph mons, Postgres) and against a mount that is
                    # genuinely read-only. Passing mountpath as its own argv
                    # element (never interpolated into a shell string) means
                    # a pod that put shell metacharacters in its own mountPath
                    # can't inject anything here.
                    OUT=$(timeout 15 kubectl exec -n "${ns}" "${pod}" -c "${container}" -- test -w "${mountpath}" 2>&1)
                    RC=$?

                    if [[ ${RC} -eq 0 ]]; then
                      echo "WRITABLE                           ${ns}/${pod} [${container}] ${mountpath} (claim=${claim})"
                      WRITABLE=$((WRITABLE + 1))
                      continue
                    fi

                    # Awkward case: containers without a shell (distroless /
                    # scratch images) don't ship a standalone `test` binary
                    # either. Retry through `sh`, still passing the path as a
                    # separate argv element (positional parameter $1), never
                    # spliced into the script text.
                    if grep -qF '"test": executable file not found' <<<"${OUT}"; then
                      OUT2=$(timeout 15 kubectl exec -n "${ns}" "${pod}" -c "${container}" -- sh -c 'test -w "$1"' sh "${mountpath}" 2>&1)
                      RC2=$?
                      if [[ ${RC2} -eq 0 ]]; then
                        echo "WRITABLE (via sh)                  ${ns}/${pod} [${container}] ${mountpath} (claim=${claim})"
                        WRITABLE=$((WRITABLE + 1))
                        continue
                      elif grep -qF '"sh": executable file not found' <<<"${OUT2}"; then
                        echo "SKIP  (no shell or test binary)    ${ns}/${pod} [${container}] ${mountpath} (claim=${claim})"
                        SKIPPED_NO_EXEC_TOOL=$((SKIPPED_NO_EXEC_TOOL + 1))
                        continue
                      elif grep -qE '^error:|cannot exec into a container|unable to upgrade connection|container not found' <<<"${OUT2}"; then
                        echo "SKIP  (exec unavailable, transient) ${ns}/${pod} [${container}] ${mountpath} (claim=${claim}) - ${OUT2}"
                        SKIPPED_TRANSIENT=$((SKIPPED_TRANSIENT + 1))
                        continue
                      else
                        echo "NOT WRITABLE                       ${ns}/${pod} [${container}] ${mountpath} (claim=${claim}) - ${OUT2}"
                        FAILURES+=("${ns}/${claim} (pod ${pod}, container ${container}, path ${mountpath})")
                        continue
                      fi
                    fi

                    # Awkward case: the pod existed a moment ago but is being
                    # deleted/rescheduled right now, or some other transient
                    # API-server/kubelet exec error. Any kubectl-level error
                    # we don't specifically recognize is treated as
                    # inconclusive, never as a failure - the one thing that
                    # counts as a genuine failure is a clean process exit with
                    # code 1 and no such error prefix, which is exactly what
                    # `test -w` prints when it ran fine and said no.
                    if grep -qE '^error:|cannot exec into a container|unable to upgrade connection|container not found' <<<"${OUT}"; then
                      echo "SKIP  (exec unavailable, transient) ${ns}/${pod} [${container}] ${mountpath} (claim=${claim}) - ${OUT}"
                      SKIPPED_TRANSIENT=$((SKIPPED_TRANSIENT + 1))
                      continue
                    fi

                    echo "NOT WRITABLE                       ${ns}/${pod} [${container}] ${mountpath} (claim=${claim}) - ${OUT}"
                    FAILURES+=("${ns}/${claim} (pod ${pod}, container ${container}, path ${mountpath})")
                  # Process substitution, not a `<<<` here-string: same
                  # temp-file concern as above (ROWS is small today, but this
                  # keeps the whole script free of a construct that silently
                  # depends on payload size), and it still runs the loop in
                  # the current shell so FAILURES survives past the loop.
                  done < <(printf '%s' "${ROWS}")

                  echo ""
                  echo "pvc-writable-check: sweep finished at $(date -u +%FT%TZ)"
                  echo "  candidates=${CANDIDATES} checked=${CHECKED} writable=${WRITABLE}"
                  echo "  skipped_not_running=${SKIPPED_NOT_RUNNING} skipped_no_exec_tool=${SKIPPED_NO_EXEC_TOOL} skipped_transient=${SKIPPED_TRANSIENT}"
                  echo "  not_writable=${#FAILURES[@]}"

                  if [[ ${#FAILURES[@]} -gt 0 ]]; then
                    echo ""
                    echo "FAILURES - application cannot write to its own mounted volume:"
                    for f in "${FAILURES[@]}"; do
                      echo "  - ${f}"
                    done
                    exit 1
                  fi

                  exit 0
              resources:
                requests:
                  cpu: 20m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
