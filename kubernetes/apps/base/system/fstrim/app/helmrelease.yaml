---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fstrim
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      fstrim:
        type: cronjob

        cronjob:
          schedule: "0 0 * * 1"
          startingDeadlineSeconds: 600
          parallelism: 3
          # A run can outlast its window when many blocks were never discarded.
          concurrencyPolicy: Forbid
          backoffLimit: 0

        pod:
          hostNetwork: true
          hostPID: true
          # Honor ignores PreferNoSchedule. Kept so a future hard taint cannot make DoNotSchedule refuse a pod.
          # See skill node-scheduling.
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              nodeTaintsPolicy: Honor
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: fstrim

        containers:
          app:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                set -eu
                KUBELET_PID="$(pidof /usr/local/bin/kubelet)"
                NS="--mount=/host/proc/${KUBELET_PID}/ns/mnt --net=/host/proc/${KUBELET_PID}/ns/net"

                # One mount per device. Never grep -v kubelet: every Ceph PV is under /var/lib/kubelet.
                # Rank 0 globalmount, 1 whole filesystem, 2 bind. Skip read-only. Dedupe on major:minor.
                nsenter $NS -- awk '
                  { sep = 0
                    for (i = 7; i <= NF; i++) if ($i == "-") { sep = i; break }
                    if (!sep)                       next
                    if ($(sep + 2) !~ /^\/dev\//)   next
                    if ($6 ~ /(^|,)ro(,|$)/)        next
                    if ($5 ~ /\/globalmount(\/|$)/) rank = 0
                    else if ($4 == "/")             rank = 1
                    else                            rank = 2
                    if (!($3 in keep) || rank < rk[$3] ||
                        (rank == rk[$3] && length($4) < length(rt[$3]))) {
                      keep[$3] = $5; rk[$3] = rank; rt[$3] = $4
                    }
                  }
                  END { for (dev in keep) print keep[dev] }
                ' /proc/self/mountinfo > /tmp/fstrim-targets.raw
                sort /tmp/fstrim-targets.raw > /tmp/fstrim-targets

                echo "$(hostname): trimming $(wc -l < /tmp/fstrim-targets) device(s)"

                # Report per-device and fail the run if any device could not be trimmed.
                rc=0
                while read -r target; do
                  nsenter $NS -- fstrim -v "$target" || rc=1
                done < /tmp/fstrim-targets
                exit "$rc"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              privileged: true

    persistence:
      procfs:
        type: hostPath
        hostPath: /proc
        hostPathType: Directory
        globalMounts:
          - path: /host/proc
            readOnly: true
      netfs:
        type: hostPath
        hostPath: /sys
        hostPathType: Directory
        globalMounts:
          - path: /host/net
            readOnly: true
