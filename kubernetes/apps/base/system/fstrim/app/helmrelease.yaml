---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fstrim
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
  interval: 30m
  values:
    controllers:
      fstrim:
        type: cronjob

        cronjob:
          schedule: "0 0 * * 1"
          startingDeadlineSeconds: 600
          parallelism: 3 # Set this to your number of nodes
          # The first pass has ~951 GiB of never-discarded blocks to work through
          # on downloads/sabnzbd-incomplete alone, so a run can outlast its window.
          concurrencyPolicy: Forbid

        pod:
          hostNetwork: true
          hostPID: true
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: fstrim

        containers:
          app:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - "/bin/sh"
              - "-c"
            args:
              - |
                set -eu
                KUBELET_PID="$(pidof /usr/local/bin/kubelet)"
                NS="--mount=/host/proc/${KUBELET_PID}/ns/mnt --net=/host/proc/${KUBELET_PID}/ns/net"

                # Select exactly one mount per block device from the kubelet's mount
                # namespace.
                #
                # This job started life as the common upstream node-fstrim recipe,
                # whose "cat /proc/self/mountinfo | grep -v kubelet" filter is aimed
                # at node filesystems. On this cluster every Ceph PV is mounted under
                # /var/lib/kubelet, so that filter excluded 100% of PersistentVolumes
                # and left no working discard path anywhere (it also selected the
                # read-only /var/mnt and the regular file /etc/nfsmount.conf, both of
                # which FITRIM rejects, and trimmed the one node partition 6x).
                #
                # Rank each candidate mount, lowest wins:
                #   0  a CSI .../globalmount/... path - the staging mount, exactly one
                #      per PV and always rw
                #   1  any other whole-filesystem mount (mountinfo root "/")
                #   2  a bind mount of a subtree - how the Talos EPHEMERAL xfs
                #      partition appears here; its own "/var" mount exists only in the
                #      host namespace, not in the kubelet one
                # Ties break toward the mount closest to the filesystem root. Read-only
                # mounts are skipped because FITRIM fails on them. De-duplication is on
                # major:minor, so each device is trimmed once, not once per bind mount.
                nsenter $NS -- awk '
                  { sep = 0
                    for (i = 7; i <= NF; i++) if ($i == "-") { sep = i; break }
                    if (!sep)                       next
                    if ($(sep + 2) !~ /^\/dev\//)   next
                    if ($6 ~ /(^|,)ro(,|$)/)        next
                    if ($5 ~ /\/globalmount(\/|$)/) rank = 0
                    else if ($4 == "/")             rank = 1
                    else                            rank = 2
                    if (!($3 in keep) || rank < rk[$3] ||
                        (rank == rk[$3] && length($4) < length(rt[$3]))) {
                      keep[$3] = $5; rk[$3] = rank; rt[$3] = $4
                    }
                  }
                  END { for (dev in keep) print keep[dev] }
                ' /proc/self/mountinfo | sort > /tmp/fstrim-targets

                echo "$(hostname): trimming $(wc -l < /tmp/fstrim-targets) device(s)"

                # Report per-device and fail the run if any device could not be
                # trimmed. The previous version could only ever report success.
                rc=0
                while read -r target; do
                  nsenter $NS -- fstrim -v "$target" || rc=1
                done < /tmp/fstrim-targets
                exit "$rc"
            probes:
              liveness:
                enabled: false
              readiness:
                enabled: false
              startup:
                enabled: false
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 128Mi
            securityContext:
              privileged: true

    persistence:
      procfs:
        type: hostPath
        hostPath: /proc
        hostPathType: Directory
        globalMounts:
          - path: /host/proc
            readOnly: true
      netfs:
        type: hostPath
        hostPath: /sys
        hostPathType: Directory
        globalMounts:
          - path: /host/net
            readOnly: true
