---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
configMapGenerator:
  - name: generic-device-plugin
    files:
      - ./config/config.yaml
# The name-suffix hash is deliberately ENABLED here. The config is mounted with
# subPath, and kubelet never refreshes a subPath mount, so with a static name a
# config-only change is inert until someone restarts the DaemonSet by hand. The
# content hash changes the ConfigMap name, kustomizeconfig.yaml rewrites the
# HelmRelease reference to it, and the pod template change rolls the DaemonSet.
# A device-plugin restart does not disturb pods holding allocated devices
# (verified live 2026-08-29: vllm kept its B70 slot and 0 restarts).
configurations:
  - kustomizeconfig.yaml
