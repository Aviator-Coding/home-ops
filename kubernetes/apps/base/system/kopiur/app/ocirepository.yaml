---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: kopiur
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    # Exact tag, never a floating one: kopiur is an alpha API that broke its
    # user-visible surface roughly once a fortnight through July 2026. Renovate
    # may propose bumps as PRs but must never merge one unattended - see the
    # kopiur exclusion in .renovate/autoMerge.json5 and README.md "Upgrades".
    tag: 0.10.6
  url: oci://ghcr.io/home-operations/charts/kopiur
