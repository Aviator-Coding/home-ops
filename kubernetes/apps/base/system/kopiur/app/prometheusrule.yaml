---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-absent
spec:
  groups:
    - name: kopiur-absent.rules
      rules:
        # The chart's own 12 alerts (group kopiur.rules) are all evaluated over
        # kopiur_* series, so every one of them goes SILENT rather than firing
        # when the operator itself disappears. This is the same absent() guard
        # we keep for VolSync, carried over deliberately.
        #
        # job label = the metrics Service name (verified live: VolSync's
        # Service is volsync-metrics and its series carry job="volsync-metrics").
        - alert: KopiurComponentAbsent
          expr: |
            absent(up{job="kopiur-controller-metrics"})
          annotations:
            summary: >-
              kopiur controller has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        # The admission webhook runs failurePolicy: Fail, so if it is gone the
        # API server REJECTS every kopiur CR write rather than leaving CRs
        # unreconciled - backups stop being schedulable, not just unobserved.
        - alert: KopiurWebhookAbsent
          expr: |
            absent(up{job="kopiur-webhook"})
          annotations:
            summary: >-
              kopiur admission webhook has disappeared from Prometheus target
              discovery; kopiur CR writes are being rejected
          for: 5m
          labels:
            severity: critical

        # CREDENTIAL-PROJECTION LEAK. Captain decision `credential-scope`
        # (2026-08-30) accepts unscoped Secret create/patch/delete for the
        # operator on the explicit grounds that the resulting exposure is
        # BOUNDED TO ONE MOVER RUN and that the leak is OBSERVABLE. Nothing in
        # the chart's 12 alerts watches this series, so this rule is what makes
        # that second half true - without it a projected credential left behind
        # in an app namespace is silent, and the decision's stated mitigation is
        # only a claim. An alert that goes quiet while credentials sit
        # permanently at rest would be worse than no alert, because it reads as
        # proof of safety.
        #
        # `kopiur_projected_secrets_live` is a POPULATION gauge sampled on the
        # operator's periodic sweep, NOT a per-run indicator. Measured here
        # 2026-08-31: two projected Secrets existed for ~90s during a real
        # backup and the gauge read 0 at every 30s scrape across that window, so
        # a flat 0 during a run is expected and is NOT evidence projection is
        # off. The control that keeps healthy runs silent is the `for:` window,
        # not the comparison: alert on the level staying above zero longer than
        # any legitimate mover can leave a copy live.
        #
        # Why `for: 1h` and not 15m. Measured 2026-08-31 on this cluster: a
        # projected credential Secret for one real backup lived ~90s end to end
        # (CSI VolumeSnapshot staging + staged PVC bind + mover Job); mover
        # Jobs themselves completed in 12-23s. Longest VolSync sync in
        # downloads is ~2m17s, so 15m already carries roughly a 10x margin over
        # anything observed. 1h is chosen instead because those runs were all
        # on volumes of at most 2.06 GiB, kopiur takes no activeDeadlineSeconds
        # in this repo so a run is not bounded from above, and Stage 3 will
        # onboard larger claims whose FIRST full kopia snapshot can legitimately
        # run far longer than any incremental measured here. 1h stays silent on
        # every legitimate run including a large initial backup, while still
        # surfacing a permanent leak within the hour.
        #
        # Upstream's HELP text still prescribes `deriv() > 0 over a day`. We
        # deliberately do NOT follow that: a one-shot leak that steps 0 to N and
        # stays flat leaves deriv ~0 once older zeros age out of the window, so
        # a deriv rule goes quiet exactly when credentials are permanently at
        # rest. Any accumulation deriv would catch also holds the gauge above
        # zero continuously, so the level alert covers that case too.
        #
        # Per-run evidence, when you need it, is the operator's own log line
        # (`reaped projected credentials copy secret=<snapshot>-creds-N`) and
        # the `kopiur_secrets_projected_total` counter - not this gauge.
        - alert: KopiurProjectedCredentialsLeaking
          expr: |
            kopiur_projected_secrets_live > 0
          annotations:
            summary: >-
              kopiur projected credential Secrets have remained live longer
              than any legitimate mover run; repository credentials may be
              sitting at rest in an app namespace
          for: 1h
          labels:
            severity: critical

        # MOVER-READABILITY, PART 2: a snapshot that succeeded while moving
        # nothing. Snapshot CRs carry a positive-only SecurityContextCompatible
        # condition ("the mover's uid exactly matches every workload writing
        # the source PVC") - but it is NOT exported to Prometheus at all
        # (checked: kopiur_resource_phase and every other kopiur_* series
        # carry no condition/message detail, only kind/name/phase). That is
        # the finding for that half of the ask.
        #
        # It is a smaller gap than it looks, though: kopiur "fails closed
        # rather than writing a partial snapshot" (kubernetes/components/
        # kopiur/Readme.md) - a real uid mismatch does not slip through as a
        # quiet Succeeded/SecurityContextCompatible=absent snapshot, it
        # drives the Snapshot CR to phase=Failed. That consequence is
        # already caught by three alerts the kopiur chart itself ships in
        # the SAME "kopiur.rules" group this file supplements
        # (kubernetes/apps/base/system/kopiur/app/helmrelease.yaml,
        # monitoring.prometheusRule.enabled: true): KopiurSnapshotFailed
        # (kopiur_resource_phase{kind="Snapshot",phase="Failed"}==1, 10m),
        # KopiurLastBackupFailed (kopiur_snapshotpolicy_last_backup_success
        # ==0, 10m), and KopiurBackupConsecutiveFailures
        # (kopiur_snapshot_consecutive_failures>=3, 15m). Confirmed against
        # real history: downloads/sabnzbd-ceph's uid mismatch (fixed
        # 2026-08-30, see CLAUDE.md Stage 3 trap 0) left exactly one
        # kopiur_snapshots_completed_total{result="failed"} sample, i.e. it
        # would have tripped KopiurLastBackupFailed at the time. So no new
        # rule was added for "SecurityContextCompatible==False or absent" -
        # it would duplicate coverage that already exists and already routes
        # the same way as every other backup alert.
        #
        # What genuinely was not covered: a Succeeded snapshot that moved
        # zero files - the exact downloads/autobrr Stage 1 shape (a passing
        # gate on an empty volume). kopiur exports only a CUMULATIVE file
        # count per snapshot (new+modified+unchanged combined,
        # kopiur_policy_last_backup_files/kopiur_snapshot_files; no
        # filesNew/bytesNew delta breakdown exists to alert on "moved
        # nothing new" specifically), so this alerts on the narrower but
        # unambiguous case below instead.
        #
        # Zero is published, not omitted: the historical empty-volume CR
        # (`kubectl get snapshot.kopiur.home-operations.com -n downloads
        # autobrr-ceph-stage1-verify -o jsonpath='{.status.stats}'`) returns
        # literally {"filesNew":0,"sizeBytes":0}, and fleet-wide the
        # (namespace,policy) set of kopiur_snapshotpolicy_last_backup_success
        # equals the set of kopiur_policy_last_backup_files exactly (27==27,
        # zero set difference either direction) - there is no live or
        # historical case where a policy has a terminal backup but no files
        # count. So `== 0` is the correct formulation; an absent-safe
        # wrapper is not needed.
        #
        # Verified live 2026-08-31 against kube-prometheus-stack-prometheus
        # (port-forwarded): all policies with a completed backup currently
        # report > 0 files (autobrr-ceph itself is now 1, since its
        # write-access fix), so this rule is silent on the current fleet -
        # no live/historical case exists where a completed backup lacks a
        # files count (success metric set == files metric set, 27==27).
        - alert: KopiurBackupEmpty
          expr: |
            kopiur_policy_last_backup_files == 0
          for: 15m
          annotations:
            summary: >-
              The latest succeeded kopiur backup for
              {{ $labels.namespace }}/{{ $labels.policy }} contains zero
              files - the source volume was empty or entirely unreadable
              when the snapshot ran, the same shape of failure that let
              downloads/autobrr's Stage 1 gate pass on an empty volume.
          labels:
            severity: warning
