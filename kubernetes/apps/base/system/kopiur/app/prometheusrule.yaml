---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kopiur-absent
spec:
  groups:
    - name: kopiur-absent.rules
      rules:
        # The chart's own 12 alerts (group kopiur.rules) are all evaluated over kopiur_* series, so every one of them goes SILENT rather than firing when the operator itself disappears.
        # Skill `kopiur-backups`.
        - alert: KopiurComponentAbsent
          expr: |
            absent(up{job="kopiur-controller-metrics"})
          annotations:
            summary: >-
              kopiur controller has disappeared from Prometheus target discovery
          for: 5m
          labels:
            severity: critical

        # The admission webhook runs failurePolicy: Fail, so if it is gone the
        # API server REJECTS every kopiur CR write rather than leaving CRs
        # unreconciled - backups stop being schedulable, not just unobserved.
        - alert: KopiurWebhookAbsent
          expr: |
            absent(up{job="kopiur-webhook"})
          annotations:
            summary: >-
              kopiur admission webhook has disappeared from Prometheus target
              discovery; kopiur CR writes are being rejected
          for: 5m
          labels:
            severity: critical

        # Projected credential Secrets still present across two sweeps. Aggregate before min_over_time.
        # Skill `kopiur-backups`.
        - alert: KopiurProjectedCredentialsLeaking
          expr: |
            min_over_time(
              (max without (pod, instance) (kopiur_projected_secrets_live))[13h:]
            ) > 0
          annotations:
            summary: >-
              kopiur projected credential Secrets have remained live across at
              least two periodic sweep passes; repository credentials may be
              sitting at rest in an app namespace
          for: 5m
          labels:
            severity: critical

        # Succeeded snapshot with zero files. SecurityContextCompatible is not a Prometheus series.
        # Skill `kopiur-backups`.
        - alert: KopiurBackupEmpty
          expr: |
            kopiur_policy_last_backup_files == 0
          for: 15m
          annotations:
            summary: >-
              The latest succeeded kopiur backup for
              {{ $labels.namespace }}/{{ $labels.policy }} contains zero
              files - the source volume was empty or entirely unreadable
              when the snapshot ran, the same shape of failure that let
              downloads/autobrr's Stage 1 gate pass on an empty volume.
          labels:
            severity: warning

        # Chart KopiurBackupStale waits 48h for every policy. Ceph fires here at 6h; r2 stays at 48h.
        # Skill `kopiur-backups`.
        - alert: KopiurBackupStaleCeph
          expr: |
            time() - kopiur_policy_last_backup_success_timestamp_seconds{policy=~".+-ceph$"} > 21600
          for: 5m
          annotations:
            summary: >-
              No successful kopiur ceph backup for
              {{ $labels.namespace }}/{{ $labels.policy }} in over 6h
              (1.5x its 4h schedule)
          labels:
            severity: critical

        - alert: KopiurBackupStaleR2
          expr: |
            time() - kopiur_policy_last_backup_success_timestamp_seconds{policy=~".+-r2$"} > 172800
          for: 5m
          annotations:
            summary: >-
              No successful kopiur r2 backup for
              {{ $labels.namespace }}/{{ $labels.policy }} in over 48h
              (2x its daily schedule)
          labels:
            severity: warning

        # Staleness cannot see a series that has disappeared. This fires when a policy's last-success series vanishes while the controller is up.
        # Skill `kopiur-backups`.
        - alert: KopiurPolicyVanished
          expr: |
            (
              count by (namespace, policy) (
                kopiur_policy_last_backup_success_timestamp_seconds offset 24h
              )
              unless
              count by (namespace, policy) (
                kopiur_policy_last_backup_success_timestamp_seconds
              )
            )
            and on() (up{job="kopiur-controller-metrics"} == 1)
          for: 30m
          annotations:
            summary: >-
              Kopiur backup policy {{ $labels.namespace }}/{{ $labels.policy }}
              had a last-success series 24h ago and does not now, so
              staleness alerts for that claim can no longer fire
          labels:
            severity: warning
