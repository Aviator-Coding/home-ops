---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-substitutions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-substitutions
    template:
      data:
        # home-ops is a PUBLIC repo and the R2 account id is deliberately not
        # committed anywhere in it today (VolSync keeps the whole endpoint in
        # 1Password). ClusterRepository.spec.backend.s3.endpoint is a plain
        # string field with no Secret ref, so the value reaches it through Flux
        # postBuild substitution instead - see the kopiur-repository
        # Kustomization's substituteFrom in kubernetes/apps/main/system/kopiur.yaml.
        KOPIUR_R2_ENDPOINT: "{{ .R2_ENDPOINT }}"
  dataFrom:
    - extract:
        key: kopiur
