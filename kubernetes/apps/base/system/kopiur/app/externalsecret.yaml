---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-substitutions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-substitutions
    template:
      data:
        # home-ops is a PUBLIC repo and the R2 account id is deliberately not
        # committed anywhere in it. ClusterRepository.spec.backend.s3.endpoint
        # is a plain string field with no Secret ref, so the value reaches it
        # through Flux postBuild substitution instead - see the
        # kopiur-repository Kustomization's substituteFrom in
        # kubernetes/apps/main/system/kopiur.yaml.
        #
        # Stored as a full URL, but kopiur wants a BARE host[:port] with no
        # scheme and no trailing slash, so it is trimmed here.
        KOPIUR_R2_ENDPOINT: >-
          {{ .endpoint | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
  data:
    # kopiur's own item, not volsync-template. Same account endpoint, copied
    # once so that nothing kopiur owns depends on the item 105 live VolSync
    # backups read.
    - secretKey: endpoint
      remoteRef:
        key: kopiur-r2
        property: R2_ENDPOINT_URL
