---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-substitutions
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-substitutions
    template:
      data:
        # home-ops is a PUBLIC repo and the R2 account id is deliberately not committed anywhere in it.
        # Skill `kopiur-backups`.
        KOPIUR_R2_ENDPOINT: >-
          {{ .endpoint | trimPrefix "https://" | trimPrefix "http://" | trimSuffix "/" }}
  data:
    # kopiur's own item, not volsync-template. Same account endpoint, copied
    # once so that nothing kopiur owns depends on the live VolSync
    # backups read.
    - secretKey: endpoint
      remoteRef:
        key: kopiur-r2
        property: R2_ENDPOINT_URL
