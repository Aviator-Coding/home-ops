---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/clusterrepository_v1alpha1.json
#
# Two destinations: `ceph` (local) and `r2` (offsite). MinIO is deliberately
# NOT defined here - the captain is retiring it over its licensing change, so
# Stage 0 does not give kopiur a MinIO destination. The existing VolSync MinIO
# backups keep running untouched; retiring them is a separate future job.
# Each is CLUSTER-SCOPED with allowedNamespaces.all so one repository object
# serves every namespace.
#
# EVERY repository points at a NEW, DEDICATED bucket - never at a VolSync restic
# path. VolSync's repositories are all `volsync/<app>` on all three backends
# (verified live), so a dedicated `kopiur` bucket cannot collide with any of
# them even by accident. The Ceph bucket is an ObjectBucketClaim in ../backend,
# the same GitOps-managed pattern that already holds our live Ceph backups.
#
# DELETION PROTECTION is pinned explicitly here rather than left to defaults.
# A kopiur Snapshot CR OWNS its kopia snapshot through a finalizer, so deleting
# CRs can delete backup data - upstream ADR-0006 records a real incident where
# ownerReference GC fired 600-700 concurrent snapshot deletions at one
# repository. We run Flux with prune: true, which is exactly that shape.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: ceph
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      bucket: kopiur
      # Bare host[:port], no scheme. Port 80 is plain HTTP inside the cluster.
      endpoint: rook-ceph-rgw-ceph-objectstore.rook-ceph.svc:80
      # Ceph RGW wants the zonegroup as region (verified live:
      # `radosgw-admin zonegroup list` -> ceph-objectstore).
      region: ceph-objectstore
      tls:
        disableTls: true
      auth:
        secretRef:
          # Generated by the ObjectBucketClaim in ../backend (named after the
          # claim). The S3 keys are created and rotated by Rook, never hand-
          # entered; a PushSecret records them in 1Password.
          name: kopiur
          namespace: system
  encryption:
    passwordSecretRef:
      name: kopiur-ceph-secret
      namespace: system
      key: KOPIA_PASSWORD
  # Idempotent: bootstraps a genuinely-absent repository, and only CONNECTS to
  # one that already exists (it never re-creates or clobbers). Needed because
  # kopiur does not create the bucket or the repository on its own.
  create:
    enabled: true
  mode: ReadWrite
  # --- credential projection (captain decision `credential-scope`, 2026-08-30) ---
  # The REPOSITORY-OWNER half of the gate: this repository consents to having
  # its credential Secrets copied into a consumer namespace. It is one of three
  # legs and grants nothing on its own - the operator also needs
  # `features.credentialProjection.enabled` (../app/helmrelease.yaml, the RBAC),
  # and each consuming SnapshotPolicy/Restore needs its own
  # `credentialProjection.enabled` (kubernetes/components/kopiur/).
  #
  # Why it is on: a mover Job runs in the WORKLOAD namespace and loads these
  # Secrets with namespace-local `envFrom`, but they are pinned to `system`
  # below. Projection is what lets a backup in any namespace read them WITHOUT
  # a standing copy sitting there between runs. The Secret exists for the length
  # of one mover run and is then reaped.
  #
  # `namespace:` on every secretRef in this file is load-bearing for this: the
  # CRD requires it be set EXPLICITLY for projection to know what to copy.
  #
  # Reversible by flipping this one boolean back to false (and the consumer
  # opt-ins with it) - but note that reverting alone leaves movers outside
  # `system` with no credentials at all, because the standing per-namespace
  # copies this decision removed are gone.
  credentialProjection:
    allowed: true
  # --- deletion protection (ADR-0006), pinned, not defaulted ---
  # Mass-deletion circuit breaker. At or above this many pending EXTERNAL
  # destructive Snapshot deletions, kopiur HOLDS them until a human acks with
  # the kopiur.home-operations.com/allow-mass-deletion annotation. The breaker
  # is axis-independent, so this one field also backstops a schedule-deletion
  # cascade and a namespace teardown. kopiur's own retention prunes are stamped
  # `pruned-by` and are never held.
  deletionProtection:
    threshold: 10
  # --- epoch tuning: why this repository does NOT run kopia's 24h default ---
  # Index blobs are only compacted once their EPOCH closes, and `minDuration` is
  # the advance GATE. Two mechanics decide the real epoch length, and BOTH were
  # measured here on 2026-09-03 rather than assumed:
  #
  #  1. An epoch's age is counted from the FIRST INDEX BLOB written into it, not
  #     from the epoch-marker blob that opens it. Proven by experiment: epoch 3's
  #     marker was written 03:08:17 and its first blob 04:38:34; a maintenance run
  #     at 08:10:43 - 5.03h after the marker but only 3.53h after the first blob -
  #     did NOT advance it under a 5h gate. Because writes arrive in the 4-hourly
  #     backup bursts, that offset is 0-4h of dead time before the clock starts.
  #  2. kopiur advances epochs ONLY during a maintenance run, so maturity is then
  #     rounded up to the next run (quick 00/06/12/18 +<=30m, full 03 +<=1h).
  #
  # So epoch length = (wait for first write) + minDuration + (wait for next run),
  # which is very non-linear in minDuration. Measured at the 24h default: epochs
  # ran 26.7h, 30.0h and 27.0h. At a measured 32.5 index blobs/hour that is ~900
  # blobs per epoch, and exactly TWO epochs are live at once (one closed-but-not-
  # yet-compacted plus the open one - verified live: 1006 = 879 + 127), so the
  # count oscillated ~900-1810 against a threshold of 1000. A stable equilibrium,
  # not a leak, and not a stuck maintenance lease.
  #
  # 4h is picked by simulating those two mechanics against the real schedules over
  # 2,400 epoch-days (the model reproduces the observed 24h epochs: mean 28.8h,
  # range 26.4-30.5h). Headroom is NOT monotonic in minDuration - it steps:
  #
  #     1.5-2.75h -> 4 epochs/day, worst epoch  8.7-9.5h, peak 564-616  (38-44%)
  #     3.0-3.25h -> worst epoch 12.5h,         peak ~810               (19%)
  #     3.5-4.75h -> 3 epochs/day, worst epoch 10.0h, peak 649          (35%)  <-- here
  #     5.0-6.0h  -> worst epoch 12.5h,         peak ~812               (19%)
  #     12h/24h   -> peak 1201 / 1980                                   (over)
  #
  # 4h sits mid-plateau, >=0.5h from either cliff, and its 3 epochs/day leaves the
  # most compaction margin (compaction advances one epoch per maintenance run and
  # there are 5 runs/day). The 2.75h peak is slightly better but is 0.25h from a
  # cliff down to 19%. NOTE the condition message's suggested `6h` lands in the
  # 19% band - and so did this repository's own first attempt at `5h`.
  # Re-derive if the maintenance OR the backup schedule changes; both feed it.
  # Evidence: docs/backups/kopiur-ceph-index-blob-compaction-2026-09-03.md
  parameters:
    epoch:
      minDuration: 4h
  # Deleting a consuming namespace orphans its snapshots rather than deleting
  # them (the ADR-0005 axis).
  onNamespaceDelete: Orphan
---
apiVersion: kopiur.home-operations.com/v1alpha1
kind: ClusterRepository
metadata:
  name: r2
spec:
  allowedNamespaces:
    all: true
  backend:
    s3:
      # A NEW, EMPTY bucket, not a VolSync restic path. Verified in-cluster
      # 2026-08-30 on the credential now in `kopiur-r2`, credentials never
      # leaving the cluster: HeadBucket, PutObject, GetObject (byte-identical
      # round trip) and DeleteObject all succeed, and ListObjectsV2 showed the
      # bucket EMPTY beforehand - so there is nothing here to collide with.
      # The probe object was deleted; the prefix lists zero keys.
      bucket: kopiur
      # <accountid>.r2.cloudflarestorage.com, substituted so the account id
      # stays out of this public repo - see app/externalsecret.yaml.
      endpoint: ${KOPIUR_R2_ENDPOINT}
      region: auto
      auth:
        secretRef:
          name: kopiur-r2-secret
          namespace: system
  encryption:
    passwordSecretRef:
      name: kopiur-r2-secret
      namespace: system
      key: KOPIA_PASSWORD
  create:
    enabled: true
  mode: ReadWrite
  # See the `ceph` repository above for the full rationale. Same owner-side
  # consent, same three-leg gate, same captain decision (`credential-scope`).
  credentialProjection:
    allowed: true
  deletionProtection:
    threshold: 10
  # No `parameters.epoch` override here, DELIBERATELY - and not because this
  # repository is healthier than `ceph`. Measured 2026-09-03: r2 has the IDENTICAL
  # epoch structure (same three epoch markers within ~15 min of ceph's, one
  # single-epoch compaction, zero range checkpoints) and the identical stalled
  # compaction. It is under the 1000 threshold only because it takes the DAILY
  # backup slot while ceph takes the 4-hourly one, so it accumulates ~4.4x slower:
  # 422 index blobs against ceph's 1851, converging on ~420 rather than ~1850.
  # `IndexBlobHealth=True` here means "quieter", not "correct". If r2's backup
  # cadence is ever raised, or its claim count grows several-fold, this repository
  # will reproduce ceph's warning and needs the same `minDuration` treatment -
  # re-derived against r2's OWN maintenance offsets (quick ~00:16, full ~03:35),
  # not copied from ceph's. Left untuned to keep the change to what the evidence
  # required. See docs/backups/kopiur-ceph-index-blob-compaction-2026-09-03.md.
  onNamespaceDelete: Orphan
