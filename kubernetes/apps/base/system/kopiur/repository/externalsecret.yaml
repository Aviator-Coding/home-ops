---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# One Secret per destination, each carrying that destination's kopia repository
# password and, where the backend needs them, its S3 credentials. This is the
# shared cluster-scoped credential pattern: two Secrets in `system` replace
# VolSync's per-app ExternalSecret + Secret pair (105 + 105 objects today).
#
# Each reads ONE purpose-built 1Password item (`kopiur-ceph`, `kopiur-r2`),
# following the `litellm-consumer-*` convention rather than a shared grab-bag -
# captain decision 2026-08-30. Nothing here reads `volsync-template` any more,
# which is what makes the 105 live VolSync backups structurally unreachable
# from this branch rather than merely untouched by it.
#
# The kopia password is per-repository and MUST NOT be reused between them or
# with any restic password: losing it makes that repository permanently
# unrecoverable, and sharing one would tie both destinations' fate together.
#
# Every field is fetched by explicit `data` + `property` rather than
# `dataFrom.extract` + template. That matters: a missing property fails the
# ExternalSecret loudly, whereas an extract-and-template would render a missing
# field as an EMPTY string and materialize a Secret holding a blank credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ceph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-ceph-secret
  data:
    # Key name is fixed by kopiur: the mover loads this Secret with envFrom and
    # hands it to kopia as an env var.
    #
    # Ceph carries ONLY the repository password. Its S3 credentials are
    # generated by the ObjectBucketClaim and consumed directly from the OBC's
    # own Secret, so they are deliberately not duplicated into this item.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-ceph
        property: KOPIA_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-r2-secret
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-r2
        property: KOPIA_PASSWORD
    # An R2 API token scoped to the `kopiur` bucket ALONE - never VolSync's
    # token. Until the captain creates it these two properties do not exist,
    # so this ExternalSecret fails and the `r2` ClusterRepository stays
    # unresolved. That is the intended failure mode: loud, and incapable of
    # touching the existing offsite backups.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur-r2
        property: R2_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur-r2
        property: R2_SECRET_ACCESS_KEY
