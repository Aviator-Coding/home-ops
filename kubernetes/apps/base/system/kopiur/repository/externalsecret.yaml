---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# One Secret per destination, each carrying that destination's kopia repository password and, where the backend needs them, its S3 credentials.
# Skill `kopiur-backups`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ceph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-ceph-secret
  data:
    # Key name is fixed by kopiur: the mover loads this Secret with envFrom and hands it to kopia as an env var.
    # Skill `kopiur-backups`.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-ceph
        property: KOPIA_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-r2-secret
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-r2
        property: KOPIA_PASSWORD
    # R2 API token distinct from VolSync's and scoped to the kopiur bucket.
    # Skill `kopiur-backups`.
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur-r2
        property: R2_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur-r2
        property: R2_SECRET_ACCESS_KEY
