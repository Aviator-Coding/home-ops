---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# One Secret per destination, each carrying that destination's kopia repository
# password AND its S3 access key. This is the shared cluster-scoped credential
# pattern: three Secrets in `system` replace VolSync's per-app ExternalSecret +
# Secret pair (105 + 105 objects today).
#
# The kopia password is per-repository and MUST NOT be reused between them or
# with any restic password: losing it makes that repository permanently
# unrecoverable, and sharing one would tie all three destinations' fate together.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ceph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-ceph-secret
    template:
      data:
        # Key names are fixed by kopiur: the mover loads this Secret with
        # envFrom and hands them to kopia as env vars.
        # Ceph carries ONLY the repository password: its S3 credentials are
        # generated by the ObjectBucketClaim and consumed directly from the
        # OBC's own Secret, so they are never hand-entered here.
        KOPIA_PASSWORD: "{{ .CEPH_KOPIA_PASSWORD }}"
  dataFrom:
    - extract:
        key: kopiur
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-minio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-minio-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .MINIO_KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .MINIO_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .MINIO_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: kopiur-r2-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .R2_KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .R2_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .R2_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kopiur
