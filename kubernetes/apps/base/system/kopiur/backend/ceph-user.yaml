---
apiVersion: ceph.rook.io/v1
kind: CephObjectStoreUser
metadata:
  name: kopiur
spec:
  store: ceph-objectstore
  clusterNamespace: rook-ceph
  displayName: kopiur-user
  quotas:
    # 500G headroom. Do not copy volsync's 20G quota; that quota was already exceeded.
    # Skill `kopiur-backups`.
    maxSize: 500G
    maxObjects: 1000000
    maxBuckets: 10
  capabilities:
    user: "*"
    bucket: "*"
