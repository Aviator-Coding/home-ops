---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Publishes the OBC-generated S3 credentials into 1Password so they are
# recorded outside the cluster, exactly as volsync-ceph-bucket-credentials does.
# Nothing in the cluster reads them back: the `ceph` ClusterRepository consumes
# the generated Secret directly.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kopiur-ceph-bucket-credentials
spec:
  secretStoreRefs:
    # onepassword-automation, NOT the shared onepassword store: the shared one
    # lists three vaults by priority (Homelab 1, Automation 2, Services 3) and
    # resolves a WRITE through that ordering, so its target vault is not
    # deterministic. This store is pinned to the single `Automation` vault, so
    # these keys land in the same `kopiur` item the kopia passwords live in.
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      # Generated by the ObjectBucketClaim above; named after the claim.
      name: kopiur
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: kopiur
          property: CEPH_ACCESS_KEY_ID
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: kopiur
          property: CEPH_SECRET_ACCESS_KEY
