---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Publishes the OBC-generated S3 credentials into 1Password so they are recorded outside the cluster, exactly as volsync-ceph-bucket-credentials does.
# Skill `kopiur-backups`.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kopiur-ceph-bucket-credentials
spec:
  # Pinned, not defaulted: removing this PushSecret (a Flux prune included)
  # must never delete the 1Password record it wrote.
  deletionPolicy: None
  secretStoreRefs:
    # The shared `onepassword` store, same as volsync's pushsecret.
    # Skill `kopiur-backups`.
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      # Generated by the ObjectBucketClaim above; named after the claim.
      name: kopiur
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: kopiur-ceph-bucket
          property: ACCESS_KEY_ID
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: kopiur-ceph-bucket
          property: SECRET_ACCESS_KEY
