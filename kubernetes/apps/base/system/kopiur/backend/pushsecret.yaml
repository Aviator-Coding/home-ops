---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Publishes the OBC-generated S3 credentials into 1Password so they are
# recorded outside the cluster, exactly as volsync-ceph-bucket-credentials does.
# Nothing in the cluster reads them back: the `ceph` ClusterRepository consumes
# the generated Secret directly.
#
# They get their OWN item rather than sharing `kopiur-ceph`, which the captain's
# 2026-08-30 tidy reserves for the kopia password alone. Different lifetimes:
# Rook owns and can regenerate these keys, while a lost kopia password is
# unrecoverable. Purely a record - no ExternalSecret reads this item.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: kopiur-ceph-bucket-credentials
spec:
  # Pinned, not defaulted: removing this PushSecret (a Flux prune included)
  # must never delete the 1Password record it wrote.
  deletionPolicy: None
  secretStoreRefs:
    # The shared `onepassword` store, same as volsync's pushsecret. It lists
    # three vaults by priority (Homelab 1, Automation 2, Services 3) and
    # resolves a write through that ordering, which lands in Homelab - measured
    # 2026-08-30, not assumed: the kopia passwords pushed through this store
    # were afterwards NOT readable through `onepassword-automation`, which is
    # pinned to Automation alone. Using that pinned store here would therefore
    # split the credentials across two different `kopiur` items in two vaults,
    # where the priority-ordered read path would silently shadow one of them.
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      # Generated by the ObjectBucketClaim above; named after the claim.
      name: kopiur
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: kopiur-ceph-bucket
          property: ACCESS_KEY_ID
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: kopiur-ceph-bucket
          property: SECRET_ACCESS_KEY
