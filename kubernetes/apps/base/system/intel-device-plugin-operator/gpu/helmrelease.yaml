---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 1h
  chart:
    spec:
      chart: intel-device-plugins-gpu
      version: 0.34.1
      sourceRef:
        kind: HelmRepository
        name: intel
        namespace: system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    name: xe
    nodeFeatureRule: false
    sharedDevNum: 99
    # This pool is the iGPU only (allowIDs 0xa7a0). B70 consumers use devic.es/b70 and devic.es/b70-vaapi.
    # See skill intel-gpu.
    allowIDs: "0xa7a0"
    # Toleration is hygiene under PreferNoSchedule. See skill node-scheduling.
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule
