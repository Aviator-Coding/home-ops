---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1beta2.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: intel-device-plugins-gpu
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 0.34.1
  url: oci://ghcr.io/home-operations/charts-mirror/intel-device-plugins-gpu
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: intel-device-plugin-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: intel-device-plugins-gpu
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    name: xe
    nodeFeatureRule: false
    sharedDevNum: 99
    # Discrete B70 consumers (vllm/vllm-embed/comfyui/tdarr-node) request
    # devic.es/b70 from generic-device-plugin, not this pool. allowIDs scopes
    # this pool to the Raptor Lake iGPU (0xa7a0) only, now that xe.force_probe
    # is applied on all three nodes and the iGPUs confirm advertising xe
    # (talos-1/2 xe=99, talos-3 was 198 pooled iGPU+B70). The B70 now serves
    # devic.es/b70 exclusively.
    allowIDs: "0xa7a0"
