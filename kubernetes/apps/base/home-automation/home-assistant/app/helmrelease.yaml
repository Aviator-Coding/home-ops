---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      home-assistant:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          annotations:
            # Static IP only, no MAC pin: a pinned MAC on bond0.3 makes the kernel reject the
            # new pod's net1 while the dying pod's veth holds it. IoT devices key on IP.
            # Skill home-automation.
            k8s.v1.cni.cncf.io/networks: |
              [{
                "name":"multus-iot",
                "namespace": "kube-system",
                "ips": ["10.40.0.100/16"]
              }]
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.8.3

            env:
              TZ: America/New_York
              HASS_HTTP_TRUSTED_PROXY_1: 10.10.10.0/24
              HASS_HTTP_TRUSTED_PROXY_2: 10.50.0.0/24
              HASS_HTTP_TRUSTED_PROXY_3: 10.42.0.0/16
              HASS_HTTP_USE_X_FORWARDED_FOR: "true"
            envFrom:
              - secretRef:
                  name: home-assistant
            # /manifest.json is served without authentication, so the probe measures HA's own
            # HTTP server, not the ext_authz chain in front of the public route. Pod readiness
            # then drives the upstream KubePodNotReady rule. Skill home-automation.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              # HA can take a while to load its integrations on first boot;
              # this delays liveness/readiness evaluation up to 300s so a
              # slow-but-healthy startup is never mistaken for a wedge.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /manifest.json
                    port: 8123
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                # Explicit memory request: without one Kubernetes reserves the full 2Gi limit on
                # the node. 768Mi is ~2x the 30-day peak working set of 393Mi. Skill node-scheduling.
                memory: 768Mi
              limits:
                memory: 2Gi
          code-server:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.133.0@sha256:e073a441c61c85821a7f16b64cf93b4e77b4092899bb1f3bed906fbd558afd62
            args:
              [
                "--auth",
                "none",
                "--user-data-dir",
                "/config/.vscode",
                "--extensions-dir",
                "/config/.vscode",
                "--port",
                "12321",
                "/config",
              ]
            resources:
              requests:
                cpu: 10m
                # See the app container above: limit-only declarations reserve
                # the whole limit. 30-day peak working set here is 148Mi.
                memory: 192Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      # nodeTaintsPolicy: Honor only filters NoSchedule/NoExecute taints. The talos-3
      # dedicated taint is PreferNoSchedule, so talos-3 stays in the spread domains and
      # the TaintToleration score penalty keeps this workload off it. Skill node-scheduling.
      topologySpreadConstraints:
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          nodeTaintsPolicy: Honor
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: home-assistant
    service:
      app:
        controller: home-assistant
        forceRename: home-assistant
        ports:
          http:
            port: 8123
      code-server:
        controller: home-assistant
        primary: false
        publishNotReadyAddresses: true
        ports:
          code-server:
            port: 12321

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/name: home-assistant
          gethomepage.dev/icon: home-assistant.svg
        hostnames:
          - "hass.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: home-assistant
                port: 8123
      code-server:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "Home Automation"
          gethomepage.dev/name: home-assistant-code
          gethomepage.dev/icon: vscode.svg
        hostnames:
          - "hass-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: home-assistant-code-server
                port: 12321

    persistence:
      config:
        enabled: true
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM: the overlay defines no VOLSYNC_* key, and the
        # `:-home-assistant` default would hide a token naming a variable nothing defines.
        existingClaim: ${KOPIUR_CLAIM:-home-assistant}
        globalMounts:
          - path: /config
      logs:
        type: emptyDir
        globalMounts:
          - path: /config/logs
      tts:
        type: emptyDir
        globalMounts:
          - path: /config/tts
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
