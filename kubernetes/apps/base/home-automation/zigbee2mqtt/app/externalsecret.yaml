---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zigbee2mqtt
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zigbee2mqtt-secret
    creationPolicy: Owner
  data:
    - secretKey: mqtt_user
      remoteRef:
        key: EMQX
        property: EMQX_MQTT_USERNAME
    - secretKey: mqtt_password
      remoteRef:
        key: EMQX
        property: EMQX_MQTT_PASSWORD
    # The three zigbee_* values ARE the Zigbee network identity. zigbee2mqtt
    # writes these env vars into /data/configuration.yaml at every start, so a
    # wrong value re-forms the network and unpairs every device. zigbee2mqtt
    # JSON-parses each value: pan ID as a decimal integer, ext pan ID and network
    # key as JSON arrays of 8 and 16 decimal bytes. It does not validate array
    # length. Populated from the live config 2026-09-25:
    # docs/home-automation/zigbee2mqtt-network-key-pinning-2026-09-25.md
    - secretKey: zigbee_pan_id
      remoteRef:
        key: zigbee2mqtt
        property: CONFIG_PAN_ID
    - secretKey: zigbee_ext_pan_id
      remoteRef:
        key: zigbee2mqtt
        property: CONFIG_EXT_PAN_ID
    - secretKey: zigbee_network_key
      remoteRef:
        key: zigbee2mqtt
        property: CONFIG_NETWORK_KEY
