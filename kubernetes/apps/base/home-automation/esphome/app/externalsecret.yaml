---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-secrets
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: esphome-secrets
    creationPolicy: Owner
    template:
      data:
        # mqtt_host is compiled into device firmware, so it must be reachable from the IoT LAN:
        # the EMQX listeners LoadBalancer (lbipam-pinned in database/emqx/cluster/cluster.yaml).
        # The mqtt hostname is the dashboard route (envoy-internal, HTTPS only), and the
        # in-cluster Service name does not resolve on the LAN.
        secrets.yaml: |-
          wifi_ssid: "{{ .ESPHOME_WIFI_SSID }}"
          wifi_pwd: "{{ .ESPHOME_WIFI_PASSWORD }}"
          wifi_fallback_ssid_password: "{{ .ESPHOME_WIFI_FALLBACK_PASSWORD }}"

          mqtt_host: "10.50.0.30"
          mqtt_user: "{{ .EMQX_MQTT_USERNAME }}"
          mqtt_pwd: "{{ .EMQX_MQTT_PASSWORD }}"

          domain_devices: internal
  dataFrom:
    - extract:
        key: esphome
    - extract:
        key: emqx
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: esphome-deploykey
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: esphome-deploykey
    creationPolicy: Owner
  data:
    - secretKey: id_ed25519
      remoteRef:
        key: esphome
        property: "private key"
