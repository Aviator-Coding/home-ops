---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app playwright
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      playwright:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/browserless/chromium
              tag: v2.55.4
            env:
              TZ: ${CONFIG_TIMEZONE}
              DATA_DIR: /config/
              ALLOW_GET: true
              SCREEN_WIDTH: 1920
              SCREEN_HEIGHT: 1080
              SCREEN_DEPTH: 24
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                gpu.intel.com/xe: 1
                memory: 2Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop:
                  - ALL
                add:
                  - SYS_ADMIN
    # `selfhostedPodOptions` is not a key the app-template chart knows, so Helm
    # silently discarded this whole block and the pod shipped with an EMPTY
    # securityContext. It appeared exactly once in the repo against 31 correct
    # `defaultPodOptions` uses, and nothing catches it: it is legal YAML, flate
    # passes, and the HelmRelease reconciles green.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch
    route:
      app:
        annotations:
          gatus.home-operations.com/enabled: "false"
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - identifier: app
                port: &port 3000
    persistence:
      # browserless keeps no durable state: DATA_DIR held nothing but the
      # `lost+found` mkfs artifact, and even browserless's own metrics go to
      # the /tmp emptyDir below. The 5Gi ceph-block claim and its three
      # ReplicationSources protected zero bytes, so both are removed here per
      # the 2026-08-30 captain decision.
      config:
        type: emptyDir
        globalMounts:
          - path: /config/
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
      dev-shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 1Gi
        globalMounts:
          - path: /dev/shm
      var-run:
        type: emptyDir
        globalMounts:
          - path: /var/run
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
