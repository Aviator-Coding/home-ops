---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app linkwarden
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      linkwarden:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-db:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom: &envFrom
              - secretRef:
                  name: linkwarden-secret

        containers:
          app:
            image:
              repository: ghcr.io/linkwarden/linkwarden
              tag: v2.16.2
            env:
              NEXT_SHARP_PATH: /data/node_modules/sharp
              NEXTAUTH_URL: "https://links.${SECRET_DOMAIN}"
              NEXT_PUBLIC_DISABLE_REGISTRATION: "true"
              NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
              # Full-page Monolith archive: raise output buffer above the 100MB
              # default (one image-heavy page overflowed it -> partial archive).
              MONOLITH_MAX_BUFFER: "256"
              # AI auto-tagging via the agentgateway unified /v1: the model id below
              # routes to the local B70 llama.cpp (with cloud kimi failover when the
              # local server is down). OPENAI_API_KEY is a dummy from the secret —
              # ignored by the keyless LAN gateway, but the OpenAI SDK still requires
              # a non-empty value to be present.
              CUSTOM_OPENAI_BASE_URL: "http://internal-noauth.ai.svc.cluster.local/v1"
              OPENAI_MODEL: "qwen3.6-35b-a3b"
            envFrom: *envFrom
            ports:
              - name: http
                containerPort: &port 3000
            resources:
              requests:
                cpu: 250m
                memory: 512Mi
              limits:
                cpu: "2"
                memory: 4Gi
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: false

    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: linkwarden
        ports:
          http:
            port: *port

    persistence:
      data:
        enabled: true
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM: volsync was retired from this volume
        # on 2026-09-04 (Stage 5 wave three), and that overlay now defines no
        # VOLSYNC_* key. The default is corrected to the literal claim name at
        # the same time, because the old `:-*app` was a DANGLING YAML ALIAS,
        # not an anchor reference - kustomize emits the token verbatim, so the
        # moment VOLSYNC_CLAIM stopped being defined the render became
        # `existingClaim: *app` and flate failed the whole Kustomization with
        # `unknown anchor 'app' referenced`. The trap was recorded in
        # docs/backups/kopiur-wave-two-retirement-2026-09-02.md and never
        # fired, because the overlay always set VOLSYNC_CLAIM until now.
        existingClaim: ${KOPIUR_CLAIM:-linkwarden}
        globalMounts:
          - path: /data/data
      next-cache:
        type: emptyDir
        globalMounts:
          - path: /data/apps/web/.next/cache

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: Linkwarden
          gethomepage.dev/icon: linkwarden.svg
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          gatus.home-operations.com/endpoint: |-
            url: https://links.${SECRET_DOMAIN}/
            conditions:
              - "[STATUS] == any(200, 307)"
            group: selfhosted
        hostnames:
          - "links.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: linkwarden
                namespace: selfhosted
                port: *port
