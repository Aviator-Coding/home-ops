---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Identity is declared pod-level like the rest of the fleet; `browser` (browserless/chrome) overrides
    # back to its image's `blessuser` uid 999 (see below). This does NOT earn kopiur's
    # `SecurityContextCompatible` condition: it needs the mover uid to match every container of every pod
    # mounting the claim, and the 999 sidecar suppresses it. The condition is positive-only (absence is not
    # a failure); a whole-volume kopia read is the proof. See `components/kopiur/Readme.md`.
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.55.8@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
            # Identity 1000:1000 (from defaultPodOptions) is measured: the image default is root, every file and
            # setgid directory under /datastore is already group 1000, and it is kopiur's fleet default, so no
            # KOPIUR_PUID/PGID override is needed.
            env:
              PORT: &port 5000
              USE_X_SETTINGS: 1
              PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/browserless-cache-123
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          browser:
            image:
              repository: docker.io/browserless/chrome
              tag: latest@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
              pullPolicy: IfNotPresent
            # Overrides the pod-level 1000:1000 back to the image's `blessuser` (999): at uid 1000 Chrome fails to
            # launch (`chrome_crashpad_handler: --database is required`) while the container still reports Ready,
            # silently breaking every browser-backed watch. It mounts no PVC, so the backup identity is unaffected.
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            env:
              - { name: SCREEN_WIDTH, value: "1920" }
              - { name: SCREEN_HEIGHT, value: "1024" }
              - { name: SCREEN_DEPTH, value: "16" }
              - { name: ENABLE_DEBUGGER, value: "false" }
              - { name: PREBOOT_CHROME, value: "true" }
              - { name: CONNECTION_TIMEOUT, value: "300000" }
              - { name: MAX_CONCURRENT_SESSIONS, value: "10" }
              - { name: CHROME_REFRESH_TIME, value: "600000" }
              - { name: DEFAULT_BLOCK_ADS, value: "true" }
              - { name: DEFAULT_STEALTH, value: "true" }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      main:
        ports:
          http:
            port: *port
    route:
      internal:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: *app
          gatus.home-operations.com/endpoint: |-
            url: https://changedetection.${SECRET_DOMAIN}/
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        enabled: true
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM. This token has no `:-default`, so a stale VOLSYNC_CLAIM would render an
        # EMPTY existingClaim. Skill `kopiur-backups`, references/onboarding.md.
        existingClaim: "${KOPIUR_CLAIM}"
        advancedMounts:
          main:
            main:
              - path: /datastore
