---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app changedetection
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 3
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Identity is declared POD-level, not only on the container that mounts the
    # claim, and that placement is load-bearing: kopiur's operator reads the
    # POD securityContext to decide whether the mover uid matches the workload,
    # and emits the positive-only `SecurityContextCompatible` condition from it.
    # Measured 2026-08-31 - with 1000:1000 set only on the `main` container the
    # snapshot still Succeeded but the condition was ABSENT, which per
    # `components/kopiur/Readme.md` is not a pass. Every other onboarded app in
    # the fleet declares its identity here for the same reason.
    # `browser` (browserless/chrome) then needs its own container-level override
    # back to its image's `blessuser` uid 999.
    defaultPodOptions:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
    controllers:
      main:
        containers:
          main:
            image:
              repository: ghcr.io/dgtlmoon/changedetection.io
              tag: 0.55.8@sha256:5438423d5e906eff4e8f7886823482ad23f472bf7b8530ccaca89fb48c337882
            # Identity (1000:1000, inherited from defaultPodOptions above) is
            # MEASURED, not declared-and-hoped: the image default is root, and
            # before this the pod ran as uid 0 while the overlay claimed
            # 2000:2000 and both VolSync movers ran 1000:1000. 1000:1000 is the
            # only value with a real claim to the data - every file and every
            # setgid directory under /datastore is already group 1000 (the stamp
            # of a VolSync restore mover) - and it is kopiur's fleet default, so
            # no KOPIUR_PUID/PGID override is needed.
            env:
              PORT: &port 5000
              USE_X_SETTINGS: 1
              PLAYWRIGHT_DRIVER_URL: ws://localhost:3000/?stealth=1&--disable-web-security=true&--user-data-dir=~/browserless-cache-123
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          browser:
            image:
              repository: docker.io/browserless/chrome
              tag: latest@sha256:57d19e414d9fe4ae9d2ab12ba768c97f38d51246c5b31af55a009205c136012f
              pullPolicy: IfNotPresent
            # Overrides the pod-level 1000:1000 back to this image's own
            # `blessuser`. Chrome needs its home and user-data-dir, both owned
            # by 999 in the image; it mounts no PVC, so nothing about the
            # backup identity depends on it.
            securityContext:
              runAsUser: 999
              runAsGroup: 999
              runAsNonRoot: true
            env:
              - { name: SCREEN_WIDTH, value: "1920" }
              - { name: SCREEN_HEIGHT, value: "1024" }
              - { name: SCREEN_DEPTH, value: "16" }
              - { name: ENABLE_DEBUGGER, value: "false" }
              - { name: PREBOOT_CHROME, value: "true" }
              - { name: CONNECTION_TIMEOUT, value: "300000" }
              - { name: MAX_CONCURRENT_SESSIONS, value: "10" }
              - { name: CHROME_REFRESH_TIME, value: "600000" }
              - { name: DEFAULT_BLOCK_ADS, value: "true" }
              - { name: DEFAULT_STEALTH, value: "true" }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      main:
        ports:
          http:
            port: *port
    route:
      internal:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Selfhosted
          gethomepage.dev/name: *app
          gatus.home-operations.com/endpoint: |-
            url: https://changedetection.${SECRET_DOMAIN}/
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
    persistence:
      config:
        enabled: true
        existingClaim: "${VOLSYNC_CLAIM}"
        advancedMounts:
          main:
            main:
              - path: /datastore
