---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name n8n-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        N8N_ENCRYPTION_KEY: "{{ .N8N_ENCRYPTION_SECRET_KEY }}"

        DB_TYPE: postgresdb
        DB_POSTGRESDB_DATABASE: "{{ .POSTGRES_DB_NAME }}"
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        DB_POSTGRESDB_HOST: "postgres-18-rw.database.svc.cluster.local"
        DB_POSTGRESDB_USER: "{{ .POSTGRES_DB_USER_NAME }}"
        DB_POSTGRESDB_PASSWORD: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        DB_POSTGRESDB_PORT: "5432"
  dataFrom:
    - extract:
        key: n8n
