---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app n8n
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      n8n:
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          init-postgres:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6
            envFrom: &envFrom
              - secretRef:
                  name: n8n-secret

        containers:
          app:
            image:
              repository: ghcr.io/n8n-io/n8n
              tag: 2.34.6
            env:
              GENERIC_TIMEZONE: America/New_York
              N8N_PORT: &port 80
              N8N_HOST: &hostName "n8n.${SECRET_DOMAIN}"
              WEBHOOK_URL: "https://n8n-webhook.${SECRET_DOMAIN}/"
              N8N_PROXY_HOPS: 1
              # Logging
              N8N_LOG_LEVEL: info
              N8N_LOG_OUTPUT: console

              N8N_PERSONALIZATION_ENABLED: false
              N8N_VERSION_NOTIFICATIONS_ENABLED: false
              N8N_DIAGONISTICS_ENABLED: false
              N8N_HIRING_BANNER_ENABLED: false
              N8N_USER_MANAGEMENT_DISABLED: true
              N8N_RUNNERS_ENABLED: true

              DB_SQLITE_VACUUM_ON_STARTUP: true
              EXECUTIONS_DATA_PRUNE: true
              EXECUTIONS_DATA_MAX_AGE: 7
              EXECUTIONS_DATA_PRUNE_MAX_COUNT: 50000
              N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: false
              N8N_PROTOCOL: "https"

              # Public API
              N8N_PUBLIC_API_DISABLED: false
              N8N_PUBLIC_API_SWAGGERUI_DISABLED: true
              NODE_FUNCTION_ALLOW_BUILTIN: "*"
              N8N_METRICS: true
              # NODE_FUNCTION_ALLOW_EXTERNAL: "@databricks/sql"  # Disabled - module not installed
              N8N_USER_FOLDER: /config
              N8N_EMAIL_MODE: smtp

            envFrom: *envFrom
            resources:
              requests:
                cpu: 100m
                memory: 200Mi
              limits:
                memory: 1000Mi
            probes:
              # n8n serves TWO different health endpoints and they are not
              # interchangeable. Upstream comments /healthz in
              # packages/cli/src/abstract-server.ts as "main health check
              # should not care about DB connections" - it is
              # `res.send({status:'ok'})` with no condition, so it CANNOT fail
              # while the process is alive. /healthz/readiness is the DB-aware
              # one: 200 only when `connected && migrated && fullyReady`.
              #
              # Pointing BOTH probes at /healthz hid a total 4-day n8n outage
              # (2026-09-16 -> 2026-09-20). A Postgres blip latched n8n's
              # `connectionState.connected` false and it never recovered, so the
              # global gate registered in setupHealthCheck() answered
              # `{"code":503,"message":"Database is not ready!"}` to EVERY route
              # - /rest/login, /metrics, webhooks, unknown paths alike - while
              # /healthz still returned 200, the pod stayed 1/1 Ready, and the
              # Gatus check on /healthz stayed green the whole time. The DB was
              # reachable from the pod throughout (TCP to postgres-17-rw:5432
              # succeeded); only n8n's cached flag was stuck.
              #
              # Liveness deliberately STAYS on /healthz: a DB-aware liveness
              # probe would restart every DB-dependent pod on each CNPG
              # switchover. Readiness moves to /healthz/readiness, which is a
              # cached in-memory flag read (no DB query, so timeoutSeconds: 1 is
              # still right). A latched pod now leaves the Service endpoints and
              # trips kube-prometheus-stack's namespace-agnostic KubePodNotReady
              # (for: 15m) instead of sitting silently dead.
              #
              # startup stays disabled on purpose: readiness failures never
              # restart a pod, so a slow schema migration just holds the pod
              # NotReady until it finishes. A startup probe on the readiness
              # path would instead CrashLoop n8n through a long migration.
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              startup:
                enabled: false

    defaultPodOptions:
      # Kept off talos-3. That node is the GPU/storage node: the Arc Pro B70
      # pins ai/vllm there (devic.es/b70 is advertised only by talos-3), and it
      # also carries 2 of the 6 Ceph OSDs, a mon, and the postgres-17 replica
      # that CNPG's required anti-affinity fixes to one instance per node. Once
      # vllm's memory request reflects its real 38.4GiB working set, talos-3 has
      # no room left for discretionary workloads. Measured evidence and the full
      # arithmetic: docs/talos-3-scheduling-truth.md (2026-09-14).
      #
      # Confining this app to talos-1/talos-2 costs no real availability: the
      # 3 Ceph mons are one per node, so losing both other nodes already means
      # no mon quorum and no ceph-block storage, and this app could not run on
      # talos-3 alone regardless.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-3
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"

    service:
      app:
        controller: n8n
        ports:
          http:
            port: *port

    persistence:
      config:
        enabled: true
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM: volsync was retired from this volume
        # on 2026-09-04 (Stage 5 wave three), and that overlay now defines no
        # VOLSYNC_* key. The default is corrected to the literal claim name at
        # the same time, because the old `:-*app` was a DANGLING YAML ALIAS,
        # not an anchor reference - kustomize emits the token verbatim, so the
        # moment VOLSYNC_CLAIM stopped being defined the render became
        # `existingClaim: *app` and flate failed the whole Kustomization with
        # `unknown anchor 'app' referenced`. The trap was recorded in
        # docs/backups/kopiur-wave-two-retirement-2026-09-02.md and never
        # fired, because the overlay always set VOLSYNC_CLAIM until now.
        existingClaim: ${KOPIUR_CLAIM:-n8n}

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Automation
          gethomepage.dev/name: N8N
          gethomepage.dev/icon: n8n.svg
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
          # /healthz/readiness, NOT /healthz - see the probes block above.
          # /healthz is unconditional `{status:'ok'}` upstream, so this check
          # reported 200/green for the entire 4-day outage in which n8n
          # answered 503 "Database is not ready!" to every real request. The
          # sibling n8n-webhooks check below was the only one that went red.
          gatus.home-operations.com/endpoint: |-
            url: https://n8n.${SECRET_DOMAIN}/healthz/readiness
            conditions:
              - "[STATUS] == 200"
            group: selfhosted
        hostnames:
          - "n8n.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: n8n
                namespace: selfhosted
                port: *port
      webhooks:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: APIs
          gethomepage.dev/description: N8N Webhook API
          gethomepage.dev/name: N8N Webhook
          gethomepage.dev/icon: n8n.svg
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          gatus.home-operations.com/endpoint: |-
            url: https://n8n-webhook.${SECRET_DOMAIN}/webhook/any
            conditions:
              - "[STATUS] == 404"
              - "[BODY].code == 404"
            group: selfhosted
        hostnames:
          - "n8n-webhook.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /webhook
            backendRefs:
              - name: n8n
                port: 80
                # NEW: OAuth callback rule
          - matches:
              - path:
                  type: PathPrefix
                  value: /rest/oauth2-credential
            backendRefs:
              - name: n8n
                port: 80
