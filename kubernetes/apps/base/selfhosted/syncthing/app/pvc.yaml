---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: syncthing-data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # Sized to the synced folders (Documents, Screenshots, Projects, camera-roll headroom) plus buffer.
      # allowVolumeExpansion permits growing later; a PVC cannot shrink. VOLSYNC_CAPACITY in
      # kubernetes/apps/main/selfhosted/syncthing.yaml must track this size.
      storage: 15Gi
  storageClassName: ceph-block
