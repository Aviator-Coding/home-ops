---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tailscale-operator
  values:
    # Credentials come from ExternalSecret operator-oauth (client_id, client_secret).
    oauthSecretVolume:
      secret:
        secretName: operator-oauth
    operatorConfig:
      hostname: tailscale-operator
      defaultTags: ["tag:k8s-operator"]
      image:
        repository: ghcr.io/tailscale/k8s-operator
        pullPolicy: IfNotPresent
      podAnnotations:
        reloader.stakater.com/auto: "true"
      resources:
        requests:
          cpu: 10m
          # Explicit memory request; limit-only would reserve all 256Mi.
          memory: 128Mi
        limits:
          memory: 256Mi
    proxyConfig:
      defaultTags: tag:k8s
      image:
        repository: ghcr.io/tailscale/tailscale
    apiServerProxyConfig:
      mode: "false"
