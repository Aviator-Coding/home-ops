---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flaresolverr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      flaresolverr:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2
            # env:
            #   TZ: Europe/Warsaw
            env:
              LOG_LEVEL: info
              LOG_HTML: false
              CAPTCHA_SOLVER: none
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8191
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # Kept off talos-3. That node is the GPU/storage node: the Arc Pro B70
      # pins ai/vllm there (devic.es/b70 is advertised only by talos-3), and it
      # also carries 2 of the 6 Ceph OSDs, a mon, and the postgres-17 replica
      # that CNPG's required anti-affinity fixes to one instance per node. Once
      # vllm's memory request reflects its real 38.4GiB working set, talos-3 has
      # no room left for discretionary workloads. Measured evidence and the full
      # arithmetic: docs/talos-3-scheduling-truth.md (2026-09-14).
      #
      # Confining this app to talos-1/talos-2 costs no real availability: the
      # 3 Ceph mons are one per node, so losing both other nodes already means
      # no mon quorum and no ceph-block storage, and this app could not run on
      # talos-3 alone regardless.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-3
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: *port
