---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app flaresolverr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      flaresolverr:
        replicas: 2
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/flaresolverr/flaresolverr
              tag: v3.5.2
            # env:
            #   TZ: Europe/Warsaw
            env:
              LOG_LEVEL: info
              LOG_HTML: false
              CAPTCHA_SOLVER: none
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8191
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 1Gi
    # `defaultPodOptions.affinity` NotIn talos-3 REMOVED 2026-09-26: it is now
    # redundant. talos-3 carries a home-operations.com/dedicated taint
    # (talos/nodes/talos-3.yaml.j2) and this app gets no toleration for it.
    # The taint was NoSchedule (a hard filter, equivalent to the removed
    # affinity) at the time of this removal; it was switched the same day to
    # PreferNoSchedule (a scheduler score penalty, not a filter), so what now
    # keeps this app off talos-3 in normal operation is the 300-point
    # TaintToleration gap (.agents/skills/node-scheduling/references/talos-3-ledger.md), not
    # an absolute exclusion - a per-app deny-list entry is still not
    # reinstated here because it would fail open the same way the removed
    # one did for anything that forgets to carry it.
    service:
      app:
        type: ClusterIP
        ports:
          http:
            port: *port
