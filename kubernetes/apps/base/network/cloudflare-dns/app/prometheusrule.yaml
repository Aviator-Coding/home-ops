---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: external-dns-rules
spec:
  groups:
    - name: external-dns.rules
      rules:
        # One rule covers cloudflare-dns and unifi-dns. 180s is 3x the 1m interval; 60s sits inside the healthy staleness sawtooth. Skill `networking` references/dns-ownership.md.
        - alert: ExternalDNSStale
          expr: |-
            time() - external_dns_controller_last_sync_timestamp_seconds > 180
          for: 5m
          annotations:
            summary: >-
              ExternalDNS ({{ $labels.job }}) has not completed a sync in over
              three minutes, sustained for five minutes
              ({{ $value | humanizeDuration }} since last sync)
          labels:
            severity: critical
