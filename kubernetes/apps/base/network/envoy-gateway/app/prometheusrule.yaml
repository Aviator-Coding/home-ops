---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: envoy-gateway-rules
spec:
  groups:
    - name: envoy-gateway.rules
      rules:
        # An Envoy proxy lost its xDS connection to the controller and serves FROZEN config (no route/endpoint
        # updates). Cause seen: controller crash-loop, expired GatewayNamespaceMode SA tokens, xDS auth failure.
        # Runbook: kubectl -n network rollout restart deploy envoy-gateway, then envoy-internal + envoy-external.
        # 10m absorbs a normal controller roll. Skill `networking`, references/envoy-gateway.md.
        - alert: EnvoyProxyControlPlaneDisconnected
          expr: envoy_control_plane_connected_state{namespace="network"} == 0
          for: 10m
          annotations:
            summary: >-
              Envoy proxy {{ $labels.pod }} has been disconnected from the
              envoy-gateway control plane for 10m and is serving stale config —
              rollout restart envoy-gateway then envoy-internal/envoy-external.
          labels:
            severity: critical
        # The controller is crash-looping. Past cause: a liveness-kill (exit 137, not OOM) from stale proxies
        # flooding the auth interceptor with expired tokens; a crash-looping controller stops pushing xDS, which
        # freezes the proxies. Skill `networking`, references/envoy-gateway.md.
        - alert: EnvoyGatewayControllerCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="network", pod=~"envoy-gateway-.*"}[15m]) >= 2
          for: 5m
          annotations:
            summary: >-
              envoy-gateway controller {{ $labels.pod }} restarted
              {{ $value | printf "%.0f" }}x in 15m — check controller logs for a
              kubejwt 'service account token has expired' storm from stale proxies.
          labels:
            severity: warning
