---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Reads the pushed password back from 1Password, so the db-init Job and the maintenance CronJob see the same value an
# external client gets. SecretSynced does not mean non-empty. Skill `secrets-1password`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ducklake
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ducklake-secret
    template:
      data:
        INIT_POSTGRES_DBNAME: ducklake
        INIT_POSTGRES_HOST: postgres-17-rw.database.svc.cluster.local
        INIT_POSTGRES_USER: ducklake
        INIT_POSTGRES_PASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # libpq environment for the maintenance CronJob (postgres extension reads these).
        PGHOST: postgres-17-rw.database.svc.cluster.local
        PGPORT: "5432"
        PGDATABASE: ducklake
        PGUSER: ducklake
        PGPASSWORD: "{{ .POSTGRES_DB_USER_PASSWORD }}"
  dataFrom:
    - extract:
        key: ducklake
    - extract:
        key: cloudnative-pg
