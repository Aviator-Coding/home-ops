---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/objectbucket.io/objectbucketclaim_v1alpha1.json
# The ceph-bucket class has reclaimPolicy Delete: deleting this claim deletes the bucket and every Parquet file in it.
# prune: disabled stops Flux from deleting it when this manifest leaves Git or the Kustomization is removed. It does NOT
# stop `kubectl delete obc` or a namespace delete. Skill `databases` references/ducklake.md.
apiVersion: objectbucket.io/v1alpha1
kind: ObjectBucketClaim
metadata:
  name: &name ducklake
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  bucketName: *name
  storageClassName: ceph-bucket
  additionalConfig:
    maxObjects: "100000"
    maxSize: 200G
