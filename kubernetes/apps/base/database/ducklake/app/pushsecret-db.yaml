---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the generated role password in 1Password (vault Automation, item `ducklake`), where externalsecret.yaml and
# external DuckDB clients read it back. Skill `databases` references/ducklake.md.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ducklake-db-password
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the item the catalog password lives in.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: ducklake-db-password
  data:
    - match:
        secretKey: POSTGRES_DB_USER_PASSWORD
        remoteRef:
          remoteKey: ducklake
          property: POSTGRES_DB_USER_PASSWORD
