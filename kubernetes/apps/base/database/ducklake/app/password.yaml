---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Role password for the ducklake catalog database. Alphanumeric only: it ends up in libpq env vars and DuckDB ATTACH strings.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: ducklake-db-password
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - POSTGRES_DB_USER_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never refreshed. Deleting this ExternalSecret mints a new password that pushsecret-db.yaml then writes over
# the 1Password field; the role keeps the old one until the db-init Job re-runs. Skill `databases` references/ducklake.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name ducklake-db-password
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
