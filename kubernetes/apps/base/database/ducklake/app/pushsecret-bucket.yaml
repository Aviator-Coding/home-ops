---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Publishes the OBC-generated S3 credentials to 1Password (vault Automation, item `ducklake-ceph-bucket`) so external
# DuckDB clients can read them. Same shape as system/kopiur's pushsecret, on the single-vault store.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: ducklake-ceph-bucket
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the 1Password record it wrote.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      # Generated by the ObjectBucketClaim; named after the claim.
      name: ducklake
  data:
    - match:
        secretKey: AWS_ACCESS_KEY_ID
        remoteRef:
          remoteKey: ducklake-ceph-bucket
          property: ACCESS_KEY_ID
    - match:
        secretKey: AWS_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: ducklake-ceph-bucket
          property: SECRET_ACCESS_KEY
