---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app surrealdb
spec:
  interval: 30m
  chart:
    spec:
      chart: surrealdb
      version: 0.5.0
      sourceRef:
        kind: HelmRepository
        name: surrealdb
        namespace: flux-system
      interval: 5m
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    cleanupOnFail: true
    remediation:
      retries: 3
      # Never roll back: the last good release points at TiKV, which is gone.
      # Skill `databases`.
      strategy: uninstall
  uninstall:
    keepHistory: false
  values:
    # Single replica: RocksDB allows one writer on the data dir lock.
    replicaCount: 1

    # RWO PV must detach the old pod before the new one mounts it on rollout.
    strategy:
      type: Recreate

    # Image runs as UID 65532; fsGroup makes the root-owned Ceph mount writable.
    podSecurityContext:
      fsGroup: 65532

    image:
      repository: surrealdb/surrealdb
      pullPolicy: IfNotPresent
      # tag: Defaults to chart appVersion

    # SurrealDB configuration
    surrealdb:
      path: "rocksdb:///data/surrealdb"

      unauthenticated: false

      log: info

      extraArgs:
        - "--allow-all"
        - "--allow-funcs"

    service:
      type: ClusterIP
      port: 8000
      annotations: {}

    podExtraEnv:
      - name: SURREAL_USER
        valueFrom:
          secretKeyRef:
            name: surrealdb-secret
            key: username
      - name: SURREAL_PASS
        valueFrom:
          secretKeyRef:
            name: surrealdb-secret
            key: password

    ingress:
      enabled: false

    resources:
      requests:
        # Re-measure at [14d:30s] before trimming cpu: coarser sampling under-reads
        # the peak. Skill `databases`.
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 2Gi

    # Preferred anti-affinity only. replicaCount stays 1. Skill databases.
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: surrealdb
              topologyKey: kubernetes.io/hostname

    # nodeTaintsPolicy: Honor only filters NoSchedule/NoExecute; talos-3 is
    # PreferNoSchedule, so the score penalty keeps this off talos-3. Skill `node-scheduling`.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: ScheduleAnyway
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: surrealdb

    # route: does not work on this chart. Leave it unset. A real HTTPRoute
    # is its own manifest. Skill databases.
    livenessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /health
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    serviceMonitor:
      enabled: true

    # storageClassName omitted on purpose: chart 0.4.0 renders it twice. Skill `databases`.
    persistence:
      enabled: true
      accessModes:
        - ReadWriteOnce
      size: 20Gi
      mountPath: /data
