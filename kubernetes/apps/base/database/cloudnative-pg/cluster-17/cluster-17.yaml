---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-17
  labels:
    pgadmin: enabled
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/tensorchord/cloudnative-pgvecto.rs versioning=docker
  imageName: ghcr.io/tensorchord/cloudnative-pgvecto.rs:17.5-v0.4.0

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      kubernetes.io/os: linux
    # instances: 3 + required hostname anti-affinity means one instance must land
    # on talos-3 (PreferNoSchedule taint); this toleration removes the score penalty.
    # Skill `node-scheduling`.
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  storage:
    size: 100Gi
    storageClass: ceph-block

  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true

  # Bootstrap from the previous serverName archive. Skill `databases`.
  bootstrap:
    recovery:
      source: &previousCluster postgres17-v4

  postgresql:
    shared_preload_libraries: ["vectors.so"]
    parameters:
      max_connections: "300"
      work_mem: 64MB
      shared_buffers: 128MB

  resources:
    requests:
      cpu: 500m
    limits:
      memory: 4Gi

  monitoring:
    enablePodMonitor: true
    # Keep the original `cluster` label: the bundled dashboard reads it. Skill `databases`.
    podMonitorMetricRelabelings:
      - {
          sourceLabels: ["cluster"],
          targetLabel: cnpg_cluster,
          action: replace,
        }

  # Increment serverName on a restore so archives stay distinct. Skill `databases`.
  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://home-ops-postgres-cluster/
      endpointURL: https://nas.${SECRET_DOMAIN}:9000
      serverName: &currentCluster postgres17-v5
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key

  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster
