---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cloudnative-pg-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: cloudnative-pg.rules
      rules:
        - alert: LongRunningTransaction
          annotations:
            description: Pod {{ $labels.pod }} is taking more than 5 minutes (300 seconds) for a query.
            summary: A query is taking longer than 5 minutes.
          expr: |-
            cnpg_backends_max_tx_duration_seconds > 300
          for: 1m
          labels:
            severity: warning
        - alert: BackendsWaiting
          annotations:
            description: Pod {{ $labels.pod }} has been waiting for longer than 5 minutes
            summary: If a backend is waiting for longer than 5 minutes
          expr: |-
            cnpg_backends_waiting_total > 300
          for: 1m
          labels:
            severity: warning
        - alert: PGDatabase
          annotations:
            description: Over 300,000,000 transactions from frozen xid on pod {{ $labels.pod }}
            summary: Number of transactions from the frozen XID to the current one
          expr: |-
            cnpg_pg_database_xid_age > 300000000
          for: 1m
          labels:
            severity: warning
        - alert: PGReplication
          annotations:
            description: Standby is lagging behind by over 300 seconds (5 minutes)
            summary: The standby is lagging behind the primary
          expr: |-
            cnpg_pg_replication_lag > 300
          for: 1m
          labels:
            severity: warning
        - alert: LastFailedArchiveTime
          annotations:
            description: Archiving failed for {{ $labels.pod }}
            summary: Checks the last time archiving failed. Will be < 0 when it has not failed.
          expr: |-
            (cnpg_pg_stat_archiver_last_failed_time - cnpg_pg_stat_archiver_last_archived_time) > 1
          for: 1m
          labels:
            severity: warning
        - alert: DatabaseDeadlockConflicts
          annotations:
            description: There are over 10 deadlock conflicts in {{ $labels.pod }}
            summary: Checks the number of database conflicts
          expr: |-
            cnpg_pg_stat_database_deadlocks > 10
          for: 1m
          labels:
            severity: warning
        - alert: ReplicaFailingReplication
          annotations:
            description: Replica {{ $labels.pod }} is failing to replicate
            summary: Checks if the replica is failing to replicate
          expr: |-
            cnpg_pg_replication_in_recovery > cnpg_pg_replication_is_wal_receiver_up
          for: 1m
          labels:
            severity: warning
        # Backup age and WAL-archive staleness. LastFailedArchiveTime only
        # sees a recorded failure (last_failed - last_archived). An archiver
        # that stops, and a nightly backup that stops being scheduled, move
        # neither timestamp, so that rule stays quiet.
        #
        # Standbys report cnpg_collector_last_available_backup_timestamp as
        # exactly 0 (measured 2026-09-26: postgres-17-1 and postgres-17-6
        # were 0 while primary postgres-17-5 was a real unix time, age ~8.9h).
        # A bare time() - timestamp comparison pages both standbys at once.
        # The timestamp > 0 filter is required. It is joined to
        # cnpg_pg_replication_in_recovery == 0 so a demoted primary that kept
        # a frozen non-zero timestamp cannot page after the new primary has
        # taken over. Over the prior 14d no series was simultaneously
        # timestamp > 0 and in_recovery == 1; the 14d peak age on a real
        # timestamp was ~23.9h, under this 36h threshold (1.5x the @daily
        # ScheduledBackup). The archiver series is exported only by the
        # primary; its 7d peak lag was ~5 minutes, under the 1h threshold.
        #
        # timestamp > 0 cannot see a primary that reports 0 or drops the
        # series. The two *TimestampAbsent rules are that case: the primary
        # (in_recovery == 0) unless a positive timestamp on the same pod.
        # Both were empty on the live primary, which does export one.
        - alert: PostgresBackupStale
          annotations:
            description: Primary {{ $labels.pod }} last completed a base backup more than 36h ago. ScheduledBackup postgres-17 is daily; standbys report this timestamp as 0 and are excluded.
            summary: Primary {{ $labels.pod }} has not completed a Postgres base backup in over 36h
          expr: |-
            (
              (time() - cnpg_collector_last_available_backup_timestamp) > 129600
            )
              and on(pod) (cnpg_collector_last_available_backup_timestamp > 0)
              and on(pod) (cnpg_pg_replication_in_recovery == 0)
          for: 15m
          labels:
            severity: warning
        - alert: PostgresBackupTimestampAbsent
          annotations:
            description: Primary {{ $labels.pod }} has no positive cnpg_collector_last_available_backup_timestamp, so PostgresBackupStale cannot see it. Standbys report 0 by design and are excluded.
            summary: Primary {{ $labels.pod }} is not reporting a Postgres base-backup timestamp
          expr: |-
            (cnpg_pg_replication_in_recovery == 0)
              unless on(pod) (cnpg_collector_last_available_backup_timestamp > 0)
          for: 15m
          labels:
            severity: warning
        - alert: PostgresWALArchiveStale
          annotations:
            description: Primary {{ $labels.pod }} has not archived a WAL segment in over 1h. LastFailedArchiveTime does not cover an archiver that simply stops.
            summary: Primary {{ $labels.pod }} has not archived a WAL segment in over 1h
          expr: |-
            (
              (time() - cnpg_pg_stat_archiver_last_archived_time) > 3600
            )
              and on(pod) (cnpg_pg_stat_archiver_last_archived_time > 0)
              and on(pod) (cnpg_pg_replication_in_recovery == 0)
          for: 10m
          labels:
            severity: warning
        - alert: PostgresWALArchiveTimestampAbsent
          annotations:
            description: Primary {{ $labels.pod }} has no positive cnpg_pg_stat_archiver_last_archived_time, so PostgresWALArchiveStale cannot see it.
            summary: Primary {{ $labels.pod }} is not reporting a WAL archive timestamp
          expr: |-
            (cnpg_pg_replication_in_recovery == 0)
              unless on(pod) (cnpg_pg_stat_archiver_last_archived_time > 0)
          for: 15m
          labels:
            severity: warning
