---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/barmancloud.cnpg.io/objectstore_v1.json
# Barman Cloud plugin destination for postgres-18. serverName stays on the Cluster's
# plugin parameters, one per cluster generation, so a rebuilt cluster never writes
# over an older archive. Same bucket as the in-tree archives. Skill `databases`.
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: postgres
spec:
  retentionPolicy: 30d
  configuration:
    destinationPath: s3://home-ops-postgres-cluster/
    endpointURL: https://nas.${SECRET_DOMAIN}:9000
    s3Credentials:
      accessKeyId:
        name: cloudnative-pg-secret
        key: aws-access-key-id
      secretAccessKey:
        name: cloudnative-pg-secret
        key: aws-secret-access-key
    data:
      # Base backups accept only bzip2, gzip, lz4 and snappy.
      compression: bzip2
    wal:
      compression: zstd
      maxParallel: 4
  instanceSidecarConfiguration:
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
