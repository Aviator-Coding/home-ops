---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-18
  labels:
    pgadmin: enabled
spec:
  instances: 3
  # `standard` ships pgvector (extension `vector`). Backups go through the Barman Cloud
  # plugin, so the deprecated `system` flavour is not needed. Renovate holds this to
  # major 18 (.renovate/overrides.json5). Skill `databases`.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:5bf4a23aa13fb560903fba932676773ba4ba2729c162e587b09bf539a2e3df56

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      kubernetes.io/os: linux
    # instances: 3 + required hostname anti-affinity means one instance must land
    # on talos-3 (PreferNoSchedule taint); this toleration removes the score penalty.
    # Skill `node-scheduling`.
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  # Ride out short pod-network stalls instead of failing over at once.
  failoverDelay: 30

  # Node-local NVMe: Postgres replicates to the other two instances and archives
  # WAL, so Ceph's 3 copies underneath would be 9 copies in total. hostpath has no
  # quota; the NodeFilesystem* alerts cover /var. A drained node's instance stays
  # Pending until that node returns. Skill `databases`.
  storage:
    size: 100Gi
    storageClass: openebs-hostpath

  superuserSecret:
    name: cloudnative-pg-secret
  # pgAdmin and break-glass. App roles and databases are DatabaseRole/Database CRs
  # (components/cnpg-database).
  enableSuperuserAccess: true

  # One-time logical import of the app databases from postgres-17 (cutover window,
  # apps scaled to 0). Retired apps' databases are deliberately left behind.
  bootstrap:
    initdb:
      import:
        type: monolith
        databases:
          - authentik
          - coder
          - lidarr
          - linkwarden
          - litellm
          - litellm_pgvector
          - n8n
          - paperless
          - prowlarr
          - radarr
          - seerr
          - sonarr
        roles:
          - authentik
          - coder
          - lidarr
          - linkwarden
          - litellm
          - litellm_pgvector
          - n8n
          - paperless
          - prowlarr
          - radarr
          - seerr
          - sonarr
        source:
          externalCluster: postgres-17

  externalClusters:
    - name: postgres-17
      connectionParameters:
        host: postgres-17-rw.database.svc.cluster.local
        user: postgres
        dbname: postgres
        sslmode: require
      password:
        name: cloudnative-pg-secret
        key: password

  # serverName is one per cluster generation: postgres18-v1 is the archive of the
  # empty cluster this one replaced. Increment it on any rebuild. Skill `databases`.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: postgres
        serverName: postgres18-v2

  # Adds the LAN name of postgres-18-lb to the CNPG-issued server certificate.
  # Never serverTLSSecret/serverCASecret. Skill `databases` references/cnpg.md.
  certificates:
    serverAltDNSNames:
      - postgres-18.${SECRET_DOMAIN}

  postgresql:
    synchronous:
      method: any
      number: 1
      # Keep accepting writes when no standby is up, then catch up.
      dataDurability: preferred
      failoverQuorum: true
    parameters:
      max_connections: "300"
      work_mem: 64MB
      shared_buffers: 512MB
      max_slot_wal_keep_size: 2GB
      idle_in_transaction_session_timeout: "600000"

  # postgres-17 peaked at 3,610Mi on a 4Gi limit with 128MB shared_buffers; this
  # adds 384MB of shared_buffers, so the request covers that peak.
  resources:
    requests:
      cpu: 500m
      memory: 4Gi
    limits:
      memory: 6Gi

  monitoring:
    enablePodMonitor: true
    # Keep the original `cluster` label: the bundled dashboard reads it. Skill `databases`.
    podMonitorMetricRelabelings:
      - sourceLabels: ["cluster"]
        targetLabel: cnpg_cluster
        action: replace
