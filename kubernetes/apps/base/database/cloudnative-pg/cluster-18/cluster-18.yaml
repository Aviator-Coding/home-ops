---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-18
spec:
  instances: 3
  # `system`, not `standard`: only it bundles the barman-cloud-* binaries that in-tree
  # `barmanObjectStore` execs (standard fails ContinuousArchiving). Moves to the Barman Cloud
  # Plugin before CNPG 1.31. Skill `databases`.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie@sha256:348997438269fddc0e2825e00594367ad61751adb08a7698a0a14f793b0dc2ce

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
    nodeSelector:
      kubernetes.io/os: linux
    # instances: 3 + required hostname anti-affinity means one instance must land
    # on talos-3 (PreferNoSchedule taint); this toleration removes the score penalty.
    # Skill `node-scheduling`.
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule

  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover

  storage:
    size: 100Gi
    storageClass: ceph-block

  superuserSecret:
    name: cloudnative-pg-secret
  enableSuperuserAccess: true

  # template1 gets the extension, so every database created later (per-app init Jobs)
  # already has `vector`. The library comes from the ImageVolume below, which needs
  # the ImageVolume feature gate in talos/machineconfig.yaml.j2. Skill `databases`.
  bootstrap:
    initdb:
      postInitTemplateSQL:
        - CREATE EXTENSION IF NOT EXISTS vector;

  postgresql:
    extensions:
      - name: pgvector
        image:
          # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/pgvector
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.7-18-trixie@sha256:bc9da05b09950b5beca1ce77c9903432b666a6cb527e60c78c7943ebf328e3cb
      # TimescaleDB Community Edition (Timescale License: compression, continuous aggregates,
      # policy jobs), built by .github/workflows/build-timescaledb-community.yaml. Content-addressed
      # tag: after ANY edit in .github/docker/timescaledb-community set it to
      # `python3 scripts/ci/timescaledb-community-test.py --print-tag`.
      # Not created in template1: each database that wants it runs CREATE EXTENSION timescaledb.
      - name: timescaledb
        image:
          reference: ghcr.io/aviator-coding/timescaledb-community:2.31.0-6648c17deb05
    shared_preload_libraries:
      - timescaledb
    parameters:
      max_connections: "300"
      work_mem: 64MB
      timescaledb.telemetry_level: "off"
      shared_buffers: 128MB

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 4Gi

  monitoring:
    enablePodMonitor: true
    # Keep the original `cluster` label: the bundled dashboard reads it. Skill `databases`.
    podMonitorMetricRelabelings:
      - {
          sourceLabels: ["cluster"],
          targetLabel: cnpg_cluster,
          action: replace,
        }

  # Increment serverName on a restore so archives stay distinct. Skill `databases`.
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 4
      destinationPath: s3://home-ops-postgres-cluster/
      endpointURL: https://nas.${SECRET_DOMAIN}:9000
      serverName: postgres18-v1
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secret
          key: aws-access-key-id
        secretAccessKey:
          name: cloudnative-pg-secret
          key: aws-secret-access-key
