---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# R2 half of the postgres-17 off-site mirror credential.
# Skill `databases`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudnative-pg-r2-secret
  data:
    - secretKey: R2_ENDPOINT_URL
      remoteRef:
        key: cloudflare-r2
        property: R2_K8S_ENDPOINT_URL
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: cloudflare-r2
        property: R2_K8S_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: cloudflare-r2
        property: R2_K8S_SECRET_ACCESS_KEY
