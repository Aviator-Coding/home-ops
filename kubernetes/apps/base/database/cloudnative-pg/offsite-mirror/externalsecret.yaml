---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# R2 half of the postgres-17 off-site mirror credential. The LAN (source) half
# already exists and is NOT duplicated here: `cloudnative-pg-secret` in this
# namespace carries `aws-access-key-id` / `aws-secret-access-key` for the
# TrueNAS MinIO, and the CronJob reads it directly.
#
# Every field is fetched by explicit `data` + `property` rather than
# `dataFrom.extract` + template, following `system/kopiur`'s repository
# ExternalSecrets. That choice is load-bearing here: a missing property fails
# this ExternalSecret LOUDLY, whereas extract-and-template renders a missing
# field as an EMPTY string and materializes a Secret holding a blank
# credential - which rclone would then present to R2 as an anonymous request.
#
# UNTIL THE 1PASSWORD ITEM EXISTS THIS EXTERNALSECRET DOES NOT RESOLVE, AND
# THAT IS THE INTENDED STATE, not a broken manifest. It is how this repo
# expresses "a secret that must exist": the declared dependency is visible in
# git and fails closed, rather than the job silently running without
# credentials. The CronJob mounts this Secret with `envFrom`, so its pods stay
# unschedulable until it materializes.
#
# The item is purpose-built for this destination rather than being added to a
# shared grab-bag, matching the `kopiur-ceph` / `kopiur-r2` convention
# (kubernetes/apps/base/system/kopiur/README.md). The two live R2 tokens are
# both bucket-scoped and deliberately NOT reused: `kopiur-r2` reaches bucket
# `kopiur` alone (`volsync` 403s, ListBuckets denied), and `volsync-template`'s
# `R2_HOME_OPS_*` reaches `volsync`.
#
# Expected 1Password item: `cloudnative-pg-r2`, in a Connect-visible vault
# (`Homelab`, `Automation` or `Services` - NEVER the hyphenated `Home-Lab`,
# which 1Password Connect cannot see at all). Required fields:
#   R2_ENDPOINT_URL       https://<accountid>.r2.cloudflarestorage.com
#   R2_ACCESS_KEY_ID
#   R2_SECRET_ACCESS_KEY
# The endpoint lives in the item rather than in git because it embeds the
# Cloudflare account id - the same reason `system/kopiur` keeps it there.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudnative-pg-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cloudnative-pg-r2-secret
  data:
    - secretKey: R2_ENDPOINT_URL
      remoteRef:
        key: cloudnative-pg-r2
        property: R2_ENDPOINT_URL
    - secretKey: R2_ACCESS_KEY_ID
      remoteRef:
        key: cloudnative-pg-r2
        property: R2_ACCESS_KEY_ID
    - secretKey: R2_SECRET_ACCESS_KEY
      remoteRef:
        key: cloudnative-pg-r2
        property: R2_SECRET_ACCESS_KEY
