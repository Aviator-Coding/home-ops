---
# Second, OFF-SITE copy of the postgres-17 barman archive.
# Skill `databases`.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-offsite-mirror
  namespace: database
  labels:
    app.kubernetes.io/name: postgres-offsite-mirror
spec:
  # SHIPS SUSPENDED, AND UN-SUSPENDING IS THE DELIBERATE ACT THAT TURNS THE MIRROR ON.
  # Skill `databases`.
  suspend: true
  # Hourly, offset from :00. The off-site WAL stream therefore lags the LAN
  # copy by up to ~1h - this is a second copy, not a second primary; the LAN
  # target remains the continuous one fed by archive_command. :25 avoids the
  # CNPG `@daily` base backup at :00, pvc-writable-check at :17 and
  # pvc-mover-readable-check at :47.
  schedule: "25 * * * *"
  # A run must never overlap itself: two rclone passes over the same
  # destination prefix would duplicate work and could interleave the prune with
  # an in-flight copy. The initial seed copies the whole archive and can exceed
  # an hour; Forbid makes the following runs skip until it finishes, which is
  # the correct behaviour rather than something to tune around.
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 172800 # 48h
      # Generous, sized for the FIRST run: seeding a 100Gi cluster's archive
      # (bzip2 base backups plus WAL) is far slower than the steady-state
      # hourly delta. Steady-state runs finish in a small fraction of this.
      activeDeadlineSeconds: 21600 # 6h
      template:
        metadata:
          labels:
            app.kubernetes.io/name: postgres-offsite-mirror
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: mirror
              # renovate: datasource=docker depName=rclone/rclone
              image: rclone/rclone:1.75.1
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  memory: 512Mi
              env:
                # Same bucket name and serverName on both sides, deliberately:
                # it keeps `destinationPath` identical for a future restore, so
                # an `externalClusters[]` entry pointed at the off-site copy
                # differs from the live one only by `endpointURL` and
                # credentials.
                - name: ARCHIVE_BUCKET
                  value: home-ops-postgres-cluster
                - name: SERVER_NAME
                  value: postgres17-v5
                # 35d, five days past the LAN 30d retention, so a LAN prune cannot race this copy.
                # Skill `databases`.
                - name: OFFSITE_RETENTION
                  value: 35d
                # Runaway guard: a candidate count above PRUNE_CEILING fails the job instead of deleting.
                # Skill `databases`.
                - name: PRUNE_CEILING
                  value: "2000"
                - name: HOME
                  value: /tmp
                - name: RCLONE_CONFIG
                  value: /tmp/rclone.conf
                # --- source: the LAN TrueNAS MinIO (read) ---
                - name: RCLONE_CONFIG_LAN_TYPE
                  value: s3
                - name: RCLONE_CONFIG_LAN_PROVIDER
                  value: Minio
                # Real Flux substitution variable - NOT escaped, unlike every
                # shell token in the script below.
                - name: RCLONE_CONFIG_LAN_ENDPOINT
                  value: https://nas.${SECRET_DOMAIN}:9000
                - name: RCLONE_CONFIG_LAN_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: aws-access-key-id
                - name: RCLONE_CONFIG_LAN_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-secret
                      key: aws-secret-access-key
                # --- destination: Cloudflare R2 (write) ---
                - name: RCLONE_CONFIG_R2_TYPE
                  value: s3
                - name: RCLONE_CONFIG_R2_PROVIDER
                  value: Cloudflare
                - name: RCLONE_CONFIG_R2_REGION
                  value: auto
                - name: RCLONE_CONFIG_R2_ENDPOINT
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-r2-secret
                      key: R2_ENDPOINT_URL
                - name: RCLONE_CONFIG_R2_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-r2-secret
                      key: R2_ACCESS_KEY_ID
                - name: RCLONE_CONFIG_R2_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cloudnative-pg-r2-secret
                      key: R2_SECRET_ACCESS_KEY
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              command:
                - /bin/sh
                - -c
                # EVERY shell token below is written `$${...}` / `$$(...)`.
                # Skill `databases`.
                - |
                  set -eu

                  SRC="LAN:$${ARCHIVE_BUCKET}/$${SERVER_NAME}"
                  DST="R2:$${ARCHIVE_BUCKET}/$${SERVER_NAME}"

                  echo "postgres-offsite-mirror: start $$(date -u +%FT%TZ)"
                  echo "postgres-offsite-mirror: $${SRC} -> $${DST}"

                  # COPY-ONLY: `rclone copy` never deletes on the destination. It must NEVER become `rclone sync`
                  # and no --delete-* flag may be added, or CNPG's 30d LAN-side deletions and any LAN wipe would
                  # propagate and the off-site copy would stop being a backup. --s3-no-check-bucket keeps the R2 token object-only.
                  rclone copy "$${SRC}" "$${DST}" \
                    --fast-list \
                    --transfers 4 \
                    --checkers 8 \
                    --retries 3 \
                    --low-level-retries 10 \
                    --s3-no-check-bucket \
                    --stats 1m \
                    --stats-one-line

                  echo "postgres-offsite-mirror: copy complete $$(date -u +%FT%TZ)"

                  # INDEPENDENT age-based expiry, not a mirror of LAN deletions; `set -eu` means a failed copy aborts before it.
                  # Ages come from the preserved source mtime (35d after ORIGINAL write); missing metadata only makes objects
                  # look younger, the safe direction. Counted against a ceiling rather than relying on `--max-delete`.
                  rclone lsf --files-only --recursive \
                    --min-age "$${OFFSITE_RETENTION}" "$${DST}" >/tmp/offsite-candidates.list
                  CANDIDATES="$$(wc -l </tmp/offsite-candidates.list | tr -d ' ')"
                  echo "postgres-offsite-mirror: $${CANDIDATES} object(s) older than $${OFFSITE_RETENTION}"

                  if [ "$${CANDIDATES}" -gt "$${PRUNE_CEILING}" ]; then
                    echo "postgres-offsite-mirror: REFUSING to prune - $${CANDIDATES} exceeds ceiling $${PRUNE_CEILING}" >&2
                    exit 1
                  fi

                  if [ "$${CANDIDATES}" -gt 0 ]; then
                    rclone delete "$${DST}" \
                      --min-age "$${OFFSITE_RETENTION}" \
                      --s3-no-check-bucket
                  fi

                  echo "postgres-offsite-mirror: done $$(date -u +%FT%TZ)"
          volumes:
            # readOnlyRootFilesystem: rclone needs a writable HOME for its
            # config and transfer scratch.
            - name: tmp
              emptyDir: {}
