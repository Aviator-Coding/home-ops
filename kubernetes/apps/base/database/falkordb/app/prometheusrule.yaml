---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Ratio rules use kube_pod_container_resource_limits, joined on
# (namespace, pod, container). 0.60 warns, 0.70 is critical, both for 2m.
# Skill databases.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: falkordb-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: falkordb.rules
      rules:
        # 0.60 fires about 2.4Gi before writes refuse at 0.75. for: 2m, because
        # a 10m for can outlast the climb. Skill databases.
        - alert: FalkorDBMemoryApproachingCeiling
          annotations:
            summary: FalkorDB is growing toward its write ceiling
            description: >-
              FalkorDB pod {{ $labels.pod }} is at {{ $value | humanizePercentage }}
              of its memory limit. Writes are refused at 75% (--maxmemory 12gb);
              reads keep serving. Plan capacity or trim the graph before then.
          expr: |
            container_memory_working_set_bytes{namespace="database", pod=~"falkordb-.*", container="app"}
              / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="database", pod=~"falkordb-.*", container="app", resource="memory"}
              > 0.6
          for: 2m
          labels:
            severity: warning

        # --- at the write ceiling ---
        #
        # 0.70 = 11.2 GiB, i.e. ~0.8 GiB below the 12 GiB refusal point. At the
        # measured 0.44 GiB/min that is under two minutes of headroom, so this
        # is deliberately worded as "at or about to reach" rather than promising
        # advance warning: by the time it resolves, ingestion may already be
        # receiving `OOM command not allowed`. Reads are unaffected either way.
        - alert: FalkorDBMemoryAtWriteCeiling
          annotations:
            summary: FalkorDB is at or about to reach its write ceiling
            description: >-
              FalkorDB pod {{ $labels.pod }} is at {{ $value | humanizePercentage }}
              of its memory limit, at the 75% --maxmemory ceiling. Ingestion is
              being or is about to be refused with OOM errors. Reads are
              unaffected. Do not add an eviction policy - that deletes the graph.
          expr: |
            container_memory_working_set_bytes{namespace="database", pod=~"falkordb-.*", container="app"}
              / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="database", pod=~"falkordb-.*", container="app", resource="memory"}
              > 0.7
          for: 2m
          labels:
            severity: critical

        # Ratio rules reset every crash. This one is for: 0m AND a restart
        # increase over 15m, so a stale OOMKilled reason does not latch.
        # Skill databases.
        - alert: FalkorDBOOMKilled
          annotations:
            summary: FalkorDB was OOMKilled
            description: >-
              FalkorDB pod {{ $labels.pod }} was OOMKilled and has restarted.
              --maxmemory bounds cumulative growth but not an AOF-rewrite fork
              or a single admitted query, so suspect those, or a dataset that
              has outgrown the limit. Check `GRAPH.MEMORY USAGE` against
              limits.memory before raising anything.
          expr: |
            kube_pod_container_status_last_terminated_reason{namespace="database", pod=~"falkordb-.*", container="app", reason="OOMKilled"} == 1
              and on (namespace, pod, container)
            increase(kube_pod_container_status_restarts_total{namespace="database", pod=~"falkordb-.*", container="app"}[15m]) > 0
          for: 0m
          labels:
            severity: critical
