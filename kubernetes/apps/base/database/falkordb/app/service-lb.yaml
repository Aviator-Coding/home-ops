---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/v1/service.json
#
# Second Service. Pin 10.50.0.24. Public DNS does not publish Services.
# Do not reuse the chart ClusterIP name or front Redis with a Gateway.
# Skill databases.
apiVersion: v1
kind: Service
metadata:
  name: falkordb-lb
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "falkordb.${SECRET_DOMAIN}"
    lbipam.cilium.io/ips: 10.50.0.24
spec:
  type: LoadBalancer
  ports:
    - name: redis
      port: 6379
      protocol: TCP
      targetPort: 6379
  # The chart's own pod selector, copied from the rendered ClusterIP Service.
  # `app.kubernetes.io/controller` is what distinguishes the controller's pods
  # and must stay in step with the `falkordb` controller key in the
  # HelmRelease - app-template stamps all three labels on the pod template.
  selector:
    app.kubernetes.io/controller: falkordb
    app.kubernetes.io/instance: falkordb
    app.kubernetes.io/name: falkordb
