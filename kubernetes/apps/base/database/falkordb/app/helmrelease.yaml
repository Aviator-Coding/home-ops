---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app falkordb
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # Ordering lives on the Flux Kustomization in
  # kubernetes/apps/main/database/falkordb.yaml (rook-ceph-cluster for the
  # ceph-block StorageClass, kopiur-repository for the backup CRs' webhook), so
  # there is no HelmRelease-level dependsOn duplicating half of it here.
  values:
    controllers:
      falkordb:
        replicas: 1
        # Recreate, NOT RollingUpdate. The claim below is RWO on ceph-block, so
        # a rolling update deadlocks: the new pod cannot attach the volume
        # while the outgoing pod still holds it, and Kubernetes will not evict
        # the old pod until the new one is Ready. This is also the correct
        # semantics for a single-writer database - two FalkorDB processes must
        # never open the same AOF/RDB set.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"

        initContainers:
          # emptyDir stays root-owned after fsGroup. The browser chmods the
          # directory, so an init must chown it. SecurityContextCompatible
          # stays absent, and that is not a failure. Skill databases.
          fix-permissions:
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - chown -R 1000:1000 /app/.data /var/lib/falkordb/browser/.data
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              repository: docker.io/falkordb/falkordb
              tag: v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d

            # AOF is load-bearing: a crash-consistent snapshot restores only
            # fsynced writes. --maxmemory 12gb, the 16Gi limit, and the alert
            # ratios move together. Escape every $${VAR}. Skill databases.
            command:
              - /bin/sh
              - -c
              - >-
                exec redis-server --protected-mode no
                --dir "$${FALKORDB_DATA_PATH}"
                --loadmodule "$${FALKORDB_BIN_PATH}/falkordb.so"
                $${FALKORDB_ARGS}
                --appendonly yes --appendfsync everysec
                --save 900 1 --save 300 10 --save 60 1000
                --maxmemory 12gb
                --requirepass "$${FALKORDB_PASSWORD}"

            envFrom:
              - secretRef:
                  name: falkordb-secret

            env:
              # BROWSER=0 is inert while run.sh is bypassed. Leave it: reverting
              # to the image command would start a second browser on :3000.
              # Skill databases.
              BROWSER: "0"

            probes:
              # TCP for liveness: cheap, and a FalkorDB that has stopped
              # accepting connections is dead regardless of why.
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 6379
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              # Readiness is redis-cli -e GRAPH.LIST. Without -e, redis-cli
              # exits 0 on NOAUTH and ERR. Readiness only: it does not restart
              # the pod. Skill databases.
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["/bin/sh", "-c", "redis-cli -e GRAPH.LIST"]
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              # Startup probe guards a long AOF replay after a restore or an
              # unclean stop: up to 5 minutes before liveness starts counting.
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 10
                  failureThreshold: 30

            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

            resources:
              # Request 7Gi is the resting set. The 16Gi limit and --maxmemory
              # 12gb move with it. Do not raise auto-aof-rewrite-percentage to
              # hide the fork. Skill databases.
              requests:
                cpu: 50m
                memory: 7Gi
              limits:
                memory: 16Gi

          # FalkorDB Browser: same image, second container. It does NOT mount the
          # data volume; it reaches the database over loopback. Skill `databases`.
          browser:
            image:
              repository: docker.io/falkordb/falkordb
              tag: v4.20.7@sha256:13996aa523f0dd283f6bd6df6620b094dcea525452417c4d6ef9bef15dc9998d

            # cwd matters: API_TOKEN_STORAGE_PATH resolves relative to it. Skill `databases`.
            workingDir: /var/lib/falkordb/browser
            # Use the image entrypoint, not `node server.js`; `exec` keeps node as PID 1.
            command:
              - /bin/sh
              - -c
              - exec ./docker-entrypoint.sh node server.js

            env:
              # Next.js binds localhost by default, which probes and the Service cannot reach.
              HOSTNAME: "0.0.0.0"
              PORT: &browserPort 3000
              # These override the image's localhost-only .env.local. Without AUTH_URL a
              # successful login bounces to http://localhost:3000. Skill `databases`.
              AUTH_URL: &browserUrl "https://falkordb-browser.${SECRET_DOMAIN}"
              ALLOWED_ORIGINS: *browserUrl
              # Auth.js must trust the X-Forwarded-* headers envoy-internal sets.
              AUTH_TRUST_HOST: "true"
              # Not envFrom: the browser must not hold FALKORDB_PASSWORD/REDISCLI_AUTH.
              AUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: falkordb-secret
                    key: AUTH_SECRET
              ENCRYPTION_KEY:
                valueFrom:
                  secretKeyRef:
                    name: falkordb-secret
                    key: ENCRYPTION_KEY

            # PORT above pins 3000 so a future image cannot move it.
            ports:
              - name: http
                containerPort: *browserPort

            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *browserPort
                  initialDelaySeconds: 15
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              # GET / returns 200 without a session, so it reads the Next.js server.
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *browserPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3

            # Rootfs stays read-only; the two writable paths are emptyDirs under persistence.
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi

    # Must be spelled exactly "defaultPodOptions", a sibling of controllers:. Any other
    # key is silently discarded. The image runs as root; 1000:1000 is imposed here.
    # Skill `app-workloads`.
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    service:
      app:
        controller: falkordb
        ports:
          redis:
            # Explicitly primary: the Service carries two ports.
            primary: true
            port: *port
          # The browser, fronted by httproute.yaml.
          http:
            port: *browserPort

    # No `route:` block: the route belongs to the browser and stays a standalone
    # HTTPRoute beside its SecurityPolicy (httproute.yaml), so the Authentik gate
    # is never one nested-key edit from being dropped.

    persistence:
      data:
        # Chart-owned claim, not components/volsync or components/kopiur/pvc (the
        # latter is reserved for retired-VolSync volumes). `retain: true` keeps the
        # volume through a failed-install uninstall. Skill `databases`.
        enabled: true
        type: persistentVolumeClaim
        # Pin the claim name: a second persistence entry would rename this to
        # `falkordb-data` and orphan the SnapshotPolicy. Skill `databases`.
        forceRename: falkordb
        accessMode: ReadWriteOnce
        size: 20Gi
        storageClass: ceph-block
        retain: true
        # advancedMounts: only the database container mounts this claim.
        advancedMounts:
          falkordb:
            app:
              - path: /var/lib/falkordb/data

      # The browser's only two writable paths. /tmp and .next/cache are not needed.
      # emptyDir: API tokens do not survive a restart, by design. Skill `databases`.
      browser-app-data:
        # The entrypoint exits 1 unless the hardcoded /app/.data is writable.
        type: emptyDir
        advancedMounts:
          falkordb:
            fix-permissions:
              - path: /app/.data
            browser:
              - path: /app/.data
      browser-data:
        # The token store lives here, not in /app/.data. Without it the pod is Ready
        # but every login fails with `EROFS: chmod '.data'`. Skill `databases`.
        type: emptyDir
        advancedMounts:
          falkordb:
            fix-permissions:
              - path: /var/lib/falkordb/browser/.data
            browser:
              - path: /var/lib/falkordb/browser/.data

      # 6.0.0's module refuses to load when TEMP_FOLDER (/tmp) is not writable,
      # and the rootfs is read-only. 4.x never wrote there. Skill `databases`.
      tmp:
        type: emptyDir
        advancedMounts:
          falkordb:
            app:
              - path: /tmp
