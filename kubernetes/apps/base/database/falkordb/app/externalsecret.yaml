---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# FalkorDB speaks the Redis protocol and its image ships with NO authentication
# and `--protected-mode no` (set by the entrypoint), so without this it would be
# a cluster-wide read/write graph database for any pod that can resolve its
# Service.
#
# The `database` namespace has no default-deny NetworkPolicy - the only policy
# in it is emqx's additive allow-monitoring rule - so network placement provides
# nothing here. That is the difference from `database/dragonfly`, which is also
# unauthenticated but is deliberately per-namespace and sits behind the
# operator's NetworkPolicy restricting :6379 to same-namespace pods; its Readme
# names that policy as the mitigation. A shared datastore in `database` cannot
# use that mitigation, because its consumers are in other namespaces by
# definition. So it takes the same route every other persistent datastore here
# takes: cloudnative-pg, emqx and surrealdb are all authenticated from
# 1Password, and this follows surrealdb's shape exactly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falkordb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: falkordb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the container command, which composes REDIS_ARGS in shell
        # so the value is expanded at start rather than baked into a manifest.
        FALKORDB_PASSWORD: "{{ .FALKORDB_PASSWORD }}"
        # Same value under the name redis-cli reads on its own. The readiness
        # probe runs a real GRAPH command, which returns NOAUTH once a password
        # is set, so the probe needs the credential too - via the environment
        # rather than a command-line flag, which would put the password in the
        # process table of every probe invocation.
        REDISCLI_AUTH: "{{ .FALKORDB_PASSWORD }}"
  dataFrom:
    - extract:
        key: falkordb
