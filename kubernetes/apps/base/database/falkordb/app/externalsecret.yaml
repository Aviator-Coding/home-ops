---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# FalkorDB speaks the Redis protocol and its image ships with NO authentication
# and `--protected-mode no` (set by the entrypoint), so without this it would be
# a cluster-wide read/write graph database for any pod that can resolve its
# Service.
#
# The `database` namespace has no default-deny NetworkPolicy - the only policy
# in it is emqx's additive allow-monitoring rule - so network placement provides
# nothing here. That is the difference from `database/dragonfly`, which is also
# unauthenticated but is deliberately per-namespace and sits behind the
# operator's NetworkPolicy restricting :6379 to same-namespace pods; its Readme
# names that policy as the mitigation. A shared datastore in `database` cannot
# use that mitigation, because its consumers are in other namespaces by
# definition. So it takes the same route every other persistent datastore here
# takes: cloudnative-pg, emqx and surrealdb are all authenticated from
# 1Password, and this follows surrealdb's shape exactly.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falkordb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: falkordb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the container command, which composes REDIS_ARGS in shell
        # so the value is expanded at start rather than baked into a manifest.
        FALKORDB_PASSWORD: "{{ .FALKORDB_PASSWORD }}"
        # Same value under the name redis-cli reads on its own. The readiness
        # probe runs a real GRAPH command, which returns NOAUTH once a password
        # is set, so the probe needs the credential too - via the environment
        # rather than a command-line flag, which would put the password in the
        # process table of every probe invocation.
        REDISCLI_AUTH: "{{ .FALKORDB_PASSWORD }}"
        # --- FalkorDB Browser (the explorer sidecar) ---
        #
        # The image ships `.env.local` with the literal placeholders
        # `AUTH_SECRET=SECRET` and
        # `ENCRYPTION_KEY="your-64-character-hex-string-here"`. Those are
        # published values baked into a public image, so leaving them in place
        # would mean the browser signs its Auth.js session cookies with a key
        # anyone can read off Docker Hub. Both are overridden here.
        #
        # DERIVED from the existing password rather than stored as two new
        # 1Password fields, for three reasons: the values must be STABLE across
        # restarts (a per-boot random `AUTH_SECRET` logs every user out on every
        # pod restart, and the image's entrypoint generates exactly such a
        # throwaway key when `ENCRYPTION_KEY` is unset, warning that encrypted
        # credentials are lost with it); a hash adds no exposure, because the
        # preimage is already in this same Secret, so anyone who can read one
        # can read the other; and it keeps the browser from adding a second
        # captain prerequisite on top of the Authentik binding it already needs.
        # Rotating FALKORDB_PASSWORD rotates both of these too, which is the
        # correct coupling - the session and the credential it protects should
        # not outlive each other.
        #
        # The two salts keep the values independent of each other, so neither
        # is usable in the other's role. `sha256sum` renders exactly 64
        # lowercase hex characters, which is precisely what the entrypoint's
        # `${#ENCRYPTION_KEY} -lt 64` check requires - verified live against
        # ESO v2.9.0 before this was wired in.
        AUTH_SECRET: '{{ printf "%s:falkordb-browser-auth" .FALKORDB_PASSWORD | sha256sum }}'
        ENCRYPTION_KEY: '{{ printf "%s:falkordb-browser-encryption" .FALKORDB_PASSWORD | sha256sum }}'
  dataFrom:
    - extract:
        key: falkordb
