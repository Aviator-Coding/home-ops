---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Authenticated on purpose. database has no default-deny, and consumers
# are cross-namespace, so a NetworkPolicy cannot stand in for a password.
# Skill databases.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: falkordb-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: falkordb-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Consumed by the container command, which composes REDIS_ARGS in shell
        # so the value is expanded at start rather than baked into a manifest.
        FALKORDB_PASSWORD: "{{ .FALKORDB_PASSWORD }}"
        # Same value under the name redis-cli reads on its own. The readiness
        # probe runs a real GRAPH command, which returns NOAUTH once a password
        # is set, so the probe needs the credential too - via the environment
        # rather than a command-line flag, which would put the password in the
        # process table of every probe invocation.
        REDISCLI_AUTH: "{{ .FALKORDB_PASSWORD }}"
        # AUTH_SECRET and ENCRYPTION_KEY are hashes of the database password
        # plus distinct salts, so they stay stable across restarts. The image
        # placeholders are public. Skill databases.
        AUTH_SECRET: '{{ printf "%s:falkordb-browser-auth" .FALKORDB_PASSWORD | sha256sum }}'
        ENCRYPTION_KEY: '{{ printf "%s:falkordb-browser-encryption" .FALKORDB_PASSWORD | sha256sum }}'
  dataFrom:
    - extract:
        key: falkordb
