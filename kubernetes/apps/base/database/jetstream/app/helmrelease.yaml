---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app nats
spec:
  interval: 30m
  chart:
    spec:
      chart: nats
      version: "2.14.*"
      sourceRef:
        kind: HelmRepository
        name: nats
        namespace: flux-system
      interval: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Cluster configuration
    config:
      cluster:
        enabled: true
        replicas: 3
      jetstream:
        enabled: true
        fileStore:
          enabled: true
          pvc:
            enabled: true
            size: 10Gi
            storageClassName: ceph-block
        memoryStore:
          enabled: true
          maxSize: 1Gi

    # StatefulSet configuration
    statefulSet:
      replicas: 3

    # Container configuration
    container:
      env:
        GOMEMLIMIT: 3GiB
      merge:
        resources:
          requests:
            # cpu 500m -> 150m (2026-09-20 fleet CPU right-sizing). 14d peak,
            # measured at 30-SECOND resolution across all 3 pods, is 34m - so
            # 150m still clears the highest burst this cluster has recorded by
            # 4.4x, while 500m reserved 14.7x it.
            #
            # The resolution matters and is not a detail: the same peak reads
            # 9m at [14d:1h], 21m at [14d:5m], 27m at [14d:1m] and 34m at
            # [14d:30s]. A 5-minute rate averages away exactly the short bursts
            # that CPU work is made of, so every coarser figure UNDER-reports.
            # 34m is the finest measurement available and is still a lower
            # bound; the 4.4x multiple is the margin for that, not padding.
            #
            # nats-2 sits on talos-3, the one node with real CPU contention
            # (85.3% busy at 14d peak vs 76.5%/66.6% elsewhere, despite the
            # LOWEST request commitment of the three). A CPU request is the
            # container's CFS weight under contention, so cutting it there is
            # not free - but at a 34m ceiling against a 150m weight this
            # workload can never be the one asking for more than it is owed.
            # memory untouched (PR #1738 owns that).
            cpu: 150m
            memory: 1Gi
          limits:
            memory: 4Gi

    # Pod topology for HA
    podTemplate:
      topologySpreadConstraints:
        kubernetes.io/hostname:
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule

    # Pod Disruption Budget
    podDisruptionBudget:
      enabled: true
      minAvailable: 2

    # Prometheus metrics
    promExporter:
      enabled: true
      port: 7777

    # Service configuration
    service:
      enabled: true
      ports:
        nats:
          enabled: true
        leafnodes:
          enabled: false
        websocket:
          enabled: false
        mqtt:
          enabled: false
