---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name coder
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        CODER_EMAIL_AUTH_PASSWORD: "{{ .SMTP_PASSWORD }}"
        CODER_EMAIL_AUTH_USERNAME: "{{ .SMTP_USERNAME }}"
        CODER_EMAIL_SMARTHOST: "{{ .SMTP_HOST }}:{{ .SMTP_PORT }}"
        CODER_EMAIL_SMARTHOST_TLS: "{{ .SMTP_SSL }}"
        CODER_OIDC_CLIENT_ID: "{{ .CODER_OAUTH_CLIENT_ID }}"
        CODER_OIDC_CLIENT_SECRET: "{{ .CODER_OAUTH_CLIENT_SECRET }}"
        CODER_OIDC_ALLOWED_GROUPS: "{{ .CODER_OAUTH_ALLOWED_GROUPS }}"
        CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: "{{ .CODER_OAUTH_GITHUB_ALLOW_SIGNUPS }}"
        CODER_OAUTH2_GITHUB_ALLOWED_ORGS: "{{ .CODER_OAUTH_GITHUB_ALLOWED_ORGS }}"
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        CODER_PG_CONNECTION_URL: "postgres://{{.POSTGRES_DB_USER_NAME}}:{{.POSTGRES_DB_USER_PASSWORD}}@postgres-18-rw.database.svc.cluster.local:5432/{{.POSTGRES_DB_NAME}}?sslmode=disable"

  dataFrom:
    - extract:
        key: smtp-bravo
    - extract:
        key: coder
