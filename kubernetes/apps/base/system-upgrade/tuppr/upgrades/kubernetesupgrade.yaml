---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/tuppr.home-operations.com/kubernetesupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: KubernetesUpgrade
metadata:
  name: kubernetes
spec:
  kubernetes:
    # renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
    version: v1.37.2
  healthChecks:
    # Evaluated per object, all must pass; zero objects pass. Finished Snapshot
    # and Restore CRs accumulate, so only an active mover phase fails.
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        !has(status.phase) || status.phase != "Running"
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !has(status.phase) || status.phase != "Restoring"
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      expr: |-
        status.ceph.health in ['HEALTH_OK']
    # Data stores back to full strength before the next node. tuppr binds only `object` and
    # `status` in CEL, so spec fields go through object.spec (a bare `spec` fails to compile).
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: |-
        has(status.readyInstances) && status.readyInstances == object.spec.instances
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      expr: |-
        has(status.phase) && status.phase == "Ready"
