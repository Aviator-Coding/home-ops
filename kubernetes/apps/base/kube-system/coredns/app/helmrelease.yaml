---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: coredns
spec:
  chartRef:
    kind: OCIRepository
    name: coredns
  interval: 1h
  values:
    fullnameOverride: coredns
    image:
      repository: mirror.gcr.io/coredns/coredns
    replicaCount: 2
    k8sAppLabelOverride: kube-dns
    serviceAccount:
      create: true
    service:
      name: kube-dns
      clusterIP: 10.43.0.10
    servers:
      - zones:
          - zone: .
            scheme: dns://
            use_tcp: true
        port: 53
        plugins:
          - name: errors
          - name: health
            configBlock: |-
              lameduck 5s
          - name: ready
          - name: kubernetes
            parameters: cluster.local in-addr.arpa ip6.arpa
            configBlock: |-
              fallthrough in-addr.arpa ip6.arpa
          # Cluster is IPv4-only (Cilium enable-ipv6=false, no IPv6 egress).
          # Answer AAAA queries with NODATA so resolvers fall back to A
          # immediately instead of wasting attempts on unreachable IPv6
          # (e.g. Flux source-controller pulling from ghcr / github.io).
          # Safe cluster-wide: every Service/Pod is IPv4-only, so AAAA NODATA
          # matches what the kubernetes plugin already returns internally.
          - name: template
            parameters: ANY AAAA
            configBlock: |-
              rcode NOERROR
          - name: forward
            parameters: . /etc/resolv.conf
          - name: cache
            configBlock: |-
              prefetch 20
              serve_stale
          - name: loop
          - name: reload
          - name: loadbalance
          - name: prometheus
            parameters: 0.0.0.0:9153
          - name: log
            configBlock: |-
              class error
    # Pin forward's upstream at Talos hostDNS (169.254.116.108), the nameserver
    # Default policy uses, without inheriting the node resolv.conf. autopath and
    # pods verified (which existed only to feed it) are gone: cache serve_stale
    # turns autopath answers into NXDOMAIN after ~30s per name, and a DHCP
    # search domain on this file (sklab.dev, DNSSEC NODATA) then breaks external
    # names and dotted service FQDNs (2026-09-26). Leave autopath out while
    # serve_stale is set.
    deployment:
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 169.254.116.108
    affinity:
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: Exists
    # Both replicas landed on talos-2 (no spread, no anti-affinity), so
    # draining that one node took cluster DNS down entirely
    # (docs/talos-3-scheduling-truth.md section 9). maxSkew 1 on hostname
    # forces the two replicas apart. nodeTaintsPolicy Honor only filters
    # NoSchedule/NoExecute taints, so it does not exclude talos-3 (its taint
    # is PreferNoSchedule); the TaintToleration score penalty is what keeps
    # a replica off talos-3 under normal conditions instead
    # (docs/talos-3-scheduling-truth.md section 9).
    topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: '{{ template "coredns.name" . }}'
            app.kubernetes.io/instance: '{{ .Release.Name }}'
        topologyKey: kubernetes.io/hostname
        maxSkew: 1
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
    resources:
      requests:
        cpu: 100m
        memory: 70Mi
      limits:
        memory: 170Mi
    tolerations:
      - key: CriticalAddonsOnly
        operator: Exists
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
