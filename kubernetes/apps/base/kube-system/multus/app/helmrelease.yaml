---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: multus
spec:
  chartRef:
    kind: OCIRepository
    name: multus
  interval: 1h
  values:
    cni:
      binPath: /opt/cni/bin
      netPath: /etc/cni/net.d
    multus:
      resources:
        requests:
          cpu: 10m
          # Explicit memory request: a limit-only declaration makes Kubernetes
          # reserve the whole limit, so this DaemonSet held 512Mi on every node
          # against a 30-day peak working set of 7Mi (measured 2026-09-14).
          memory: 64Mi
        limits:
          memory: 512Mi
