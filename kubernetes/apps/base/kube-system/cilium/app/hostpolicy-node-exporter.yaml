---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: node-exporter-lan
spec:
  description: Allow cluster entities to scrape node-exporter on the hosts.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  ingress:
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9100"
              protocol: TCP
