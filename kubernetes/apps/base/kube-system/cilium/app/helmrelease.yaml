---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: cilium
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    cluster:
      id: 1
      name: home-ops-prod
    autoDirectNodeRoutes: true
    bandwidthManager:
      enabled: true
      bbr: true
    bpf:
      datapathMode: netkit
      masquerade: true
      preallocateMaps: true
      tproxy: true
    bpfClockProbe: true
    bgpControlPlane:
      enabled: true
    cgroup:
      automount:
        enabled: false
      # The mount-cgroup init container takes its resources from
      # cgroup.autoMount.resources (NOT initResources) — requests==limits
      # needed here too for pod-level Guaranteed QoS.
      autoMount:
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 100m
            memory: 128Mi
      hostRoot: /sys/fs/cgroup
    cni:
      exclusive: false
      # install-cni-binaries init container: chart default is requests-only
      # (100m/10Mi) which would keep the pod Burstable — requests==limits is
      # required on every container for Guaranteed QoS (see resources below).
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 100m
          memory: 128Mi
    dashboards:
      enabled: true
      annotations:
        grafana_folder: Cilium
    devices: bond+
    enableIPv4BIGTCP: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    # Host firewall: enforces CiliumClusterwideNetworkPolicy with a nodeSelector
    # against the *host* endpoint. Required because every Ceph daemon runs on
    # host network (CephCluster spec.network.provider: host), so pod-level
    # NetworkPolicy cannot reach them. Consumed by ./hostpolicy-ceph.yaml.
    # Enforced at the tc hook in bpf_host on `devices` (bond0, bond0.3,
    # bond0.90 here) - see ./hostpolicy-ceph.yaml for the full safety argument.
    hostFirewall:
      enabled: true
    hubble:
      enabled: false
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: "10.42.0.0/16"
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: false
    loadBalancer:
      acceleration: best-effort
      algorithm: maglev
      mode: dsr
    localRedirectPolicy: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 2
      rollOutPods: true
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
    pmtuDiscovery:
      enabled: true
    # STAGE 2 OF 2 - ENFORCING. `policy-audit-mode: "false"` means host and pod
    # policy verdicts are enforced again: traffic matched by a deny rule is
    # dropped rather than reported. The Ceph host policy in
    # ./hostpolicy-ceph.yaml is now live.
    #
    # Flipped only after a 25h audit window (2026-08-24T10:38Z ->
    # 2026-08-25T11:38Z) proved nothing but intended LAN traffic would be
    # dropped. Evidence: docs/ceph/lan-isolation-audit-results.md. Headline
    # numbers: deny-counter delta over the window was 0 packets on talos-1 and
    # talos-3 and 4 packets on talos-2 (a deliberate probe from 10.0.0.150);
    # all 99 VolSync ReplicationSources completed Successful; all 4 Prometheus
    # Ceph targets stayed up; port-80 LoadBalancer traffic was proved not to
    # traverse the host policy.
    #
    # This also restores enforcement of the cluster's 14 pod NetworkPolicies,
    # which global audit mode had suspended for the duration of the window.
    #
    # The safety property does NOT come from this flag. It comes from
    # `enableDefaultDeny: {ingress: false, egress: false}` in
    # ./hostpolicy-ceph.yaml, which keeps the host endpoint out of default-deny
    # so only the enumerated (world, port) pairs can ever be dropped. Read the
    # header of that file before changing either.
    #
    # ROLLBACK: set this back to `true` (fastest, un-drops everything
    # immediately) or delete the CCNP. See
    # docs/ceph/lan-isolation-audit-plan.md section 6.
    policyAuditMode: false
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    # Host-namespace-only socket LB. Prerequisite for Talos
    # machine.features.hostDNS.forwardKubeDNSToHost; leaves the pod datapath
    # unchanged (only host-namespace sockets use socket LB).
    socketLB:
      enabled: true
      hostNamespaceOnly: true
    tunneling:
      mtu: 9000
    # Chart default is maxUnavailable: 2, which on a 3-node cluster restarts
    # two thirds of the datapath at once. Enabling hostFirewall recompiles and
    # reloads bpf_host, so this is the one rollout where a bad load must not be
    # able to hit two nodes simultaneously - dropping to 1 keeps two healthy
    # nodes (and etcd quorum) while a failure is caught and reverted.
    # Independent of the audit/enforce staging; safe to keep permanently.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxUnavailable: 1
    # Guaranteed QoS (requests == limits on EVERY container, init containers
    # included) so the Talos runtime.OOMController never selects the agent:
    # its victim ranking assigns Guaranteed cgroups weight 0.0. During the
    # 2026-06-30/07-03 OOM cascade the burstable cilium-agent was a chronic
    # victim (503 restarts on talos-1), taking the node network plane down
    # with every kill. Memory limit raised 1Gi -> 1536Mi (live peak 743Mi)
    # since the request is now reserved anyway; CPU limit is required for
    # Guaranteed (live peak ~100m, 500m leaves burst room).
    resources:
      requests:
        cpu: 500m
        memory: 1536Mi
      limits:
        cpu: 500m
        memory: 1536Mi
    # Init containers must also be requests==limits or the pod QoS falls
    # back to Burstable (kubelet computes QoS over init containers too).
    initResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
