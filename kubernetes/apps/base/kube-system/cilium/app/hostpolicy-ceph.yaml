---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
# Subtractive host firewall for Ceph's host-netns ports. enableDefaultDeny stays false in both directions. Removing it, or adding another nodeSelector CCNP that defaults deny on, locks the nodes out: default-deny is OR-ed across policies.
# fromEntities world does not match host, remote-node, or pods. Enforcing while policyAuditMode is false. Rollback: set policyAuditMode true, or delete this policy.
# Skill `cilium-host-policy`.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: ceph-lan-isolation
spec:
  description: >-
    Deny non-cluster (world) access to host-network Ceph daemon ports.
    Subtractive only - enableDefaultDeny is false in both directions so the
    host endpoint never enters default-deny and management access cannot break.
  # Host-endpoint labels are not node labels. kubernetes.io/os and kubernetes.io/hostname are stripped, so a selector on them is accepted and matches nothing. control-plane covers all three nodes today.
  # Verify a selector change with cilium-dbg bpf policy get. Skill `cilium-host-policy`.
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
  # LOAD-BEARING - see the header. Removing this turns the rules below into a
  # default-deny host firewall and will lock the nodes out.
  enableDefaultDeny:
    ingress: false
    egress: false
  ingressDeny:
    - fromEntities:
        - world
      toPorts:
        - ports:
            # mon msgr2. Only v2 is bound (monmap epoch 30: all three mons are
            # v2:10.10.10.x:3300). Cluster-internal mon traffic is
            # host/remote-node identity and unaffected.
            - port: "3300"
              protocol: TCP
            # mon msgr1. ms_bind_msgr1 is true but no mon currently binds it;
            # denied so re-enabling msgr1 cannot silently re-expose a mon.
            - port: "6789"
              protocol: TCP
            # RGW, cleartext HTTP (CephObjectStore gateway.port: 80, no
            # securePort). Serves an anonymous bucket listing on the node IP.
            # NOTE: this is the one port also used by LoadBalancer services
            # (envoy-external 10.50.0.21:80, envoy-internal 10.50.0.26:80, the
            # three ai/* LBs). Those target LB IPs, not the node IP, so they
            # are a different destination and should be unaffected - the audit
            # window exists to prove exactly that before this enforces.
            - port: "80"
              protocol: TCP
            # mgr prometheus module - unauthenticated metrics, live at
            # http://10.10.10.12:9283/. Prometheus scrapes it from a pod, which
            # is SNAT'd to a node IP and so is not `world`.
            - port: "9283"
              protocol: TCP
            # ceph-exporter - unauthenticated per-daemon metrics on every node.
            - port: "9926"
              protocol: TCP
            # mgr restful admin API. The module is enabled but is not currently
            # registering a service endpoint; denied so it cannot appear later.
            - port: "8003"
              protocol: TCP
            # mgr dashboard. Currently disabled (cluster helmrelease
            # dashboard.enabled: false, and `ceph mgr services` lists only
            # prometheus), but the mgr pod still declares 8443 and the old
            # deployment used 7000. Denied so re-enabling the dashboard cannot
            # re-expose it to the LAN by accident.
            - port: "7000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
            # OSD / MDS / mgr msgr2 data path. Range comes from the live
            # settings ms_bind_port_min=6800 / ms_bind_port_max=7568 - note
            # this cluster's max is NOT the 7300 upstream default. No ephemeral
            # (32768-60999) or NodePort (30000-32767) range overlaps this.
            - port: "6800"
              endPort: 7568
              protocol: TCP
