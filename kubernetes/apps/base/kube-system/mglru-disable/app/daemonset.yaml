---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: mglru-disable
  namespace: kube-system
  labels:
    app.kubernetes.io/name: mglru-disable
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: mglru-disable
  updateStrategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mglru-disable
    spec:
      # Reasserts kernel/mm/lru_gen/enabled=0. machine.sysfs sets the same key. Do not delete this until a reboot proves sysfs alone holds.
      # See skill talos-nodes.
      priorityClassName: system-node-critical
      automountServiceAccountToken: false
      hostPID: false
      tolerations:
        - operator: Exists
      containers:
        - name: mglru-disable
          image: docker.io/library/busybox:1.38
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              while true; do
                if [ -w /host-sys/kernel/mm/lru_gen/enabled ]; then
                  echo 0 > /host-sys/kernel/mm/lru_gen/enabled 2>/dev/null || true
                fi
                sleep 300
              done
          securityContext:
            privileged: true
            runAsUser: 0
          resources:
            requests:
              cpu: 1m
              memory: 16Mi
            limits:
              memory: 32Mi
          volumeMounts:
            - name: sys
              mountPath: /host-sys
      volumes:
        - name: sys
          hostPath:
            path: /sys
            type: Directory
