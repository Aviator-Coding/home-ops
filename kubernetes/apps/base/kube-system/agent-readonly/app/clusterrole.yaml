---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/rbac.authorization.k8s.io/clusterrole_v1.json
# Reads that the built-in `view` role leaves out: cluster-scoped objects and the infra
# CRDs agents debug. Groups whose objects can carry credentials (litellm, toolhive,
# tailscale, talos.dev) and Secrets stay out. Read verbs only.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-readonly-extra
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list", "watch"]
  - apiGroups:
      - storage.k8s.io
      - snapshot.storage.k8s.io
      - ceph.rook.io
      - cilium.io
      - monitoring.coreos.com
      - gateway.networking.k8s.io
      - gateway.envoyproxy.io
      - kopiur.home-operations.com
      - volsync.backube
      - postgresql.cnpg.io
      - tuppr.home-operations.com
      - deviceplugin.intel.com
      - keda.sh
    resources: ["*"]
    verbs: ["get", "list", "watch"]
