---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flux-operator-allow-dns-replies
spec:
  # Supplemental policy for the chart-owned `flux-operator-web` NetworkPolicy (Helm-managed, not in git),
  # which does not admit kube-dns. Policies on the same pod OR-combine; this matches the chart policy's
  # podSelector exactly. Do not disable or replace the chart's policy. Skill `networking`.
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: flux-operator
      app.kubernetes.io/name: flux-operator
  policyTypes:
    - Ingress
  ingress:
    # Allow DNS replies from CoreDNS. No ports restriction on purpose: `ports` matches the DESTINATION port,
    # and a reply arrives on the pod's ephemeral port, so `port: 53` would silently drop every reply.
    # Skill `networking`.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
