---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app konflate
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: *app
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    fullnameOverride: *app
    # `affinity` NotIn talos-3 is not needed: the talos-3 PreferNoSchedule taint (no toleration here)
    # keeps this app off it via the TaintToleration score. Skill `node-scheduling`, references/talos-3-ledger.md.
    # No image override: the chart pins its own image by digest at package time, so the image
    # follows the chart version Renovate tracks in ocirepository.yaml. An override here is invisible
    # to Renovate and froze the image at 0.6.2 while the chart moved on.
    config:
      repo: github://skrumbach/home-ops
      # FluxInstance sync.path / flux-local --path. spec.path values still
      # resolve against the clone root (konflate RepoRoot), so this is the
      # entry point, not a chroot.
      clusterPath: kubernetes/clusters/main
      # Match the live cluster so charts gated on kube version render the same
      # way helm-controller will. tpl'd by the chart.
      kubeVersion: "{{ .Capabilities.KubeVersion.Version }}"
      logFormat: json
      # Read-only pilot: write-back stays off. Do not enable these, and do not add secret.writeToken / app credentials.
      statusChecks: false
      prComments: false
      renderForkPrs: false
    # No secret.* : anonymous GitHub reads on this public repo. No write
    # credential enters the cluster.
    persistence:
      enabled: true
      storageClass: ceph-block
      size: 5Gi
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 2Gi
