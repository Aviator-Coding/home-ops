---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: flux-instance-rules
  namespace: flux-system
spec:
  groups:
    - name: flux-instance.rules
      rules:
        - alert: FluxInstanceAbsent
          expr: |
            absent(flux_instance_info{exported_namespace="flux-system", name="flux"})
          for: 5m
          annotations:
            summary: >-
              Flux instance metric is missing
          labels:
            severity: critical

        - alert: FluxInstanceNotReady
          expr: |
            flux_instance_info{exported_namespace="flux-system", name="flux", ready!="True"}
          for: 5m
          annotations:
            summary: >-
              Flux instance {{ $labels.name }} is not ready
          labels:
            severity: critical

        # flux_resource_info is the only live suspended signal. Key the object on exported_namespace; namespace is always flux-system. Skill `flux-gitops`.
        - alert: FluxResourceSuspendedTooLong
          expr: |
            flux_resource_info{suspended="True", kind=~"Kustomization|HelmRelease|GitRepository|OCIRepository|HelmRepository|HelmChart|Bucket"}
          for: 24h
          annotations:
            summary: >-
              Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been suspended for over 24h
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has had spec.suspend: true for more than 24 hours. A suspended
              object stops reconciling and keeps applying whatever revision
              it last saw while still reporting Ready=True, silently
              ignoring every merge to main - this is exactly how
              system-controller/k8tz and downloads/readarr ran stale for 19
              days in 2026-09 with nothing surfacing it. If the suspension
              was only meant to be temporary, resume it (flux resume, or
              kubectl patch spec.suspend=false).
          labels:
            severity: warning

        # Aggregated over the identity labels so a flapping ready/reason label does not reset the 30m timer. A first install that fails and then retries as an upgrade has no rollback target, so the HelmRelease stays Stalled with Ready=False and emits no further events. Skill `flux-gitops`.
        - alert: FluxResourceNotReadyTooLong
          expr: |
            max by (kind, exported_namespace, name) (
              flux_resource_info{ready!="True", suspended!="True", kind=~"HelmRelease|Kustomization"}
            ) == 1
          for: 30m
          annotations:
            summary: >-
              Flux {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} has been not Ready for over 30m
            description: >-
              {{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }}
              has not been Ready for more than 30 minutes, including while it
              retries and flips between False and Unknown. A HelmRelease whose first install failed goes
              Stalled (MissingRollbackTarget) and Flux stops reconciling it
              while its Kustomization can still report Ready. Inspect it with
              flux get hr -n {{ $labels.exported_namespace }} {{ $labels.name }}
              (or flux get ks for a Kustomization). If it is Stalled, once
              the cause is fixed run flux reconcile hr {{ $labels.name }}
              -n {{ $labels.exported_namespace }} --reset.
          labels:
            severity: warning
