---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
#
# Reads Secrets out of the `system` namespace, so a workload namespace can
# mirror the Ceph S3 credentials that Rook's ObjectBucketClaim generates for
# kopiur (`system/kopiur`). Same shape as ../database-secrets, which is this
# repo's existing kubernetes-provider precedent.
#
# WHY THIS EXISTS AT ALL: a kopiur mover Job runs in the WORKLOAD namespace and
# loads its repository credentials with `envFrom`, which is namespace-local. The
# `ceph` and `r2` ClusterRepository objects pin their Secrets to `system`, so a
# backup in `downloads` cannot see them. Upstream's own fix is credential
# projection, which is DEFERRED by captain decision 2026-08-30
# (`kopiur-workload-ns-credentials`): it requires granting the operator unscoped
# Secret create/patch/delete cluster-wide, and that architecture change is not
# worth making to unblock a single 5Gi pilot volume. See
# kubernetes/components/kopiur/Readme.md "Credentials".
#
# SCOPED TO THE PILOT, DELIBERATELY. `spec.conditions` is load-bearing security,
# not tidiness: the `system` namespace also holds `cluster-secrets` (the Secret
# every Flux postBuild substitution reads), so an UNSCOPED store here would let
# an ExternalSecret in any namespace read it. Pinning `namespaces: [downloads]`
# means only the pilot namespace can use this store at all. Widening this list
# is a security decision, not a routine edit - the Stage 3 shape is still open.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: kopiur-system-secrets
spec:
  conditions:
    - namespaces:
        - downloads
  provider:
    kubernetes:
      remoteNamespace: system
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: security
          key: ca.crt
      auth:
        # The ESO controller's own ServiceAccount, which already holds
        # cluster-wide secrets get/list/watch - verified 2026-08-30 with
        # `kubectl auth can-i get secret/kopiur -n system --as=...`. No new
        # RBAC is granted by this store.
        serviceAccount:
          name: external-secrets
          namespace: security
