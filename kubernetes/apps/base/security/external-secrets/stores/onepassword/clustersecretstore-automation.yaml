---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-automation
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local:8080
      auth:
        secretRef:
          connectTokenSecretRef:
            key: token
            name: onepassword-secret
            namespace: security
      # A WRITE-targeted store, and the reason it exists is that the sibling
      # `onepassword` store cannot be one. That store lists Homelab/Automation/
      # Services with priorities, which is right for reads (search all three) and
      # wrong for writes: a PushSecret through it resolves by that ordering
      # rather than to a vault you named, so it could land in Homelab.
      #
      # Cluster-scoped rather than a namespaced SecretStore per namespace,
      # because a namespaced store may only reference a Secret in its OWN
      # namespace - ESO's admission webhook rejects anything else outright - and
      # the Connect token lives in `security`. Pushers in other namespaces
      # (ai/litellm) therefore cannot use a namespaced store at all.
      vaults:
        Automation: 1
