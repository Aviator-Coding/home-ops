---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-automation
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local:8080
      auth:
        secretRef:
          connectTokenSecretRef:
            key: token
            name: onepassword-secret
            namespace: security
      # A WRITE-targeted store. The sibling `onepassword` store lists Homelab/Automation/Services by priority,
      # right for reads but wrong for writes: a PushSecret would resolve by that ordering and could land in
      # Homelab. Cluster-scoped because a namespaced store may only reference a Secret in its own namespace
      # (ESO rejects anything else) and the Connect token lives in `security`. Skill `secrets-1password`.
      vaults:
        Automation: 1
