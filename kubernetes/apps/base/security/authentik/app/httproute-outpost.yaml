---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik-outpost
  annotations:
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    # Unannotated auto-discovery defaults to `[STATUS] == 200` on the bare /outpost.goauthentik.io prefix,
    # which the outpost 404s, so the check sat permanently red. /outpost.goauthentik.io/ping is its
    # unauthenticated liveness endpoint (204). This route backs the extAuth gate on every ext_authz-protected
    # app, so an outpost outage fails all of them closed.
    gatus.home-operations.com/endpoint: |-
      url: https://auth.${SECRET_DOMAIN}/outpost.goauthentik.io/ping
      conditions: ["[STATUS] == 204"]
spec:
  hostnames: ["auth.${SECRET_DOMAIN}"]
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /outpost.goauthentik.io
      backendRefs:
        - name: ak-outpost-authentik-embedded-outpost
          namespace: security
          port: 9000
