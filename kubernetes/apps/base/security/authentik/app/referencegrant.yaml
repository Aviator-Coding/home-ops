---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-authentik-access
  namespace: security
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: home-automation
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: monitoring
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: network
    # ai/opencode (and any future ai-namespace extAuth SecurityPolicy)
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: ai
    # database/falkordb-browser (and any future database-namespace extAuth
    # SecurityPolicy). Without this entry the SecurityPolicy is still accepted,
    # but its cross-namespace ext_authz backendRef resolves to nothing.
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: database
  to:
    - group: ""
      kind: Service
      name: ak-outpost-authentik-embedded-outpost
