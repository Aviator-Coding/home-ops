---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-automation
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local:8080
      auth:
        secretRef:
          connectTokenSecretRef:
            key: token
            name: onepassword-secret
            namespace: security
      # Single vault ON PURPOSE. The shared `onepassword` ClusterSecretStore
      # lists Homelab/Automation/Services with priorities, and a write resolves
      # through that ordering rather than to a vault you named - so a push there
      # could land in Homelab. Scoping this store to Automation alone makes the
      # push target deterministic instead of incidental. Read paths keep using
      # the shared ClusterSecretStore; this store exists only for the push below.
      vaults:
        Automation: 1
