---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-terraform-credentials
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-automation
      kind: SecretStore
  selector:
    secret:
      name: authentik-terraform-credentials
  # Source Secret is created ONCE, by hand, during the mint documented in
  # docs/authentik/terraform.md section 5. It is deliberately not committed: it
  # holds the live API token. This PushSecret is what makes that one-time mint
  # durable, upserting it into the 1Password item `terraform/authentik` reads
  # through vals.
  #
  # Deliberately NOT self-healing on a timer, unlike
  # monitoring/grafana-sa-provisioner. That reconciler exists because Grafana
  # runs on emptyDir SQLite and loses its service account on every pod restart.
  # Authentik persists tokens in Postgres, so there is no drift for a CronJob to
  # heal here - it would be machinery guarding a failure mode that does not exist.
  data:
    - match:
        secretKey: AUTHENTIK_TOKEN
        remoteRef:
          remoteKey: authentik-terraform
          property: AUTHENTIK_TOKEN
    - match:
        secretKey: CODER_CLIENT_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: CODER_CLIENT_ID
    - match:
        secretKey: OPEN_WEBUI_CLIENT_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: OPEN_WEBUI_CLIENT_ID
    - match:
        secretKey: PGADMIN_CLIENT_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: PGADMIN_CLIENT_ID
