---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: authentik-terraform-credentials
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: authentik-terraform-credentials
  # Hand-made source Secret, not committed (it holds the API token). Authentik persists tokens in Postgres, so this is not a restart-wiped provisioner. Skill `authentik-terraform` references/state-and-credentials.md.
  data:
    - match:
        secretKey: AUTHENTIK_TOKEN
        remoteRef:
          remoteKey: authentik-terraform
          property: AUTHENTIK_TOKEN
    - match:
        secretKey: CODER_CLIENT_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: CODER_CLIENT_ID
    - match:
        secretKey: PGADMIN_CLIENT_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: PGADMIN_CLIENT_ID
    # State-bucket keys. Without them tofu init against the real backend cannot authenticate. Skill `authentik-terraform` references/state-and-credentials.md.
    - match:
        secretKey: TF_STATE_ACCESS_KEY_ID
        remoteRef:
          remoteKey: authentik-terraform
          property: TF_STATE_ACCESS_KEY_ID
    - match:
        secretKey: TF_STATE_SECRET_ACCESS_KEY
        remoteRef:
          remoteKey: authentik-terraform
          property: TF_STATE_SECRET_ACCESS_KEY
