---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name authentik-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        AUTHENTIK_POSTGRESQL__HOST: "postgres-18-rw.database.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__NAME: "{{ .POSTGRES_DB_NAME }}"
        AUTHENTIK_POSTGRESQL__USER: "{{ .POSTGRES_DB_USER_NAME }}"
        AUTHENTIK_POSTGRESQL__PASSWORD: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        AUTHENTIK_REDIS__DB: "1"
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        AUTHENTIK_SESSION_STORAGE: db

        AUTHENTIK_EMAIL__HOST: "{{ .SMTP_HOST }}"
        AUTHENTIK_EMAIL__PORT: "{{ .SMTP_PORT }}"
        AUTHENTIK_EMAIL__USERNAME: "{{ .SMTP_USERNAME }}"
        AUTHENTIK_EMAIL__PASSWORD: "{{ .SMTP_PASSWORD }}"
        AUTHENTIK_EMAIL__USE_SSL: "{{ .SMTP_SSL }}"
        AUTHENTIK_EMAIL__FROM: "Authentik <auth@${SECRET_DOMAIN}>"

  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: smtp-bravo
