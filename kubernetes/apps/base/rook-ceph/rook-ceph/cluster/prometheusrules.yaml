---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ceph-custom-alerts
  namespace: rook-ceph
spec:
  groups:
    - name: ceph-reliability
      rules:
        # container_spec_memory_limit_bytes does not exist in this Prometheus
        # (cAdvisor is scraped but the container_spec_* families are absent),
        # so this alert could never fire. Swapped to kube-state-metrics'
        # kube_pod_container_resource_limits, which needs an explicit on(...)
        # join because the two metrics carry different label sets. Live check
        # after the swap: all three mons read ~0.18 of their 2Gi limit.
        - alert: CephMonitorMemoryHigh
          expr: |
            container_memory_working_set_bytes{namespace="rook-ceph", container="mon"}
              / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="rook-ceph", container="mon", resource="memory"}
              > 0.8
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ceph monitor {{ $labels.pod }} memory usage above 80%"

        - alert: CephOSDRestarts
          expr: increase(kube_pod_container_status_restarts_total{namespace="rook-ceph",container="osd"}[1h]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OSD {{ $labels.pod }} has restarted more than 3 times in 1 hour"

        # ceph_osd_slow_ops does not exist; ceph_trackedop_slow_ops_count is the
        # live per-daemon equivalent and keeps the ceph_daemon label this
        # annotation depends on. Note it is a COUNTER ("Number of operations
        # taking over ten seconds"), not a gauge, so a bare > 5 would latch on
        # permanently after the fifth slow op the cluster ever saw - increase()
        # over a window is what makes "sustained" mean sustained.
        - alert: CephOSDSlowOps
          expr: |
            increase(ceph_trackedop_slow_ops_count{ceph_daemon=~"osd.*"}[10m]) > 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "OSD {{ $labels.ceph_daemon }} experiencing sustained slow operations"
            description: "OSD {{ $labels.ceph_daemon }} recorded {{ $value }} operations over ten seconds in the last 10 minutes, sustained for 10 minutes."

        - alert: CephMonitorQuorumAtRisk
          expr: sum(ceph_mon_quorum_status) < 3
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Ceph monitor quorum has fewer than 3 members"

        # Capacity alerts
        - alert: CephClusterNearFull
          expr: |
            ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.75
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ceph cluster storage usage above 75%"
            description: "Cluster is {{ $value | humanizePercentage }} full. Consider adding capacity or cleaning up data."

        - alert: CephClusterCriticallyFull
          expr: |
            ceph_cluster_total_used_bytes / ceph_cluster_total_bytes > 0.85
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph cluster storage usage above 85%"
            description: "Cluster is {{ $value | humanizePercentage }} full. Immediate action required."

        - alert: CephOSDNearFull
          expr: |
            (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) > 0.80
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OSD {{ $labels.ceph_daemon }} storage usage above 80%"
            description: "OSD {{ $labels.ceph_daemon }} is {{ $value | humanizePercentage }} full."

        - alert: CephOSDFull
          expr: |
            (ceph_osd_stat_bytes_used / ceph_osd_stat_bytes) > 0.90
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "OSD {{ $labels.ceph_daemon }} storage usage above 90%"
            description: "OSD {{ $labels.ceph_daemon }} is {{ $value | humanizePercentage }} full. Critical!"

        # OSD down/health alerts
        - alert: CephOSDDown
          expr: ceph_osd_up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph OSD {{ $labels.ceph_daemon }} is down"
            description: "OSD {{ $labels.ceph_daemon }} has been down for more than 5 minutes."

        - alert: CephOSDOut
          expr: ceph_osd_in == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ceph OSD {{ $labels.ceph_daemon }} is out of the cluster"
            description: "OSD {{ $labels.ceph_daemon }} is marked out and not participating in data placement."

        - alert: CephOSDFlapping
          expr: |
            changes(ceph_osd_up[10m]) > 4
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "OSD {{ $labels.ceph_daemon }} is flapping"
            description: "OSD {{ $labels.ceph_daemon }} has changed state more than 4 times in 10 minutes."

    - name: ceph-pg-health
      rules:
        # Placement Group Health Alerts
        - alert: CephPGDegraded
          expr: ceph_pg_degraded > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Ceph placement groups are degraded"
            description: "{{ $value }} placement groups are in degraded state. Data is still accessible but not fully replicated."

        # ceph_pg_inactive does not exist. Ceph exports per-state PG gauges, so
        # inactive is derived: everything not counted as active.
        - alert: CephPGInactive
          expr: |
            (ceph_pg_total - ceph_pg_active) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph placement groups are inactive"
            description: "{{ $value }} placement groups are inactive. Data may be inaccessible."

        - alert: CephPGInconsistent
          expr: ceph_pg_inconsistent > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph placement groups are inconsistent"
            description: "{{ $value }} placement groups have inconsistent data. Run 'ceph pg repair' after investigation."

        # ceph_pg_recovery_full does not exist; the live gauge is
        # ceph_pg_recovery_toofull. backfill_toofull is included because a full
        # cluster blocks backfill the same way it blocks recovery.
        - alert: CephPGRecoveryFull
          expr: |
            (ceph_pg_recovery_toofull + ceph_pg_backfill_toofull) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Ceph recovery blocked - cluster full"
            description: "Placement group recovery is blocked because the cluster is too full."

    # Do not re-add life-expectancy alerts. diskprediction_local has no NVMe model, so the series never exists.
    # See skill rook-ceph.

    - name: ceph-crash-detection
      rules:
        # Crash Detection Alert
        - alert: CephCrashesDetected
          expr: ceph_health_detail{name=~"RECENT_CRASH|RECENT_MGR_MODULE_CRASH"} == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ceph daemon crash detected"
            description: "A Ceph daemon or mgr module has crashed recently. Run 'ceph crash ls-new' to see details and 'ceph crash archive-all' after review."

    - name: ceph-iops-performance
      rules:
        # High IOPS Alert - sustained high I/O during backup windows
        - alert: CephHighIOPS
          expr: |
            sum(irate(ceph_osd_op_w[5m]) + irate(ceph_osd_op_r[5m])) > 300
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Ceph cluster experiencing high IOPS"
            description: "Total cluster IOPS {{ $value | humanize }} exceeds 300 ops/sec for more than 5 minutes. This may indicate backup schedule overlap or unusual workload."

        # OSD Latency Disparity Alert - monitors device class performance variance
        - alert: CephOSDLatencyDisparity
          expr: |
            max(ceph_osd_apply_latency_ms) - min(ceph_osd_apply_latency_ms) > 15
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "High latency variance between Ceph OSDs"
            description: "OSD apply latency disparity is {{ $value }}ms. Samsung 980 PRO (osd.0, osd.1) typically have higher latency than Lexar NM790 (osd.2-5). Investigate if variance exceeds expected device-class differences."

        # Individual OSD High Latency Alert
        - alert: CephOSDHighLatency
          expr: |
            ceph_osd_apply_latency_ms > 50
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "OSD {{ $labels.ceph_daemon }} has high apply latency"
            description: "OSD {{ $labels.ceph_daemon }} apply latency is {{ $value }}ms, exceeding 50ms threshold. Check for I/O contention or disk issues."
