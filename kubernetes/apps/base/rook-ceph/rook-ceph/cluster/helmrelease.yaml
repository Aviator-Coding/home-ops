---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-cluster
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: rook-ceph-cluster
  dependsOn:
    - name: rook-ceph
      namespace: rook-ceph
    - name: snapshot-controller
      namespace: kube-system
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    monitoring:
      enabled: true
      createPrometheusRules: true
    toolbox:
      enabled: true
    # renovate: datasource=docker depName=quay.io/ceph/ceph
    cephImage:
      repository: quay.io/ceph/ceph
      tag: v20.2.4
    cephClusterSpec:
      csi:
        cephfs:
          # ms_mode=prefer-crc so the kernel client uses msgr2. forceCephFSKernelClient is inert and stays deleted.
          # See skill rook-ceph.
          kernelMountOptions: "ms_mode=prefer-crc"
      cephConfig:
        global:
          bdev_enable_discard: "true"
          bdev_async_discard_threads: "1"
          osd_class_update_on_start: "false"
          device_failure_prediction_mode: local

          auth_client_required: "cephx"
          auth_cluster_required: "cephx"
          auth_service_required: "cephx"

          # Compression stays off. Media and RBD never hit the ratio, and zstd added write latency on these drives.
          # See skill rook-ceph.

        mgr:
          mgr/crash/warn_recent_interval: "7200"

        osd:
          # 10 GiB is the BlueStore cache target, not OSD RSS. Do not cut the 12Gi request to match it.
          # See skill rook-ceph.
          osd_memory_target: "10737418240" # 10 GiB
          osd_recovery_max_active: "3" # Don't overwhelm homelab hardware
          # One scrub per OSD, window 01:00-07:00. See skill rook-ceph.
          osd_max_scrubs: "1"
          osd_scrub_begin_hour: "1"
          osd_scrub_end_hour: "7"
          # Prioritise client I/O over background work on latency-sensitive drives.
          osd_mclock_profile: high_client_ops

          # Threshold 5 is Ceph's own non-default and still trips a real stall. Lifetime 3600 is what stops one stall latching HEALTH_WARN for a day and blocking the reboot gate.
          # See skill rook-ceph.
          bluestore_slow_ops_warn_threshold: "5"
          bluestore_slow_ops_warn_lifetime: "3600"

        # Literature caps, not fio: Samsung 15000, Lexar 7000. A set cap makes the OSD skip re-bench. No osd.1.
        # See skill rook-ceph.
        "osd.0":
          osd_mclock_max_capacity_iops_ssd: "15000" # Samsung 980 PRO 2TB
        "osd.2":
          osd_mclock_max_capacity_iops_ssd: "15000" # Samsung 980 PRO 2TB
        "osd.6":
          osd_mclock_max_capacity_iops_ssd: "15000" # Samsung 990 PRO 2TB
        "osd.3":
          osd_mclock_max_capacity_iops_ssd: "7000" # Lexar NM790 4TB (DRAM-less HMB)
        "osd.4":
          osd_mclock_max_capacity_iops_ssd: "7000" # Lexar NM790 4TB (DRAM-less HMB)
        "osd.5":
          osd_mclock_max_capacity_iops_ssd: "7000" # Lexar NM790 4TB (DRAM-less HMB)

        mds:
          # Kept below the 10Gi MDS pod limit.
          mds_cache_memory_limit: "8589934592" # 8 GiB

        client.rgw:
          # Explicitly set realm to prevent orphan default zone/zonegroup creation
          rgw_realm: ceph-objectstore

          # Keep true until a Tentacle image carrying ceph/ceph#71192 lands in the same commit, then prove unsigned content-type PUT 200 and unsigned x-amz-* 403.
          # See skill rook-ceph.
          rgw_sigv4_insecure: "true"
      security:
        cephx:
          # Daemon keys are aes256k at generation 2. Next rotation sets keyGeneration to current+1. csi stays aes (kernel < 7.0).
          # See skill rook-ceph.
          daemon:
            keyType: aes256k
            keyRotationPolicy: KeyGeneration
            keyGeneration: 2
          # csi stays aes. Kernel clients need Linux >= 7.0. These nodes run 6.18.x. See skill rook-ceph.
      # Effect must match PreferNoSchedule. `all` covers mon, osd, and mgr. It does not cover mds or rgw.
      # CSI nodeplugins are operator/csi-driver-tolerations.yaml. See skill node-scheduling.
      placement:
        all:
          tolerations:
            - key: home-operations.com/dedicated
              operator: Exists
              effect: PreferNoSchedule
      crashCollector:
        disable: false
      dashboard:
        enabled: false
      mgr:
        modules:
          - name: diskprediction_local
            enabled: true
          - name: pg_autoscaler
            enabled: true
          # Stays off until a Tentacle release ships rook/rook#18124 and ceph/ceph#71041 plus #71180. See skill rook-ceph.
          - name: rook
            enabled: false
          # Stays off. It crash-reports through the disabled rook orchestrator. Re-enable only with that module. See skill rook-ceph.
          - name: nfs
            enabled: false
          - name: rgw
            enabled: true
          - name: insights
            enabled: false
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app: rook-ceph-mgr
      network:
        provider: host
        connections:
          requireMsgr2: true
      resources:
        mgr:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
        # requests==limits keeps mon and logcollector Guaranteed, so OOMController skips them. Do not copy this onto MDS.
        # See skill rook-ceph.
        mon:
          requests:
            cpu: 500m
            memory: 2Gi
          limits:
            cpu: 500m
            memory: 2Gi
        logcollector:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 100m
            memory: 256Mi
        osd:
          # Request 12Gi is above the 9317 Mi peak. osd_memory_target is cache, not RSS. Limit 14Gi stays so a spike can burst. OSDs stay Burstable.
          # See skill rook-ceph.
          requests:
            cpu: 500m
            memory: 12Gi
          limits:
            memory: 14Gi
        mgr-sidecar:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
      storage:
        useAllNodes: false
        useAllDevices: false
        # Under storage, not the spec root. Pinned to 1 (CRD default 20). See skill rook-ceph.
        osdMaxUpdatesInParallel: 1
        nodes:
          - name: "talos-1"
            devices:
              - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME714W100393P2202"
              # osd.0 is a stopgap with a known silent-write fault. Checksums and size 3 contain a bad read. Do not mark it out.
              # See skill rook-ceph.
              - name: "/dev/disk/by-id/nvme-Samsung_SSD_980_PRO_2TB_S6B0NL0W412707M"
          - name: "talos-2"
            devices:
              - name: "/dev/disk/by-id/nvme-Samsung_SSD_990_PRO_2TB_S7KHNJ0WC55436E"
              - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NME714W101694P2202"
          - name: "talos-3"
            devices:
              - name: "/dev/disk/by-id/nvme-Samsung_SSD_980_PRO_2TB_S69ENL0TC06068B"
              - name: "/dev/disk/by-id/nvme-Lexar_SSD_NM790_4TB_NL1948W100519P2202"
        config:
          osdsPerDevice: "1"
      mon:
        count: 3
        allowMultiplePerNode: false
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 10Gi
            storageClassName: openebs-hostpath
        placement:
          topologySpreadConstraints:
            - maxSkew: 1
              topologyKey: kubernetes.io/hostname
              whenUnsatisfiable: DoNotSchedule
              labelSelector:
                matchLabels:
                  app: rook-ceph-mon
    cephBlockPools:
      - name: ceph-blockpool
        enableRBDStats: true
        spec:
          failureDomain: host
          replicated:
            size: 3
          # Compression stays off. See skill rook-ceph.
          compressionMode: none
          parameters:
            compression_mode: none
            # bulk lets the autoscaler grow PGs. Do not hand-set pg_num. See skill rook-ceph.
            bulk: "true"
        storageClass:
          enabled: true
          name: ceph-block
          isDefault: true
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          volumeBindingMode: Immediate
          parameters:
            # Immutable. aggressive only tags new images; the pool's none governs. Do not edit this to match the pool.
            # See skill rook-ceph.
            compression_mode: aggressive
            compression_algorithm: zstd
            imageFormat: "2"
            imageFeatures: layering,fast-diff,object-map,deep-flatten,exclusive-lock
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-rbd-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-rbd-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephBlockPoolsVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-blockpool
      isDefault: false
      deletionPolicy: Delete
    cephFileSystems:
      - name: &cephFileSystemName ceph-filesystem
        spec:
          preserveFilesystemOnDelete: true
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              compression_mode: none
          dataPools:
            # No deviceClass. A shadow CRUSH root made the autoscaler skip every pool. See skill rook-ceph.
            - name: data0
              failureDomain: host
              replicated:
                size: 3
              parameters:
                compression_mode: none
                bulk: "true"
          metadataServer:
            activeCount: 2
            activeStandby: true
            priorityClassName: system-cluster-critical
            placement:
              # Preferred anti-affinity only. Required would leave standby-replay unschedulable during a drain.
              # MDS has no talos-3 toleration. Do not add a NotIn deny-list. See skill rook-ceph and skill node-scheduling.
              podAntiAffinity:
                preferredDuringSchedulingIgnoredDuringExecution:
                  - weight: 100
                    podAffinityTerm:
                      topologyKey: kubernetes.io/hostname
                      labelSelector:
                        matchExpressions:
                          - key: mds
                            operator: In
                            values:
                              - ceph-filesystem-a
                              - ceph-filesystem-b
              # Honor ignores PreferNoSchedule. Kept so a future hard taint cannot make DoNotSchedule refuse every node.
              # See skill node-scheduling.
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  nodeTaintsPolicy: Honor
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: ceph-mds
                      app.kubernetes.io/part-of: *cephFileSystemName
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 10Gi # > mds_cache_memory_limit (8Gi) + headroom

        storageClass:
          enabled: true
          isDefault: false
          name: ceph-filesystem
          pool: data0
          reclaimPolicy: Delete
          allowVolumeExpansion: true
          parameters:
            csi.storage.k8s.io/provisioner-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/provisioner-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/controller-expand-secret-name: rook-csi-cephfs-provisioner
            csi.storage.k8s.io/controller-expand-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/node-stage-secret-name: rook-csi-cephfs-node
            csi.storage.k8s.io/node-stage-secret-namespace: "{{ .Release.Namespace }}"
            csi.storage.k8s.io/fstype: ext4

    cephFileSystemVolumeSnapshotClass:
      enabled: true
      name: csi-ceph-filesystem
      isDefault: false
      deletionPolicy: Delete
    cephObjectStores:
      - name: &cephObjectStoreName ceph-objectstore
        spec:
          metadataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              compression_mode: none
          dataPool:
            failureDomain: host
            replicated:
              size: 3
            parameters:
              compression_mode: none
          preservePoolsOnDelete: false
          allowUsersInNamespaces:
            - "*"
          gateway:
            port: 80
            resources:
              requests:
                cpu: 500m
                memory: 1Gi
              limits:
                memory: 3Gi
            instances: 2
            priorityClassName: system-cluster-critical
            placement:
              # RGW has no talos-3 toleration. Honor ignores PreferNoSchedule and stays as hygiene for a future hard taint.
              # See skill node-scheduling.
              topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: DoNotSchedule
                  nodeTaintsPolicy: Honor
                  labelSelector:
                    matchLabels:
                      app: rook-ceph-rgw
                      ceph_daemon_id: ceph-objectstore
          healthCheck:
            bucket:
              interval: 60s

        storageClass:
          enabled: true
          name: ceph-bucket
          reclaimPolicy: Delete
          parameters:
            region: us-east-1
