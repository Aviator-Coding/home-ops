---
# Partial Driver: only nodePlugin.tolerations. Keep prune: disabled (lowercase) and ssa: Merge, or Flux deletes the operator-owned Drivers and every RBD/CephFS mount.
# The tolerations list is atomic, so Merge protects the other fields. PreferNoSchedule makes this hygiene. Do not delete this file.
# See skill node-scheduling.
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.rbd.csi.ceph.com
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  nodePlugin:
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule
---
apiVersion: csi.ceph.io/v1
kind: Driver
metadata:
  name: rook-ceph.cephfs.csi.ceph.com
  namespace: rook-ceph
  annotations:
    kustomize.toolkit.fluxcd.io/ssa: Merge
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  nodePlugin:
    tolerations:
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule
