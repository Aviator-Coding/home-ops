---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 30m
  releaseName: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    crds:
      enabled: true
    csi:
      # NOTE: there is no way to place the CSI controller plugin from this repo,
      # and it is not an oversight - do not go looking for the value again.
      # rook v1.20 moved CSI to ceph-csi-operator, so
      # `rook-ceph.{rbd,cephfs}.csi.ceph.com-ctrlplugin` is owned by a
      # `Driver` CR (csi.ceph.io/v1). That CR *does* carry a usable
      # `spec.controllerPlugin.affinity`, but it is created by an internal Helm
      # release (`ceph-csi-drivers`) that Flux does not manage, and nothing
      # surfaces it: this chart's only `nodeAffinity` value targets the
      # `discover` DaemonSet, and `CephCluster.spec.csi` exposes just
      # `cephfs` / `readAffinity` / `skipUserCreation`. Reaching it would mean
      # fighting that internal release or applying a competing `Driver` CR.
      # Checked 2026-09-14 while freeing memory on talos-3, where the rbd
      # ctrlplugin's 1024Mi was wanted and proved structurally unavailable -
      # docs/talos-3-scheduling-truth.md "What could not be moved".
      #
      # NOTE: cephFSKernelMountOptions was removed from the v1.20 operator chart
      # (ceph-csi-operator migration). The effective kernel mount option now lives on
      # the CephCluster CR (cephClusterSpec.csi.cephfs.kernelMountOptions in the cluster HR).
      # NOTE: Enable the driver and snapshotter if you want to use CephFS
      enableCephfsDriver: true
      enableCephfsSnapshotter: true
      enableLiveness: true
      # DISABLED 2026-09-15: this chart value creates ServiceMonitor
      # `csi-metrics` selecting `app: csi-metrics`, a label from the pre-1.20
      # architecture where rook itself ran the CSI plugin pods and stamped
      # that label on them. Since v1.20 (see the NOTE above), the ctrlplugin/
      # nodeplugin pods are owned by ceph-csi-operator's `Driver` CR via its
      # own internal `ceph-csi-drivers` Helm release, which this repo does not
      # manage. Live-verified: no pod anywhere carries `app=csi-metrics`, no
      # CSI container declares a metrics port or `--metricsport` arg, and the
      # `Driver` CRD (csi.ceph.io/v1) exposes no metrics field at all - so the
      # ServiceMonitor has selected zero targets for the life of the cluster
      # and there is no way to feed it from this repo. Toggling this back on
      # would require ceph-csi-operator to gain a metrics option upstream.
      serviceMonitor:
        enabled: false
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    # Sized from Prometheus history 2026-09-22 (retained since 2026-09-20T01:47Z, covering
    # the PR #1736 six-OSD memory-request rollout). The operator was OOMKilled at 11:45:13Z
    # against the chart's own default limits.memory: 512Mi (this file's prior `limits: {}`
    # left it unset, so the chart default silently applied): the pre-kill container's last
    # successful scrape was 455.14Mi at 11:45:00Z, one minute before the kill, so the true
    # peak is unmeasurable but bounded only below by that reading and above by wherever it
    # crossed 512Mi. limits.memory: 1Gi is ~2x that last confirmed pre-kill reading and 2x
    # the failed 512Mi ceiling. Idle steady-state is ~168-220Mi (kubectl top and the
    # post-restart container's baseline agree), so do not size off that reading alone - it
    # excludes the reconcile burst that caused the kill.
    # CPU: the same rollout window peaked at 407m (rate over [3m], 2026-09-20T11:46-11:48Z)
    # against an idle baseline of 30-40m; requests.cpu raised from 100m to 300m to give the
    # operator a realistic CFS weight during a reconcile burst under node contention. No CPU
    # limit is set (chart has none), so this is a scheduling-weight change only, not a cap.
    resources:
      requests:
        memory: 128Mi
        cpu: 300m
      limits:
        memory: 1Gi
