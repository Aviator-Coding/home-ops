---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph
spec:
  interval: 30m
  releaseName: rook-ceph
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  chartRef:
    kind: OCIRepository
    name: rook-ceph
  values:
    crds:
      enabled: true
    csi:
      # CSI controller placement is not settable from this repo. The Driver CR belongs to the internal ceph-csi-drivers release.
      # Kernel mount options live on the CephCluster. See skill rook-ceph.
      # NOTE: Enable the driver and snapshotter if you want to use CephFS
      enableCephfsDriver: true
      enableCephfsSnapshotter: true
      enableLiveness: true
      # Stays off. No pod carries app=csi-metrics, and the Driver CRD has no metrics field. See skill rook-ceph.
      serviceMonitor:
        enabled: false
    enableDiscoveryDaemon: true
    image:
      repository: ghcr.io/rook/ceph
    monitoring:
      enabled: true
    # Explicit 1Gi. limits: {} does not clear the chart default 512Mi, which OOMKilled the operator.
    # See skill rook-ceph. (PR #1751)
    resources:
      requests:
        memory: 128Mi
        cpu: 300m
      limits:
        memory: 1Gi
    # Discover DaemonSet toleration. PreferNoSchedule makes it hygiene for a future hard taint.
    # See skill node-scheduling.
    discover:
      tolerations:
        - key: home-operations.com/dedicated
          operator: Exists
          effect: PreferNoSchedule
