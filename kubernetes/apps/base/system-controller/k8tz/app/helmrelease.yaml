---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8tz
spec:
  chart:
    spec:
      chart: k8tz
      version: 0.20.0
      interval: 30m
      sourceRef:
        kind: HelmRepository
        name: k8tz
  interval: 30m
  values:
    namespace: system-controller

    replicaCount: 2

    timezone: America/New_York
    cronJobTimeZone: true

    # Init requests equal limits, so an injected init does not demote a Guaranteed pod. imageVolume stays off: it cannot mount /etc/localtime.
    # See skill system-namespaces.
    initContainerResources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 100m
        memory: 128Mi

    # Webhook request equals limit. Raising only the limit demotes the pod to Burstable. Chart resources do not cover cert-watcher.
    # See skill system-namespaces.
    resources:
      requests:
        cpu: 250m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 64Mi

    webhook:
      certManager:
        enabled: true
        issuerRef:
          name: k8tz-webhook-selfsign
          kind: Issuer

    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/name: k8tz
              topologyKey: kubernetes.io/hostname

    # DoNotSchedule spread plus the PDB. Honor does not see the current PreferNoSchedule taint.
    # See skill node-scheduling.
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: k8tz
        matchLabelKeys:
          - pod-template-hash

  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Namespace
            patch: |-
              $patch: delete
              apiVersion: v1
              kind: Namespace
              metadata:
                name: not-used
          # Chart resources skip cert-watcher. Keep this patch request equal to limit or the pod stays Burstable.
          # See skill system-namespaces.
          - target:
              version: v1
              kind: Deployment
              name: k8tz
            patch: |-
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: k8tz
              spec:
                template:
                  spec:
                    containers:
                      - name: k8tz-cert-watcher
                        resources:
                          requests:
                            cpu: 50m
                            memory: 64Mi
                          limits:
                            cpu: 50m
                            memory: 64Mi
