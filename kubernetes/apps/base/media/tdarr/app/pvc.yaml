---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tdarr-temp
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
  # On `csi-rwx`: the default `csi` subvolumegroup is broken by Ceph Tentacle
  # v20.2.1 subvolume corruption. Disposable transcode scratch. Revert to
  # `ceph-filesystem` once a fixed Ceph release lands. Skill rook-ceph.
  storageClassName: ceph-filesystem-rwx
