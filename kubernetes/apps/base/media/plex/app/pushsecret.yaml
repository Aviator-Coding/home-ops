---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: plex-token
spec:
  refreshInterval: 1h
  secretStoreRefs:
    # The shared `onepassword` store, NOT `onepassword-automation`: that one only
    # sees the `Automation` vault, but the `plex` item lives in `Homelab`, which the
    # shared store lists first. Skill secrets-1password.
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: plex-token
  # Source Secret is created ONCE, by hand, from PlexOnlineToken in the running
  # Plex server's Preferences.xml; it is deliberately not committed. This PushSecret
  # upserts it as the single `PLEX_TOKEN` field of the existing `plex` 1Password item.
  # the ESO 1Password provider looks the item up by title, and when found
  # updates only the field matching `property` rather than replacing the item.
  # An empty PLEX_TOKEN still reports SecretSynced. Skill media-stack.
  data:
    - match:
        secretKey: PLEX_TOKEN
        remoteRef:
          remoteKey: plex
          property: PLEX_TOKEN
