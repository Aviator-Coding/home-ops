---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: plex-token
spec:
  refreshInterval: 1h
  secretStoreRefs:
    # The shared `onepassword` store, NOT `onepassword-automation`. That store
    # only sees the `Automation` vault, but the existing `plex` item (read by
    # media/plex-exporter's and downloads/bazarr's ExternalSecrets) lives in
    # `Homelab`. The shared store lists Homelab first (priority 1), so a write
    # through it resolves there - same reasoning, and the same measured
    # behavior, as kopiur-ceph-bucket-credentials
    # (kubernetes/apps/base/system/kopiur/backend/pushsecret.yaml).
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: plex-token
  # Source Secret is created ONCE, by hand, by copying PlexOnlineToken out of
  # the running Plex server's own Preferences.xml - it is deliberately not
  # committed, and nothing in the cluster generates it. This PushSecret upserts
  # it as the single `PLEX_TOKEN` field of the existing `plex` 1Password item,
  # the same "update one field, leave the rest of the item alone" shape as
  # grafana-sa-provisioner-token
  # (kubernetes/apps/base/monitoring/grafana-sa-provisioner/app/pushsecret.yaml):
  # the ESO 1Password provider looks the item up by title, and when found
  # updates only the field matching `property` rather than replacing the item.
  # Root cause of the empty field and the exact captain action:
  # docs/monitoring/exporter-endpoint-repair-2026-09-20.md
  data:
    - match:
        secretKey: PLEX_TOKEN
        remoteRef:
          remoteKey: plex
          property: PLEX_TOKEN
