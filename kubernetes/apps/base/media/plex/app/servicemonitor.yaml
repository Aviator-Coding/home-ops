---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: plex-exporter
  namespace: media
spec:
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
  selector:
    matchLabels:
      # Flux's commonMetadata.labels (kubernetes/apps/main/media/plex.yaml)
      # overwrites this Service's app.kubernetes.io/name to "plex" at reconcile
      # time - it never carries "plex-exporter" live. The `port: metrics`
      # endpoint below is what actually disambiguates it from the main `plex`
      # Service, which shares this label but has no port named "metrics".
      app.kubernetes.io/name: plex
  namespaceSelector:
    matchNames:
      - media
