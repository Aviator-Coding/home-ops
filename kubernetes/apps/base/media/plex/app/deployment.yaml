---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: plex-exporter
  namespace: media
  labels:
    app.kubernetes.io/name: plex-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: plex-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: plex-exporter
    spec:
      containers:
        - name: exporter
          image: ghcr.io/axsuul/plex-media-server-exporter:2.1.0
          env:
            - name: PORT
              value: "9594"
            - name: PLEX_ADDR
              value: http://plex.media.svc.cluster.local:32400
            - name: PLEX_TOKEN
              valueFrom:
                secretKeyRef:
                  name: plex-exporter-secret
                  key: PLEX_TOKEN
          ports:
            - name: metrics
              containerPort: 9594
          # DO NOT "fix" these three probes to target /metrics. `/` returns 200
          # even while /metrics returns 500, which looks like an obvious bug and
          # is load-bearing: because the pod stays Ready it stays in the Service
          # endpoints, so Prometheus keeps scraping it, gets the 500, and records
          # up=0 - the target is HONESTLY DOWN and TargetDown (general.rules,
          # for: 10m) fires on it. Pointing the probes at /metrics would make the
          # pod NotReady, drop it from the endpoints and remove the target from
          # Prometheus entirely: `up` would not go to 0, it would CEASE TO EXIST,
          # and TargetDown could no longer fire. That trades an honest alert for
          # silence. Reasoning and the measured evidence:
          # docs/monitoring/exporter-endpoint-repair-2026-09-20.md
          startupProbe:
            httpGet:
              path: /
              port: metrics
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 18
          livenessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: metrics
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
