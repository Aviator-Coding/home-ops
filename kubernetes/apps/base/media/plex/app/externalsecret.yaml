---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# Homelab item plex, field PLEX_TOKEN. SecretSynced does not mean the value
# is non-empty: check decoded length. An empty token makes plex-exporter
# return 500 and TargetDown fire. Skill media-stack.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: plex-exporter
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: plex-exporter-secret
    creationPolicy: Owner
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
