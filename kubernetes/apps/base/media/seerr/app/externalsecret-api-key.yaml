---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never refreshed. Deleting this ExternalSecret mints a new key that pushsecret-api-key.yaml then writes
# over the 1Password field, and Seerr and the seerr MCP both pick it up on their next restart.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name seerr-api-key
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
