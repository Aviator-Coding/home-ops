---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Seerr admin API key. Seerr adopts it through the API_KEY env var, so GitOps owns the key instead of settings.json.
# Alphanumeric only: it travels in the X-Api-Key header.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: seerr-api-key
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - SEERR_API_KEY
