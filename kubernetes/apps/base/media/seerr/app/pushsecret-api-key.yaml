---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the generated key in 1Password (vault Automation, item `seerr-api`), where the ai/toolhive seerr MCP reads it back.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: seerr-api-key
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the item the key lives in.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: seerr-api-key
  data:
    - match:
        secretKey: SEERR_API_KEY
        remoteRef:
          remoteKey: seerr-api
          property: SEERR_API_KEY
