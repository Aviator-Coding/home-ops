---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: seerr-secret
    creationPolicy: Owner
    template:
      data:
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        DB_TYPE: postgres
        DB_HOST: "postgres-18-rw.database.svc.cluster.local"
        DB_PORT: "5432"
        DB_USER: "{{ .POSTGRES_DB_USER_NAME }}"
        DB_PASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        DB_NAME: "{{ .POSTGRES_DB_NAME }}"

  dataFrom:
    - extract:
        key: seerr
