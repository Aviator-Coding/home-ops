---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Wizarr admin password and the API key Hermes and scripts use. Alphanumeric only: the key travels in a header.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: wizarr-generated
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - WIZARR_ADMIN_PASSWORD
    - WIZARR_API_KEY
