---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never refreshed. The seed creates the admin only when it is missing, so deleting this ExternalSecret
# changes the 1Password copy but not an existing admin password (reset it in the Wizarr UI).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name wizarr-generated
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
