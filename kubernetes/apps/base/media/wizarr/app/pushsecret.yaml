---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the generated admin password and API key in 1Password (vault Automation, item `wizarr`) so the owner can log in.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: wizarr-generated
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the item the credentials live in.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: wizarr-generated
  data:
    - match:
        secretKey: WIZARR_ADMIN_PASSWORD
        remoteRef:
          remoteKey: wizarr
          property: WIZARR_ADMIN_PASSWORD
    - match:
        secretKey: WIZARR_API_KEY
        remoteRef:
          remoteKey: wizarr
          property: WIZARR_API_KEY
