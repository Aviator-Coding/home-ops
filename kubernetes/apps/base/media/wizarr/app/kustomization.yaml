---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./helmrelease.yaml
  - ./password.yaml
  - ./externalsecret.yaml
  - ./externalsecret-generated.yaml
  - ./pushsecret.yaml
configMapGenerator:
  - name: wizarr-seed
    files:
      - seed.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
