---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Plex token for the seed. Homelab item plex, field PLEX_TOKEN: SecretSynced does not mean the value is non-empty.
# The Seerr key comes straight from the in-namespace Secret seerr-api-key. Skill media-stack.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wizarr-seed
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: wizarr-seed-secret
    creationPolicy: Owner
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
