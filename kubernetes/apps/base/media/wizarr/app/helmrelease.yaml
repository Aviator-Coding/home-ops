---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wizarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      wizarr:
        annotations:
          reloader.stakater.com/auto: "true"

        # Single replica with an RWO database PVC: Recreate avoids a Multi-Attach deadlock.
        strategy: Recreate

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
            env:
              TZ: America/New_York
              PORT: &port 5690
              PUID: "2000"
              PGID: "2000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: wizarr
        ports:
          http:
            port: *port

    persistence:
      config:
        # Created here (app-template names it after the release) and backed up by
        # components/kopiur. Invites, servers and libraries live in this SQLite database.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          wizarr:
            app:
              - path: /data/database
      temp:
        type: emptyDir
        advancedMounts:
          wizarr:
            app:
              - path: /tmp
              - path: /.cache

    route:
      # Admin UI: LAN/VPN only.
      admin:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: *app
          gethomepage.dev/icon: wizarr.png
          gethomepage.dev/description: "Wizarr sends invite links that give friends a Plex library share."
          gethomepage.dev/pod-selector: app.kubernetes.io/name=wizarr
          gatus.home-operations.com/endpoint: |-
            url: https://wizarr.${SECRET_DOMAIN}/health
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames:
          - wizarr.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: wizarr
                port: *port
      # Invite flow only, reachable from the internet. Everything else (admin login,
      # settings, plex scan, API) is not routed on this host.
      join:
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
        hostnames:
          - join.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path: { type: PathPrefix, value: /j }
              - path: { type: PathPrefix, value: /join }
              - path: { type: PathPrefix, value: /invitation }
              - path: { type: PathPrefix, value: /wizard }
              - path: { type: PathPrefix, value: /static }
              - path: { type: PathPrefix, value: /image-proxy }
              - path: { type: PathPrefix, value: /cinema-posters }
              - path: { type: PathPrefix, value: /reset }
              - path: { type: Exact, value: /favicon.ico }
              - path: { type: Exact, value: /plex/callback }
            backendRefs:
              - name: wizarr
                port: *port
