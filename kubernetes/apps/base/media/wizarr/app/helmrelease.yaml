---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app wizarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      wizarr:
        annotations:
          reloader.stakater.com/auto: "true"

        # Single replica with an RWO database PVC: Recreate avoids a Multi-Attach deadlock.
        strategy: Recreate

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        initContainers:
          # Writes the admin, Plex server, Seerr link and Hermes API key rows that Wizarr's setup wizard would. Skill
          # media-stack references/friends.md. Runs on the exact app image so it always matches the DB schema.
          seed:
            image: &image
              repository: ghcr.io/wizarrrr/wizarr
              tag: v2026.10.1@sha256:08f2c6de534ec7d36d39a4f55b7c5c379021ca881dc519c702aad0ddafbdc67a
            command: ["/bin/sh", "-c"]
            args:
              - >-
                uv run --frozen --no-dev flask db upgrade &&
                uv run --frozen --no-dev python /seed/seed.py
            env:
              TZ: America/New_York
              FLASK_SKIP_SCHEDULER: "true"
              PYTHONPATH: /app
              WIZARR_ADMIN_USERNAME: admin
              PLEX_URL: http://plex.media.svc.cluster.local:32400
              SEERR_URL: http://seerr.media.svc.cluster.local:5055
              PLEX_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-seed-secret
                    key: PLEX_TOKEN
              SEERR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: seerr-api-key
                    key: SEERR_API_KEY
              WIZARR_ADMIN_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-generated
                    key: WIZARR_ADMIN_PASSWORD
              WIZARR_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: wizarr-generated
                    key: WIZARR_API_KEY
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

        containers:
          app:
            image: *image
            env:
              TZ: America/New_York
              PORT: &port 5690
              PUID: "2000"
              PGID: "2000"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 15m
                memory: 128Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: wizarr
        ports:
          http:
            port: *port

    persistence:
      config:
        # Created here (app-template names it after the release) and backed up by
        # components/kopiur. Invites, servers and libraries live in this SQLite database.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        advancedMounts:
          wizarr:
            app:
              - path: /data/database
            seed:
              - path: /data/database
      temp:
        type: emptyDir
        advancedMounts:
          wizarr:
            app:
              - path: /tmp
              - path: /.cache
            seed:
              - path: /tmp
              - path: /.cache
      seed:
        type: configMap
        name: wizarr-seed
        advancedMounts:
          wizarr:
            seed:
              - path: /seed
                readOnly: true

    route:
      # Admin UI: LAN/VPN only.
      admin:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Media
          gethomepage.dev/name: *app
          gethomepage.dev/icon: wizarr.png
          gethomepage.dev/description: "Wizarr sends invite links that give friends a Plex library share."
          gethomepage.dev/pod-selector: app.kubernetes.io/name=wizarr
          gatus.home-operations.com/endpoint: |-
            url: https://wizarr.${SECRET_DOMAIN}/health
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames:
          - wizarr.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: wizarr
                port: *port
      # Invite flow only, reachable from the internet. Everything else (admin login,
      # settings, plex scan, API) is not routed on this host.
      join:
        annotations:
          external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
          # "/" is not routed on this host, so the default probe of the bare hostname always 404s.
          # /favicon.ico is an Exact route straight to the app.
          gatus.home-operations.com/endpoint: |-
            url: https://join.${SECRET_DOMAIN}/favicon.ico
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames:
          - join.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path: {type: PathPrefix, value: /j}
              - path: {type: PathPrefix, value: /join}
              - path: {type: PathPrefix, value: /invitation}
              - path: {type: PathPrefix, value: /wizard}
              - path: {type: PathPrefix, value: /static}
              - path: {type: PathPrefix, value: /image-proxy}
              - path: {type: PathPrefix, value: /cinema-posters}
              - path: {type: PathPrefix, value: /reset}
              - path: {type: Exact, value: /favicon.ico}
              - path: {type: Exact, value: /plex/callback}
            backendRefs:
              - name: wizarr
                port: *port
