---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      recyclarr:
        type: cronjob

        cronjob:
          schedule: "@daily"
          startingDeadlineSeconds: 600
          backoffLimit: 0
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          # Was 0, which made a healthy CronJob read as permanently broken: with
          # no successful Job retained, the only Job object left was the last
          # FAILED one, so KubeJobFailed latched on a 2026-08-24 failure and had
          # been firing ever since while recyclarr succeeded every single day.
          # Keeping one success means the retained Jobs reflect current reality.
          successfulJobsHistory: 1
          # Backstop so a failed Job ages out on its own instead of pinning
          # KubeJobFailed forever, matching renovate's HelmRelease. A genuinely
          # recurring failure still re-fires the alert daily; only the stale
          # artefact disappears. 24h is well clear of the alert's for: window.
          ttlSecondsAfterFinished: 86400

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.7.2
            args:
              - sync
            envFrom:
              - secretRef:
                  name: recyclarr-secret
            resources:
              requests:
                cpu: 5m
                memory: 36M
              limits:
                memory: 128M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      config:
        existingClaim: recyclarr-config
        advancedMounts:
          recyclarr:
            app:
              - path: /config
      config-file:
        type: configMap
        name: recyclarr
        globalMounts:
          - path: /config/recyclarr.yml
            subPath: recyclarr.yml
            readOnly: true
