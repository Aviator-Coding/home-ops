---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name lidarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: lidarr-secret
    template:
      data:
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        LIDARR__POSTGRES__HOST: "postgres-18-rw.database.svc.cluster.local"
        LIDARR__POSTGRES__MAINDB: "{{ .POSTGRES_DB_NAME }}"
        LIDARR__POSTGRES__USER: "{{ .POSTGRES_DB_USER_NAME }}"
        LIDARR__POSTGRES__PASSWORD: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        LIDARR__POSTGRES__PORT: "5432"

        LIDARR__AUTH__APIKEY: "{{ .LIDARR_API_KEY }}"

  dataFrom:
    - extract:
        key: lidarr
