---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# PILOT-SCOPED, NOT A PATTERN TO COPY. Captain decision 2026-08-30
# (`kopiur-workload-ns-credentials`). Read
# kubernetes/components/kopiur/Readme.md "Credentials" before reusing any of
# this in another namespace - the permanent shape is an OPEN decision.
#
# A kopiur mover Job runs in the workload namespace and loads its repository
# credentials with `envFrom`, which is namespace-local. Both ClusterRepository
# objects pin their Secrets to `system`, so `downloads` needs its own copies,
# under the SAME NAMES the ClusterRepository specs reference:
#
#   ClusterRepository ceph -> auth.secretRef                  system/kopiur
#                          -> encryption.passwordSecretRef    system/kopiur-ceph-secret
#   ClusterRepository r2   -> auth + encryption               system/kopiur-r2-secret
#
# Every field is fetched by explicit `data` + `property` rather than
# `dataFrom.extract` + template, matching Stage 0: a missing property fails the
# ExternalSecret loudly, whereas extract-and-template renders a missing field as
# an EMPTY string and materializes a Secret holding a blank credential.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ceph-bucket
spec:
  # NOT 1Password. These S3 keys are generated and rotated by Rook's
  # ObjectBucketClaim, so `system/kopiur` is the AUTHORITATIVE source and this
  # mirror follows a Rook rotation on the next refresh. Stage 0's PushSecret
  # also copies them into the 1Password `kopiur-ceph-bucket` item, but that item
  # is a RECORD and nothing reads it - reading it here instead would invent a
  # second source of truth and contradict Stage 0's own README.
  secretStoreRef:
    kind: ClusterSecretStore
    name: kopiur-system-secrets
  target:
    # Must match ClusterRepository ceph's `backend.s3.auth.secretRef.name`.
    name: kopiur
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        # For the kubernetes provider, `key` is the remote Secret's NAME and
        # `property` is a key inside it.
        key: kopiur
        property: AWS_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur
        property: AWS_SECRET_ACCESS_KEY
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-ceph
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    # Must match ClusterRepository ceph's `encryption.passwordSecretRef.name`.
    name: kopiur-ceph-secret
  data:
    # Key name is fixed by kopiur: the mover loads this Secret with envFrom and
    # hands it to kopia as an env var. Same 1Password item Stage 0 reads - the
    # kopia password has no in-cluster authoritative source, so 1Password IS the
    # source of truth for it.
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-ceph
        property: KOPIA_PASSWORD
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-r2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    # r2 uses ONE Secret for both auth and encryption, so this copy carries the
    # kopia password and the R2 API token together.
    name: kopiur-r2-secret
  data:
    - secretKey: KOPIA_PASSWORD
      remoteRef:
        key: kopiur-r2
        property: KOPIA_PASSWORD
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: kopiur-r2
        property: R2_ACCESS_KEY_ID
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: kopiur-r2
        property: R2_SECRET_ACCESS_KEY
