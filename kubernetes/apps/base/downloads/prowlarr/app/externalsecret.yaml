---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: prowlarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: prowlarr-secret
    creationPolicy: Owner
    template:
      data:
        # postgres-18-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        # Role and database come from components/cnpg-database. Skill `databases`.
        PROWLARR__POSTGRES__HOST: "postgres-18-rw.database.svc.cluster.local"
        PROWLARR__POSTGRES__MAINDB: "{{ .POSTGRES_DB_NAME }}"
        PROWLARR__POSTGRES__USER: "{{ .POSTGRES_DB_USER_NAME }}"
        PROWLARR__POSTGRES__PASSWORD: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        PROWLARR__POSTGRES__PORT: "5432"

        PROWLARR__AUTH__APIKEY: "{{ .PROWLARR_API_KEY }}"

  dataFrom:
    - extract:
        key: prowlarr
