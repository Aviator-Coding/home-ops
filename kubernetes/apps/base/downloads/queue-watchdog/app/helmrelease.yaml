---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: queue-watchdog
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  values:
    controllers:
      queue-watchdog:
        type: cronjob

        # Fails (exit 1) when any Radarr/Sonarr/Lidarr queue item is older than
        # 24h and (exit 2) when a queue is unreadable; KubeJobFailed pages on it.
        cronjob:
          schedule: "*/30 * * * *"
          startingDeadlineSeconds: 600
          backoffLimit: 0
          # A pod that never starts (missing secret) would otherwise block every later
          # run under Forbid; the deadline turns it into a failed Job.
          activeDeadlineSeconds: 600
          concurrencyPolicy: Forbid
          failedJobsHistory: 1
          # Keep one success: with none retained, the last FAILED Job is the only Job
          # object left and KubeJobFailed latches on it forever.
          successfulJobsHistory: 1
          # Backstop so a failed Job ages out instead of pinning KubeJobFailed.
          ttlSecondsAfterFinished: 86400

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: OnRootMismatch

        containers:
          app:
            image:
              repository: mirror.gcr.io/python
              tag: 3.13-alpine
            command:
              - python3
              - /scripts/watchdog.py
            env:
              RADARR_URL: http://radarr.downloads.svc.cluster.local:7878
              SONARR_URL: http://sonarr.downloads.svc.cluster.local:8989
              LIDARR_URL: http://lidarr.downloads.svc.cluster.local:8080
              PYTHONDONTWRITEBYTECODE: "1"
            envFrom:
              - secretRef:
                  name: queue-watchdog-secret
            resources:
              requests:
                cpu: 5m
                memory: 32M
              limits:
                memory: 64M
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    persistence:
      script:
        type: configMap
        name: queue-watchdog
        globalMounts:
          - path: /scripts
            readOnly: true
