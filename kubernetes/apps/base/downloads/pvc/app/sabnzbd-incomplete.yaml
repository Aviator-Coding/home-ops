---
# SABnzbd article-assembly scratch (the "incomplete"/download_dir). On
# `ceph-block` (RWO), NOT CephFS RWX, on purpose: assembly writes thousands of
# tiny `SABnzbd_article_*` files that storm the CephFS MDS metadata journal and
# can stall the whole filesystem. Block keeps that churn inside the RBD; Ceph
# only sees 4MB objects. Finished media moves to `complete` on `shared-downloads`
# (CephFS RWX) so the *arr hardlink/atomic-import flow is unchanged.
# Disposable scratch, no backup.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-incomplete
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      # 1.5Ti: 500Gi filled during large UHD batches (par2 + multi-file assembly) and
      # paused downloads on low free space. The scratch is transient, so the
      # reservation only consumes space when used.
      storage: 1500Gi
  storageClassName: ceph-block
