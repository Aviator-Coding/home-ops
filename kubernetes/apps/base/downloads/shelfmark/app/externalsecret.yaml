---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: shelfmark
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: shelfmark-secret
    creationPolicy: Owner
  # SABnzbd and Prowlarr reuse their existing 1Password items; the rest live in the shelfmark item.
  data:
    - secretKey: AA_DONATOR_KEY
      remoteRef:
        key: shelfmark
        property: AA_DONATOR_KEY
    - secretKey: HARDCOVER_API_KEY
      remoteRef:
        key: shelfmark
        property: HARDCOVER_API_KEY
    - secretKey: GOOGLEBOOKS_API_KEY
      remoteRef:
        key: shelfmark
        property: GOOGLEBOOKS_API_KEY
    - secretKey: SABNZBD_API_KEY
      remoteRef:
        key: sabnzbd
        property: SABNZBD_API_KEY
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: prowlarr
        property: PROWLARR_API_KEY
