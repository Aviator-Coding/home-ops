---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app shelfmark
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    defaultPodOptions:
      securityContext:
        runAsUser: 2000
        runAsGroup: 2000
        fsGroup: 2000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: false
        seccompProfile: { type: RuntimeDefault }
    controllers:
      shelfmark:
        containers:
          app:
            image:
              repository: ghcr.io/calibrain/shelfmark-lite
              tag: v1.4.0@sha256:edc889c12c4e54076432e5377b674fed4a1aaa934890f8a678bc5b38e5088a75
            env:
              UID: "2000"
              GID: "2000"
              FLASK_PORT: &port 8084
              INGEST_DIR: /cwa-book-ingest
              LOG_ROOT: /var/log
              LOG_LEVEL: info
              BOOK_LANGUAGE: en
              USE_BOOK_TITLE: "true"
              # Usenet only: Prowlarr finds releases, SABnzbd downloads them to the shared
              # volume at the same path SABnzbd reports.
              PROWLARR_ENABLED: "true"
              PROWLARR_URL: http://prowlarr.downloads.svc.cluster.local:9696
              PROWLARR_USENET_CLIENT: sabnzbd
              SABNZBD_URL: http://sabnzbd.downloads.svc.cluster.local:8080
              SABNZBD_CATEGORY: books
              # Lite image has no Chromium; Cloudflare challenges go to FlareSolverr.
              USING_EXTERNAL_BYPASSER: "true"
              EXT_BYPASSER_URL: http://flaresolverr.network.svc.cluster.local:8191
              EXT_BYPASSER_PATH: /v1
              EXT_BYPASSER_TIMEOUT: 60000
            envFrom:
              - secretRef:
                  name: shelfmark-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /request/api/status
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /request/api/status
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
            resources:
              requests:
                cpu: 10m
                memory: 150Mi
              limits:
                memory: 500Mi
            securityContext:
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
              allowPrivilegeEscalation: false
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: calibre-web.png
          gethomepage.dev/name: *app
          gethomepage.dev/group: media
          gatus.home-operations.com/endpoint: |-
            url: https://books.${SECRET_DOMAIN}/request/api/status
            conditions:
              - "[STATUS] == 200"
            group: media
        hostnames: ["books.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
            timeouts:
              request: 0s
    persistence:
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
          - path: /app/downloaded_files
            subPath: downloads
          - path: /var/log/shelfmark
            subPath: logs
      downloads:
        existingClaim: shared-downloads
        globalMounts:
          - path: /data/downloads
      ingest:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/storage/Media/ebooks/calibre/ingest
        globalMounts:
          - path: /cwa-book-ingest
