---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app bazarr
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      bazarr:
        annotations:
          reloader.stakater.com/auto: "true"

        pod:
          securityContext:
            runAsUser: 2000
            runAsGroup: 2000
            runAsNonRoot: true
            fsGroup: 2000
            fsGroupChangePolicy: "OnRootMismatch"
            supplementalGroups:
              - 65542 # gladius:external-services

        initContainers:
          fix-permissions:
            # emptyDir volumes are root-owned by default; s6-overlay's preinit
            # refuses to start unless /run is owned by the UID it runs as.
            image:
              repository: docker.io/library/busybox
              tag: "1.38"
            command:
              - sh
              - -c
              - chown -R 2000:2000 /run /tmp
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false

        containers:
          app:
            image:
              # linuxserver/bazarr, not home-operations/bazarr: it ships upstream
              # Bazarr on Alpine's python3 (3.12, well under Bazarr's <=3.13 ceiling)
              # instead of home-operations' Python 3.14 build, which upstream Bazarr
              # does not support and which hangs before binding its HTTP port.
              repository: ghcr.io/linuxserver/bazarr
              tag: version-v1.6.0
              digest: sha256:ac284d3fda9ee7da8b15197dc51f0d7a2a1da98549bee99a3d924d3e94a5e7ed
            env:
              # Tell the s6-overlay init to skip its root-only usermod/chown steps:
              # the pod already runs as the target non-root UID with a read-only
              # rootfs, so there is nothing for those steps to do and they would
              # fail under this securityContext anyway.
              LSIO_NON_ROOT_USER: "true"
              LSIO_READ_ONLY_FS: "true"
            envFrom:
              - secretRef:
                  name: bazarr-secret
            probes:
              # Moving forward across the accumulated Alembic revision backlog is a
              # one-time, single-threaded SQLite migration that took ~7 minutes
              # against this app's real config DB - give it generous room on first
              # boot via startupProbe, which gates liveness/readiness until it
              # passes, then fall back to a normal steady-state window.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 6767
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 90
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 15m
                memory: 256Mi
              limits:
                memory: 512Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    service:
      app:
        controller: *app
        ports:
          http:
            port: *port

    persistence:
      config:
        existingClaim: bazarr-config
      tmp:
        type: emptyDir
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      downloads:
        existingClaim: shared-downloads
        globalMounts:
          - path: /data/downloads
      media:
        type: nfs
        server: nas.${SECRET_DOMAIN}
        path: /mnt/storage/Media
        globalMounts:
          - path: /data/nas-media

    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: Downloads
          gethomepage.dev/name: *app
          gethomepage.dev/icon: https://raw.githubusercontent.com/loganmarchione/homelab-svg-assets/refs/heads/main/assets/bazarr.svg
          # gethomepage.dev/siteMonitor: coder.${SECRET_DOMAIN}
          gethomepage.dev/description: "Bazarr - Subtitle Management"
          gethomepage.dev/pod-selector: app.kubernetes.io/name=bazarr
          external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
        hostnames:
          - bazarr.${SECRET_DOMAIN}
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: *port
