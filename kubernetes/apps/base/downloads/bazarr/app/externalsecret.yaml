---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
#
# NOTE (2026-09-20): this ExternalSecret is CORRECT and needs no change, but the
# value it resolves is EMPTY. The `PLEX_TOKEN` field of the `plex` item in the
# `Homelab` vault holds no value, so ESO writes a zero-length string and still
# reports `SecretSynced / Ready=True`. An ExternalSecret reporting Ready does
# NOT mean the value is usable - check the LENGTH, not the status:
#   kubectl -n <ns> get secret <name> -o jsonpath='{.data.PLEX_TOKEN}' | base64 -d | wc -c
#
# A valid 20-character token already exists in the running Plex server's
# Preferences.xml; it only has to be copied into that 1Password field. It must
# stay in `Homelab` - Connect cannot see the hyphenated `Home-Lab` vault at all.
# Root cause, evidence and the exact captain action:
# docs/monitoring/exporter-endpoint-repair-2026-09-20.md
# Same empty `Homelab/plex` -> `PLEX_TOKEN` field as media/plex-exporter:
# these two are the only consumers, so populating it once repairs both.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bazarr
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: bazarr-secret
    creationPolicy: Owner
  data:
    - secretKey: PLEX_TOKEN
      remoteRef:
        key: plex
        property: PLEX_TOKEN
