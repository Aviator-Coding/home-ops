---
# yaml-language-server: $schema=https://raw.githubusercontent.com/kashalls/kromgo/main/config.schema.json
badge:
  font: Verdana.ttf
  size: 12

metrics:
  - name: talos_version
    query: label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)")
    label: version_id
    title: Talos

  - name: kubernetes_version
    query: label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)")
    label: git_version
    title: Kubernetes

  - name: flux_version
    query: label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+")
    label: revision
    title: Flux

  - name: cluster_node_count
    query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
    colors:
      - { color: "green", min: 0, max: 9999 }
    title: Nodes

  - name: cluster_pod_count
    query: sum(kube_pod_status_phase{phase="Running"})
    colors:
      - { color: "green", min: 0, max: 9999 }
    title: Pods

  - name: cluster_cpu_usage
    query: round(avg(instance:node_cpu_utilisation:rate5m{kubernetes_node!=""}) * 100, 0.1)
    suffix: "%"
    colors:
      - { color: "green", min: 0, max: 35 }
      - { color: "orange", min: 36, max: 75 }
      - { color: "red", min: 76, max: 9999 }
    title: CPU

  - name: cluster_memory_usage
    query: round(sum(node_memory_MemTotal_bytes{kubernetes_node!=""} - node_memory_MemAvailable_bytes{kubernetes_node!=""}) / sum(node_memory_MemTotal_bytes{kubernetes_node!=""}) * 100, 0.1)
    suffix: "%"
    colors:
      - { color: green, min: 0, max: 35 }
      - { color: orange, min: 36, max: 75 }
      - { color: red, min: 76, max: 9999 }
    title: Memory

  - name: cluster_power_usage
    query: round(upsHighPrecOutputLoad, 0.1)
    suffix: "w"
    colors:
      - { color: "green", min: 0, max: 400 }
      - { color: "orange", min: 401, max: 750 }
      - { color: "red", min: 751, max: 9999 }
    title: Power

  - name: cluster_age_days
    query: round((time() - min(kube_node_created) ) / 86400)
    suffix: "d"
    colors:
      - { color: "green", min: 0, max: 180 }
      - { color: "orange", min: 181, max: 360 }
      - { color: "red", min: 361, max: 9999 }
    title: Age

  - name: cluster_uptime_days
    query: round(avg(node_time_seconds{kubernetes_node!=""} - node_boot_time_seconds{kubernetes_node!=""}) / 86400)
    suffix: "d"
    colors:
      - { color: "green", min: 0, max: 180 }
      - { color: "orange", min: 181, max: 360 }
      - { color: "red", min: 361, max: 9999 }
    title: Uptime

  - name: cluster_alert_count
    query: alertmanager_alerts{state="active"} - 1 # Ignore Watchdog
    colors:
      - { color: "green", min: 0, max: 0 }
      - { color: "red", min: 1, max: 9999 }
    title: Alerts

  # ---------------------------------------------------------------------------
  # Profile README (github.com/skrumbach). Everything below is PUBLIC: aggregates
  # only — no model names except the loaded chat model, no keys, spend or prompts.
  # ---------------------------------------------------------------------------
  - name: cluster_node_ready_count
    query: sum(kube_node_status_condition{condition="Ready", status="true"})
    title: Ready

  # AI gateway (LiteLLM), last 7 days (Prometheus keeps 14d). Sparse counters
  # fall back to 0 so an idle week reads 0, not "no data".
  - name: ai_tokens_7d
    query: round(sum(increase(litellm_total_tokens_metric_total[7d])) or vector(0))
    title: Tokens (7d)

  - name: ai_requests_7d
    query: round(sum(increase(litellm_proxy_total_requests_metric_total[7d])) or vector(0))
    title: Requests (7d)

  # Share of successful calls served by a local deployment. The auto-router's own
  # classifier call is excluded, or every routed request would count locally twice.
  - name: ai_local_share_7d
    query: >-
      round(100 *
        (sum(increase(litellm_deployment_success_responses_total{litellm_model_name!~"claude-.*", requested_model!="chat-local-classifier"}[7d])) or vector(0))
        / clamp_min(sum(increase(litellm_deployment_success_responses_total{requested_model!="chat-local-classifier"}[7d])), 1), 0.1)
    suffix: "%"
    title: Served locally

  - name: ai_cache_hit_rate_7d
    query: >-
      round(100 *
        (sum(increase(litellm_cache_hits_metric_total[7d])) or vector(0))
        / clamp_min((sum(increase(litellm_cache_hits_metric_total[7d])) or vector(0)) + (sum(increase(litellm_cache_misses_metric_total[7d])) or vector(0)), 1), 0.1)
    suffix: "%"
    title: Cache hits

  # Arc Pro B70 on talos-3 (skill intel-gpu, references/telemetry.md). VRAM from
  # system/xe-gpu-exporter; temperature, fan and energy from the xe hwmon chip.
  - name: gpu_vram_used_gib
    query: round(sum(xe_gpu_vram_used_bytes{pdev="0000:03:00.0"}) / 2^30, 0.1)
    title: VRAM used

  - name: gpu_vram_total_gib
    query: round(max(xe_gpu_vram_total_bytes{pdev="0000:03:00.0"}) / 2^30, 0.1)
    title: VRAM

  - name: gpu_temp_celsius
    query: round(max(node_hwmon_temp_celsius{chip="0000:02:01_0_0000:03:00_0", sensor="temp2"}))
    suffix: "°C"
    title: GPU temp

  - name: gpu_power_watts
    query: round(sum(rate(node_hwmon_energy_joule_total{chip="0000:02:01_0_0000:03:00_0", sensor="energy1"}[5m])))
    suffix: "w"
    title: GPU power

  - name: gpu_fan_rpm
    query: round(max(node_hwmon_fan_rpm{chip="0000:02:01_0_0000:03:00_0", sensor="fan1"}))
    title: GPU fan

  # llama-server (ai/vllm) metrics. job="vllm" keeps the embedding server out.
  # Decode t/s is tokens over busy seconds, so it is averaged over 24h: a live
  # value is empty whenever the server is idle.
  - name: llm_decode_tps_24h
    query: round(sum(increase(llamacpp:tokens_predicted_total{job="vllm"}[24h])) / sum(increase(llamacpp:tokens_predicted_seconds_total{job="vllm"}[24h])))
    title: Decode t/s

  # The model label comes from the vllm ServiceMonitor relabeling (${CHAT_MODEL_ID}).
  - name: llm_model
    query: max by (model) (llamacpp:requests_processing{job="vllm"})
    label: model
    title: Model

  - name: llm_requests_processing
    query: sum(llamacpp:requests_processing{job="vllm"})
    title: Active requests
