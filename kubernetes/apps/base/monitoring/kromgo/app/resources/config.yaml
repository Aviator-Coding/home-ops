---
# yaml-language-server: $schema=https://raw.githubusercontent.com/home-operations/kromgo/main/config.schema.json
#
# PUBLIC: served on envoy-external without auth. kromgo 0.16 returns every label of the
# result sample in ?format=json, so every query must aggregate away all labels except the
# one a badge displays. scripts/ci/kromgo-public-config-test.py enforces the badge
# allow-list, that every metric sits under a label-dropping aggregation, and that no
# graphs (range data) or gallery are served. The route only forwards /badges/.
# Flux substitutes this file: never write a dollar-brace variable here.

gallery:
  enabled: false

cache:
  enabled: true
  maxAge: 300

defaults:
  badge:
    gallery:
      hidden: true

badges:
  - id: talos_version
    title: Talos
    query: max by (version_id) (label_replace(node_os_info{name="Talos"}, "version_id", "$1", "version_id", "v(.+)"))
    valueExpr: labels[?"version_id"].orValue("unknown")

  - id: kubernetes_version
    title: Kubernetes
    query: max by (git_version) (label_replace(kubernetes_build_info{service="kubernetes"}, "git_version", "$1", "git_version", "v(.+)"))
    valueExpr: labels[?"git_version"].orValue("unknown")

  - id: flux_version
    title: Flux
    query: max by (revision) (label_replace(flux_instance_info, "revision", "$1", "revision", "v(.+)@sha256:.+"))
    valueExpr: labels[?"revision"].orValue("unknown")

  - id: cluster_node_count
    title: Nodes
    query: count(count by (node) (kube_node_status_condition{condition="Ready"}))
    valueExpr: humanizeFloat(result)
    colorExpr: '"green"'

  - id: cluster_node_ready_count
    title: Ready
    query: sum(kube_node_status_condition{condition="Ready", status="true"})
    valueExpr: humanizeFloat(result)

  - id: cluster_pod_count
    title: Pods
    query: sum(kube_pod_status_phase{phase="Running"})
    valueExpr: humanizeFloat(result)
    colorExpr: '"green"'

  - id: cluster_cpu_usage
    title: CPU
    query: round(avg(instance:node_cpu_utilisation:rate5m{job="node-exporter"}) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'

  - id: cluster_memory_usage
    title: Memory
    query: round(sum(node_memory_MemTotal_bytes{job="node-exporter"} - node_memory_MemAvailable_bytes{job="node-exporter"}) / sum(node_memory_MemTotal_bytes{job="node-exporter"}) * 100, 0.1)
    valueExpr: humanizeFloat(result) + "%"
    colorExpr: 'colorScale(result, [36.0, 76.0], ["green", "orange", "red"])'

  - id: cluster_age_days
    title: Age
    query: round((time() - min(kube_node_created)) / 86400)
    valueExpr: humanizeFloat(result) + "d"
    colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'

  - id: cluster_uptime_days
    title: Uptime
    query: round(avg(node_time_seconds{job="node-exporter"} - node_boot_time_seconds{job="node-exporter"}) / 86400)
    valueExpr: humanizeFloat(result) + "d"
    colorExpr: 'colorScale(result, [181.0, 361.0], ["green", "orange", "red"])'

  # Firing alerts, excluding the severity=none meta alerts (Watchdog, InfoInhibitor).
  - id: cluster_alert_count
    title: Alerts
    query: count(ALERTS{alertstate="firing", severity!="none"}) or vector(0)
    valueExpr: humanizeFloat(result)
    colorExpr: 'result < 1 ? "green" : "red"'

  # ---------------------------------------------------------------------------
  # Profile README (github.com/skrumbach). Aggregates only: no model names except
  # the loaded chat model, no keys, spend or prompts.
  # ---------------------------------------------------------------------------

  # AI gateway (LiteLLM), last 7 days (Prometheus keeps 14d). Sparse counters
  # fall back to 0 so an idle week reads 0, not "no data".
  - id: ai_tokens_7d
    title: Tokens (7d)
    query: round(sum(increase(litellm_total_tokens_metric_total[7d])) or vector(0))
    valueExpr: humanize(result)

  - id: ai_requests_7d
    title: Requests (7d)
    query: round(sum(increase(litellm_proxy_total_requests_metric_total[7d])) or vector(0))
    valueExpr: humanizeCommas(result)

  # Share of successful calls served by a local deployment. The auto-router's own
  # classifier call is excluded, or every routed request would count locally twice.
  - id: ai_local_share_7d
    title: Served locally
    query: >-
      round(100 *
        (sum(increase(litellm_deployment_success_responses_total{litellm_model_name!~"claude-.*", requested_model!="chat-local-classifier"}[7d])) or vector(0))
        / clamp_min(sum(increase(litellm_deployment_success_responses_total{requested_model!="chat-local-classifier"}[7d])), 1), 0.1)
    valueExpr: humanizeFloat(result) + "%"

  - id: ai_cache_hit_rate_7d
    title: Cache hits
    query: >-
      round(100 *
        (sum(increase(litellm_cache_hits_metric_total[7d])) or vector(0))
        / clamp_min((sum(increase(litellm_cache_hits_metric_total[7d])) or vector(0)) + (sum(increase(litellm_cache_misses_metric_total[7d])) or vector(0)), 1), 0.1)
    valueExpr: humanizeFloat(result) + "%"

  # Arc Pro B70 on talos-3 (skill intel-gpu, references/telemetry.md). VRAM from
  # system/xe-gpu-exporter; temperature, fan and energy from the xe hwmon chip.
  - id: gpu_vram_used_gib
    title: VRAM used
    query: round(sum(xe_gpu_vram_used_bytes{pdev="0000:03:00.0"}) / 2^30, 0.1)
    valueExpr: humanizeFloat(result) + " GiB"

  - id: gpu_vram_total_gib
    title: VRAM
    query: round(max(xe_gpu_vram_total_bytes{pdev="0000:03:00.0"}) / 2^30, 0.1)
    valueExpr: humanizeFloat(result) + " GiB"

  - id: gpu_temp_celsius
    title: GPU temp
    query: round(max(node_hwmon_temp_celsius{chip="0000:02:01_0_0000:03:00_0", sensor="temp2"}))
    valueExpr: humanizeFloat(result) + "°C"

  - id: gpu_power_watts
    title: GPU power
    query: round(sum(rate(node_hwmon_energy_joule_total{chip="0000:02:01_0_0000:03:00_0", sensor="energy1"}[5m])))
    valueExpr: humanizeFloat(result) + "w"

  - id: gpu_fan_rpm
    title: GPU fan
    query: round(max(node_hwmon_fan_rpm{chip="0000:02:01_0_0000:03:00_0", sensor="fan1"}))
    valueExpr: humanizeFloat(result)

  # llama-server (ai/vllm). job="vllm-app" is the only job exporting llamacpp:* metrics.
  # Decode t/s is tokens over busy seconds, averaged over 24h: a live value is empty
  # whenever the server is idle.
  - id: llm_decode_tps_24h
    title: Decode t/s
    query: round(sum(increase(llamacpp:tokens_predicted_total{job="vllm-app"}[24h])) / sum(increase(llamacpp:tokens_predicted_seconds_total{job="vllm-app"}[24h])))
    valueExpr: 'math.isNaN(result) ? "idle" : humanizeFloat(result)'

  # The model label comes from the vllm ServiceMonitor relabeling (CHAT_MODEL_ID).
  - id: llm_model
    title: Model
    query: max by (model) (llamacpp:requests_processing{job="vllm-app"})
    valueExpr: labels[?"model"].orValue("unknown")

  - id: llm_requests_processing
    title: Active requests
    query: sum(llamacpp:requests_processing{job="vllm-app"})
    valueExpr: humanizeFloat(result)
