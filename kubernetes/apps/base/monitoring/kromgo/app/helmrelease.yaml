---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kromgo
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kromgo:
        replicas: 2
        strategy: RollingUpdate
        # One of the two badge replicas stays up through a node drain.
        podDisruptionBudget:
          minAvailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # kashalls/kromgo moved to home-operations/kromgo (tags without the v prefix).
              repository: ghcr.io/home-operations/kromgo
              tag: 0.16.3@sha256:98775a53019250a517a09a0fb716404146d1aaa6fb1f67091c58345663e5b7b5
            env:
              KROMGO_PROMETHEUS_URL: http://prometheus-operated.monitoring.svc.cluster.local:9090
              KROMGO_SERVER_PORT: &port 8080
              # No /metrics listener: nothing scrapes it, and the main port is the only one served.
              KROMGO_METRICS_ENABLED: "false"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
                # ~4x the 14d peak (x2 replicas). Limit 64Mi.
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      # maxSkew 1 so one drain cannot take both replicas. Honor does not see the talos-3 PreferNoSchedule taint.
      # The chart defaults labelSelector to this controller's pods. See skill node-scheduling.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
    service:
      app:
        ports:
          http:
            port: *port
    # Public on purpose, no ExtAuth: the github.com/skrumbach profile workflow reads these
    # badges anonymously. Only /badges/ is routed (no gallery, graphs or health paths), kromgo
    # answers only the fixed queries in resources/config.yaml (query parameters never reach
    # PromQL), and every query aggregates away identifying labels.
    # scripts/ci/kromgo-public-config-test.py enforces both. Cloudflare sits in front.
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://kromgo.${SECRET_DOMAIN}/badges/cluster_node_count?format=json
            conditions: ["[STATUS] == 200", "[BODY].id == cluster_node_count"]
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /badges/
            backendRefs:
              - identifier: app
                port: *port
    persistence:
      config-file:
        type: configMap
        name: kromgo-configmap
        globalMounts:
          - path: /config/config.yaml
            subPath: config.yaml
            readOnly: true
