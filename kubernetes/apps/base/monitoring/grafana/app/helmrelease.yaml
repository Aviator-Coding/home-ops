---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
spec:
  chartRef:
    kind: OCIRepository
    name: grafana
  interval: 30m
  timeout: 20m
  values:
    admin:
      existingSecret: grafana-admin-secret

    annotations:
      configmap.reloader.stakater.com/reload: grafana
      secret.reloader.stakater.com/reload: grafana-admin-secret

    replicas: 1

    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
          - name: default
            disableDeletion: false
            editable: true
            folder: ""
            options:
              path: /var/lib/grafana/dashboards/default
            orgId: 1
            type: file
          - name: infrastructure
            orgId: 1
            folder: Infrastructure
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/infrastructure
          - name: databases
            orgId: 1
            # 'Database' (singular) matches the folder used by sidecar-loaded
            # dashboards (CNPG, Dragonfly operator). Single folder for all
            # database-related dashboards instead of split Database/Databases.
            folder: Database
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/databases
          - name: ai-ml
            orgId: 1
            folder: AI/ML
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/ai-ml
          - name: media
            orgId: 1
            folder: Media
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/media
          - name: networking
            orgId: 1
            folder: Networking
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/networking
          - name: monitoring
            orgId: 1
            folder: Monitoring
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/monitoring
          - name: security
            orgId: 1
            folder: Security
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/security
          - name: storage
            orgId: 1
            folder: Storage
            type: file
            disableDeletion: false
            editable: true
            options:
              path: /var/lib/grafana/dashboards/storage

    dashboards:
      default:
        external-dns:
          # renovate: depName="External-DNS"
          gnetId: 15038
          revision: 3
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        node-exporter-full:
          # renovate: depName="Node Exporter Full"
          gnetId: 1860
          revision: 45
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        smartctl-exporter:
          # renovate: depName="SMARTctl Exporter Dashboard"
          gnetId: 22604
          revision: 4
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        home-dashboard:
          json: |
            {
              "annotations": {
                "list": []
              },
              "description": "Homelab Dashboard - Organized by Function",
              "editable": false,
              "fiscalYearStartMonth": 0,
              "graphTooltip": 0,
              "links": [],
              "liveNow": false,
              "panels": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "$${datasource}"
                  },
                  "gridPos": {"h": 3, "w": 24, "x": 0, "y": 0},
                  "id": 1,
                  "options": {
                    "code": {"language": "plaintext", "showLineNumbers": false, "showMiniMap": false},
                    "content": "# 🏠 Homelab Dashboard\n\nWelcome to your reorganized Grafana! Dashboards are now organized by function.",
                    "mode": "markdown"
                  },
                  "pluginVersion": "10.3.1",
                  "targets": [],
                  "title": "",
                  "transparent": true,
                  "type": "text"
                },
                {
                  "datasource": {"type": "prometheus", "uid": "$${datasource}"},
                  "gridPos": {"h": 8, "w": 8, "x": 0, "y": 3},
                  "id": 2,
                  "options": {
                    "code": {"language": "plaintext", "showLineNumbers": false, "showMiniMap": false},
                    "content": "## 🖥️ Infrastructure\n- [Cilium](/d/vtuWtdumz)\n- [Kubernetes](/d/k8s_views_global)\n- [Cert-manager](/d/cdhrcds8aosg0c)\n- [Ceph Cluster](/d/tbO9LAiZK)\n- [Ceph Usage](/d/ceph-usage)\n- [Ceph Hosts](/d/ceph-hosts-overview)\n\n## 🗄️ Databases\n- [CloudNativePG](/d/cloudnative-pg)\n- [Dragonfly](/d/xDLNRKUWl)\n- [EMQX](/d/overview)",
                    "mode": "markdown"
                  },
                  "title": "Infrastructure & Databases",
                  "type": "text"
                },
                {
                  "datasource": {"type": "prometheus", "uid": "$${datasource}"},
                  "gridPos": {"h": 8, "w": 8, "x": 8, "y": 3},
                  "id": 3,
                  "options": {
                    "code": {"language": "plaintext", "showLineNumbers": false, "showMiniMap": false},
                    "content": "## 🤖 AI/ML\n- [AgentGateway](/d/agentgateway)\n- [LiteLLM](/d/litellm)\n- [LiteLLM Routing](/d/llm-routing)\n- [LLM Cost](/d/ai-llm-cost)\n- [Qdrant](/d/qdrant-overview)\n- [Ollama](/d/ollama-inference-v1)\n\n## 🎬 Media\n- [Plex](/d/TPZ6-zT4z)",
                    "mode": "markdown"
                  },
                  "title": "AI/ML & Media",
                  "type": "text"
                },
                {
                  "datasource": {"type": "prometheus", "uid": "$${datasource}"},
                  "gridPos": {"h": 8, "w": 8, "x": 16, "y": 3},
                  "id": 4,
                  "options": {
                    "code": {"language": "plaintext", "showLineNumbers": false, "showMiniMap": false},
                    "content": "## 🔒 Security\n- [Authentik](/d/authentik)\n\n## 📊 Monitoring\n- [Gatus](/d/KPI7Qj1Wk)\n- [UniFi Sites](/d/9WaGWZaZk)\n- [UniFi Clients](/d/jMfvAjxWz)",
                    "mode": "markdown"
                  },
                  "title": "Security & Monitoring",
                  "type": "text"
                }
              ],
              "refresh": "",
              "schemaVersion": 38,
              "tags": ["home", "overview"],
              "templating": {
                "list": [
                  {
                    "current": {"selected": false, "text": "Prometheus", "value": "prometheus"},
                    "hide": 0,
                    "includeAll": false,
                    "label": "Datasource",
                    "multi": false,
                    "name": "datasource",
                    "options": [],
                    "query": "prometheus",
                    "refresh": 1,
                    "regex": "",
                    "skipUrlSync": false,
                    "type": "datasource"
                  }
                ]
              },
              "time": {"from": "now-6h", "to": "now"},
              "timepicker": {},
              "timezone": "browser",
              "title": "Home - Homelab Overview",
              "uid": "home-dashboard",
              "version": 1,
              "weekStart": ""
            }

      infrastructure:
        # The Cilium dashboard comes from the cilium HelmRelease (kube-system/cilium-dashboard).
        # Do not re-add gnetId 16611: same UID as the operator's and it locks sidecarProvider
        # out of writes. Skill observability.

        kube-state-metrics:
          # renovate: depName="Kube-State-Metrics"
          gnetId: 13332
          revision: 12
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: VAR_DATASOURCE
              value: Prometheus

        volsync:
          # renovate: depName="VolSync Dashboard"
          gnetId: 21356
          revision: 3
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: VAR_REPLICATIONDESTNAME
              value: ".*-bootstrap"

        flux-cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
          datasource: Prometheus

        flux-control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
          datasource: Prometheus

        flux-logs:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/logs.json
          # LogQL dashboard: string mode would rewrite the Loki datasource to Prometheus.
          datasource:
            - name: DS_LOKI
              value: Loki

        k8s-system-api-server:
          # renovate: depName="Kubernetes / System / API Server"
          gnetId: 15761
          revision: 21
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-global:
          # renovate: depName="Kubernetes / Views / Global"
          gnetId: 15757
          revision: 43
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-namespaces:
          # renovate: depName="Kubernetes / Views / Namespaces"
          gnetId: 15758
          revision: 46
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-nodes:
          # renovate: depName="Kubernetes / Views / Nodes"
          gnetId: 15759
          revision: 40
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-views-pods:
          # renovate: depName="Kubernetes / Views / Pods"
          gnetId: 15760
          revision: 41
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        k8s-volumes:
          # renovate: depName="K8s / Storage / Volumes / Cluster"
          gnetId: 11454
          revision: 14
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        cert-manager:
          url: https://grafana.com/api/dashboards/20842/revisions/3/download
          datasource: Prometheus

      databases:
        # CloudNativePG (cloudnative-pg-dashboard chart) and the Dragonfly operator install their
        # own dashboards; gnetIds 15944/15945/21053/21054 are the unrelated Dragonfly P2P project.
        # Do not duplicate them here (UID collision). Skill observability.

        emqx-authentication:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/authentication.json
          datasource: Prometheus

        emqx-authorization:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/authorization.json
          datasource: Prometheus

        emqx-client-events:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/client-events.json
          datasource: Prometheus

        emqx-messages:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/messages.json
          datasource: Prometheus

        emqx-overview:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/overview.json
          datasource: Prometheus

        emqx-rule-engine-count:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/rule-engine-count.json
          datasource: Prometheus

        emqx-rule-engine-rate:
          url: https://raw.githubusercontent.com/emqx/emqx-exporter/main/grafana-dashboard/template/emqx-5/rule-engine-rate.json
          datasource: Prometheus

      # agentgateway + llm-cost dashboards are sidecar ConfigMaps
      # (kubernetes/apps/base/ai/agentgateway-dashboards/), not gnet entries.

        qdrant-observatory:
          # renovate: depName="Qdrant Observatory"
          gnetId: 25152
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        ollama-llm-inference:
          # renovate: depName="Ollama LLM Inference"
          gnetId: 25086
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      ai-ml:
        toolhive-mcp-gateway:
          url: https://raw.githubusercontent.com/stacklok/toolhive/main/examples/otel/grafana-dashboards/toolhive-mcp-grafana-dashboard-otel-scrape.json
          datasource: Prometheus

      media:
        plex-media-server-exporter:
          # renovate: depName="plex-media-server-exporter"
          gnetId: 17891
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      networking:
        cloudflare-tunnels:
          url: https://grafana.com/api/dashboards/17457/revisions/6/download
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        envoy-gateway:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-gateway-global.json
          datasource: Prometheus

        envoy-proxy:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/refs/heads/main/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
          datasource: Prometheus

      monitoring:
        gatus:
          # renovate: depName="Gatus"
          gnetId: 24379
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        # PDU Insights (grafana.com 23027) is not imported: this Prometheus
        # has no unpoller_device_outlet_* series, so every panel would be empty.
        unifi-insights:
          # renovate: depName="UniFi-Poller: Client Insights - Prometheus"
          gnetId: 11315
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            # A few panels still reference the upstream input name.
            - name: DS_UNIFI_POLLER
              value: Prometheus

        unifi-network-sites:
          # renovate: depName="UniFi-Poller: Network Sites - Prometheus"
          gnetId: 11311
          revision: 5
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus

        unifi-usw:
          # renovate: depName="UniFi-Poller: USW Insights - Prometheus"
          gnetId: 11312
          revision: 9
          datasource:
            - name: "DS_PROMETHEUS"
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus

        unifi-uap:
          # renovate: depName="UniFi-Poller: UAP Insights - Prometheus"
          gnetId: 11314
          revision: 10
          datasource:
            - name: "DS_PROMETHEUS"
              value: Prometheus
            - name: DS_UNIFI_POLLER
              value: Prometheus

      security:
        authentik:
          # renovate: depName="authentik"
          gnetId: 23043
          revision: 1
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

      storage:
        ceph-cluster:
          # renovate: depName="Ceph Cluster"
          gnetId: 2842
          revision: 18
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        ceph-osd:
          # renovate: depName="Ceph - OSD (Single)"
          gnetId: 5336
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

        ceph-pools:
          # renovate: depName="Ceph - Pools"
          gnetId: 5342
          revision: 9
          datasource:
            - name: DS_PROMETHEUS
              value: Prometheus

    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - access: proxy
            name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090
            isDefault: true
            jsonData:
              prometheusType: Prometheus
              # Must match scrapeInterval in kube-prometheus-stack. Unset, Grafana assumes 15s and
              # $__rate_interval resolves to 1m, one scrape, so rate() panels are empty.
              timeInterval: 1m
          - access: proxy
            name: Loki
            type: loki
            url: http://loki-headless.monitoring.svc.cluster.local:3100
          - name: Alertmanager
            type: alertmanager
            access: proxy
            url: http://alertmanager.monitoring.svc.cluster.local:9093
            jsonData:
              implementation: prometheus
          - name: Tempo
            type: tempo
            uid: tempo
            access: proxy
            url: http://tempo.monitoring.svc.cluster.local:3200
            jsonData:
              tracesToMetrics:
                datasourceUid: prometheus

        deleteDatasources:
          - name: Alertmanager
            orgId: 1
          - name: Prometheus
            orgId: 1
          - name: Loki
            orgId: 1
          - name: Tempo
            orgId: 1

    env:
      GF_ANALYTICS_CHECK_FOR_UPDATES: false
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: false
      GF_ANALYTICS_REPORTING_ENABLED: false
      GF_AUTH_ANONYMOUS_ENABLED: false
      GF_AUTH_BASIC_ENABLED: false
      GF_DATE_FORMATS_USE_BROWSER_LOCALE: true
      # Do not set GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH. It overrides
      # grafana.ini dashboards.default_home_dashboard_path, and the sidecar
      # directory (/tmp/dashboards) has no home.json, so every visit to
      # /api/dashboards/home returns 500. The chart writes the landing
      # dashboard to the path grafana.ini already names.
      GF_EXPLORE_ENABLED: true
      GF_FEATURE_TOGGLES_ENABLE: publicDashboards
      GF_LOG_MODE: console
      GF_NEWS_NEWS_FEED_ENABLED: false
      GF_SECURITY_COOKIE_SAMESITE: grafana
      GF_SERVER_ROOT_URL: "https://{{ .Release.Name }}.${SECRET_DOMAIN}"

    grafana.ini:
      analytics:
        check_for_updates: false
        check_for_plugin_updates: false
        reporting_enabled: false
      auth.anonymous:
        enabled: true
        org_id: 1
        org_name: Main Org.
        org_role: Viewer
      dashboards:
        default_home_dashboard_path: /var/lib/grafana/dashboards/default/home-dashboard.json
      news:
        news_feed_enabled: false
    imageRenderer:
      enabled: true

    persistence:
      enabled: false

    plugins:
      - grafana-clock-panel

    rbac:
      pspEnabled: false

    resources:
      limits:
        memory: 512Mi
      requests:
        cpu: 50m
        memory: 128Mi

    route:
      main:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/icon: grafana.svg
          gethomepage.dev/name: Grafana
          gethomepage.dev/group: Observability
          gethomepage.dev/description: Monitoring Dashboards
          gethomepage.dev/widget.type: grafana
          gethomepage.dev/widget.url: "http://grafana.${SECRET_DOMAIN}"
          gethomepage.dev/widget.username: "{{`{{HOMEPAGE_VAR_GRAFANA_USERNAME}}`}}"
          gethomepage.dev/widget.password: "{{`{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}`}}"
        enabled: true
        hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https

    serviceAccount:
      create: true
      autoMount: true

    serviceMonitor:
      enabled: true

    sidecar:
      dashboards:
        enabled: true
        searchNamespace: ALL
        label: grafana_dashboard
        folderAnnotation: grafana_folder
        provider:
          disableDelete: true
          foldersFromFilesStructure: true
      datasources:
        enabled: true
        searchNamespace: ALL
        labelValue: ""

    testFramework:
      enabled: false

    # nodeTaintsPolicy: Honor - no toleration for the talos-3 taint, which is PreferNoSchedule,
    # so Honor does not exclude talos-3 from the spread domains; the TaintToleration score
    # penalty keeps this workload off it (.agents/skills/node-scheduling/references/talos-3-ledger.md).
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        nodeTaintsPolicy: Honor
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: grafana
