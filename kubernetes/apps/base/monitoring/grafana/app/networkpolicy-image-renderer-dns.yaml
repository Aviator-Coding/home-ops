---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: grafana-image-renderer-allow-dns-replies
spec:
  # The chart's imageRenderer subchart ships its own NetworkPolicy
  # `grafana-image-renderer-ingress` (Helm-managed) which does not admit kube-dns. This
  # additive policy OR-combines with it and matches its podSelector exactly. Do not
  # disable or replace the chart's policy.
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: grafana
      app.kubernetes.io/name: grafana-image-renderer
  policyTypes:
    - Ingress
  ingress:
    # DNS replies from CoreDNS. No ports restriction on purpose: `ports` matches the
    # destination port and a reply arrives on an ephemeral one, so port:53 drops every
    # reply. Skill networking.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
