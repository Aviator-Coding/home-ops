---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: grafana-sa-provisioner-token
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: grafana-sa-provisioner-token
  # Existing 1Password item/field grafana-mcp/GRAFANA_SERVICE_ACCOUNT_TOKEN -
  # the same one kubernetes/apps/base/ai/toolhive/mcp-servers/grafana-mcp's
  # ExternalSecret already reads from. This upserts that one field; it does
  # not own or touch the rest of the item.
  data:
    - match:
        secretKey: GRAFANA_SERVICE_ACCOUNT_TOKEN
        remoteRef:
          remoteKey: grafana-mcp
          property: GRAFANA_SERVICE_ACCOUNT_TOKEN
