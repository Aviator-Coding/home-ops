---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: grafana-sa-provisioner-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: grafana-sa-provisioner.rules
      rules:
        - alert: GrafanaSAProvisionerFailing
          annotations:
            description: >-
              The grafana-sa-provisioner CronJob (monitoring namespace) has not
              completed successfully in over an hour. The Viewer service account
              token grafana-mcp depends on may be stale or missing until this
              clears - silence here is the failure mode by design. Check
              `kubectl -n monitoring logs -l app.kubernetes.io/name=grafana-sa-provisioner --tail=50`;
              a 401 from admin auth in those logs means grafana-admin-secret has
              drifted from live Grafana state and needs a Grafana pod restart to
              clear (see kubernetes/apps/base/monitoring/grafana-sa-provisioner/README.md).
            summary: Grafana Viewer service account reconciler has been failing for over an hour.
          # Verified live against the running cluster (2026-08-26): an earlier
          # `... or vector(0)` version of this expression never cleared, even
          # with the CronJob succeeding every 5 minutes. `or` unions series by
          # label set rather than substituting only when the LHS is absent -
          # `vector(0)` has no labels at all, so it never matches the real
          # metric's label set and both series survive the union. `time() -
          # 0 > 3600` is then permanently true, so a second, phantom,
          # zero-label series stays in the result forever regardless of the
          # real metric. `absent()` doesn't have that problem: it special-cases
          # the equality matchers in its argument into the labels of its (single)
          # result series, and only produces a result at all when the metric is
          # truly absent - confirmed empty-vs-populated against live Prometheus.
          expr: |-
            absent(kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob="grafana-sa-provisioner"})
            or
            (time() - kube_cronjob_status_last_successful_time{namespace="monitoring", cronjob="grafana-sa-provisioner"} > 3600)
          for: 5m
          labels:
            severity: warning
