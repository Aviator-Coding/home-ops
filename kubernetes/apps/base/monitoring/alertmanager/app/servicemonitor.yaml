---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
# Alertmanager is standalone (app-template), so the chart creates no ServiceMonitor for it;
# without this every alertmanager_* series is absent. Skill observability.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: alertmanager
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
      app.kubernetes.io/instance: alertmanager
  endpoints:
    - port: http
      interval: 1m
      scrapeTimeout: 10s
      relabelings:
        # Load-bearing: the chart alertmanager.rules match job="kube-prometheus-stack-alertmanager".
        # The Service-name default scrapes fine and leaves them inert. The operator appends user
        # relabelings after its own job assignment, so this override wins.
        - action: replace
          targetLabel: job
          replacement: kube-prometheus-stack-alertmanager
