---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: pushover_api_token
      remoteRef:
        key: pushover
        property: PUSHOVER_ALERTMANAGER_TOKEN
    - secretKey: pushover_api_userkey
      remoteRef:
        key: pushover
        property: PUSHOVER_USER
    # External dead-man's switch (see config/alertmanager.yml's
    # healthchecks-io receiver). This 1Password item does not exist yet as
    # of 2026-09-15 - it is a captain-owned Healthchecks.io account, which
    # this repo cannot create. Until a "healthchecks-io" item with a
    # "PING_URL" property (the check's ping URL, e.g.
    # https://hc-ping.com/<uuid>, with the check's Period set to 5m and
    # Grace Time to at least 15m) is created in a Connect-visible vault
    # (Homelab/Automation/Services), this one remoteRef fails to resolve.
    #
    # This is deliberately safe rather than assumed safe: this target's
    # `deletionPolicy` is unset, which defaults to "Retain" (pinned
    # external-secrets v2.9.0, apis/externalsecrets/v1/externalsecret_types.go)
    # - "If a provider secret does not exist the ExternalSecret gets into the
    # SecretSyncedError status" and retains the existing Secret rather than
    # deleting or emptying it. Confirmed against that same version's
    # controller source: GetProviderSecretData returns an error for an
    # unresolvable spec.data[] entry under Retain, and the reconciler's
    # Reconcile() marks the condition and returns *before* any code path that
    # would touch the target Secret. So a missing "healthchecks-io" item
    # leaves pushover_api_token/pushover_api_userkey exactly as last synced;
    # Pushover delivery is unaffected either way. The resulting missing
    # `/etc/secrets/healthchecks_ping_url` file is itself non-fatal to
    # Alertmanager - see the healthchecks-io receiver comment.
    - secretKey: healthchecks_ping_url
      remoteRef:
        key: healthchecks-io
        property: PING_URL
