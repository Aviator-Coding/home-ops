---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: pushover_api_token
      remoteRef:
        key: pushover
        property: PUSHOVER_ALERTMANAGER_TOKEN
    - secretKey: pushover_api_userkey
      remoteRef:
        key: pushover
        property: PUSHOVER_USER
    # healthchecks-io / PING_URL. Period 5m, grace >= 15m. deletionPolicy
    # is unset (Retain): a missing item does not empty the Pushover keys.
    # A missing ping file fails only that receiver. Skill observability.
    - secretKey: healthchecks_ping_url
      remoteRef:
        key: healthchecks-io
        property: PING_URL
