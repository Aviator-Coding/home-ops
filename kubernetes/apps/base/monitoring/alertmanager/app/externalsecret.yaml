---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-secret
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: alertmanager-secret
    creationPolicy: Owner
  data:
    - secretKey: pushover_api_token
      remoteRef:
        key: pushover
        property: PUSHOVER_ALERTMANAGER_TOKEN
    - secretKey: pushover_api_userkey
      remoteRef:
        key: pushover
        property: PUSHOVER_USER
    # External dead-man's switch (see config/alertmanager.yml's
    # healthchecks-io receiver). This 1Password item does not exist yet as
    # of 2026-09-15 - it is a captain-owned Healthchecks.io account, which
    # this repo cannot create. Until a "healthchecks-io" item with a
    # "PING_URL" property (the check's ping URL, e.g.
    # https://hc-ping.com/<uuid>, with the check's Period set to 5m and
    # Grace Time to at least 15m) is created in a Connect-visible vault
    # (Homelab/Automation/Services), this one remoteRef fails to resolve and
    # the whole ExternalSecret reports SecretSyncedError - which leaves the
    # existing pushover_api_token/pushover_api_userkey keys on the
    # already-synced Secret untouched (ESO does not clear a target Secret on
    # a failed sync), so this does not affect Pushover delivery either way.
    - secretKey: healthchecks_ping_url
      remoteRef:
        key: healthchecks-io
        property: PING_URL
