---
# Severity-aware Pushover delivery.
#
# Before 2026-09-15 there was exactly one receiver and every firing alert was
# sent at Pushover priority 1, so an `info` CPU-throttle notice and a Ceph
# outage were indistinguishable on the phone. Measured over the 7 days to
# 2026-09-15: 591 Pushover notifications, 84/day, one every 17 minutes, with
# zero delivery failures and zero silences - i.e. the channel was saturated,
# not broken.
#
# Priority is a Pushover concept, not an Alertmanager one:
#   -2  no notification at all; the message only appears in the app's history
#   -1  notification shown, no sound or vibration
#    0  normal; respects the user's Pushover quiet hours
#    1  high; bypasses quiet hours, highlighted red
#    2  emergency; repeats every `retry` until acknowledged, or until `expire`
# `retry`/`expire` are always sent by the Alertmanager notifier and ignored by
# Pushover below priority 2. `ttl` auto-deletes a delivered message and is
# ignored for priority 2. All of priority/sound/retry/expire/ttl/html are
# supported by the pinned Alertmanager v0.34.0 (see the pushover notifier and
# config.PushoverConfig in that release); Alertmanager's own built-in default
# for `priority` is this same `2 when firing, 0 otherwise` template, so the
# critical receiver below is upstream's default applied selectively rather
# than a novel escalation.
#
# Resolved notifications are deliberately quieter than the firing ones: a
# resolution should be visible, never audible.
receivers:
  - name: "null"

  # severity: critical -> emergency. Sirens every 5 minutes for up to 30
  # minutes, or until the captain acknowledges it in the Pushover app. This is
  # the only class that may wake someone.
  #
  # `expire` is deliberately 30m rather than Alertmanager's 1h default, and the
  # critical route below repeats at 6h rather than 4h, because a critical CAN
  # sit true for days on this cluster: over the 30 days to 2026-09-15,
  # VolSyncSyncStalledR2 fired for 21,437 minutes (14.9 days),
  # KubeClientCertificateExpiration for 11,957 and ExternalDNSStale for 9,372.
  # None is firing now, and each is a real condition rather than a latch of the
  # KubeJobFailed kind, but at priority 2 a sustained critical costs 4
  # acknowledgement-required pages a day (6 siren repeats each) - so the
  # exposure is bounded here on purpose. If that still proves too much, the
  # single dial is `repeat_interval` on the critical route.
  - name: "pushover-critical"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: |-
          {{ if eq .Status "firing" }}2{{ else }}-1{{ end }}
        retry: 5m
        expire: 30m
        sound: siren
        url_title: View in Alert Manager
        title: &alert_title |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}
        message: &alert_message |-
          {{- range .Alerts }}
            {{- if ne .Labels.severity "" }}
              <b>Severity:</b> <i>{{ .Labels.severity }}</i>
            {{- else }}
              <b>Severity:</b> <i>N/A</i>
            {{- end }}
            {{- if ne .Annotations.description "" }}
              <b>Description:</b> <i>{{ .Annotations.description }}</i>
            {{- else if ne .Annotations.summary "" }}
              <b>Summary:</b> <i>{{ .Annotations.summary }}</i>
            {{- else if ne .Annotations.message "" }}
              <b>Message:</b> <i>{{ .Annotations.message }}</i>
            {{- else }}
              <b>Description:</b> <i>N/A</i>
            {{- end }}
            {{- if gt (len .Labels.SortedPairs) 0 }}
              <b>Details:</b>
              {{- range .Labels.SortedPairs }}
                • <b>{{ .Name }}:</b> <i>{{ .Value }}</i>
              {{- end }}
            {{- end }}
          {{- end }}

  # severity: warning (and anything with no severity label, via the root
  # route) -> normal priority. Audible, but honours Pushover quiet hours.
  - name: "pushover-warning"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: |-
          {{ if eq .Status "firing" }}0{{ else }}-1{{ end }}
        url_title: View in Alert Manager
        title: *alert_title
        message: *alert_message

  # severity: info | notify -> delivered silently. The alert still exists, is
  # still firing in Prometheus, and is still readable in the Alertmanager and
  # Pushover histories; it just never interrupts. `ttl` clears these from the
  # device after a day so they cannot pile up.
  - name: "pushover-low"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: "-2"
        ttl: 24h
        url_title: View in Alert Manager
        title: *alert_title
        message: *alert_message

  # External dead-man's switch (added 2026-09-15). Every Pushover receiver
  # above depends on Alertmanager itself being alive to send it, so a total
  # failure of Prometheus + Alertmanager together pages no one - the one
  # monitoring failure mode nothing inside this cluster can report. The
  # `Watchdog` route below (split out of the null route further down) sends
  # this receiver a webhook on every cycle Watchdog fires; Healthchecks.io
  # expects that ping on a fixed schedule and raises its own, independent
  # alert the moment the pings stop, which is exactly the case a live-inside
  # Pushover receiver cannot cover.
  #
  # The check itself is a captain-owned Healthchecks.io account, not
  # something this repo can create: see externalsecret.yaml's
  # healthchecks_ping_url entry for the exact 1Password item/property the
  # ping URL must be stored under, and the Watchdog route below for the
  # Period/Grace values the Healthchecks.io check must be configured with to
  # match this route's repeat_interval. `url_file` is read fresh on every
  # notification attempt (unlike `url`, which is fixed at config parse time),
  # so populating that 1Password property is a live-effect change with no
  # Alertmanager restart needed - confirmed against the pinned v0.34.0
  # webhook notifier source, which calls plain os.ReadFile(URLFile) inside
  # Notify() with no existence check at config load, so a not-yet-populated
  # secret makes only THIS receiver's sends fail (logged, retried on the next
  # cycle) rather than breaking config parsing or any other receiver.
  - name: "healthchecks-io"
    webhook_configs:
      - url_file: /etc/secrets/healthchecks_ping_url
        # Only a firing Watchdog is a heartbeat; a resolved one is not a
        # "still alive" signal worth an extra ping.
        send_resolved: false
        max_alerts: 1

route:
  # `namespace` replaces `job` so each notification is about one namespace,
  # which is what the reader needs first on a phone. Severity does not need to
  # be in the key: every alert matches exactly one severity route below, and
  # aggregation groups never span routes.
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  # Was 6h. Re-notification of a still-true alert is a large share of the
  # volume; warning-class repetition every 12h is enough to keep something
  # unresolved visible without retraining the captain to ignore the channel.
  repeat_interval: 12h
  # Fail loud: an alert carrying no severity label at all still pages.
  receiver: "pushover-warning"
  routes:
    # Structural, not a real condition. Exists only to be the source of the
    # inhibit rule below. Matched by name rather than by `severity: none` so
    # that a future rule which forgets its severity falls through to the
    # root receiver instead of being silently dropped.
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"

    # The dead-man's-switch heartbeat (see the healthchecks-io receiver
    # above). Both severity: none, so matched by name for the same
    # fail-loud reason as InfoInhibitor above.
    #
    # group_wait/group_interval/repeat_interval are set explicitly here
    # rather than left to inherit from the root route (which would currently
    # be 30s/5m/12h) because this cadence is a deliberate contract with an
    # external system: Healthchecks.io must be configured with Period 5m and
    # a Grace Time of at least 15m (3x the period, enough to absorb ordinary
    # notification jitter without false alarms) - a shorter grace than this
    # repeat_interval false-alarms on ordinary jitter, a much longer one
    # leaves a real failure undetected for hours before Healthchecks.io
    # itself pages. Watchdog is a single always-firing alert with no
    # siblings, so in practice group_interval never matters (nothing ever
    # joins the group) and every re-notification is paced by repeat_interval
    # alone; group_wait: 0s just means the very first ping after a config
    # reload goes out immediately rather than waiting 30s for no reason.
    - receiver: "healthchecks-io"
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m

    - receiver: "pushover-critical"
      matchers:
        - severity = critical
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h

    - receiver: "pushover-warning"
      matchers:
        - severity = warning
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

    # `notify` is a home-ops-local severity (coder's three rules) meaning
    # "an event worth recording", not "a problem".
    - receiver: "pushover-low"
      matchers:
        - severity =~ "info|notify"
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h

# The first two are the upstream kube-prometheus-stack defaults and were only
# half-present here: the `critical -> warning` rule existed but `equal` on
# both alertname AND namespace means it only triggers when the same alert name
# fires at two severities, which essentially never happens. They are kept
# because they are harmless and correct, not because they do much.
#
# The third is the one that matters. kube-prometheus-stack ships the
# `InfoInhibitor` alert *specifically* to be this rule's source - it fires for
# any namespace that has an `info` alert and no warning/critical - and without
# the rule that consumes it, every `info` alert paged. Measured over the 7 days
# to 2026-09-15: 11,639 of 11,677 info namespace-minutes (99.7%) had a
# co-firing InfoInhibitor and would have been inhibited here.
#
# This is inhibition, not silencing: nothing is muted at the source. An `info`
# alert accompanied by a real warning/critical in the same namespace is NOT
# inhibited (InfoInhibitor stops firing for that namespace), so context still
# reaches the phone when there is something to give context to.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|info"
    equal: ["alertname", "namespace"]
  - source_matchers:
      - severity = "warning"
    target_matchers:
      - severity = "info"
    equal: ["alertname", "namespace"]
  - source_matchers:
      - alertname = "InfoInhibitor"
    target_matchers:
      - severity = "info"
    equal: ["namespace"]
