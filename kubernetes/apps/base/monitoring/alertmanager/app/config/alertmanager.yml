---
# critical is Pushover priority 2, warning 0, info -2. retry/expire
# apply only at priority 2; ttl does not. Resolved notifications stay
# quieter than firing ones. Skill observability.
receivers:
  - name: "null"

  # severity: critical -> emergency. Sirens every 5 minutes for up to 30
  # minutes, or until the captain acknowledges it in the Pushover app. This is
  # the only class that may wake someone.
  #
  # `expire` is deliberately 30m rather than Alertmanager's 1h default, and the
  # critical route below repeats at 6h rather than 4h, because a critical CAN
  # sit true for days on this cluster: over the 30 days to 2026-09-15,
  # VolSyncSyncStalledR2 fired for 21,437 minutes (14.9 days),
  # KubeClientCertificateExpiration for 11,957 and ExternalDNSStale for 9,372.
  # None is firing now, and each is a real condition rather than a latch of the
  # KubeJobFailed kind, but at priority 2 a sustained critical costs 4
  # acknowledgement-required pages a day (6 siren repeats each) - so the
  # exposure is bounded here on purpose. If that still proves too much, the
  # single dial is `repeat_interval` on the critical route.
  - name: "pushover-critical"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: |-
          {{ if eq .Status "firing" }}2{{ else }}-1{{ end }}
        retry: 5m
        expire: 30m
        sound: siren
        url_title: View in Alert Manager
        title: &alert_title |-
          [{{ .Status | toUpper }}{{ if eq .Status "firing" }}:{{ .Alerts.Firing | len }}{{ end }}] {{ .CommonLabels.alertname }}{{ with .CommonLabels.namespace }} ({{ . }}){{ end }}
        message: &alert_message |-
          {{- range .Alerts }}
            {{- if ne .Labels.severity "" }}
              <b>Severity:</b> <i>{{ .Labels.severity }}</i>
            {{- else }}
              <b>Severity:</b> <i>N/A</i>
            {{- end }}
            {{- if ne .Annotations.description "" }}
              <b>Description:</b> <i>{{ .Annotations.description }}</i>
            {{- else if ne .Annotations.summary "" }}
              <b>Summary:</b> <i>{{ .Annotations.summary }}</i>
            {{- else if ne .Annotations.message "" }}
              <b>Message:</b> <i>{{ .Annotations.message }}</i>
            {{- else }}
              <b>Description:</b> <i>N/A</i>
            {{- end }}
            {{- if gt (len .Labels.SortedPairs) 0 }}
              <b>Details:</b>
              {{- range .Labels.SortedPairs }}
                • <b>{{ .Name }}:</b> <i>{{ .Value }}</i>
              {{- end }}
            {{- end }}
          {{- end }}

  # severity: warning (and anything with no severity label, via the root
  # route) -> normal priority. Audible, but honours Pushover quiet hours.
  - name: "pushover-warning"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: |-
          {{ if eq .Status "firing" }}0{{ else }}-1{{ end }}
        url_title: View in Alert Manager
        title: *alert_title
        message: *alert_message

  # severity: info | notify -> delivered silently. The alert still exists, is
  # still firing in Prometheus, and is still readable in the Alertmanager and
  # Pushover histories; it just never interrupts. `ttl` clears these from the
  # device after a day so they cannot pile up.
  - name: "pushover-low"
    pushover_configs:
      - html: true
        token_file: /etc/secrets/pushover_api_token
        user_key_file: /etc/secrets/pushover_api_userkey
        send_resolved: true
        priority: "-2"
        ttl: 24h
        url_title: View in Alert Manager
        title: *alert_title
        message: *alert_message

  # Watchdog heartbeat. url_file is read per send. A missing file fails
  # only this receiver; Alertmanager still starts and Pushover still routes.
  # Period 5m, grace >= 15m. Skill observability.
  - name: "healthchecks-io"
    webhook_configs:
      - url_file: /etc/secrets/healthchecks_ping_url
        # Only a firing Watchdog is a heartbeat; a resolved one is not a
        # "still alive" signal worth an extra ping.
        send_resolved: false
        max_alerts: 1

route:
  # `namespace` replaces `job` so each notification is about one namespace,
  # which is what the reader needs first on a phone. Severity does not need to
  # be in the key: every alert matches exactly one severity route below, and
  # aggregation groups never span routes.
  group_by: ["alertname", "namespace"]
  group_wait: 30s
  group_interval: 5m
  # Was 6h. Re-notification of a still-true alert is a large share of the
  # volume; warning-class repetition every 12h is enough to keep something
  # unresolved visible without retraining the captain to ignore the channel.
  repeat_interval: 12h
  # Fail loud: an alert carrying no severity label at all still pages.
  receiver: "pushover-warning"
  routes:
    # Structural, not a real condition. Exists only to be the source of the
    # inhibit rule below. Matched by name rather than by `severity: none` so
    # that a future rule which forgets its severity falls through to the
    # root receiver instead of being silently dropped.
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"

    # Watchdog is matched by name (severity none). repeat_interval 5m is
    # the Healthchecks.io period; grace >= 15m. Do not inherit the root
    # route's 12h repeat. Skill observability.
    - receiver: "healthchecks-io"
      matchers:
        - alertname = "Watchdog"
      group_wait: 0s
      group_interval: 5m
      repeat_interval: 5m

    - receiver: "pushover-critical"
      matchers:
        - severity = critical
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 6h

    - receiver: "pushover-warning"
      matchers:
        - severity = warning
      group_wait: 1m
      group_interval: 10m
      repeat_interval: 12h

    # `notify` is a home-ops-local severity (coder's three rules) meaning
    # "an event worth recording", not "a problem".
    - receiver: "pushover-low"
      matchers:
        - severity =~ "info|notify"
      group_wait: 5m
      group_interval: 30m
      repeat_interval: 24h

# InfoInhibitor suppresses info only while the namespace has no warning
# or critical. The same-alertname inhibit rules stay and almost never
# match. Skill observability.
inhibit_rules:
  - source_matchers:
      - severity = "critical"
    target_matchers:
      - severity =~ "warning|info"
    equal: ["alertname", "namespace"]
  - source_matchers:
      - severity = "warning"
    target_matchers:
      - severity = "info"
    equal: ["alertname", "namespace"]
  - source_matchers:
      - alertname = "InfoInhibitor"
    target_matchers:
      - severity = "info"
    equal: ["namespace"]
