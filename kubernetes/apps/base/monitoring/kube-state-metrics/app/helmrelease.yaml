---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-state-metrics
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: kube-state-metrics
  values:
    fullnameOverride: kube-state-metrics

    prometheus:
      monitor:
        enabled: true
        honorLabels: true

    # KSM's own health (list/watch errors, sharding) is a SEPARATE telemetry
    # port (8081) from the main kube_state_metrics.* endpoint (8080, port
    # name "http", already scraped above). Without this the container only
    # ever exposed 8080 via the Service, so KubeStateMetricsListErrors,
    # KubeStateMetricsWatchErrors, KubeStateMetricsShardingMismatch and
    # KubeStateMetricsShardsMissing were structurally dead - zero
    # kube_state_metrics_* families existed under any condition. This adds
    # the 8081 container port, exposes it on the Service, and adds a second
    # ServiceMonitor endpoint for it.
    selfMonitor:
      enabled: true
