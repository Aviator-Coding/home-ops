---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 30m
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: kube-prometheus-stack
  install:
    crds: Skip
  upgrade:
    crds: Skip
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    crds:
      enabled: false
    cleanPrometheusOperatorObjectNames: true

    ###
    ### Default rule overrides
    ###
    # A chart-shipped rule cannot be edited from Git, but `defaultRules.disabled`
    # (a per-alert-name map, present in this chart version's rule templates) can
    # switch one off so a home-ops replacement under ./alerts/ owns the name
    # instead. Each replacement keeps upstream's alert name, severity, `for` and
    # runbook_url, and changes exactly one thing; the rationale and the live
    # before/after measurement live in the replacement file itself.
    defaultRules:
      disabled:
        # Latched with no recency bound: fires for as long as the failed Job
        # object is retained, which was 13-44h on four dead Jobs. Replaced by
        # ./alerts/kubernetes-apps-recency.yaml.
        KubeJobFailed: true
        # Fires on containers of terminal (phase=Failed) pods, which are not
        # waiting for anything. Two 10-day-old UnexpectedAdmissionError zombies
        # were paging. Replaced by ./alerts/kubernetes-apps-recency.yaml.
        KubeContainerWaiting: true
        # rate()/increase() over [1m] with a 1m scrape interval returns no
        # series at all. Replaced by ./alerts/apiserver-aggregation.yaml.
        KubeAggregatedAPIErrors: true

      # PrometheusDuplicateTimestamps is the alert that correctly reported
      # ~5,000,000 silently discarded samples over 8 days (two episodes in 30
      # days) and was never acted on, because at the time every alert arrived at
      # the same urgency. Discarded samples degrade every alert computed over the
      # affected target, so this is a failure of the monitoring system itself,
      # not of one workload - critical, and now Pushover priority 2.
      additionalRuleAnnotations:
        PrometheusDuplicateTimestamps:
          # The counter is global and unlabelled, so the offending target can
          # only be named from Prometheus's own log - which is lost when the pod
          # is replaced. Promtail ships it to Loki, so read it there first.
          attribution: >-
            The dropped samples are attributable ONLY from Prometheus's own log,
            not from any metric label. Capture it before the pod is replaced:
            LogQL `{namespace="monitoring", pod=~"prometheus-.*"} |= "different
            value but same timestamp"` names the scrape_pool, the target URL and
            num_dropped per scrape. Last occurrence: rook-ceph-exporter on
            talos-2 (http://10.10.10.12:9926/metrics), 90 samples per 10s scrape
            = 540/min, from 2026-09-06 until it cleared at 2026-09-14T21:29Z.

    customRules:
      PrometheusDuplicateTimestamps:
        severity: critical

    ###
    ### Component values
    ###
    alertmanager:
      enabled: false

    kubeApiServer:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver|etcd|rest_client)_request(|_sli|_slo)_duration_seconds_bucket
          - action: drop
            sourceLabels: ["__name__"]
            regex: (apiserver_response_sizes_bucket|apiserver_watch_events_sizes_bucket)

    kubeControllerManager:
      enabled: false

    kubeEtcd:
      enabled: false

    kubelet:
      enabled: true
      serviceMonitor:
        metricRelabelings:
          # Drop high cardinality labels
          - action: labeldrop
            regex: (uid)
          - action: labeldrop
            regex: (id|name)
          - action: drop
            sourceLabels: ["__name__"]
            regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)

    kubeProxy:
      enabled: false

    kubeScheduler:
      enabled: false

    kubeStateMetrics:
      enabled: false

    # Re-enabled 2026-07-03: with the victoria-metrics stack disabled (see
    # monitoring/kustomization.yaml) NOTHING scraped node-level metrics — no
    # node_memory_* / node_pressure_* series existed, which is one reason the
    # 2026-06-30 OOMController cascade ran 2 days undetected. The alerts in
    # ./alerts/node-memory-pressure.yaml depend on these metrics.
    nodeExporter:
      enabled: true

    prometheus-node-exporter:
      prometheus:
        monitor:
          enabled: true
          relabelings:
            # Use the node name as the instance label (instead of pod IP:9100)
            # so alerts can target instance="talos-1" directly.
            - action: replace
              regex: (.+)
              replacement: $1
              sourceLabels: ["__meta_kubernetes_pod_node_name"]
              targetLabel: instance
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi

    grafana:
      enabled: false
      forceDeployDashboards: true
      sidecar:
        dashboards:
          annotations:
            grafana_folder: Kubernetes

    ###
    ### Prometheus operator values
    ###
    prometheusOperator:
      resources:
        requests:
          cpu: 35m
          memory: 273M
        limits:
          memory: 326M

      prometheusConfigReloader:
        # resource config for prometheusConfigReloader
        resources:
          requests:
            cpu: 5m
            memory: 32M
          limits:
            memory: 32M

    ###
    ### Prometheus instance values
    ###
    prometheus:
      prometheusSpec:
        alertingEndpoints:
          - namespace: monitoring
            name: alertmanager
            port: 9093
            apiVersion: v2
        enableAdminAPI: true
        enableFeatures:
          - auto-gomaxprocs
          - memory-snapshot-on-shutdown
          - new-service-discovery-manager
        podMonitorSelectorNilUsesHelmValues: false
        probeSelectorNilUsesHelmValues: false
        replicas: 1
        replicaExternalLabelName: "__replica__" # must match with thanos value `.query.replicaLabel[0]`
        resources:
          requests:
            cpu: 100m
            memory: 3Gi
          # 3Gi OOMKilled the pod during TSDB head compaction (self-reinforcing
          # crash loop). Node has ample headroom; 8Gi absorbs the compaction spike.
          limits:
            memory: 8Gi
        retention: 14d
        retentionSize: 50GB
        ruleSelectorNilUsesHelmValues: false
        scrapeConfigSelectorNilUsesHelmValues: false
        scrapeInterval: 1m # Must match interval in Grafana Helm chart
        serviceMonitorSelectorNilUsesHelmValues: false
        storageSpec:
          volumeClaimTemplate:
            metadata:
              name: storage-prometheus-db
            spec:
              storageClassName: ceph-block
              resources:
                requests:
                  storage: 55Gi
        walCompression: true

      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/icon: prometheus
            gethomepage.dev/name: Prometheus
            gethomepage.dev/group: Observability
            gethomepage.dev/app: prometheus
            gethomepage.dev/description: Monitoring Scrape Service
            gethomepage.dev/widget.type: prometheus
            gethomepage.dev/widget.url: http://kube-prometheus-stack-prometheus.monitoring:9090
          hostnames: ["{{ .Release.Name }}.${SECRET_DOMAIN}"]
          parentRefs:
            - name: envoy-internal
              namespace: network
              sectionName: https
