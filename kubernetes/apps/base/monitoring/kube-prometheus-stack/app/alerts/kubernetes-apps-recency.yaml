---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Recency replacements for KubeJobFailed and KubeContainerWaiting (the chart
# copies stay disabled). Names, severity, for, and runbook_url stay.
# Skill observability.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: kubernetes-apps-recency
spec:
  groups:
    - name: kubernetes-apps-recency
      rules:
        # Upstream: kube_job_failed > 0, for: 15m. The bound is `unless ... >= 43200`, not
        # `and ... < 43200`, so it FAILS OPEN if kube_job_status_start_time is ever missing.
        # 12h is ~6x the longest Job runtime seen (1.9h) and a 03:00 failure still fires at breakfast.
        - alert: KubeJobFailed
          annotations:
            description: >-
              Job {{ $labels.namespace }}/{{ $labels.job_name }} failed to
              complete within the last 12 hours. The failed Job object is
              retained by its CronJob's failedJobsHistoryLimit and this alert
              deliberately stops firing after 12 hours even though the object
              remains - `kubectl get jobs -A` still shows it.
            summary: Job failed to complete.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubejobfailed
          expr: |-
            kube_job_failed{job="kube-state-metrics"} > 0
              unless on (namespace, job_name)
            (time() - kube_job_status_start_time{job="kube-state-metrics"} >= 43200)
          for: 15m
          labels:
            severity: warning

        # Upstream: kube_pod_container_status_waiting_reason{reason!="CrashLoopBackOff"} > 0,
        # for: 1h. kube-state-metrics keeps a terminal pod's last waiting reason forever, so
        # those pods are excluded; a live pod stuck in ImagePullBackOff still fires. Terminal
        # Failed pods piling up need their own rule, not this one.
        - alert: KubeContainerWaiting
          annotations:
            description: >-
              pod/{{ $labels.pod }} in namespace {{ $labels.namespace }} on
              container {{ $labels.container }} has been in waiting state for
              longer than 1 hour. (reason: "{{ $labels.reason }}")
            summary: Pod container waiting longer than 1 hour
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubecontainerwaiting
          expr: |-
            kube_pod_container_status_waiting_reason{job="kube-state-metrics", reason!="CrashLoopBackOff"} > 0
              unless on (namespace, pod)
            (kube_pod_status_phase{job="kube-state-metrics", phase=~"Failed|Succeeded"} == 1)
          for: 1h
          labels:
            severity: warning
