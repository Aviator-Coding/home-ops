---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Replacement for kube-prometheus-stack's KubeAggregatedAPIErrors, switched off
# via `defaultRules.disabled` in ../helmrelease.yaml.
#
# Upstream uses increase(...[1m]). This Prometheus scrapes at 1m
# (prometheus.prometheusSpec.scrapeInterval), and rate()/increase() need two
# samples inside the window, so a [1m] window can never return a series -
# the rule was syntactically valid, listed as healthy, and structurally
# incapable of firing. Measured 2026-09-15:
#
#   increase(aggregator_unavailable_apiservice_total{job="apiserver"}[1m]) >= 0
#     -> 0 series
#   increase(aggregator_unavailable_apiservice_total{job="apiserver"}[5m]) >= 0
#     -> 4 series
#
# [5m] is used rather than the [3m] floor so the rule tolerates a missed scrape
# without collapsing back to two samples. Over the 24h to 2026-09-15 the [5m]
# value never exceeded 0, so widening the window adds no notification volume.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: apiserver-aggregation
spec:
  groups:
    - name: apiserver-aggregation
      rules:
        - alert: KubeAggregatedAPIErrors
          annotations:
            description: >-
              Kubernetes aggregated API {{ $labels.name }}/{{ $labels.namespace }}
              has reported {{ $value }} errors in the last 5 minutes.
            summary: Kubernetes aggregated API has reported errors.
            runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeaggregatedapierrors
          expr: |-
            sum by (cluster, instance, name, reason) (
              increase(aggregator_unavailable_apiservice_total{job="apiserver"}[5m])
            ) > 0
          for: 10m
          labels:
            severity: warning
