---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: promtail
  values:
    fullnameOverride: promtail

    # talos-3 carries a home-operations.com/dedicated taint (PreferNoSchedule, a score
    # penalty not a filter - .agents/skills/node-scheduling/references/talos-3-ledger.md).
    # Helm does not merge lists, so this block replaces the chart's default tolerations
    # (control-plane/master) wholesale; both defaults are restated alongside the new one.
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: home-operations.com/dedicated
        operator: Exists
        effect: PreferNoSchedule

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    config:
      clients:
        - url: http://loki-headless.monitoring.svc.cluster.local:3100/loki/api/v1/push
          tenant_id: ""
          batchwait: 1s
          batchsize: 1048576
          timeout: 10s
          backoff_config:
            min_period: 500ms
            max_period: 5m
            max_retries: 10

      snippets:
        # Tempo 3.0's backend-worker logs its idle "no jobs found" poll at error level every
        # backend_scheduler.job_timeout - grafana/tempo#7403 / #7666, open upstream, no log-level
        # knob short of the global server.log_level. Drop only this exact message so real
        # Tempo errors still ship to Loki.
        pipelineStages:
          - cri: {}
          - match:
              selector: '{namespace="monitoring", container="tempo"}'
              stages:
                - drop:
                    expression: 'msg="error calling scheduler" err="rpc error: code = NotFound desc = no jobs found"'
                    drop_counter_reason: tempo_idle_scheduler_noise
        extraRelabelConfigs:
          - source_labels: [__meta_kubernetes_pod_label_ceph_daemon_type]
            target_label: ceph_daemon_type
          - source_labels: [__meta_kubernetes_pod_label_ceph_daemon_id]
            target_label: ceph_daemon_id
          - source_labels: [__meta_kubernetes_namespace]
            regex: rook-ceph
            target_label: ceph_cluster_id
            replacement: rook-ceph
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: hostname
          - source_labels: [__meta_kubernetes_container_name]
            regex: "(mgr|mon|osd|mds|rgw)"
            target_label: log_type
            replacement: daemon

    serviceMonitor:
      enabled: true
