---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: promtail
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: promtail
  values:
    fullnameOverride: promtail

    # talos-3 carries a NoSchedule taint (talos/nodes/talos-3.yaml.j2). This
    # chart's own tolerations default (control-plane/master only) would
    # otherwise be REPLACED wholesale by this values block (Helm does not
    # merge lists), so both defaults are restated here alongside the new one.
    # See docs/talos-3-scheduling-truth.md.
    tolerations:
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: home-operations.com/dedicated
        operator: Exists
        effect: NoSchedule

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        memory: 256Mi

    config:
      clients:
        - url: http://loki-headless.monitoring.svc.cluster.local:3100/loki/api/v1/push
          tenant_id: ""
          batchwait: 1s
          batchsize: 1048576
          timeout: 10s
          backoff_config:
            min_period: 500ms
            max_period: 5m
            max_retries: 10

      snippets:
        # Tempo 3.0's backend-worker logs its idle "no jobs found" poll result
        # at error level every backend_scheduler.job_timeout (15s default) -
        # grafana/tempo#7403 / #7666, open upstream, no per-component log
        # level or config knob exists to suppress it at the source (checked
        # 2026-09-22: tempo's `server.log_level` is the only log level and is
        # global, and neither the backend_scheduler nor backend_worker config
        # blocks expose logging options). Drop only this exact message so
        # real Tempo errors still ship to Loki.
        pipelineStages:
          - cri: {}
          - match:
              selector: '{namespace="monitoring", container="tempo"}'
              stages:
                - drop:
                    expression: 'msg="error calling scheduler" err="rpc error: code = NotFound desc = no jobs found"'
                    drop_counter_reason: tempo_idle_scheduler_noise
        # Add relabel configs to properly label Ceph logs for dashboard compatibility
        extraRelabelConfigs:
          # Add ceph_daemon_type label for Ceph dashboard compatibility
          - source_labels: [__meta_kubernetes_pod_label_ceph_daemon_type]
            target_label: ceph_daemon_type
          # Add ceph_daemon_id label
          - source_labels: [__meta_kubernetes_pod_label_ceph_daemon_id]
            target_label: ceph_daemon_id
          # Add ceph_cluster_id label
          - source_labels: [__meta_kubernetes_namespace]
            regex: rook-ceph
            target_label: ceph_cluster_id
            replacement: rook-ceph
          # Add hostname label
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: hostname
          # Identify log type based on container
          - source_labels: [__meta_kubernetes_container_name]
            regex: "(mgr|mon|osd|mds|rgw)"
            target_label: log_type
            replacement: daemon

    serviceMonitor:
      enabled: true
