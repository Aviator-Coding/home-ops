---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
# PromtailRequestErrors needs [5m]: a rate over [1m] at a 1m scrape can never hold two
# samples and returns nothing. [5m] rather than the [3m] floor so one missed scrape
# cannot empty the window. Silence at the real `> 10` threshold means no errors, not
# no data. Skill observability.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: promtail
  labels:
    prometheus: kube-prometheus
spec:
  groups:
    - name: promtail
      rules:
        - alert: PromtailRequestErrors
          annotations:
            message: "Promtail {{ $labels.pod }} is experiencing {{ $value | humanizePercentage }} request errors."
          expr: |
            100 * sum(rate(promtail_request_duration_seconds_count{status_code=~"5..|failed"}[5m])) by (namespace, pod)
              /
            sum(rate(promtail_request_duration_seconds_count[5m])) by (namespace, pod)
              > 10
          for: 15m
          labels:
            severity: warning
        - alert: PromtailFileLagging
          annotations:
            message: "Promtail {{ $labels.pod }} has files lagging more than 1 hour."
          expr: |
            promtail_file_bytes_total - promtail_read_bytes_total > 1e9
          for: 15m
          labels:
            severity: warning
