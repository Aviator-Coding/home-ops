---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: loki-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: loki
  policyTypes:
    - Ingress
  ingress:
    # Allow log collectors and queriers (promtail, grafana, etc.)
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 3100
    # Allow Ceph dashboard to query logs
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: rook-ceph
      ports:
        - protocol: TCP
          port: 3100
    # Allow DNS replies from CoreDNS in kube-system. No ports restriction here
    # on purpose: NetworkPolicy `ports` matches the DESTINATION port on this
    # pod, and a DNS reply arrives on loki's ephemeral source port, never 53
    # - a port:53 restriction (as added in #1800) can never match a reply and
    # silently drops every DNS response. Reproduced live 2026-09-26: Cilium
    # recorded `drop (Policy denied) ... identity <coredns>-><loki>:
    # 10.43.0.10:53 -> <loki-ip>:<ephemeral> udp` for every query.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
