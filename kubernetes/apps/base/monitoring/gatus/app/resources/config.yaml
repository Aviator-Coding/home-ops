---
storage:
  type: sqlite
  path: /config/sqlite.db
  caching: true

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

endpoints:
  - name: Cloudflare
    group: connectivity
    url: icmp://1.1.1.1
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Google
    group: connectivity
    url: icmp://8.8.8.8
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  - name: Quad9
    group: connectivity
    url: icmp://9.9.9.9
    interval: 1m
    conditions:
      - "[CONNECTED] == true"

  # Radarr never surfaces a stuck queue item (e.g. importBlocked - "matched movie by ID,
  # Manual Import required") as a hard error anywhere but its own Activity/Queue tab. This
  # polls the same status Radarr's UI queue badge uses, so a stuck item becomes a
  # PrometheusRule alert (RadarrImportQueueBlocked) instead of silently accumulating.
  - name: Radarr Import Queue
    group: downloads
    url: http://radarr.downloads.svc.cluster.local:7878/api/v3/queue/status
    method: GET
    headers:
      X-Api-Key: "${RADARR_API_KEY}"
    interval: 15m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].warnings == false"
      - "[BODY].errors == false"

  # Gateway :8642, not the dashboard :9119. The dashboard SPA returns 200
  # for unknown paths, so this matches the gateway's own /health JSON.
  # Skill observability.
  - name: Hermes Gateway
    group: ai
    url: http://hermes.ai.svc.cluster.local:8642/health
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  # initialize, not /health: /health stays 200 while the handshake hangs.
  # 25s timeout, 5m interval. A fast embed failure can still return 200.
  # Skill observability.
  - name: ToolHive MCP Session
    group: ai
    url: ${MCP_GATEWAY_URL}
    method: POST
    headers:
      Authorization: "Bearer ${MCP_GATEWAY_TOKEN}"
      Content-Type: application/json
      Accept: application/json, text/event-stream
    body: |
      {"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"gatus","version":"1"}}}
    client:
      timeout: 25s
    interval: 5m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].result.serverInfo.name == mcp-gateway-internal"

  # In-cluster Service, matching a Home Assistant manifest.json body field.
  # Status-only on the HTTPRoute stays green through ext_authz, and
  # code-server also serves /manifest.json. Skill observability.
  - name: Home Assistant
    group: home-automation
    url: http://home-assistant.home-automation.svc.cluster.local:8123/manifest.json
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].related_applications[0].id == io.homeassistant.companion.android"

  # In-cluster health bodies, not the ext_authz route. The (in-cluster)
  # suffix avoids colliding with auto-discovered external/echo and
  # external/kromgo, which panics Gatus at startup. Skill observability.
  - name: Echo (in-cluster)
    group: external
    url: http://echo.network.svc.cluster.local/healthz
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY].path == /healthz"

  - name: Kromgo (in-cluster)
    group: external
    url: http://kromgo.monitoring.svc.cluster.local:8080/readyz
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"

  # Tdarr's web UI on :8265 is already probed and auto-discovered via the
  # HTTPRoute (group=internal). The node protocol is :8266, which answered
  # HTTP 302 to :8265 from inside the server pod. The UI can be healthy
  # while nothing is listening for nodes. tcp connected is that signal.
  # group=media so GatusServiceDown (warning) covers it, and it does not
  # join the critical external group.
  - name: Tdarr Server
    group: media
    url: tcp://tdarr.media.svc.cluster.local:8266
    interval: 1m
    ui:
      hide-url: true
    conditions:
      - "[CONNECTED] == true"

metrics: true

ui:
  title: Status | Gatus
  header: Status
  # logo: https://avatars.githubusercontent.com/u/213795
  link: https://github.com/Aviator-Coding
  buttons:
    - name: Github
      link: https://github.com/Aviator-Coding
    - name: Homelab
      link: https://github.com/Aviator-Coding/home-ops

web:
  port: ${WEB_PORT}
