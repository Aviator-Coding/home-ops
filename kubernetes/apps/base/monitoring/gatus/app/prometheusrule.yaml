---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gatus-rules
spec:
  groups:
    - name: gatus.rules
      rules:
        - alert: GatusEndpointDown
          expr: |
            gatus_results_endpoint_success{group="external"} == 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint is down
          labels:
            severity: critical

        # Broadens paging beyond group=external (captain decision, 2026-09-12):
        # 60 endpoints were watched and only the 3 group=external ones above
        # could page anyone - group=internal (32 endpoints) and every other
        # app group had no alert path at all. downloads/readarr was fully down
        # over 10h and only noticed via a manual scan.
        #
        # `connectivity` (Cloudflare/Google/Quad9 ICMP reachability) is
        # excluded on purpose: those measure the household's own WAN, not an
        # application, and are not what this alert is for.
        #
        # `name!~` excludes an endpoint confirmed red live (2026-09-12,
        # after the fsGroup fix restored real monitoring - not a number
        # carried over from the outage) for reasons that are not a Gatus
        # check problem, so excluded rather than paged on from day one:
        #   - Radarr Import Queue: this synthetic endpoint (group=downloads)
        #     already has its own dedicated RadarrImportQueueBlocked alert
        #     below for the same signal (a stuck import, not a down
        #     service). Without this exclusion, a stuck import would also
        #     trip this generic alert 20m earlier with a misleading
        #     "endpoint is down" summary when Radarr answered 200.
        # Remove an entry once its underlying issue is actually resolved
        # live, not before - re-check with the live Gatus API, not git.
        #
        # `for: 10m` (vs. 5m above) because these ~50-plus endpoints have
        # never paged before: give a newly-onboarded, possibly-flaky check
        # more room before waking anyone, so the very first pages people see
        # are worth trusting.
        # `name!~` also excludes "Hermes Gateway": it has its own dedicated,
        # faster, critical HermesGatewayDown alert below (same reasoning as
        # the Radarr exclusion just below - a second, slower, lower-severity
        # "endpoint is down" page for the identical condition is noise, not
        # signal).
        - alert: GatusServiceDown
          expr: |
            gatus_results_endpoint_success{group!~"external|connectivity", name!~"Radarr Import Queue|Hermes Gateway"} == 0
          for: 10m
          annotations:
            summary: >-
              The {{ $labels.name }} endpoint ({{ $labels.group }}) is down
          labels:
            severity: warning

        - alert: RadarrImportQueueBlocked
          expr: |
            gatus_results_endpoint_success{name="Radarr Import Queue"} == 0
          for: 30m
          annotations:
            summary: >-
              Radarr's queue has an item stuck (importBlocked or another warning/error) -
              open Activity > Queue in Radarr and Manual Import it
          labels:
            severity: warning

        # Catches a dead/wedged Hermes gateway (Telegram, Discord, cron +
        # the OpenAI-compatible API on :8642) independently of the
        # dashboard on :9119, which stays healthy through this exact
        # failure - see the "Hermes Gateway" endpoint definition in
        # monitoring/gatus's config.yaml for the live-measured proof this
        # check is not the auth-gated-redirect trap.
        #
        # `for: 10m`, not the 5m used for the group=external checks above:
        # this is a single-replica, `strategy: Recreate` deployment
        # (kubernetes/apps/base/ai/hermes/app/helmrelease.yaml) that goes
        # through a real, expected outage window on every restart (config
        # change via reloader, node reschedule, upgrade) while the gateway
        # re-initialises - the dashboard's own startupProbe alone already
        # tolerates up to 5 minutes (failureThreshold: 30 * periodSeconds:
        # 10s) before it is even considered started, and the gateway's own
        # boot has been observed taking meaningfully longer than that.
        # 10m gives that normal-restart headroom while still detecting the
        # real failure mode (a 5.5-hour outage) roughly 33x faster than it
        # was actually caught.
        #
        # kube_pod_container_status_restarts_total cannot substitute for
        # this: measured live against the 2026-09-14 outage, the CONTAINER
        # never restarted while the gateway was down - the counter sat
        # flat at 0 from before the gateway died (21:29:58Z) through at
        # least 21:30Z, and only incremented to 1 later (23:18:08Z, an
        # unrelated container exit) after the gateway had already been
        # dead for over 90 minutes. A restart-count-based rule would have
        # stayed silent for the entire outage.
        - alert: HermesGatewayDown
          expr: |
            gatus_results_endpoint_success{name="Hermes Gateway"} == 0
          for: 10m
          annotations:
            summary: >-
              Hermes' gateway (Telegram/Discord/cron + the :8642 API) is down -
              the dashboard can stay green through this failure, so check the
              gateway specifically (kubectl -n ai exec deploy/hermes -c app --
              hermes gateway status)
          labels:
            severity: critical
