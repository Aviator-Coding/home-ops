---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-secret
    creationPolicy: Owner
    template:
      data:
        # Read-only Radarr API access for the "Radarr Import Queue" check (../resources/config.yaml).
        # Same 1Password item as Radarr's own ExternalSecret.
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        # "ToolHive MCP Session" check: the LAN route and its bearer token (1Password item mcp-gateway).
        MCP_GATEWAY_TOKEN: "{{ .MCP_GATEWAY_TOKEN }}"
        MCP_GATEWAY_URL: "https://mcp.${SECRET_DOMAIN}/mcp"
  dataFrom:
    - extract:
        key: radarr
    - extract:
        key: mcp-gateway
