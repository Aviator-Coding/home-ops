---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: gatus
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: gatus-secret
    creationPolicy: Owner
    template:
      data:
        # Read-only Radarr API access for the "Radarr Import Queue" endpoint check
        # (../resources/config.yaml). Same 1Password item Radarr's own ExternalSecret
        # uses, no new 1Password field required.
        RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
  dataFrom:
    - extract:
        key: radarr
