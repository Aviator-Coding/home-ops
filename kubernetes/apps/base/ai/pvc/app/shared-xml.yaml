---
# Mac-authoritative XML corpus. ceph-filesystem-rwx. Unbacked on purpose.
# See skill hermes-agent references/shared-storage.md.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shared-xml
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: ceph-filesystem-rwx
