---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
#
# Separate HelmRelease: a change here must not Recreate the chat server.
# TEI XPU failed on this Battlemage card. Do not append <|endoftext|>. Cosine vs the CPU
# endpoint is not the NaN probe. See skill b70-llm-serving references/embeddings.md.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app embedding-gpu
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      embedding-gpu:
        replicas: 1
        # Recreate: devic.es/b70 is a share token, so two copies both load weights.
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 30
          # Lowest priority, never preempts. See priorityclass.yaml and skill node-scheduling.
          priorityClassName: embedding-gpu-low
          # talos-3 PreferNoSchedule: this pod can only land there, so it tolerates the penalty.
          # See skill node-scheduling.
          tolerations:
            - key: home-operations.com/dedicated
              operator: Exists
              effect: PreferNoSchedule
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # Same tag as ai/vllm. Re-measure both workloads before the next bump.
              tag: server-intel-b10820
            args:
              - -hf
              - Qwen/Qwen3-Embedding-0.6B-GGUF:f16
              - --embedding
              # Last-token pooling. Mean pooling is a different vector space.
              - --pooling
              - last
              - --host
              - "0.0.0.0"
              - --port
              - "8080"
              - -ngl
              - "99"
              # Must pin 2. There is a 56 MiB F16 KV pool; the 0.00 MiB line is only the reserve pass.
              # The chat "do not pin --parallel" rule does not transfer. See skill b70-llm-serving references/embeddings.md.
              - --parallel
              - "2"
              # Required with --parallel. Without it n_ctx_slot halves to 256.
              # See skill b70-llm-serving references/embeddings.md.
              - --kv-unified
              # 0. The embedding cache is write-only, and absence restores the silent 8192 MiB default.
              # A memory limit cannot stop that. Do not copy chat's 4096. See skill b70-llm-serving references/memory.md.
              - --cache-ram
              - "0"
              # One triple. 512 leaves room for a chat restart; 2048 fits but spends that margin.
              # See skill b70-llm-serving references/embeddings.md.
              - --ctx-size
              - "512"
              - -b
              - "512"
              - -ub
              - "512"
              # --timeout 30 replaces the image default of 3600 but is only a socket timeout: it does not
              # bound a queued request (live: 28-31 s, all 200). Load is capped at LiteLLM on the embedding-local
              # model. See skill b70-llm-serving references/contention.md.
              - --no-cont-batching
              - --timeout
              - "30"
            env:
              LLAMA_CACHE: /models
              # /dev/dri/card0 here is the B70; /sys/class/drm/card0 is the iGPU. Use PCI 0000:03:00.0.
              # See skill intel-gpu references/devices.md.
              ONEAPI_DEVICE_SELECTOR: level_zero:0
              ZES_ENABLE_SYSMAN: "1"
              UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
            resources:
              requests:
                cpu: 250m
                # 1024Mi on purpose: this pod is evicted before chat. Do not raise it without
                # redoing the talos-3 arithmetic. See skill node-scheduling.
                memory: 1024Mi
                devic.es/b70: 1
              limits:
                cpu: "2"
                # Headroom, not a bound. --cache-ram 0 is what stops the OOM.
                # See skill b70-llm-serving references/memory.md.
                memory: 4Gi
                devic.es/b70: 1
            probes:
              # /health cannot see NaN. Startup only. Readiness and liveness assert finite values.
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: { path: /health, port: 8080 }
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 40
              # nlohmann renders NaN as bare null, so grep -q null is the detector. No $ in this
              # script: Flux envsubst eats it. Gate: scripts/ci/embedding-values-test.py.
              # See skill b70-llm-serving references/embeddings.md.
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - |
                        curl -sf --max-time 10 -X POST http://127.0.0.1:8080/v1/embeddings -H 'Content-Type: application/json' -d '{"model":"probe","input":"embedding health probe"}' -o /tmp/probe-readiness.json || exit 1
                        grep -q 'null' /tmp/probe-readiness.json && exit 1
                        grep -qE '"embedding"[[:space:]]*:[[:space:]]*\[[^]]*[1-9]' /tmp/probe-readiness.json
                  periodSeconds: 30
                  timeoutSeconds: 15
                  failureThreshold: 5
              liveness:
                <<: *probe
                spec:
                  exec:
                    command:
                      - sh
                      - -c
                      - |
                        curl -sf --max-time 10 -X POST http://127.0.0.1:8080/v1/embeddings -H 'Content-Type: application/json' -d '{"model":"probe","input":"embedding health probe"}' -o /tmp/probe-liveness.json || exit 1
                        grep -q 'null' /tmp/probe-liveness.json && exit 1
                        grep -qE '"embedding"[[:space:]]*:[[:space:]]*\[[^]]*[1-9]' /tmp/probe-liveness.json
                  periodSeconds: 60
                  timeoutSeconds: 15
                  failureThreshold: 10

    service:
      app:
        controller: embedding-gpu
        ports:
          http:
            port: 8080

    persistence:
      # Re-downloadable GGUF. Not backed up. Without the claim every start re-fetches it.
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 5Gi
        advancedMounts:
          embedding-gpu:
            app:
              - path: /models
