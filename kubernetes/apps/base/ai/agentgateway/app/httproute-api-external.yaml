---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# External (and internal) OpenAI-compatible API endpoint for the model
# gateway. Envoy terminates TLS for llm-api.* and forwards to the
# agentgateway `public` data-plane Service on its HTTP listener, where the
# API-key policy (apikey-policy.yaml) enforces per-consumer bearer keys.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: agentgateway-api
  annotations:
    # ONE target only. The unifi webhook provider keeps just the first target
    # of a CNAME and logs "Ignoring additional CNAME targets" once a minute,
    # forever - with both listed it dropped `internal.${SECRET_DOMAIN}` on
    # every sync (measured 2026-09-06: 10 warnings in 10 minutes) and the LAN
    # record settled on `external.${SECRET_DOMAIN}` anyway. This states what
    # actually happens and stops the warning stream from masking a real
    # external-dns problem. The public record is unaffected: cloudflare-dns
    # runs with --gateway-name=envoy-external and already resolved this name
    # to the external target.
    external-dns.alpha.kubernetes.io/target: "external.${SECRET_DOMAIN}"
    gatus.home-operations.com/endpoint: |-
      conditions: ["[STATUS] == 401"]
      url: "https://llm-api.${SECRET_DOMAIN}/v1/models"
spec:
  hostnames:
    - "llm-api.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
    - name: envoy-external
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: public
          namespace: ai
          port: 80
