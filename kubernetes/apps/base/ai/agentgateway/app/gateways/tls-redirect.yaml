apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tls-redirect
  annotations:
    # No hostname, so gateway-httproute would publish the wildcard. The live LAN wildcard
    # is a hand-made UniFi record. See skill networking.
    external-dns.alpha.kubernetes.io/controller: none
spec:
  # `internal` has no http listener any more (see internal.yaml) - a parentRef
  # to it would sit permanently unresolved.
  parentRefs:
    - name: internal-noauth
      sectionName: http
    - name: public
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
