apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
spec:
  # Pin the LB IP Cilium originally auto-allocated, so the Service keeps it
  # across recreation.
  infrastructure:
    annotations:
      lbipam.cilium.io/ips: 10.50.0.27
  gatewayClassName: agentgateway
  # No http listener. Most-specific-wins would serve /v1 in cleartext with cluster credentials.
  # Do not try to outrank that with tls-redirect. See skill agentgateway references/gateways-auth.md.
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: sklab-dev-production-tls
