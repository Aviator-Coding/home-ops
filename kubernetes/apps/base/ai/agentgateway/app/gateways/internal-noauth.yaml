apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal-noauth
spec:
  # ClusterIP. This listener is keyless, so a LoadBalancer exposes paid backends to the LAN.
  # The type is a strategic-merge on AgentgatewayParameters. See skill agentgateway references/gateways-auth.md.
  infrastructure:
    parametersRef:
      group: agentgateway.dev
      kind: AgentgatewayParameters
      name: internal-noauth-params
  gatewayClassName: agentgateway
  listeners:
    - name: http
      port: 80
      protocol: HTTP
    - name: https
      protocol: HTTPS
      port: 443
      hostname: "*.${SECRET_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            group: ""
            name: sklab-dev-production-tls
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/agentgateway.dev/agentgatewayparameters_v1alpha1.json
# Gateway-level overlay for `internal-noauth` only, referenced from that
# Gateway's spec.infrastructure.parametersRef above. Gateway-level parameters
# MERGE with the GatewayClass-level ones (../agentgatewayparameters.yaml,
# which supplies ADMIN_ADDR) rather than replacing them - the chart applies
# GatewayClass typed fields, then Gateway typed fields, then the overlays in
# the same order.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayParameters
metadata:
  name: internal-noauth-params
spec:
  service:
    spec:
      type: ClusterIP
