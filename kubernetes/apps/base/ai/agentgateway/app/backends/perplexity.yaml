---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: perplexity-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: perplexity-secret
    template:
      data:
        Authorization: "{{ .PERPLEXITY_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# Perplexity AgentgatewayBackend (OpenAI-compatible; provider.path pins the
# upstream path). Reached ONLY via the unified /v1 router
# (../httproute-unified.yaml) by model name (sonar*). No per-provider path
# route exists anymore.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: perplexity
spec:
  ai:
    provider:
      openai: {}
      host: api.perplexity.ai
      port: 443
      path: /chat/completions
  policies:
    tls: {}
    auth:
      secretRef:
        name: perplexity-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
