---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: togetherai-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: togetherai-secret
    template:
      data:
        Authorization: "{{ .TOGETHERAI_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# togetherai AgentgatewayBackend (OpenAI-compatible). DORMANT: no model in
# use, so the unified /v1 router (../httproute-unified.yaml) has no rule for
# it — re-enabling is one routing rule there. Backend + secret kept so the
# credential path stays wired.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: togetherai
spec:
  ai:
    provider:
      openai: {}
      host: api.together.xyz
      port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: togetherai-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
