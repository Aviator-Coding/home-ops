---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencodego-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opencodego-secret
    template:
      data:
        Authorization: "{{ .OPENCODE_GO_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# OpenCode Go AgentgatewayBackend (OpenAI-compatible, flat $10/mo sub, serves
# under /zen/go). Reached ONLY via the unified /v1 router
# (../httproute-unified.yaml) by bare Go model ids (kimi-*/glm-*/minimax-*/
# mimo-*/hy3-*/deepseek-v4-*/qwen3.x-max|plus — the unified rule prepends
# /zen/go). Also the failover leg of llm-chat-failover (backends/vllm.yaml).
# No per-provider path route exists anymore.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: opencodego
spec:
  ai:
    provider:
      openai: {}
      host: opencode.ai
      port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: opencodego-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
