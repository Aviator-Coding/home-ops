---
# Local embedder, reached directly, not through LiteLLM. Not vllm-embed (replicas 0, different model).
# This shares the B70 with chat. Throttle by request rate. See skill b70-llm-serving references/contention.md
# and skill agentgateway references/routing-backends.md.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: embedding-local
spec:
  ai:
    provider:
      openai: {}
      host: embedding-gpu.ai.svc.cluster.local
      port: 8080

  policies:
    ai:
      routes:
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
