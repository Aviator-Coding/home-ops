---
# Copies the body model into x-model before routing, only for /v1/chat/completions and /v1/embeddings.
# No fallback entry: other paths must not be body-parsed. See skill agentgateway references/routing-backends.md.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: model-routing
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal-noauth
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: internal
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: public
  traffic:
    phase: PreRouting
    transformation:
      conditional:
        - condition: request.path.startsWith("/v1/chat/completions") || request.path.startsWith("/v1/embeddings")
          policy:
            request:
              set:
                # coalesce swallows a malformed/empty body → empty x-model (which
                # then falls through to the unified route's default rule) rather
                # than erroring the request.
                - name: x-model
                  value: 'coalesce(json(request.body).model, "")'
