---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sklab-dev-production-tls
spec:
  # NO refreshPolicy here. This is a LIVE serving certificate for the three
  # `ai` data-plane Gateways, not a bootstrap seed: `CreatedOnce` syncs once
  # at creation and never again, so the copy silently froze on 2026-06-07 and
  # the gateways served a certificate that expired 2026-07-15 for 53 days
  # while this object still reported Ready=True / "secret synced". The
  # default (refreshInterval-driven) policy is what keeps it current as
  # cert-manager renews `network/sklab-dev-production-tls` and
  # PushSecret `network/sklab-dev-tls` re-uploads it to 1Password.
  # The `CreatedOnce` in ../../../network/certificates/import/externalsecret.yaml
  # is a deliberate bootstrap seed and is correct there - do not copy it here.
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: sklab-dev-production-tls
    creationPolicy: Orphan
    template:
      type: kubernetes.io/tls
      metadata:
        annotations:
          cert-manager.io/alt-names: "*.${SECRET_DOMAIN},${SECRET_DOMAIN}"
          cert-manager.io/certificate-name: sklab-dev
          cert-manager.io/common-name: "${SECRET_DOMAIN}"
          cert-manager.io/ip-sans: ""
          cert-manager.io/issuer-group: ""
          cert-manager.io/issuer-kind: ClusterIssuer
          cert-manager.io/issuer-name: letsencrypt-production
          cert-manager.io/uri-sans: ""
        labels:
          controller.cert-manager.io/fao: "true"
  dataFrom:
    - extract:
        key: sklab-dev-tls
        decodingStrategy: Base64
