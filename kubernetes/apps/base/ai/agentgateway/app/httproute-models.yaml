---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# GET /v1/models on the unified endpoint. agentgateway does not aggregate
# /v1/models across backends, so the `models-catalog` policy below serves a
# static OpenAI-format catalog of every model id routable through
# httproute-unified.yaml. The vllm backendRef is only the fallback if the
# policy is ever removed (then you get just the local llama.cpp list back).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-models
spec:
  parentRefs:
    - name: internal-noauth
    - name: internal
    - name: public
  rules:
    - matches:
        - path:
            type: Exact
            value: /v1/models
      backendRefs:
        - name: vllm
          group: agentgateway.dev
          kind: AgentgatewayBackend
---
# >>> MODEL CATALOG - maintain me alongside rules/cost.yaml! <<<
# One entry per in-use model id (owned_by = the backend the unified router
# sends it to — informational only). Adding a model = a routing rule in
# httproute-unified.yaml (if its family is new) + a price row in
# rules/cost.yaml + an entry here.
# `body` is capped at 4096 chars — if the catalog outgrows it, switch to
# `bodyExpression` (16384 chars, CEL string literal).
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: models-catalog
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: llm-models
  traffic:
    directResponse:
      status: 200
      headers:
        # value is a CEL expression -> quoted string literal
        - name: content-type
          value: '"application/json"'
      body: >-
        {"object":"list","data":[
