---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: agentgateway-crds
spec:
  interval: 5m
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: v1.4.1
  # ghcr mirror of the same chart (identical digest to cr.agentgateway.dev).
  # CI flate reconcile hit Cloudflare 522s on cr.agentgateway.dev HEAD checks
  # (2026-08-31, PR #1527 Diff-ks); GHCR is the durable public pull path.
  url: oci://ghcr.io/agentgateway/charts/agentgateway-crds
