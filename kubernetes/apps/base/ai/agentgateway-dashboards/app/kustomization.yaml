---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Re-vendor from the chart on a bump, then restore the local edits: expanded LLM/Latency
# rows, no MCP row, the LLM Cost link, and group by (not sum by) on agentgateway_build_info.
# See skill agentgateway references/observability.md.
configMapGenerator:
  - name: agentgateway-dashboard
    files:
      - agentgateway.json
  - name: llm-cost-dashboard
    files:
      - llm-cost.json
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    grafana_folder: AI/ML
  labels:
    grafana_dashboard: "true"
