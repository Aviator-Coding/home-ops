---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Sum by (namespace, persistentvolumeclaim). A per-node series resets predict_linear on reschedule.
# Compare to the live capacity, not a hardcoded size. See skill hermes-agent references/state-db.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: hermes-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: hermes.rules
      rules:
        - alert: HermesStateVolumeApproachingCapacity
          annotations:
            summary: hermes's /opt/data volume is on track to fill up within 2 weeks
            description: >-
              The hermes PVC (state.db, sessions, memories) is projected to
              reach capacity within ~14 days at its current growth rate
              (projected to {{ $value | humanize1024 }}B of the 40Gi
              claim). Investigate state.db growth/retention or grow the
              claim before it actually fills - a full RWO volume stops
              Hermes' single writer cold.
          expr: |
            predict_linear(sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="ai", persistentvolumeclaim="hermes"})[24h:5m], 14*86400)
              > on (namespace, persistentvolumeclaim)
            sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="ai", persistentvolumeclaim="hermes"})
          for: 1h
          labels:
            severity: warning

        - alert: HermesStateVolumeCriticalCapacity
          annotations:
            summary: hermes's /opt/data volume will fill up within days
            description: >-
              The hermes PVC is projected to reach capacity within ~3 days
              at its current growth rate (projected to {{ $value |
              humanize1024 }}B of the 40Gi claim). Act now - grow the
              claim or clear space - not after Hermes' single writer starts
              failing.
          expr: |
            predict_linear(sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="ai", persistentvolumeclaim="hermes"})[24h:5m], 3*86400)
              > on (namespace, persistentvolumeclaim)
            sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="ai", persistentvolumeclaim="hermes"})
          for: 30m
          labels:
            severity: critical

        # Trend-independent backstop (same two-layer shape as
        # ai/vllm's VLLMMemoryCriticalLimit): if growth suddenly accelerates
        # far past the ~237MB/day baseline the two rules above are sized
        # for, this still catches an already-dangerously-full volume on its
        # own static ratio, regardless of trend.
        - alert: HermesStateVolumeNearlyFull
          annotations:
            summary: hermes's /opt/data volume is nearly full
            description: >-
              The hermes PVC is at {{ $value | humanizePercentage }} of its
              40Gi capacity. Hermes has a single RWO writer - a full volume
              stops it cold, not just degrades it.
          expr: |
            sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_used_bytes{namespace="ai", persistentvolumeclaim="hermes"})
              / on (namespace, persistentvolumeclaim)
            sum by (namespace, persistentvolumeclaim) (kubelet_volume_stats_capacity_bytes{namespace="ai", persistentvolumeclaim="hermes"})
              > 0.95
          for: 15m
          labels:
            severity: critical
