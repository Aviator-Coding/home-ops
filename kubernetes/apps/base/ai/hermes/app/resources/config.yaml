# Hermes runtime config - GitOps source of truth.
#
# The `copy-config` initContainer (helmrelease.yaml) copies this to
# /opt/data/config.yaml on EVERY pod start (overwriting any in-pod edits), and
# reloader restarts the pod when this ConfigMap changes. Change models/providers
# HERE, in Git, NOT via `hermes model` / `hermes config edit`.
_config_version: 46

providers:
  # The one LLM provider: LiteLLM, on Hermes' own virtual key (`hermes`, 1Password
  # `litellm-consumer-hermes`) so spend and traffic are attributable to it alone.
  # key_env is the real key: a dummy (`no-auth`, empty) is not sent and LiteLLM 401s. The env
  # name is not OPENAI_API_KEY / GH_TOKEN / LITELLM_API_KEY: Hermes scrubs built-in names.
  #
  # Never name a custom provider after a built-in id (`openrouter`, `openai`, ...): the
  # auxiliary-client resolver then routes into the native integration and skips this base_url.
  #
  # session_affinity_header: OpenCode Go (the go-* models) answers HTTP 400 MissingSessionID
  # without x-opencode-session and wants one stable value per conversation. Hermes sends it
  # on main AND auxiliary calls; LiteLLM forwards it for the go-* groups only
  # (litellmproxy.yaml model_group_settings) and other models ignore it.
  #
  # discover_models stays off so embedding-local and other keys' models stay unlisted.
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    name: LiteLLM
    key_env: LITELLM_HERMES_API_KEY
    transport: chat_completions
    session_affinity_header: x-opencode-session
    discover_models: false
    models:
      chat-local:
        context_length: 262144
      go-deepseek-v4-flash:
        context_length: 128000
      go-glm-5.1:
        context_length: 200000
      go-kimi-k2.6:
        context_length: 200000
      claude-fable-5:
        context_length: 200000
      claude-fable-5-1-metered:
        context_length: 200000
      claude-haiku-4-5-20251001-metered:
        context_length: 200000
      claude-haiku-5-5:
        context_length: 200000
      claude-opus-4-5-20251101:
        context_length: 200000
      claude-opus-4-6:
        context_length: 200000
      claude-opus-4-7:
        context_length: 200000
      claude-opus-4-8:
        context_length: 200000
      claude-opus-5-5:
        context_length: 200000
      claude-opus-5-metered:
        context_length: 1000000
      claude-sonnet-4-5-20250929:
        context_length: 200000
      claude-sonnet-4-6:
        context_length: 200000
      claude-sonnet-5-5:
        context_length: 200000
      claude-sonnet-5-metered:
        context_length: 1000000
      gpt-5.6-luna:
        context_length: 272000
      gpt-5.6-sol:
        context_length: 272000
      gpt-5.6-terra:
        context_length: 272000
      gpt-6-astra:
        context_length: 272000
      gpt-6-astra-pro:
        context_length: 272000
      gpt-oss-20b:
        context_length: 131072

# Default serving model: the local chat role alias `chat-local` (the model loaded on the B70,
# llama.cpp SYCL). Never put the loaded model's name here: it lives once, in ConfigMap
# chat-model, so a swap does not touch Hermes. List /v1/models to see it (`root`).
# llama-server auto-selects n_parallel=4 + kv_unified=true (do not pin those
# flags); fan-out above 4 queues. `chat-local` is a terminal alias in LiteLLM (no cloud
# fallback, by design), so the failover when the B70 is down is `fallback_providers` below.
# To serve a cloud model instead, set e.g.
# model: { default: claude-sonnet-5-5, provider: custom:litellm }.
model:
  default: chat-local
  provider: custom:litellm

# Fail-over chain for the MAIN agentic loop (fires when the local model errors): kimi-k2.6,
# then glm-5.1 (both the flat-rate OpenCode Go sub), then claude-haiku-5-5 (metered, deliberately
# NOT on the Go sub: this tier exists for Go-quota exhaustion, and it spends the hermes key's
# own $50/30d). This chain runs the full tool-calling loop, unlike the aux chores below.
fallback_providers:
  - provider: custom:litellm
    model: go-kimi-k2.6
  - provider: custom:litellm
    model: go-glm-5.1
  - provider: custom:litellm
    model: claude-haiku-5-5

# Auxiliary chores run on cloud models via LiteLLM, NOT the local model:
# web_extract fires N parallel calls (one per page) and the 4-slot local
# llama-server queues / times out past 4.
# IMPORTANT: aux fallback uses the PER-TASK `fallback_chain`, NOT the global
# `fallback_providers` above; without it Hermes falls back to the main model
# (the local qwen) and re-times-out. `vision` needs a vision-capable cloud slug
# (the local 35B is text-only). `compression` is pinned to an off-Go primary, see below.
auxiliary:
  web_extract:
    provider: custom:litellm
    model: go-kimi-k2.6
    fallback_chain:
      - provider: custom:litellm
        model: go-glm-5.1
      - provider: custom:litellm
        model: gpt-oss-20b
  # Off-Go (metered, cheap) primary, NOT a go-* model: on a provider error hermes-agent's
  # compressor falls back to the MAIN model (it does not consult this task's fallback_chain),
  # which is the local llama-server already serving the live session and queues / times out
  # under contention. A Go-quota failure must not dump compression onto the local server.
  compression:
    provider: custom:litellm
    model: gpt-oss-20b
  session_search:
    provider: custom:litellm
    model: go-kimi-k2.6
  title_generator:
    provider: custom:litellm
    model: go-kimi-k2.6
  # Vision-capable cloud model, pinned here (not kimi) because the local 35B is text-only.
  vision:
    provider: custom:litellm
    model: claude-haiku-5-5

# Web search via the SearXNG instance already running in ns ai.
web:
  search_backend: searxng

# Aggregated MCP tools via the ToolHive VirtualMCPServer (ns ai): the vmcp
# "mcp-gateway-internal" federates every MCPServer in the `mcp-tools` group behind
# one streamable-http endpoint at /mcp. Hermes reaches it through the LAN route with
# a bearer token (MCP_GATEWAY_URL, MCP_GATEWAY_TOKEN, both from the hermes Secret);
# a NetworkPolicy closes the vmcp Service to everything but envoy-internal. Tool
# names are prefixed per backend ({workload}_); LiteLLM is not an MCP gateway here.
#
# The gateway runs with gateway.multiplex_profiles, and under multiplexing a ${VAR}
# in mcp_servers resolves only from the profile secret scope (/opt/data/.env plus
# `secrets:` sources), never from the container env. The `command` source below
# hydrates both vars from the hermes Secret, mounted as files at /secrets/mcp
# (helmrelease.yaml), because the helper sees the profile scope, not the container env.
secrets:
  command:
    enabled: true
    command: |-
      for k in MCP_GATEWAY_URL MCP_GATEWAY_TOKEN; do printf '%s=%s\n' "$k" "$(cat "/secrets/mcp/$k")"; done

mcp_servers:
  toolhive:
    url: ${MCP_GATEWAY_URL}
    headers:
      Authorization: "Bearer ${MCP_GATEWAY_TOKEN}"
    enabled: true

# Persistent cross-session memory. `memory.provider` ACTIVATES a provider (without
# it Hermes shows `provider: none` and captures nothing). `holographic` is Hermes'
# bundled local SQLite fact store: in-process only, no shared service.
memory:
  provider: holographic
  auto_migrate: true

# Messaging platforms. The gateway-default profile starts the Telegram platform
# when TELEGRAM_BOT_TOKEN is present (from the hermes secret); TELEGRAM_ALLOWED_USERS
# gates who may DM it. platform_toolsets controls which tools each surface gets.
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
telegram:
  require_mention: false

# state.db retention (bounds /opt/data/state.db growth)
#
# Upstream's own supported settings (hermes_cli/config_defaults.py `sessions:`).
# Every key not listed deep-merges to upstream's default. Rationale for each:
# skill `hermes-agent`, references/state-db.md.
sessions:
  # Upstream default is already true; pinned because both call sites read
  # `.get("auto_prune", False)`, so an upstream flip would silently stop pruning.
  auto_prune: true

  # THE ACTUAL FIX. Upstream default is 90, which does not fit this claim. Dial this
  # one number down if volume climbs again (must stay 0 < n < 90). Upstream has no
  # per-source retention. A session can be exempted permanently by pinning it.
  retention_days: 30

  # LOAD-BEARING, and deliberately the OPPOSITE of upstream's `true` default: VACUUM
  # rewrites every page through the WAL and cannot succeed on this claim, yet would
  # be attempted on every prune that deletes rows and write until ENOSPC. The file
  # plateaus instead of shrinking; that is intended (state-db.md).
  vacuum_after_prune: false

# Approval gating for flagged commands. Declared explicitly so it is durable: the
# `copy-config` initContainer wipes any in-pod adjustment on every restart. These
# are the stock default values, pinned for durability, not changing what is gated.
approvals:
  mode: smart
  timeout: 300
  cron_mode: deny
  single_query_mode: deny
  unattended_mode: deny
  smart_policy: ""
  denial_breaker_threshold: 3
  deny: []
  mcp_reload_confirm: true
  destructive_slash_confirm: true
