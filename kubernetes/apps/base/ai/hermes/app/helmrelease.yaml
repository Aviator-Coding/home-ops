---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app hermes
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      hermes:
        # Single source of truth at /opt/data (sessions/memories/skills) is not
        # safe for concurrent writers -> exactly one replica, recreate on update.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        # Bind the cluster-operator ServiceAccount (rbac block below) to this
        # controller so the agent's kubectl uses Hermes' scoped permissions.
        serviceAccount:
          identifier: hermes
        initContainers:
          # Copies config.yaml into /opt/data on EVERY start, so in-pod config edits are
          # lost: change models in Git. Runs as root to chown to the dropped 10000 user.
          copy-config:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -eu
                mkdir -p /opt/data
                cp /run/config/config.yaml /opt/data/config.yaml
                chown 10000:10000 /opt/data/config.yaml
                chmod 0644 /opt/data/config.yaml
            securityContext:
              runAsUser: 0
              runAsGroup: 0
          # Copy GitOps-managed skills into /opt/data/skills on every start (the
          # repo is the source of truth; overwrites any stale copy). Runs as root
          # to chown to the dropped 10000 user. Add future skills here.
          seed-skills:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -eu
                skill_dir=/opt/data/skills/homelab/homelab-commit-watcher
                mkdir -p "$skill_dir/scripts"
                cp /run/skills/homelab-commit-watcher/SKILL.md "$skill_dir/SKILL.md"
                cp /run/skills/homelab-commit-watcher/fetch_k8s_repos.py "$skill_dir/scripts/fetch_k8s_repos.py"
                chmod +x "$skill_dir/scripts/fetch_k8s_repos.py"
                chown -R 10000:10000 /opt/data/skills
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            # Keep the -desktop suffix. The plain tag has no Chromium or Bot Desktop, and neither
            # can be installed at runtime. Docker versioning keeps the suffix on its own.
            # See skill hermes-agent.
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24-desktop
            # Do not pass gateway run. gateway-default is the only gateway; a second one crash-loops.
            # See skill hermes-agent references/restarts.md.
            args: ["sleep", "infinity"]
            env:
              # Never set OPENAI_BASE_URL. It overrides every provider. Routing is config.yaml.
              # See skill hermes-agent references/llm-routing.md.
              HERMES_DASHBOARD: "1"
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: "9119"
              # OpenAI-compatible API server on :8642; API_SERVER_KEY comes via envFrom.
              API_SERVER_ENABLED: "true"
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: "8642"
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              # homelab-commit-watcher: points its per-repo digest LLM at the internal gateway.
              SUMMARY_LLM_URL: http://internal-noauth.ai.svc.cluster.local/v1
              SUMMARY_LLM_MODEL: kimi-k2.6
              # s6 init starts as root, chowns /opt/data, then drops to this uid.
              HERMES_UID: "10000"
              HERMES_GID: "10000"
              # 900. Runway is 4x because the integrity check burns CPU and earns extensions.
              # The 300 default loses that race and the pod loops. See skill hermes-agent references/restarts.md.
              HERMES_STARTUP_WATCHDOG_TIMEOUT_S: "900"
              # uid 10000 is not detected as Docker, so the sandbox does not auto-disable.
              # There is no browser.launch_args key. See skill hermes-agent.
              AGENT_BROWSER_ARGS: "--no-sandbox,--disable-dev-shm-usage,--disable-gpu"
              # Global git config via env (no writable $HOME): the `store` helper reads the
              # single-repo PAT from the mounted `.git-credentials` file.
              GIT_CONFIG_COUNT: "3"
              GIT_CONFIG_KEY_0: credential.helper
              GIT_CONFIG_VALUE_0: store --file=/secrets/git/.git-credentials
              GIT_CONFIG_KEY_1: user.name
              GIT_CONFIG_VALUE_1: Hermes Agent
              GIT_CONFIG_KEY_2: user.email
              GIT_CONFIG_VALUE_2: hermes@users.noreply.github.com
            envFrom:
              # Dashboard basic-auth credentials (HERMES_DASHBOARD_BASIC_AUTH_*).
              - secretRef:
                  name: *app
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &dash 9119
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *dash
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 5
                  # Generous: first boot initialises config/skills under /opt/data.
                  failureThreshold: 30
            # 6Gi so state.db's page cache is not thrashed. The request stays 512Mi.
            # See skill hermes-agent references/state-db.md and skill node-scheduling.
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 6Gi
            # gateway_state.json records stopped on a graceful exit, and boot will not restart it.
            # See skill hermes-agent references/restarts.md.
            lifecycle:
              postStart:
                exec:
                  command:
                    - sh
                    - -c
                    - |
                      for i in $(seq 1 30); do
                        if [ -d /run/service/gateway-default ]; then
                          /command/s6-svc -u /run/service/gateway-default || true
                          break
                        fi
                        sleep 2
                      done
                      exit 0
          # Browser VS Code over the agent's state PVC. Same pod as `app`, so it
          # shares the RWO /opt/data mount (no multi-attach, no node affinity).
          # Runs as uid 10000 to own /opt/data (hermes owns it as 10000). LAN-only
          # via envoy-internal; --auth none (the internal net is the gate).
          codeserver:
            image:
              repository: ghcr.io/coder/code-server
              tag: 4.133.0
            env:
              HOME: /opt/data
              TZ: ${CONFIG_TIMEZONE}
            args:
              - --auth
              - none
              - --user-data-dir
              - /opt/data/.vscode
              - --extensions-dir
              - /opt/data/.vscode
              - --port
              - "12321"
              - /opt/data
            securityContext:
              runAsUser: 10000
              runAsGroup: 10000
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 10m
                # code-server sidecar: an editor opening a large tree spikes well above idle,
                # hence the 1Gi limit.
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      # Hermes operates the cluster via kubectl, so its SA token must be mounted.
      # app-template v5 defaults automountServiceAccountToken to false.
      automountServiceAccountToken: true
      securityContext:
        # s6 starts as root then drops to 10000; fsGroup makes the ceph-block
        # PVC group-writable so the dropped user owns its state at /opt/data.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *dash
          agent:
            port: 8642
          codeserver:
            port: 12321
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            url: https://hermes.${SECRET_DOMAIN}/
            conditions:
              # Dashboard 302-redirects unauthenticated requests to its login.
              - "[STATUS] == any(200, 302, 401)"
            group: ai
        hostnames:
          - "{{ .Release.Name }}.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          # Pin the hostname to the basic-auth dashboard port (service has several).
          - backendRefs:
              - name: *app
                port: *dash
      # Browser VS Code. LAN-only. code-server has no auth of its own.
      codeserver:
        hostnames:
          - "hermes-code.${SECRET_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        rules:
          - backendRefs:
              - name: *app
                port: 12321
    persistence:
      # Agent state PVC, mounted at /opt/data by every container that needs it.
      data:
        existingClaim: *app
        advancedMounts:
          hermes:
            copy-config:
              - path: /opt/data
            seed-skills:
              - path: /opt/data
            app:
              - path: /opt/data
            codeserver:
              - path: /opt/data
      # Two-way XML share. App container only. smbd forces 10000:10000.
      # See skill hermes-agent references/shared-storage.md.
      xml:
        existingClaim: shared-xml
        advancedMounts:
          hermes:
            app:
              - path: /opt/xml
      # Scratch drop folder, not a second copy of the XML corpus, and not backed up.
      # See skill hermes-agent references/shared-storage.md.
      files:
        existingClaim: shared-files
        advancedMounts:
          hermes:
            app:
              - path: /opt/files
      # Single private-repo git token, rendered as `.git-credentials` by the
      # hermes-git ExternalSecret and read by the git `store` helper (see
      # GIT_CONFIG_* env above). reloader restarts the pod on token rotation.
      git-credentials:
        type: secret
        name: hermes-git
        globalMounts:
          - path: /secrets/git/.git-credentials
            subPath: .git-credentials
            readOnly: true
      # config.yaml mounted into the copy-config initContainer, which copies it to
      # /opt/data/config.yaml on every start. The PVC `data` advancedMount gives
      # that init container /opt/data so it can write the file.
      config:
        type: configMap
        name: hermes-configmap
        advancedMounts:
          hermes:
            copy-config:
              - path: /run/config/config.yaml
                subPath: config.yaml
                readOnly: true
      # Skill sources, mounted into the seed-skills init which copies them onto
      # the PVC at /opt/data/skills (see initContainers above).
      skill-commit-watcher:
        type: configMap
        name: hermes-skill-homelab-commit-watcher
        advancedMounts:
          hermes:
            seed-skills:
              - path: /run/skills/homelab-commit-watcher
                readOnly: true
    # Read-all everywhere plus a narrow self-heal write surface: delete a stuck pod,
    # exec for diagnostics, patch/restart deployments in ns ai.
    serviceAccount:
      hermes: {}
    rbac:
      roles:
        hermes-read-all:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [pods, pods/log, nodes, services, namespaces, configmaps,
                persistentvolumes, persistentvolumeclaims, endpoints, resourcequotas,
                limitranges, serviceaccounts, events]
              verbs: [get, list, watch]
            - apiGroups: [apps]
              resources: [deployments, daemonsets, statefulsets, replicasets, controllerrevisions]
              verbs: [get, list, watch]
            - apiGroups: [batch]
              resources: [jobs, cronjobs]
              verbs: [get, list, watch]
            - apiGroups: [networking.k8s.io]
              resources: [ingresses, ingressclasses, networkpolicies]
              verbs: [get, list, watch]
            - apiGroups: [gateway.networking.k8s.io]
              resources: [gateways, httproutes]
              verbs: [get, list, watch]
            - apiGroups: [storage.k8s.io]
              resources: [storageclasses, csinodes, csidrivers, volumeattachments]
              verbs: [get, list, watch]
            - apiGroups: [metrics.k8s.io]
              resources: [nodes, pods]
              verbs: [get, list, watch]
            - apiGroups: [helm.toolkit.fluxcd.io]
              resources: [helmreleases]
              verbs: [get, list, watch]
            - apiGroups: [kustomize.toolkit.fluxcd.io]
              resources: [kustomizations]
              verbs: [get, list, watch]
            - apiGroups: [source.toolkit.fluxcd.io]
              resources: [gitrepositories, helmrepositories, ocirepositories, buckets, helmcharts]
              verbs: [get, list, watch]
            - apiGroups: [external-secrets.io]
              resources: [externalsecrets, secretstores, clustersecretstores]
              verbs: [get, list, watch]
            - apiGroups: [volsync.backube]
              resources: [replicationsources, replicationdestinations]
              verbs: [get, list, watch]
            - apiGroups: [postgresql.cnpg.io]
              resources: [clusters, backups, scheduledbackups]
              verbs: [get, list, watch]
        # Cluster-wide: delete a wedged pod (lets a controller reschedule it).
        hermes-pod-delete:
          type: ClusterRole
          rules:
            - apiGroups: [""]
              resources: [pods]
              verbs: [delete]
        # ns ai only: exec into pods (diagnostics) + rollout-restart/patch deployments.
        hermes-exec-deploy:
          type: Role
          rules:
            - apiGroups: [""]
              resources: [pods/exec]
              verbs: [create]
            - apiGroups: [apps]
              resources: [deployments]
              verbs: [patch, update]
      bindings:
        hermes-read-all:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-read-all
          subjects:
            - identifier: hermes
        hermes-pod-delete:
          type: ClusterRoleBinding
          roleRef:
            identifier: hermes-pod-delete
          subjects:
            - identifier: hermes
        hermes-exec-deploy:
          type: RoleBinding
          roleRef:
            identifier: hermes-exec-deploy
          subjects:
            - identifier: hermes
