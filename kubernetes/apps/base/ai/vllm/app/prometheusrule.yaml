---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
#
# Divide by kube_pod_container_resource_limits and join on (namespace, pod, container).
# container_spec_memory_limit_bytes does not exist here. Exclude vllm-vllm-embed (own 16Gi limit).
# ApproachingLimit needs predict_linear AND a current ratio above 0.6: predict_linear alone
# pages every post-restart ramp, and a static threshold inside the steady band never clears.
# CriticalLimit is the static >0.85 backstop. database/tikv-rules is an undeclared live rule
# on that dead metric; deleting it is a captain action. See skill b70-llm-serving references/memory.md.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: vllm-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: vllm.rules
      rules:
        - alert: VLLMMemoryApproachingLimit
          annotations:
            summary: vllm is on track to exceed its memory limit
            description: >-
              vllm pod {{ $labels.pod }} is projected to exceed its memory
              limit within the next ~24h based on its recent growth rate
              (currently {{ $value | humanizePercentage }} of limit
              projected). This is the captain's LLM - plan capacity or
              investigate the growth before it reaches the critical
              threshold.
          expr: |
            (
              predict_linear(container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}[6h], 86400)
                / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app", resource="memory"}
                > 1
            )
            and on (namespace, pod, container)
            (
              container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}
                / on (namespace, pod, container)
              kube_pod_container_resource_limits{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app", resource="memory"}
                > 0.6
            )
          for: 1h
          labels:
            severity: warning

        # Watches the REQUEST. The limit rules stay silent for another 36Gi and miss a prefill spike.
        # Raising the request to silence RetainedAboveBound is wrong. See skill b70-llm-serving references/memory.md.
        - alert: VLLMMemoryExceedsRequest
          annotations:
            summary: vllm is using more memory than it reserves
            description: >-
              vllm pod {{ $labels.pod }} is at
              {{ $value | humanizePercentage }} of its memory REQUEST. It has
              re-entered the kubelet's eviction exceeds-set and will now be
              evicted before pods that stay within their requests. The 12Gi
              request was sized on 2026-09-20 against a measured 5750 Mi peak.
              If this is firing, either that sizing is wrong or host memory is
              leaking. If VLLMMemoryRetainedAboveBound is also firing, it is a
              leak, and raising the request only buys time - see
              .agents/skills/b70-llm-serving/references/memory.md.
          expr: |
            container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}
              / on (namespace, pod, container)
            kube_pod_container_resource_requests{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app", resource="memory"}
              > 1
          for: 30m
          labels:
            severity: warning

        # 3h floor above 8GiB, AND the live instant series. A range selector alone pages a
        # terminated pod for up to 3h. Move the 8GiB threshold with --cache-ram.
        # Gate: scripts/ci/vllm-memory-alert-test.py. See skill b70-llm-serving references/memory.md.
        - alert: VLLMMemoryRetainedAboveBound
          annotations:
            summary: vllm is retaining more host memory than its bounded caches can hold
            description: >-
              vllm pod {{ $labels.pod }} has not dropped below
              {{ $value | humanize1024 }}B of working set in the last 3h.
              Everything this server is meant to keep is bounded under ~7.2GiB
              (baseline + the 4096 MiB prompt cache + one slot's context
              checkpoints), so something is growing without bound. First
              suspect: the oneDNN SDPA leak is back. Check that the running
              image still honours GGML_SYCL_FA_ONEDNN=0 -
              .agents/skills/b70-llm-serving/references/memory.md.
          expr: |
            (
              min_over_time(container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}[3h])
                > 8 * 1024^3
            )
            and on (namespace, pod, container)
            container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}
          for: 1h
          labels:
            severity: warning

        - alert: VLLMMemoryCriticalLimit
          annotations:
            summary: vllm is close to being OOMKilled
            description: >-
              vllm pod {{ $labels.pod }} is at {{ $value | humanizePercentage }}
              of its memory limit and is close to an OOMKill. This is the
              captain's LLM - act now, not after the crash.
          expr: |
            container_memory_working_set_bytes{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app"}
              / on (namespace, pod, container)
            kube_pod_container_resource_limits{namespace="ai", pod=~"vllm-.*", pod!~"vllm-vllm-embed-.*", container="app", resource="memory"}
              > 0.85
          for: 15m
          labels:
            severity: critical
