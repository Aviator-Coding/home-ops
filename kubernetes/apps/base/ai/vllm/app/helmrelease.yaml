---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vllm
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    # Placement is the devic.es/b70 request, not hostname affinity. KV at ctx
    # 262144 q8_0 is 2720 MiB (10 of 40 layers are full attention), not ~5.2 GiB.
    # See skill b70-llm-serving references/flags.md.
    controllers:
      # Chat stays llama.cpp SYCL. This GPTQ cannot finish vLLM warmup on one B70
      # (intel/llm-scaler#382). The controller name stays vllm so the Service does not move.
      vllm:
        strategy: Recreate
        pod:
          terminationGracePeriodSeconds: 60
          # talos-3 PreferNoSchedule: this pod can only land there, so it tolerates the penalty.
          # See skill node-scheduling.
          tolerations:
            - key: home-operations.com/dedicated
              operator: Exists
              effect: PreferNoSchedule
        containers:
          app:
            image:
              repository: ghcr.io/ggml-org/llama.cpp
              # Re-measure the next tag with -ub 2048 before bumping. The two compound.
              # See skill b70-llm-serving references/flags.md.
              tag: server-intel-b10820
            args:
              - -hf
              - unsloth/Qwen3.6-35B-A3B-GGUF:UD-Q4_K_M
              - --alias
              - qwen3.6-35b-a3b
              - --host
              - "0.0.0.0"
              - --port
              - "8000"
              - --ctx-size
              # Model max. Do not pin --parallel or --kv-unified: an explicit pin collapses decode.
              # vllm-embed stays at replicas 0. See skill b70-llm-serving references/flags.md.
              - "262144"
              - -ngl
              - "99"
              - --jinja
              - --metrics
              - --flash-attn
              - "on"
              - --cache-type-k
              - q8_0
              - --cache-type-v
              - q8_0
              - --cache-reuse
              # No-op while mmproj is loaded. Dropping mmproj removes vision.
              # See skill b70-llm-serving references/flags.md.
              - "256"
              - --cache-ram
              # Absence restores the silent 8192 MiB default. A memory limit cannot stop that leak
              # (kernel SIGKILL at page fault). 4096, not 0. Pairs with GLIBC_TUNABLES. --no-mmap is not this fix.
              # See skill b70-llm-serving references/memory.md. Gate: scripts/ci/vllm-prompt-cache-test.py.
              - "4096"
              - --no-mmap
              # -ub must match -b at 2048. -ub 4096 was rejected under concurrency.
              # See skill b70-llm-serving references/flags.md.
              - -b
              - "2048"
              - -ub
              - "2048"
            env:
              LLAMA_CACHE: /models/llama
              ONEAPI_DEVICE_SELECTOR: level_zero:0
              ZES_ENABLE_SYSMAN: "1"
              UR_L0_ENABLE_RELAXED_ALLOCATION_LIMITS: "1"
              SYCL_PI_LEVEL_ZERO_USE_IMMEDIATE_COMMANDLISTS: "1"
              # Second half of --cache-ram. Pins mmap_threshold so glibc returns large chunks.
              # Do not ship one without the other. See skill b70-llm-serving references/memory.md.
              GLIBC_TUNABLES: glibc.malloc.mmap_threshold=131072
              # Numeric only. "false" or "off" parse as the default and leave the leak on.
              # Lift only when this tag bounds fattn-onednn.cpp. Gate: scripts/ci/vllm-fa-onednn-test.py.
              # See skill b70-llm-serving references/memory.md.
              GGML_SYCL_FA_ONEDNN: "0"
            envFrom: &envFrom
              - secretRef:
                  name: vllm-secret
            resources:
              requests:
                cpu: "2"
                # 12Gi = ~1232 MiB baseline + 2.7x the 4096 MiB cache. Below the working set this
                # pod is evicted first. Do not raise it to silence VLLMMemoryRetainedAboveBound.
                # See skill b70-llm-serving references/memory.md.
                memory: 12Gi
                devic.es/b70: 1
              limits:
                # A limit cannot stop the host leak. Leave it above the request so a prefill
                # spike is not an OOMKill. See skill b70-llm-serving references/memory.md.
                memory: 48Gi
                devic.es/b70: 1
            probes:
              # First boot downloads ~21GB GGUF; allow 30 min
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 60
              readiness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              liveness: *probe

      vllm-embed:
        # replicas 0. No live consumer, and it shares the one B70 with chat.
        # --gpu-memory-utilization belongs only on this controller. See skill b70-llm-serving.
        replicas: 0
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/intel/llm-scaler-vllm
              tag: 0.14.0-b8.3.1
            command:
              - vllm
              - serve
              - Qwen/Qwen3-VL-Embedding-2B
              # --task was removed in vLLM 0.14; needs both runner + convert here
              # (convert alone leaves pooler_config unset -> AssertionError)
              - --runner=pooling
              - --convert=embed
              - --served-model-name=qwen3-vl-embedding-2b
              - --host=0.0.0.0
              - --port=8000
              - --dtype=float16
              # 0.15 (4.8GB) only covers the fp16 weights; no room for cache blocks
              - --gpu-memory-utilization=0.20
              - --max-model-len=8192
            env:
              HF_HOME: /models
              VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
              VLLM_WORKER_MULTIPROC_METHOD: spawn
              ZES_ENABLE_SYSMAN: "1"
            envFrom: *envFrom
            resources:
              requests:
                cpu: "1"
                memory: 4Gi
                devic.es/b70: 1
              limits:
                memory: 16Gi
                devic.es/b70: 1
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 20
              readiness: *probe
              liveness: *probe

    service:
      app:
        controller: vllm
        ports:
          http:
            port: 8000
      embed:
        controller: vllm-embed
        ports:
          http:
            port: 8000

    persistence:
      models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 50Gi
        advancedMounts:
          vllm:
            app:
              - path: /models
      embed-models:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: ceph-block
        size: 20Gi
        advancedMounts:
          vllm-embed:
            app:
              - path: /models
