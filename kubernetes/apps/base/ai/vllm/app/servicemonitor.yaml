---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: vllm
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # llama-server series have no model label. The gpu-node dashboard groups t/s by
      # these two, so a variant ships with its own label and history stays separable.
      # Change them with the -hf and --cache-type-k/v args in helmrelease.yaml.
      # Gate: scripts/ci/gpu-node-dashboard-test.py.
      relabelings:
        - targetLabel: model
          replacement: qwen3.8-35b-a3b-apex-iq3xxs
        - targetLabel: kv
          replacement: f16
  selector:
    matchLabels:
      app.kubernetes.io/name: vllm
  namespaceSelector:
    matchNames:
      - ai
