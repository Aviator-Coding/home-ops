---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal only (captain request 2026-08-26): envoy-internal is the sole
# parentRef and external-dns only publishes the internal record. Nothing
# public - see securitypolicy.yaml for the auth gate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: &app opencode
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: OpenCode
    gethomepage.dev/description: "Interactive coding workspace"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=opencode
    external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
    # `[STATUS] == any(200, 302, 401)` alone is a false-green trap: Authentik's
    # own "Application not found" error page (served when the outpost has no
    # Proxy Provider + Application bound to this hostname) has been observed
    # returning HTTP 200 through this route, which the status-only condition
    # accepts as healthy even though the app is completely unreachable.
    # Verified live 2026-09-12. The error page is the only response on this
    # route missing `<ak-flow-executor` (present on every real login flow
    # page) and carrying the literal string "Not Found" as its card title, so
    # the body condition below closes that gap without touching the accepted
    # status set.
    gatus.home-operations.com/endpoint: |-
      conditions:
        - "[STATUS] == any(200, 302, 401)"
        - "[BODY] != pat(*Not Found*)"
spec:
  hostnames:
    - "opencode.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: *app
          namespace: ai
          port: 4096
