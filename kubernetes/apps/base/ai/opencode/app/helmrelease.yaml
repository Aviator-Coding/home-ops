---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # Kept off talos-3. That node is the GPU/storage node: the Arc Pro B70
      # pins ai/vllm there (devic.es/b70 is advertised only by talos-3), and it
      # also carries 2 of the 6 Ceph OSDs, a mon, and the postgres-17 replica
      # that CNPG's required anti-affinity fixes to one instance per node. Once
      # vllm's memory request reflects its real 38.4GiB working set, talos-3 has
      # no room left for discretionary workloads. Measured evidence and the full
      # arithmetic: docs/talos-3-scheduling-truth.md (2026-09-14).
      #
      # Confining this app to talos-1/talos-2 costs no real availability: the
      # 3 Ceph mons are one per node, so losing both other nodes already means
      # no mon quorum and no ceph-block storage, and this app could not run on
      # talos-3 alone regardless.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - talos-3
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/opencode
              tag: 1.18.31@sha256:69018c2db35a873b4f4d1d515cf364e7c55f7195ab9c9a26c9d945f73717d64f
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: opencode
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi

    persistence:
      home:
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM: volsync was retired from this volume
        # on 2026-09-04 (Stage 5 wave three), and that overlay now defines no
        # VOLSYNC_* key. The `:-opencode` default meant this kept rendering
        # correctly either way, which is exactly why it is renamed rather than
        # left to rot - a token naming a variable nothing defines is a silent
        # trap for whoever edits it next. See ai/repo-wiki's precedent.
        existingClaim: ${KOPIUR_CLAIM:-opencode}
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode

    service:
      app:
        controller: opencode
        ports:
          http:
            port: *port
