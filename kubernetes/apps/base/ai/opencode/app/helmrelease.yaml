---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app opencode
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  maxHistory: 2
  install:
    createNamespace: true
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  uninstall:
    keepHistory: false
  values:
    defaultPodOptions:
      # REMOVED 2026-09-26: the explicit `NotIn talos-3` nodeAffinity that
      # used to live here is now redundant. talos-3 carries a NoSchedule
      # taint (talos/nodes/talos-3.yaml.j2) and this app gets no toleration
      # for it, so the taint alone keeps it off talos-3 with the same effect,
      # without a per-app deny-list entry that fails open for anything that
      # forgets to carry it. See docs/talos-3-scheduling-truth.md.
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }

    controllers:
      opencode:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/joryirving/opencode
              tag: 2.0.18@sha256:5704af85d87d7b2ca449873218a441011756cf57741b1645cb30fce3aa149712
            command: ["/etc/opencode/entrypoint.sh"]
            env:
              HOME: &homepath /home/opencode
              OPENCODE_CONFIG: /etc/opencode/opencode.json
              TZ: America/New_York
            envFrom:
              - secretRef:
                  name: opencode
            securityContext:
              allowPrivilegeEscalation: false
              capabilities: { drop: ["ALL"] }
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 4096
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  initialDelaySeconds: 15
                  periodSeconds: 15
                  failureThreshold: 6
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 8Gi

    persistence:
      home:
        # KOPIUR_CLAIM, not VOLSYNC_CLAIM: volsync was retired from this volume
        # on 2026-09-04 (Stage 5 wave three), and that overlay now defines no
        # VOLSYNC_* key. The `:-opencode` default meant this kept rendering
        # correctly either way, which is exactly why it is renamed rather than
        # left to rot - a token naming a variable nothing defines is a silent
        # trap for whoever edits it next. See ai/repo-wiki's precedent.
        existingClaim: ${KOPIUR_CLAIM:-opencode}
        globalMounts:
          - path: *homepath
      config:
        type: configMap
        name: opencode-config
        defaultMode: 0755
        globalMounts:
          - path: /etc/opencode

    service:
      app:
        controller: opencode
        ports:
          http:
            port: *port
