---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# GITHUB_TOKEN reuses the EXISTING `hermes` 1Password item's `HOMELAB_GH_TOKEN`
# field (public_repo scope: read+write to public repos) - no new prerequisite.
# It's already the credential this cluster trusts for automated public-repo
# writes (hermes' commit-watcher skill), and opencode is an internal-only,
# Authentik-gated interactive workspace for the captain, so reusing it here to
# let opencode push to home-ops/etc. is the same trust boundary, not a new one.
# See this app's README.md for why this differs from repo-wiki's read-only key.
# LITELLM_API_KEY is NOT a captain prerequisite - see the README.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name opencode
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        LITELLM_API_KEY: "{{ .key }}"
        GITHUB_TOKEN: "{{ .HOMELAB_GH_TOKEN }}"
  dataFrom:
    - extract:
        key: litellm-consumer-opencode
    - extract:
        key: hermes
