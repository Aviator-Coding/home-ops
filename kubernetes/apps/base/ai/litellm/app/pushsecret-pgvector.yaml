---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the two credentials of the ai/litellm-pgvector vector store in
# 1Password item `litellm-pgvector`, from where BOTH halves read them back:
# this app's externalsecret.yaml (LITELLM_PGVECTOR_API_KEY for the proxy) and
# ai/litellm-pgvector's externalsecrets (the server's bearer key and its
# Postgres role password). Same seam as pushsecret-sso.yaml: the source Secret
# is created ONCE by hand and never committed, and 1Password is what survives
# a cluster rebuild.
#
# It lives in THIS app, not in ai/litellm-pgvector, for ordering:
# litellm-pgvector dependsOn litellm, so the item already exists by the time
# anything there reads it.
#
# Seeding (already done 2026-09-27; only needed again after losing both the
# Secret and the 1Password item). `kubectl create`, never `apply`, so no
# last-applied annotation carries the values. Hex keeps the DB password safe
# inside a postgresql:// URL without escaping.
#   kubectl -n ai create secret generic litellm-pgvector-seed \
#     --from-literal=LITELLM_PGVECTOR_DB_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=LITELLM_PGVECTOR_SERVER_API_KEY="sk-pgvector-$(openssl rand -hex 32)"
#
# Rotation: replace a value in that Secret. This pushes it, both
# ExternalSecrets pick it up within their refresh, reloader restarts the proxy
# and the server, and the db-init Job re-asserts the role password on its next
# run (postgres-init always runs ALTER USER ... PASSWORD) - delete
# `litellm-pgvector-db-init` to run it immediately.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-pgvector-seed
spec:
  refreshInterval: 1h
  # Pinned, not defaulted: pruning this PushSecret must never delete the only
  # durable copy of the credentials.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-pgvector-seed
  data:
    - match:
        secretKey: LITELLM_PGVECTOR_DB_PASSWORD
        remoteRef:
          remoteKey: litellm-pgvector
          property: LITELLM_PGVECTOR_DB_PASSWORD
    - match:
        secretKey: LITELLM_PGVECTOR_SERVER_API_KEY
        remoteRef:
          remoteKey: litellm-pgvector
          property: LITELLM_PGVECTOR_SERVER_API_KEY
