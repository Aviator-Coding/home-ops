---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the vector store's two credentials in 1Password `litellm-pgvector`; both the proxy and
# ai/litellm-pgvector read them back. Lives here because litellm-pgvector dependsOn litellm.
# Seed once (only after losing both the Secret and the item) with create, never apply:
#   kubectl -n ai create secret generic litellm-pgvector-seed \
#     --from-literal=LITELLM_PGVECTOR_DB_PASSWORD="$(openssl rand -hex 32)" \
#     --from-literal=LITELLM_PGVECTOR_SERVER_API_KEY="sk-pgvector-$(openssl rand -hex 32)"
# Rotation: replace a value in that Secret; reloader restarts both apps and the db-init Job
# re-asserts the role password on its next run (delete litellm-pgvector-db-init to run it now).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-pgvector-seed
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the only durable copy.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-pgvector-seed
  data:
    - match:
        secretKey: LITELLM_PGVECTOR_DB_PASSWORD
        remoteRef:
          remoteKey: litellm-pgvector
          property: LITELLM_PGVECTOR_DB_PASSWORD
    - match:
        secretKey: LITELLM_PGVECTOR_SERVER_API_KEY
        remoteRef:
          remoteKey: litellm-pgvector
          property: LITELLM_PGVECTOR_SERVER_API_KEY
