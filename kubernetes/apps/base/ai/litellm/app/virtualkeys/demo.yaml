---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# D4 budget-path smoke test: the only consumer of the synthetically priced qwen3.6-35b-a3b.
# Never give it auto or a cloud model.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: demo
spec:
  proxyRef: litellm
  keyAlias: demo
  secretName: litellm-key-demo
  secretKey: key
  models:
    - qwen3.6-35b-a3b
    - embedding-local
  # Decimal STRING (CRD type); exhaustible by one smoke test.
  maxBudget: "0.05"
  budgetDuration: 30d
  rpmLimit: 2
  tpmLimit: 2000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-demo
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-demo
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-demo
          property: key
