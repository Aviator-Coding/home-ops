---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# The AI PR reviewer's key. Also hand-copied into the GitHub secret LITELLM_PR_REVIEW_KEY, so rotation
# has a second, silent step. Never give it auto. Skill litellm-proxy (references/pr-reviewer.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: ai-pr-review
spec:
  proxyRef: litellm
  keyAlias: ai-pr-review
  secretName: litellm-key-ai-pr-review
  secretKey: key
  models:
    - pr-review-local
    - embedding-local
    # The blocking gate (scripts/ci/ai_review_gate.py) asks Jev on POST /v1/decisions; owner
    # decision 2026-10-31 (goal task 2.4). Metered via OpenRouter, a fraction of a cent per PR.
    - jev
  # Caps Jev spend; the other two models are zero-priced.
  maxBudget: "5.00"
  budgetDuration: 30d
  # The real bound: several concurrent Renovate reviews plus one retry each.
  rpmLimit: 10
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the key to 1Password litellm-consumer-ai-pr-review, the source for LITELLM_PR_REVIEW_KEY.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-ai-pr-review
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-ai-pr-review
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-ai-pr-review
          property: key
