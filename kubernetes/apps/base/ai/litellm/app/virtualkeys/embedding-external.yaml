---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# External callers of the local embedder. The B70 is shared with chat and has no partition, so
# rpmLimit also protects ai/vllm (skill b70-llm-serving). maxBudget is inert but kept as the widening guard.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: embedding-external
spec:
  proxyRef: litellm
  keyAlias: embedding-external
  secretName: litellm-key-embedding-external
  secretKey: key
  models:
    - embedding-local
  maxBudget: "1.00"
  budgetDuration: 30d
  rpmLimit: 60
  tpmLimit: 100000
  metadata:
    purpose: external service access to the local GPU embedder (B70) via LiteLLM
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-embedding-external
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-embedding-external
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-embedding-external
          property: key
