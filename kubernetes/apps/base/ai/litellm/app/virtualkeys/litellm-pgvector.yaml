---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# The key ai/litellm-pgvector uses to embed every SEARCH QUERY through this
# proxy (BerriAI/litellm-pgvector calls litellm.aembedding against LiteLLM on
# each /search). Scoped to exactly the one model the store's vectors come from:
# a query embedded by any other model would land in a different vector space
# and return confident nonsense rather than an error, so the allow-list is
# also a correctness guard, not only an entitlement one.
#
# Ingest does NOT use this key - callers embed their own chunks with their own
# key (see ../../README.md "Vector store (pgvector)"), so every row in the
# store is attributable in the spend log to whoever wrote it.
#
# maxBudget is set and INERT for the same reason as embedding-external.yaml:
# embedding-local is zero-priced, and the cap only matters if `models` is ever
# widened to something priced. scripts/ci/litellm-claude-code-subscription-test.py
# pins the exact budgetless set; this key is deliberately not in it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: litellm-pgvector
spec:
  proxyRef: litellm
  keyAlias: litellm-pgvector
  secretName: litellm-key-litellm-pgvector
  secretKey: key
  models:
    - embedding-local
  maxBudget: "1.00"
  budgetDuration: 30d
  # One embedding call per search, each a single short query (batch of one).
  # The B70 is shared with chat and has no compute partition; at batch 32 about
  # 1 req/s costs chat ~30% (docs/ai/embedder-gpu-migration-analysis-2026-09-15.md),
  # and a one-query batch is far cheaper than that, so 60/min is a runaway
  # backstop rather than a chat-protection throttle.
  rpmLimit: 60
  tpmLimit: 100000
  metadata:
    purpose: query embeddings for the ai/litellm-pgvector vector store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the operator-minted key into 1Password item
# `litellm-consumer-litellm-pgvector` (auto-created - not a captain
# prerequisite), which ai/litellm-pgvector's ExternalSecret reads back - the
# same continuity pattern as every other consumer in this directory.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-litellm-pgvector
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-litellm-pgvector
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-litellm-pgvector
          property: key
