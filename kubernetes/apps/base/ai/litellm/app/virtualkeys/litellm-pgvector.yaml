---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# The vector store's embedding key. INVARIANT: exactly the one model the store's vectors come from
# (so no embedding-local); another model's vectors rank silently wrong. references/vector-store.md.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: litellm-pgvector
spec:
  proxyRef: litellm
  keyAlias: litellm-pgvector
  secretName: litellm-key-litellm-pgvector
  secretKey: key
  models:
    - qwen/qwen3-embedding-8b
  maxBudget: "5.00"
  budgetDuration: 30d
  rpmLimit: 120
  tpmLimit: 1000000
  metadata:
    purpose: ingest and query embeddings for the ai/litellm-pgvector vector store
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-litellm-pgvector
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-litellm-pgvector
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-litellm-pgvector
          property: key
