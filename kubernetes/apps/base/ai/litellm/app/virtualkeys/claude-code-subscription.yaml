---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# One interactive `claude` CLI user against the subscription pass-through
# models (captain decision 2026-08-27, alongside the model CR itself; Opus
# added 2026-08-30). Scoped to the two `claude-code-subscription*` CRs and
# nothing else: this key must not be a second way into the metered Anthropic
# models, so it names neither `auto` nor `claude-sonnet-5`/`claude-opus-5` -
# a caller wanting those needs a key that says so, priced against a real
# budget.
#
# THE ONLY KEY HERE WITH NO `maxBudget`, AND THAT IS DELIBERATE, NOT AN
# OVERSIGHT. The model CRs are priced at an explicit $0 on EVERY field - input,
# output, and the five prompt-cache fields (see each CR's `info.extra` header;
# zeroing only input/output left ~$54 of fictional recorded spend on this key
# until 2026-08-31, because Claude Code's cost is almost entirely cache). With
# the full set declared, recorded spend is $0.00 and any maxBudget could never
# trip - a cap that cannot fire reads as protection that does not exist. Rate
# limits are the real guardrail here, which is why both are set and neither
# should be dropped. If a future change ever drops one of those cache zeros,
# recorded spend starts climbing again and a budget added in response would
# then lock the key out on dollars nobody is invoiced.
#
# Sizing history: raised from 10 rpm / 250000 tpm to 300 rpm / 7500000 tpm on
# 2026-08-30 after measured rate-limiting - LiteLLM logs showed ~556
# request-limit 429s and ~171 token-limit 429s in 24 hours at the old values
# ("Limit type: requests. Current limit: 10" and "Limit type: tokens. Current
# limit: 250000"), both of which presented to the client as timeouts, since a
# throttled request that retries looks like a hang rather than an explicit
# 429. Both numbers had to move together: Claude Code's agentic loop issues
# several requests per human turn (each tool call is its own round trip, so
# request count tracks tool use, not typing speed) and each of those requests
# can carry a large context (50-200k tokens), so raising rpm alone without a
# proportional tpm increase just re-throttles at the token ceiling instead -
# 7500000 preserved the same tokens-per-request headroom the key had at
# 10 rpm / 250000 tpm.
#
# The captain then raised both again, directly in the LiteLLM UI, to
# 3000 rpm / 750000000 tpm. This file is being updated to match that live
# state so Git is the source of truth and the operator does not silently
# revert the captain's change on its next reconcile - the UI is NOT the
# source of truth; any future change to these numbers belongs here, in Git.
#
# Caveat, stated rather than solved here: at 750000000 tpm these limits are
# no longer a meaningful runaway-agent guardrail, which is the whole reason
# rate limits exist on this budget-less key (see above). That is the
# captain's call and it stands. The real ceiling is now Anthropic's own rate
# limiting against the caller's personal subscription, which this proxy
# neither sees nor can raise - and unlike the guardrail these numbers used to
# provide, that ceiling was never something this file controlled anyway.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: claude-code-subscription
spec:
  proxyRef: litellm
  keyAlias: claude-code-subscription
  secretName: litellm-key-claude-code-subscription
  secretKey: key
  models:
    # BOTH entries are subscription pass-through CRs for which the proxy holds
    # NO credential (../models/claude-code-subscription{,-opus}.yaml). Neither
    # is the metered `claude-sonnet-5`/`claude-opus-5`, and adding either of
    # those here is the one change this file exists to prevent - it would make
    # subscription traffic bill the household's metered ANTHROPIC_API_KEY.
    # `claude-code-subscription-opus` was added 2026-08-30 after a `claude`
    # subagent requested Opus by name and was correctly refused; the name
    # collision with the metered `claude-opus-5` is closed CLIENT-side via
    # ANTHROPIC_DEFAULT_OPUS_MODEL, because LiteLLM applies a key's `aliases`
    # only after this allow-list has already rejected the request (measured
    # 2026-08-30 - see the -opus CR header and the doc's section 7).
    - claude-code-subscription
    - claude-code-subscription-opus
  rpmLimit: 3000
  tpmLimit: 750000000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the operator-minted key into 1Password item
# `litellm-consumer-claude-code-subscription` (auto-created - not a captain
# prerequisite). This is the value a user puts in ANTHROPIC_CUSTOM_HEADERS as
# `x-litellm-api-key`; it is NOT the Anthropic subscription token, which never
# leaves the user's workstation. See
# docs/ai-system/litellm/claude-code-subscription.md section 5.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-claude-code-subscription
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-claude-code-subscription
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-claude-code-subscription
          property: key
