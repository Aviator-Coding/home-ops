---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# One interactive `claude` CLI user against the subscription pass-through
# models (captain decision 2026-08-27, alongside the model CR itself; Opus
# added 2026-08-30). Scoped to the two pass-through CRs and nothing else: this
# key must not be a second way into the metered Anthropic models, so it names
# neither `auto` nor `claude-sonnet-5-metered`/`claude-opus-5-metered` - a
# caller wanting those needs a key that says so, priced against a real budget.
#
# RENAMED 2026-08-31 (captain decision, Alternative B of
# data/homeops-claude-code-passthrough-design/report.md): the two pass-through
# model CRs this key allow-lists moved from `claude-code-subscription` /
# `claude-code-subscription-opus` to the natural `claude-sonnet-5` /
# `claude-opus-5` (../models/claude-sonnet-5.yaml, ../models/claude-opus-5.yaml),
# and the formerly-natural-named METERED CRs moved to `claude-sonnet-5-metered`
# / `claude-opus-5-metered` to free those names. This key itself keeps its own
# name, alias and Secret - `claude-code-subscription` still accurately
# describes what the key is FOR (the Claude Code CLI subscription user), it is
# only the two models it is allow-listed to that changed names. The client-side
# `ANTHROPIC_DEFAULT_OPUS_MODEL`/`ANTHROPIC_DEFAULT_SONNET_MODEL` overrides
# that section 7 below describes are gone: the natural names now resolve
# directly to these pass-through CRs, so no override is needed. Full rationale
# and the deliberate 401 an admin gets asking for the bare metered name:
# docs/ai-system/litellm/claude-code-subscription.md.
#
# THE ONLY KEY HERE WITH NO `maxBudget`, AND - AS OF 2026-08-31 - NO
# `rpmLimit`/`tpmLimit` EITHER. THIS KEY HAS NO LOCAL CEILING AT ALL, AND THAT
# IS DELIBERATE, NOT AN OVERSIGHT.
#
# No budget: the model CRs are priced at an explicit $0 on EVERY field - input,
# output, and the five prompt-cache fields (see each CR's `info.extra` header).
# With the full set declared, recorded spend is $0.00 and any maxBudget could
# never trip - a cap that cannot fire reads as protection that does not exist.
#
# No rate limits (captain decision, 2026-08-31): firstmate measured usage
# across all 212 minutes this key had ever been active before the removal -
#
#   | metric        | observed              | old limit   | headroom |
#   |----------------|-----------------------|-------------|----------|
#   | requests/min   | peak 70, p99 60       | 3000        | 43x      |
#   | tokens/min     | peak 2,808,629        | 750000000   | 267x     |
#
# - and the captain chose to drop both rather than keep chasing a number that
# was never actually load-bearing. The real ceiling was always Anthropic's own
# rate limiting against the caller's personal subscription (this proxy neither
# sees nor can raise it), so `rpmLimit`/`tpmLimit` were only ever a
# runaway-agent guardrail against a local bug, and 43x/267x measured headroom
# means they had already stopped being one. Enforcement now lives entirely
# upstream, on Anthropic's side.
#
# Sizing history, kept for context: 10 rpm / 250000 tpm at creation (2026-08-27)
# -> 300 rpm / 7500000 tpm on 2026-08-30 (measured ~556 request-limit and ~171
# token-limit 429s/24h at the old values, both of which presented to the client
# as hangs rather than explicit errors) -> 3000 rpm / 750000000 tpm, raised
# directly in the LiteLLM UI by the captain the same day -> REMOVED entirely
# 2026-08-31.
#
# THE CRD CANNOT EXPRESS "CLEAR AN EXISTING LIMIT", ONLY "STOP MANAGING IT" -
# removing `rpmLimit`/`tpmLimit` from this spec is not sufficient on its own.
# `LiteLLMVirtualKeySpec.{TPMLimit,RPMLimit}` are Go `*int64` with
# `json:",omitempty"`; an absent field marshals to nothing in the `/key/update`
# body rather than an explicit `null`. LiteLLM's `prepare_key_update_data`
# builds that update via `data.model_dump(exclude_unset=True)`
# (key_management_endpoints.py, v1.98.0), so a field that is merely ABSENT from
# the request is treated as "leave the DB column alone", not "clear it" - only
# an explicit JSON `null` clears it. Measured live 2026-08-31: after removing
# both fields from this CR, litellm-operator's reconciler correctly detected
# drift and called `POST /key/update` (the key's `updated_at` advanced), but
# `rpm_limit`/`tpm_limit` on the live key were unchanged at `3000`/`750000000`
# afterwards - proving the operator's update was a no-op for these two fields.
# Clearing them required one manual, one-time
# `POST /key/update {"key": "<key>", "rpm_limit": null, "tpm_limit": null}`
# against the proxy's admin API with the master key, verified by a follow-up
# `GET /key/info` showing both `null`. This is an operational action, not
# something Git or the operator can perform - it only has to happen once per
# already-limited key going unlimited; a key that starts unlimited (fresh
# `/key/generate`, or a limit that only ever gets raised, never dropped to
# none) never hits this gap. If this key is ever regenerated (rotation,
# Secret deletion) after a future spec still carries no limits, no manual step
# is needed - the new key is created with no limits from the start.
#
# PHANTOM SPEND (annotated, not zeroed - see the runbook's disclaimer below):
# this key shows $54.31 of recorded spend nobody is ever invoiced
# (`LiteLLM_VerificationToken.spend`; live-measured 2026-08-31 as $54.27, a
# small rounding/timing difference from the same underlying figure). Cause:
# the two model CRs originally zeroed only `input_cost_per_token`/
# `output_cost_per_token`; the five prompt-cache pricing fields were left
# unset and fell back to LiteLLM's built-in metered `claude-sonnet-5` cost map
# entry - and Claude Code caches almost every turn, so that gap priced
# essentially the whole bill (output_cost was exactly $0.00; the total was
# 100% cache_read + cache_creation). Fix: the five cache fields were zeroed on
# both pass-through model CRs (renamed 2026-08-31 to
# `../models/claude-sonnet-5.yaml` / `../models/claude-opus-5.yaml`), and the
# proxy was restarted at 2026-08-31T04:09:50Z to pick it up. Full mechanism
# and probe evidence: `docs/ai-system/litellm/claude-code-subscription.md`
# §4a. This $54.31 is deliberately left ON THE KEY, not zeroed: with no
# `maxBudget`, the number constrains nothing operationally, it only pollutes
# reporting, and zeroing it would destroy the evidence trail before the fix
# had ever been proven against real traffic (zero requests had hit this key
# since the restart at the time this comment was written). The
# `LiteLLMClaudeCodeSubscriptionSpendRegression` alert in `../prometheusrule.yaml`
# is what proves or disproves the fix once traffic resumes:
# `litellm_spend_metric_total` is a per-request Counter (incremented on every
# logged call regardless of amount,
# `_increment_top_level_request_and_spend_metrics`, v1.98.0; scrape name ends
# in `_total` on this cluster). The 2026-08-31T04:09:50Z proxy restart reset
# process counters, so the series starts fresh near 0 rather than carrying the
# DB's ~$54.31 - that figure lives only on this key's `spend` column /
# `LiteLLM_SpendLogs`. When pricing is correct the series should not increase
# as traffic resumes; `increase(...[1h]) > 0` is the regression signal.
# Historical `LiteLLM_SpendLogs` rows and this key's `spend` column must never
# be edited or zeroed to make this figure "clean" - the accounting bug is the
# thing to fix, not the record of it.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: claude-code-subscription
spec:
  proxyRef: litellm
  keyAlias: claude-code-subscription
  secretName: litellm-key-claude-code-subscription
  secretKey: key
  models:
    # BOTH entries are subscription pass-through CRs for which the proxy holds
    # NO credential (../models/claude-sonnet-5.yaml, ../models/claude-opus-5.yaml).
    # Neither is the metered `claude-sonnet-5-metered`/`claude-opus-5-metered`,
    # and adding either of those here is the one change this file exists to
    # prevent - it would make subscription traffic bill the household's
    # metered ANTHROPIC_API_KEY. The Opus entry was added 2026-08-30 after a
    # `claude` subagent requested Opus by name and was correctly refused; at
    # the time the collision with the then-natural-named metered `claude-opus-5`
    # was closed CLIENT-side via ANTHROPIC_DEFAULT_OPUS_MODEL (LiteLLM applies a
    # key's `aliases` only after this allow-list has already rejected the
    # request - measured 2026-08-30, see the CR header and the doc's section 7
    # for why that ordering ruled out a per-key alias). The 2026-08-31 rename
    # retired that override entirely: these two names are now the pass-through
    # CRs outright, so no client-side steering is needed anymore.
    - claude-sonnet-5
    - claude-opus-5
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the operator-minted key into 1Password item
# `litellm-consumer-claude-code-subscription` (auto-created - not a captain
# prerequisite). This is the value a user puts in ANTHROPIC_CUSTOM_HEADERS as
# `x-litellm-api-key`; it is NOT the Anthropic subscription token, which never
# leaves the user's workstation. See
# docs/ai-system/litellm/claude-code-subscription.md section 5.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-claude-code-subscription
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-claude-code-subscription
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-claude-code-subscription
          property: key
