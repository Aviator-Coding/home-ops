---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# The Claude Code subscription pass-through key. INVARIANT: allow-list only credential-less
# pass-through CRs (+ embedding-local), never a -metered model or auto. No maxBudget and no rpm/tpm
# by captain decision; never zero its historical spend. Skill litellm-proxy (references/claude-code-subscription.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: claude-code-subscription
spec:
  proxyRef: litellm
  keyAlias: claude-code-subscription
  secretName: litellm-key-claude-code-subscription
  secretKey: key
  # Pass-through entries carry the placeholder apiKey and $0 prices; embedding-local is
  # credential-less and unpriced (both CI-asserted).
  models:
    - claude-sonnet-5
    - claude-opus-5
    - claude-haiku-4-5-20251001
    - claude-fable-5-1
    - embedding-local
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the key to 1Password litellm-consumer-claude-code-subscription (the x-litellm-api-key value).
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-claude-code-subscription
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-claude-code-subscription
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-claude-code-subscription
          property: key
