---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Cloud-entitled failover demo: holding chat-ha IS the cloud entitlement (config fallbacks bypass
# allow-lists). Its budget is real USD, moved only by fallback spend. references/fallbacks.md.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: ha-demo
spec:
  proxyRef: litellm
  keyAlias: ha-demo
  secretName: litellm-key-ha-demo
  secretKey: key
  models:
    - chat-ha
    - embedding-local
  maxBudget: "1.0"
  budgetDuration: 30d
  rpmLimit: 10
  tpmLimit: 60000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-ha-demo
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-ha-demo
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-ha-demo
          property: key
