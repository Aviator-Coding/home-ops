---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Captain's off-cluster gnhf agent loop. chat-local only: zero-priced and terminal, so it can never
# reach a paid API. Budgetless by CI-asserted exception; rpm/tpm are the captain's live values and only
# stop spurious throttling. Skill litellm-proxy (references/governance-keys.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: mac-gnhf
spec:
  proxyRef: litellm
  keyAlias: mac-gnhf
  secretName: litellm-key-mac-gnhf
  secretKey: key
  models:
    - chat-local
    - embedding-local
  rpmLimit: 300
  tpmLimit: 200000000
  metadata:
    purpose: captain's Mac running the gnhf agent loop, off-cluster
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-mac-gnhf
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-mac-gnhf
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-mac-gnhf
          property: key
