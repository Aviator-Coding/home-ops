---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# One file per consumer (captain decision D4), each pairing a
# LiteLLMVirtualKey with the PushSecret that mirrors its minted key to
# 1Password. This replaces resources/consumers.json + provision_keys.py and
# both provisioning controllers - the operator owns minting, updating and
# deleting the key through the proxy's admin API.
#
# Adding a consumer: copy a file, change the name/secretName/remoteKey and the
# limits, add it here. Raising a budget: edit the number and commit - the
# operator diffs the live key against the spec and PATCHes only what changed,
# so the credential itself is preserved (same property the old script had).
#
# Every key here carries a `maxBudget` except `claude-code-subscription.yaml`,
# whose allow-list names the two subscription pass-through models - the
# natural `claude-sonnet-5` and `claude-opus-5` since the 2026-08-31 rename
# (previously `claude-code-subscription`/`claude-code-subscription-opus`; see
# that file's own header). It stays budgetless because those models are
# zero-priced across every field including
# the five prompt-cache ones (runbook §4a - zeroing only input/output left ~$54
# of fictional recorded spend until 2026-08-31), so recorded spend is $0 and a
# maxBudget could never trip. As of 2026-08-31 it also carries no rpmLimit/
# tpmLimit - enforcement is entirely upstream on Anthropic's subscription
# ceiling; LiteLLMClaudeCodeSubscriptionSpendRegression watches for renewed
# phantom spend. Read that file's header before copying its shape.
resources:
  - ./claude-code-subscription.yaml
  - ./demo.yaml
  - ./ha-demo.yaml
  - ./router-demo.yaml
  - ./repo-wiki.yaml
  - ./opencode.yaml
  - ./ai-pr-review.yaml
