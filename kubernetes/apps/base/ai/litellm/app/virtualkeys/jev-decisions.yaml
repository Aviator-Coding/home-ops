---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# The one non-admin key allowed through POST /openrouter/alpha/decisions (captain decision jev-door-grant).
# The grant is an out-of-Git admin /key/update (../../README.md). NEVER add spec.metadata: the operator
# would overwrite and delete the grant. Skill litellm-proxy (references/passthrough-lockdown.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: jev-decisions
spec:
  proxyRef: litellm
  keyAlias: jev-decisions
  secretName: litellm-key-jev-decisions
  secretKey: key
  # The Jev id only; it is not (and must not become) a LiteLLMModel.
  models:
    - typesafe/jev-1.13
  # Priced natively from the cost map; $1/30d stops a runaway loop.
  maxBudget: "1.00"
  budgetDuration: 30d
  rpmLimit: 30
  tpmLimit: 50000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the key to 1Password litellm-consumer-jev-decisions, where the decision skill reads it.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-jev-decisions
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-jev-decisions
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-jev-decisions
          property: key
