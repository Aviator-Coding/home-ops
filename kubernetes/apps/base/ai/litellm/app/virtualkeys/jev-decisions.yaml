---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Decision key: calls POST /v1/decisions or /v1/systemone against the `jev` model. No pass-through
# route, no out-of-Git grant. Skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: jev-decisions
spec:
  proxyRef: litellm
  keyAlias: jev-decisions
  secretName: litellm-key-jev-decisions
  secretKey: key
  # The proxy alias (models/jev.yaml), not the upstream typesafe id.
  models:
    - jev
  # Priced from OpenRouter's usage.cost; $1/30d stops a runaway loop.
  maxBudget: "1.00"
  budgetDuration: 30d
  rpmLimit: 300
  tpmLimit: 1000000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the key to 1Password litellm-consumer-jev-decisions, where the decision skill reads it.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-jev-decisions
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-jev-decisions
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-jev-decisions
          property: key
