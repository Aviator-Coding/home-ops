---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Captain-owned key for off-cluster agent-swarm runs; budgetless by captain decision (CI-asserted).
# Brought under Git by forced rotation (no adopt-by-alias); consumers re-copy it from 1Password.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: agent-swarm-captain
spec:
  proxyRef: litellm
  keyAlias: agent-swarm-captain
  secretName: litellm-key-agent-swarm-captain
  secretKey: key
  models:
    - chat-local
    - embedding-local
  metadata:
    purpose: agent-swarm local runs, captain-owned
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-agent-swarm-captain
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-agent-swarm-captain
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-agent-swarm-captain
          property: key
