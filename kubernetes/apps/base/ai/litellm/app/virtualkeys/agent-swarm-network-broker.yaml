---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Captain-owned, task-scoped key for proving the gateway path through the network broker.
# Brought under Git by forced rotation; entitlements carried over exactly as found live.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: agent-swarm-network-broker
spec:
  proxyRef: litellm
  keyAlias: agent-swarm-network-broker
  secretName: litellm-key-agent-swarm-network-broker
  secretKey: key
  models:
    - chat-local
    - embedding-local
  maxBudget: "1.00"
  metadata:
    purpose: prove the gateway path through the broker, task-scoped
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-agent-swarm-network-broker
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-agent-swarm-network-broker
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-agent-swarm-network-broker
          property: key
