---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# ai/opencode's workspace key, auto only (same boundary as router-demo). Budget = cloud-tier USD only;
# local volume is bounded by rpm/tpm. tpmLimit must clear one full agent turn at opencode.json's limits.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: opencode
spec:
  proxyRef: litellm
  keyAlias: opencode
  secretName: litellm-key-opencode
  secretKey: key
  models:
    - auto
    - embedding-local
  maxBudget: "10.00"
  budgetDuration: 30d
  rpmLimit: 8
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-opencode
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-opencode
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-opencode
          property: key
