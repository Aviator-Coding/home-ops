---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# ai/repo-wiki's 12-hourly generator cron on the zero-priced chat-local.
# WIKI_MODEL in ai/repo-wiki's HelmRelease must match this allow-list. Never give it auto.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: repo-wiki
spec:
  proxyRef: litellm
  keyAlias: repo-wiki
  secretName: litellm-key-repo-wiki
  secretKey: key
  models:
    - chat-local
    - embedding-local
  # Inert (zero-priced models) but kept: the guard if models is ever widened, and removing it
  # would not clear the live cap (omitempty). references/governance-keys.md.
  maxBudget: "30.00"
  budgetDuration: 30d
  # The real bound: one repo is 9 back-to-back calls (1 plan + 8 pages).
  rpmLimit: 12
  # A full repo regen is ~137k tokens; 200000 clears one within a minute.
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-repo-wiki
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-repo-wiki
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-repo-wiki
          property: key
