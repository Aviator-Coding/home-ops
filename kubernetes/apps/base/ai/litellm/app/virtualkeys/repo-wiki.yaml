---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Batch consumer for ai/repo-wiki's 12-hourly generator cron (captain request
# 2026-08-26), running on the LOCAL B70 via the zero-priced `chat-local` alias.
#
# This key spends NOTHING, and that is now literally true rather than a
# footnote. Every model it may call is priced at zero, so its recorded spend
# stays flat at whatever it had already accrued and `maxBudget` below can never
# trip. See the maxBudget comment for why the number is still here.
#
# HISTORY - what changed and why. Until 2026-08-27 this key called
# `qwen3.6-35b-a3b`, which carries deliberately inflated per-token prices whose
# only purpose is letting the `demo` key's $0.05 cap be exhausted by one smoke
# test (models/qwen3.6-35b-a3b.yaml). Running the generator through that alias
# meant a batch job on free hardware accrued play money at ~$7.50 per repo
# regenerated, and this file used to carry a long sizing calculation treating
# those numbers as a real constraint. They never were. The figures had already
# stopped describing reality: repos.txt has since grown well past what $30
# covers at that fictional rate, so the *only* thing the budget was on track to
# do was 429 the backfill partway through for zero actual cost. Measured live
# 2026-08-27 before the switch: $7.82 accrued against the $30 cap, all of it
# imaginary.
#
# The generator asks for this alias by name via WIKI_MODEL in
# kubernetes/apps/base/ai/repo-wiki/app/helmrelease.yaml. That env var and this
# allow-list have to move together - a key scoped to `chat-local` while the
# CronJob still requests `qwen3.6-35b-a3b` fails every call on the allow-list.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: repo-wiki
spec:
  proxyRef: litellm
  keyAlias: repo-wiki
  secretName: litellm-key-repo-wiki
  secretKey: key
  # Direct local model only - this is a scheduled batch job, not a routed
  # interactive consumer, so it does not need the `auto` alias (and must not
  # have it: `auto`'s COMPLEX/REASONING tiers are Anthropic, which would put an
  # unattended cron on a paid API). `chat-local` carries no cloud fallback
  # either, so this key is structurally incapable of reaching a paid model.
  models:
    - chat-local
  # INERT, deliberately kept. Every model above is priced at zero, so spend can
  # never rise and this cap can never fire - it bounds nothing today. It stays
  # for two reasons. (1) It is the guard that matters the moment anyone widens
  # `models` above to something real: a cloud alias added to a key with no
  # budget is an uncapped unattended cron. (2) Deleting it would NOT clean up
  # the live key. The operator builds its update body with
  # `MaxBudget *float64  json:"max_budget,omitempty"` and skips the field
  # entirely when spec.maxBudget is "" (litellm-operator
  # internal/controller/litellmvirtualkey_controller.go virtualKeyRequest), so
  # an omitted budget is never sent as an explicit null - while its drift check
  # compares `reflect.DeepEqual(live.MaxBudget, desired.MaxBudget)`. Live 30.0
  # vs desired nil never converges, so removing this line leaves the $30 cap
  # standing on the live key while Git claims there is none, and re-PATCHes it
  # on every reconcile forever. What actually bounds this consumer is
  # rpmLimit/tpmLimit below plus MAX_REPOS_PER_RUN=1 in the CronJob.
  maxBudget: "30.00"
  budgetDuration: 30d
  # THE bound on this consumer, now that the dollar cap is inert - and the pair
  # below were measured, not guessed. At the previous rpmLimit: 4 this job was
  # structurally unable to finish a repo: generate.py issues 1 plan call + up to
  # 8 page calls back to back with no retry or backoff, so the proxy 429'd the
  # 5th call inside the same minute ("Limit type: requests. Current limit: 4,
  # Remaining: 0") and the generator caught it and skipped the whole repo
  # ("skipped <repo>: HTTP Error 429"). Observed on a real triggered run
  # 2026-08-27: 1 page generated, then skipped.
  #
  # That 429 used to be ambiguous - budget or rate - and the comment this
  # replaces guessed wrong, telling the next reader to raise maxBudget. With
  # spend pinned at $0 by chat-local, any 429 on this key is now unambiguously
  # one of these two limits, and the error message names which.
  #
  # 12 clears one repo's 9 sequential calls with headroom.
  rpmLimit: 12
  # Each page call can send up to PAGE_CTX_CHARS (60000 chars =~ 15k tokens) of
  # source context, and a full repo regen is ~137k tokens across its 9 calls
  # (1 plan ~5k + 8 pages ~15k each, plus output). At the previous 30000 this
  # bound the job even harder than rpmLimit did - two page calls exhausted it -
  # so it moves in the same pass rather than leaving a second 429 waiting behind
  # the first. 200000 clears a whole repo inside one minute worst-case (matching
  # the opencode consumer's value) and stays a real runaway backstop.
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Mirrors the operator-minted key into 1Password item `litellm-consumer-repo-wiki`
# (auto-created - not a captain prerequisite), the same continuity pattern as
# litellm-consumer-demo/router-demo.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-repo-wiki
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-repo-wiki
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-repo-wiki
          property: key
