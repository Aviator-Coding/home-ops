---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# selfhosted/linkwarden's key (AI tagging on the local model). chat-local only, so spend is $0 by
# construction and maxBudget is an inert guard (same reasoning as repo-wiki); rpm/tpm are the real
# bound on the shared B70. See skill litellm-proxy (references/governance-keys.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: linkwarden
spec:
  proxyRef: litellm
  keyAlias: linkwarden
  secretName: litellm-key-linkwarden
  secretKey: key
  models:
    - chat-local
    - embedding-local
  maxBudget: "1.00"
  budgetDuration: 30d
  rpmLimit: 30
  tpmLimit: 200000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-linkwarden
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-linkwarden
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-linkwarden
          property: key
