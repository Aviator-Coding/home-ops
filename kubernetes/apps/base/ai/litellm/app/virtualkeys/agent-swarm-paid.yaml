---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Captain-owned key for off-cluster agent-swarm paid runs. `models: []` means ALL models, on purpose,
# under the hard $25 cap; do not narrow it without a captain decision. Rotation resets its spend counter.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: agent-swarm-paid
spec:
  proxyRef: litellm
  keyAlias: agent-swarm-paid
  secretName: litellm-key-agent-swarm-paid
  secretKey: key
  models: []
  maxBudget: "25.00"
  budgetDuration: 30d
  metadata:
    purpose: agent-swarm paid runs, captain-owned, hard cap
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-agent-swarm-paid
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-agent-swarm-paid
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-agent-swarm-paid
          property: key
