---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# Auto-router consumer, auto only: reaches cloud tiers only by classification, never directly.
# Its budget measures only COMPLEX/REASONING cloud spend. references/auto-router.md.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: router-demo
spec:
  proxyRef: litellm
  keyAlias: router-demo
  secretName: litellm-key-router-demo
  secretKey: key
  models:
    - auto
    - embedding-local
  maxBudget: "0.5"
  budgetDuration: 30d
  rpmLimit: 6
  tpmLimit: 60000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-router-demo
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-router-demo
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-router-demo
          property: key
