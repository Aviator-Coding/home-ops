---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmvirtualkey_v1alpha1.json
# D3 auto-router consumer. Scoped to the routed alias ONLY, which is the point:
# this key reaches Anthropic exclusively through a classification it does not
# control. A key whose models list contains only `auto` can still be routed to
# every tier backend AND still runs the classifier: verified 2026-08-26 - the
# allow-list is checked against the model the CALLER asked for, not the one the
# router resolves to. That makes `auto` a real governance boundary - such a key
# cannot call claude-opus-5 directly, only reach it by being classified into
# that tier.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMVirtualKey
metadata:
  name: router-demo
spec:
  proxyRef: litellm
  keyAlias: router-demo
  secretName: litellm-key-router-demo
  secretKey: key
  models:
    - auto
  # Deliberately small but larger than the `demo` cap. A purely local routed
  # request (SIMPLE/MEDIUM + classifier) no longer moves spend at all -
  # chat-local and qwen3.6-35b-a3b-classifier are zero-priced, so both spend
  # rows stay 0.0 (measured 2026-08-27: a SIMPLE auto request went $0.04735
  # before the split, $0.003 with tiers moved but classifier still priced, then
  # $0.00000000 once the classifier was zeroed). This $0.50 cap therefore
  # measures only cloud-tier spend on COMPLEX/REASONING. Raise maxBudget here
  # when real Anthropic traffic runs it out; local volume is rpmLimit/tpmLimit.
  maxBudget: "0.5"
  budgetDuration: 30d
  rpmLimit: 6
  tpmLimit: 60000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-key-router-demo
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-key-router-demo
  data:
    - match:
        secretKey: key
        remoteRef:
          remoteKey: litellm-consumer-router-demo
          property: key
