---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Aviator Anthropic org route. The v1.103.1 cost map has no anthropic/claude-sonnet-5-5
# entry, so these are the published rates ($2/$10 per 1M, cache read $0.10, 5m write
# $2.50, 1h write $4). A single rate: above-200k fields match the base.
# See skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-sonnet-5-5
spec:
  modelName: claude-sonnet-5-5
  proxyRef: litellm
  params:
    model: anthropic/claude-sonnet-5-5
    apiKey: os.environ/ANTHROPIC_API_KEY
  info:
    extra:
      input_cost_per_token: 0.000002
      output_cost_per_token: 0.00001
      input_cost_per_token_above_200k_tokens: 0.000002
      output_cost_per_token_above_200k_tokens: 0.00001
      cache_read_input_token_cost: 0.0000001
      cache_read_input_token_cost_above_200k_tokens: 0.0000001
      cache_creation_input_token_cost: 0.0000025
      cache_creation_input_token_cost_above_1hr: 0.000004
      cache_creation_input_token_cost_above_200k_tokens: 0.0000025
