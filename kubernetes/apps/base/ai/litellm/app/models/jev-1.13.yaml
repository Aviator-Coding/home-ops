---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# TypeSafe Jev 1.13 - a structured decision model. Captain request
# 2026-09-27: https://openrouter.ai/typesafe/jev-1.13
#
# OpenRouter is the only credential this repo holds that reaches this
# vendor, so it is the route by necessity, not preference.
#
# Model id verified against the per-model ENDPOINTS catalog, not the public
# listing: `typesafe/jev-1.13` is ABSENT from
# `GET https://openrouter.ai/api/v1/models` (which lists only the unrelated
# `typesafe/jev-router`, a text-output model router built on a different
# model) but resolves at
# `GET https://openrouter.ai/api/v1/models/typesafe/jev-1.13/endpoints`
# (verified 2026-09-27), which returned this exact id, "TypeSafe: Jev 1.13",
# context_length 32000, max_completion_tokens 28800, and pricing
# prompt=0.000000042/completion=0 - matching the captain's request.
#
# NOT LIVE-VERIFIED: OpenRouter's architecture for this model reports
# modality `text->decisions` / output_modalities: ["decisions"], unlike
# every other model in this directory (all `->text`). Whether LiteLLM's
# chat-completions path can render that response into
# `choices[0].message.content` at all is unconfirmed - see
# ../../README.md Model catalog for status before relying on this entry.
#
# REGISTRATION ONLY - see ./kustomization.yaml for what that does and does
# not grant, and for why no `info.extra` prices appear here.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: jev-1.13
spec:
  modelName: jev-1.13
  proxyRef: litellm
  params:
    model: openrouter/typesafe/jev-1.13
    apiKey: os.environ/OPENROUTER_API_KEY
