---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Aviator Anthropic org route. The v1.103.1 cost map has no anthropic/claude-haiku-5-5
# entry. Sticker rates are prompts at or under 100k tokens ($0.10/$0.50 per 1M, cache
# read $0.01, 5m write $0.125, 1h write $0.20). The published over-100k tier is 5x and
# is stored on the above-200k fields, the only long-context breakpoint this image has.
# Prompts between 100k and 200k tokens are therefore counted at the sticker rate.
# See skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-haiku-5-5
spec:
  modelName: claude-haiku-5-5
  proxyRef: litellm
  params:
    model: anthropic/claude-haiku-5-5
    apiKey: os.environ/ANTHROPIC_API_KEY
  info:
    extra:
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000005
      input_cost_per_token_above_200k_tokens: 0.0000005
      output_cost_per_token_above_200k_tokens: 0.0000025
      cache_read_input_token_cost: 0.00000001
      cache_read_input_token_cost_above_200k_tokens: 0.00000005
      cache_creation_input_token_cost: 0.000000125
      cache_creation_input_token_cost_above_1hr: 0.0000002
      cache_creation_input_token_cost_above_200k_tokens: 0.000000625
