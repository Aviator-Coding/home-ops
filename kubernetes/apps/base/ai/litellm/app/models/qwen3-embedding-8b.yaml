---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# The vector store's embedding model (OpenRouter, metered). Store callers request dimensions: 2000.
# Declares its real price: the bundled cost map has no openrouter entry and would record $0.
# See skill litellm-proxy (references/vector-store.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3-embedding-8b
spec:
  modelName: qwen/qwen3-embedding-8b
  proxyRef: litellm
  params:
    model: openrouter/qwen/qwen3-embedding-8b
    apiKey: os.environ/OPENROUTER_API_KEY
  info:
    mode: embedding
    maxInputTokens: 32768
    extra:
      input_cost_per_token: 0.00000001
      output_cost_per_token: 0
