---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# xAI SuperGrok subscription via the in-cluster cliproxyapi (OpenAI-compatible, OAuth held there), not XAI_API_KEY.
# Registration only: no key is entitled by this file.
# INVARIANT: explicit $0 on every price field (flat-rate subscription). Skill litellm-proxy.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: grok-4.5
spec:
  modelName: grok-4.5
  proxyRef: litellm
  params:
    model: openai/grok-4.5
    apiBase: http://cliproxyapi.ai.svc.cluster.local:8317/v1
    apiKey: os.environ/CLIPROXYAPI_API_KEY
  info:
    mode: chat
    maxInputTokens: 500000
    maxOutputTokens: 500000
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
