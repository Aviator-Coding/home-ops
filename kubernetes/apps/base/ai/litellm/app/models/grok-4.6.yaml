---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier S - SOTA (frontier ceiling).
# Source: captain's `indydevdan-model-stack` sheet, 2026-08-27.
#
# Direct xAI route - cheaper and one hop shorter than OpenRouter, and
# the credential exists (captain's xAI subscription).
# Model id verified against the live provider catalog: GET https://api.x.ai/v1/models (2026-08-27).
#
# REGISTRATION ONLY - see ./kustomization.yaml for what that does and does
# not grant, and for why no `info.extra` prices appear here.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: grok-4.6
spec:
  modelName: grok-4.6
  proxyRef: litellm
  params:
    model: xai/grok-4.6
    apiKey: os.environ/XAI_API_KEY
