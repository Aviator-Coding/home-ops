---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# The AI PR reviewer's alias: zero-priced, terminal (no cloud fallback), thinking off because the
# action parses `content`. Never point the reviewer at chat-local or the classifier.
# See skill litellm-proxy (references/pr-reviewer.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: pr-review-local
spec:
  modelName: pr-review-local
  proxyRef: litellm
  params:
    model: openai/qwen3.6-35b-a3b
    apiBase: http://vllm-app.ai.svc.cluster.local:8000/v1
    apiKey: "not-needed" # llama.cpp server has no --api-key set
    additional:
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
  # Hub metadata only; keep identical on all five aliases.
  info:
    mode: chat
    maxInputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: false
