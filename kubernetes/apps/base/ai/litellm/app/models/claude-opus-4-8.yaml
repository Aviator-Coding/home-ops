---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier S - SOTA (frontier ceiling).
# Source: captain's `indydevdan-model-stack` sheet, 2026-08-27.
#
# Direct Anthropic route - the captain's own Anthropic subscription key.
# Model id verified against the live provider catalog: GET https://api.anthropic.com/v1/models (2026-08-27).
#
# Anthropic's native id is DASH-form `claude-opus-4-8`; OpenRouter's
# `anthropic/claude-opus-4.8` is a different string for the same model and
# does NOT resolve on the direct `anthropic/` route we take here.
#
# REGISTRATION ONLY - see ./kustomization.yaml for what that does and does
# not grant, and for why no `info.extra` prices appear here.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-opus-4-8
spec:
  modelName: claude-opus-4-8
  proxyRef: litellm
  params:
    model: anthropic/claude-opus-4-8
    apiKey: os.environ/ANTHROPIC_API_KEY
