---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Zero-priced local alias WITH the claude-sonnet-5-metered fallback: holding it IS the cloud
# entitlement (config fallbacks bypass allow-lists). See skill litellm-proxy (references/fallbacks.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: chat-ha
spec:
  modelName: chat-ha
  proxyRef: litellm
  params:
    # The loaded model's real name, from ConfigMap chat-model. Never type it here.
    model: openai/${CHAT_MODEL_ID}
    apiBase: http://vllm-app.ai.svc.cluster.local:8000/v1
    apiKey: "not-needed" # llama.cpp server has no --api-key set
  # Hub metadata only; keep identical on all five aliases.
  info:
    mode: chat
    maxInputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    extra:
      supports_reasoning: true
