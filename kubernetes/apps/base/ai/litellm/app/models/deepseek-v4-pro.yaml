---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier B (indydevdan-model-stack). Registration only - no key is entitled by this file.
# Id resolved on the live OpenRouter catalog; no info.extra prices (cost map is the invoice).
# Undated slug = the older `0423` snapshot, distinct from deepseek-v4-pro-0813.
# See skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: deepseek-v4-pro
spec:
  modelName: deepseek-v4-pro
  proxyRef: litellm
  params:
    model: openrouter/deepseek/deepseek-v4-pro
    apiKey: os.environ/OPENROUTER_API_KEY
