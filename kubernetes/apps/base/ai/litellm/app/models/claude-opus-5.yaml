---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Cloud tier backend for the D3 auto-router (REASONING tier).
#
# Credentials are the ALREADY-EXISTING 1Password `ai-keys` item that every
# agentgateway backend in this namespace already extracts (see
# kubernetes/apps/base/ai/agentgateway/app/backends/anthropic.yaml). No new
# 1Password item is introduced by the router; externalsecret.yaml just adds a
# second `extract` of that same item so ANTHROPIC_API_KEY reaches this pod,
# where the proxy's envFrom makes it visible to `os.environ/...`.
#
# Reachable directly as well (`model: claude-opus-5`), which is deliberate:
# the router is one more way in, never the only way in.
#
# Prices come from LiteLLM's built-in model-cost map, so routed cloud spend is
# real USD against the per-consumer D4 budgets - do NOT add `info.extra`
# prices here or the accounting stops matching the invoice.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-opus-5
spec:
  modelName: claude-opus-5
  proxyRef: litellm
  params:
    model: anthropic/claude-opus-5
    # Literal `os.environ/` reference, not apiKeyRef: the key already reaches
    # the pod through the proxy's envFrom on litellm-secret. apiKeyRef would
    # inject a second, differently-named env var (LITELLM_MODELKEY_*) for the
    # same value.
    apiKey: os.environ/ANTHROPIC_API_KEY
