---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Claude Max subscription via the in-cluster cliproxyapi (OpenAI-compatible, OAuth held there), not the
# metered ANTHROPIC_API_KEY. The *-metered routes stay on the API key as the auto-router and fallback targets.
# INVARIANT: explicit $0 on every price field (flat-rate subscription). Skill litellm-proxy.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-sonnet-4-6
spec:
  modelName: claude-sonnet-4-6
  proxyRef: litellm
  params:
    model: openai/claude-sonnet-4-6
    apiBase: http://cliproxyapi.ai.svc.cluster.local:8317/v1
    apiKey: os.environ/CLIPROXYAPI_API_KEY
  info:
    mode: chat
    supportsFunctionCalling: true
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      cache_read_input_token_cost_above_200k_tokens: 0
      cache_creation_input_token_cost: 0
      cache_creation_input_token_cost_above_1hr: 0
      cache_creation_input_token_cost_above_200k_tokens: 0
