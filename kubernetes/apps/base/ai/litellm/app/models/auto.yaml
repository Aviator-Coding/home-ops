---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# The D3 complexity-tier router (additive; direct model names keep working).
# See skill litellm-proxy (references/auto-router.md) before editing.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: auto
spec:
  modelName: auto
  proxyRef: litellm
  params:
    model: auto_router/complexity_router
    additional:
      # The fail-open pin LiteLLM actually reads. Keep it AND default_model below on
      # chat-local, or a retargeted tier silently makes classifier failures spend cloud money.
      complexity_router_default_model: chat-local
      complexity_router_config:
        # Cloud tiers must name the -metered CRs (the natural names are credential-less pass-throughs).
        tiers:
          SIMPLE: chat-local
          MEDIUM: chat-local
          COMPLEX: claude-sonnet-5-metered
          REASONING: claude-opus-5-metered

        # Needs LiteLLM >= v1.93.0; below it this block is silently ignored.
        classifier_type: llm
        classifier_llm_config:
          # LOCAL, thinking-off classifier; never a cloud model.
          model: qwen3.6-35b-a3b-classifier
          timeout_ms: 8000
          # `legacy` (the default) grades routine work as top tier.
          classification_rubric: agentic

        # Fail open to local, never to the heuristic scorer.
        classifier_fallback: default_model
        default_model: chat-local
        return_raw_model_name: true
        session_affinity: false
  info:
    # Hub metadata only; window and pricing are whichever tier served.
    mode: chat
