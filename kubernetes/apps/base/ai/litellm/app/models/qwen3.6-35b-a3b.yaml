---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# The synthetically PRICED local alias: the `demo` budget-test fixture only, never production traffic.
# See skill litellm-proxy (references/governance-keys.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: qwen3.6-35b-a3b
spec:
  modelName: qwen3.6-35b-a3b
  proxyRef: litellm
  params:
    model: openai/qwen3.6-35b-a3b
    apiBase: http://vllm-app.ai.svc.cluster.local:8000/v1
    apiKey: "not-needed" # llama.cpp server has no --api-key set
  info:
    # Hub metadata; keep identical on all five aliases (only the prices differ).
    mode: chat
    maxInputTokens: 262144
    supportsFunctionCalling: true
    supportsVision: true
    # Governance-accounting prices so demo's $0.05 cap is exhaustible by one smoke test.
    extra:
      input_cost_per_token: 0.00005
      output_cost_per_token: 0.0001
      supports_reasoning: true
