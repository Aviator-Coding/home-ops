---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Claude Code subscription PASS-THROUGH: the caller's own OAuth token pays, never ANTHROPIC_API_KEY.
# INVARIANT: placeholder apiKey + $0 on all seven price fields below are load-bearing (money safety).
# Fable 5.1, a distinct model from the metered claude-fable-5 (not a rename).
# See skill litellm-proxy (references/claude-code-subscription.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-fable-5-1
spec:
  modelName: claude-fable-5-1
  proxyRef: litellm
  params:
    model: anthropic/claude-fable-5-1
    # Placeholder, not a secret: omitting apiKey would fall back to the metered ANTHROPIC_API_KEY.
    apiKey: "sk-ant-oat-PLACEHOLDER-CLIENT-SENDS-ITS-OWN-TOKEN"
  info:
    # Flat-rate invoice: explicit $0, including the five cache fields (IO-only zeros left ~$54 phantom spend).
    extra:
      input_cost_per_token: 0
      output_cost_per_token: 0
      cache_read_input_token_cost: 0
      cache_read_input_token_cost_above_200k_tokens: 0
      cache_creation_input_token_cost: 0
      cache_creation_input_token_cost_above_1hr: 0
      cache_creation_input_token_cost_above_200k_tokens: 0
