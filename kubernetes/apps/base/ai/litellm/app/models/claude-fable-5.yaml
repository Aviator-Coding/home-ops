---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier S+ (indydevdan-model-stack). Registration only - no key is entitled by this file.
# Id resolved on the live Anthropic catalog; no info.extra prices (cost map is the invoice).
# Metered Fable 5; distinct from the claude-fable-5-1 subscription pass-through.
# See skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: claude-fable-5
spec:
  modelName: claude-fable-5
  proxyRef: litellm
  params:
    model: anthropic/claude-fable-5
    apiKey: os.environ/ANTHROPIC_API_KEY
