---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# Tier S (indydevdan-model-stack). Registration only - no key is entitled by this file.
# No info.extra prices (cost map is the invoice).
# $50 per 1M output tokens: never add it to an auto-router tier or fallback chain.
# See skill litellm-proxy (references/model-catalog.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: gpt-6-astra-pro
spec:
  modelName: gpt-6-astra-pro
  proxyRef: litellm
  params:
    model: openrouter/openai/gpt-6-astra-pro
    apiKey: os.environ/OPENROUTER_API_KEY
