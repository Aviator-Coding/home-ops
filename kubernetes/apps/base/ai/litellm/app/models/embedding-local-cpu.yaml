---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmmodel_v1alpha1.json
# LiteLLM's front door to the cluster's local embedding service (captain
# request 2026-09-13: "how can an external service consume the embedding?").
# Not one of the five B70 chat aliases - this is a SEPARATE CPU-only backend,
# HuggingFace Text Embeddings Inference serving Qwen/Qwen3-Embedding-0.6B
# (up to 1024-dim; capped to a 384-token effective context by
# embeddingserver.yaml's `--max-batch-tokens 384` - see that file for the
# full 2026-09-14 investigation into why neither raising this ceiling nor
# disabling auto_truncate closes the silent-truncation gap for THIS route:
# TEI's OpenAI-compatible /v1/embeddings - what this LiteLLM model actually
# calls - hardcodes its truncate behavior to the server-wide default with
# no per-request override in its request schema at all, unlike TEI's native
# /embed endpoint), declared at ../../toolhive/config/embeddingserver.yaml
# and already OpenAI-API compatible at its native /v1/embeddings.
# `info.mode: embedding` tells LiteLLM to treat this alias as an embedding
# model rather than chat.
#
# MODEL SWAPPED 2026-09-13 from sentence-transformers/all-MiniLM-L6-v2
# (384-dim, silently truncated anything past 256 tokens via auto_truncate,
# English-only) to Qwen3-Embedding-0.6B - see ../../toolhive/config/
# embeddingserver.yaml for the full reasoning and resource re-sizing. The
# `params.model` string below MUST always name the same upstream model
# embeddingserver.yaml declares - LiteLLM does not verify this against the
# live backend, so a mismatch here would describe a model that is not what
# is actually serving requests.
#
# VECTOR-SPACE BREAK: 384-dim MiniLM vectors and up-to-1024-dim Qwen3
# vectors are not comparable, so this is not a drop-in swap for any existing
# stored embedding. As of this change the only consumer that persists
# anything derived from this endpoint is ToolHive's `mcp-gateway-internal`
# VirtualMCPServer (../../toolhive/config/virtualmcpserver.yaml), whose tool-
# selection semantic index (~959 vectors over the live MCP tool catalog,
# measured 2026-09-13) is held entirely in-memory by the vmcp pod - no PVC,
# `readOnlyRootFilesystem: true`, no writable volume of any kind - so it is
# rebuilt from scratch on every restart of that pod, never persisted to disk.
# The `embedding-external` virtual key (../virtualkeys/embedding-external.yaml)
# has no live external consumer yet (see that file's own "once one exists"
# note), so there is nothing further to re-index today; a future consumer
# that stores vectors from this alias must re-embed its corpus after any
# future model swap here, same as this one.
#
# NAMED "-local-cpu", deliberately, so no consumer can mistake this for a GPU
# path: it is pure CPU inference on the toolhive-operator-managed pod, never
# the Arc Pro B70. This registration does not touch the B70 or the vllm-embed
# deployment on it (kubernetes/apps/base/ai/vllm/app/helmrelease.yaml, pinned
# replicas: 0 - compute isolation, sharing the B70 with chat decode measured a
# 38x collapse). See ../virtualkeys/embedding-external.yaml for the
# consumer-side entitlement and a worked curl example.
#
# NO `info.extra` PRICES, deliberately, same rule as chat-local/pr-review-local
# (see ./kustomization.yaml): the pod runs on CPU, sunk hardware cost, so real
# spend through this alias is always $0 and a consumer's maxBudget keeps
# measuring exactly one thing - real USD.
#
# NO CLOUD FALLBACK, deliberately, and for a different reason than the chat
# aliases: a fallback embedder at different dimensions would silently corrupt
# any vector index built against this model's output (the same reason
# ../../agentgateway/app/backends/vllm.yaml's `llm-chat-failover` explicitly
# excludes embeddings). This alias appears in neither `fallbacks` nor
# `context_window_fallbacks` in ../litellmproxy.yaml.
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: embedding-local-cpu
spec:
  modelName: embedding-local-cpu
  proxyRef: litellm
  params:
    model: openai/Qwen/Qwen3-Embedding-0.6B
    apiBase: http://mcp-tools-embedding.ai.svc.cluster.local:8080/v1
    apiKey: "not-needed" # TEI server has no --api-key set
  info:
    mode: embedding
