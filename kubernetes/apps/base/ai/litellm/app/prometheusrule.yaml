---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: litellm-rules
  labels:
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: litellm.rules
      rules:
        - alert: LiteLLMProxyDown
          annotations:
            description: The LiteLLM governance proxy has been unreachable for 5 minutes.
            summary: LiteLLM proxy is down.
          expr: |-
            up{job="litellm"} == 0
          for: 5m
          labels:
            severity: critical
        - alert: LiteLLMHighFailureRate
          annotations:
            description: LiteLLM has returned failed requests at a sustained rate for 10 minutes - check the /v1 backend (vllm-app) and proxy logs.
            summary: LiteLLM is failing a sustained share of requests.
          expr: |-
            rate(litellm_proxy_failed_requests_metric_total[15m]) > 0.1
          for: 10m
          labels:
            severity: warning
        - alert: LiteLLMConsumerBudgetExhausted
          annotations:
            description: 'A LiteLLM virtual key has spent its full budget_duration budget. Deliberate per D4 (tiny initial budgets) - raise the limit on the matching LiteLLMVirtualKey in virtualkeys/ if that consumer needs more headroom, or leave it to reset at the next budget_duration boundary.'
            summary: A LiteLLM consumer key has hit its spend budget.
          expr: |-
            litellm_remaining_api_key_budget_metric <= 0
          for: 5m
          labels:
            severity: warning
        # Fallback/router alerts: skill litellm-proxy (references/fallbacks.md, references/auto-router.md).
        # The two fallback counters are SPARSE (no series until the first fallback): absence is the
        # healthy state, not a wrong name - do not "repair" these alerts. Names need the _total suffix.
        - alert: LiteLLMFallbackChainExhausted
          annotations:
            description: >-
              Every leg of a LiteLLM fallback chain failed - the primary
              {{ $labels.requested_model }} AND its fallback
              {{ $labels.fallback_model }} both errored, so the caller got a
              5xx. This is the one fallback alert that means real user-visible
              breakage rather than degraded-but-serving: check the B70
              (vllm-app) and the Anthropic status page together, because it
              takes both being unavailable to get here.
            summary: A LiteLLM fallback chain is exhausted - requests are failing outright.
          expr: |-
            sum by (requested_model, fallback_model) (rate(litellm_deployment_failed_fallbacks_total[10m])) > 0
          for: 5m
          labels:
            severity: critical
        # Split by exception_class so prompt overflow does not raise the availability alert.
        - alert: LiteLLMSustainedFailover
          annotations:
            description: >-
              {{ $labels.requested_model }} has been failing over to
              {{ $labels.fallback_model }} continuously for 15 minutes. Traffic
              IS being served - that is the design - but it is being served by
              a paid cloud model and is spending real USD, so this is a silent
              cost event as much as an availability one. Fix the local backend;
              until then watch the holder key's budget
              (LiteLLMConsumerBudgetExhausted is the backstop). Context-window
              overflow is excluded here and handled by
              LiteLLMContextWindowFallbackFiring.
            summary: LiteLLM has been on its cloud fallback for 15 minutes.
          expr: |-
            sum by (requested_model, fallback_model) (
              rate(litellm_deployment_successful_fallbacks_total{exception_class!~".*ContextWindowExceeded.*"}[15m])
            ) > 0
          for: 15m
          labels:
            severity: warning
        - alert: LiteLLMContextWindowFallbackFiring
          annotations:
            description: >-
              {{ $labels.requested_model }} is overflowing its context window
              and falling back to {{ $labels.fallback_model }}. Expected
              occasionally - the local model stops at 262,144 input tokens and
              the cloud target accepts 1,000,000 - but a sustained rate means a
              consumer is routinely sending prompts the local tier can never
              serve, so it is paying cloud rates for ALL of that traffic.
              Consider whether that consumer should be on a cloud alias
              outright, or should be trimming its context.
              exception_class is matched by regex because LiteLLM prefixes it
              with the provider (observed form: `Openai.InternalServerError`).
            summary: LiteLLM context-window fallback is firing steadily.
          expr: |-
            sum by (requested_model, fallback_model) (
              rate(litellm_deployment_successful_fallbacks_total{exception_class=~".*ContextWindowExceeded.*"}[30m])
            ) > 0
          for: 30m
          labels:
            severity: warning
        - alert: LiteLLMDeploymentStuckFailing
          annotations:
            description: >-
              Deployment {{ $labels.litellm_model_name }} ({{ $labels.api_base }})
              is marked unhealthy AND is still producing failures. The
              `and on(model_id)` guard is load-bearing: litellm_deployment_state
              is a LATCHED gauge (set to 1 on any failure, back to 0 only on a
              later success, never self-resetting), so on its own it would alert
              forever after a single transient blip on a deployment that then
              went idle. Pairing it with a live failure rate is what makes it
              mean "still broken" instead of "was broken once".
            summary: A LiteLLM deployment is unhealthy and still failing.
          expr: |-
            (litellm_deployment_state >= 1)
              and on (model_id)
            (sum by (model_id) (rate(litellm_deployment_failure_responses_total[15m])) > 0)
          for: 15m
          labels:
            severity: warning
        # api_provider="anthropic" keeps our own allow-list 403s (empty api_provider) off this alert.
        - alert: LiteLLMCloudProviderAuthFailing
          annotations:
            description: >-
              Anthropic is rejecting our credentials (HTTP
              {{ $labels.exception_status }}, {{ $labels.exception_class }}).
              The cloud fallback target is therefore NOT actually available -
              every fallback that reaches it will exhaust the chain. Check
              ANTHROPIC_API_KEY in the `ai-keys` 1Password item and the
              litellm-secret ExternalSecret.
            summary: LiteLLM cloud provider is rejecting our API credentials.
          expr: |-
            sum by (api_provider, exception_class, exception_status) (
              rate(litellm_deployment_failure_responses_total{api_provider="anthropic", exception_status=~"401|403"}[15m])
            ) > 0
          for: 10m
          labels:
            severity: critical
        - alert: LiteLLMCloudProviderQuotaExhausted
          annotations:
            description: >-
              Anthropic is returning 429s. Distinct from the auth alert above
              (that is a credential problem, this is a capacity/quota one) and
              from LiteLLMConsumerBudgetExhausted (that is OUR budget stopping
              us before we spend; this is the provider's). While it lasts the
              cloud fallback cannot absorb a local outage.
            summary: LiteLLM cloud provider is rate-limiting or out of quota.
          expr: |-
            sum by (api_provider) (
              rate(litellm_deployment_failure_responses_total{api_provider="anthropic", exception_status="429"}[15m])
            ) > 0
          for: 10m
          labels:
            severity: warning
        # requested_model is what the caller asked for; the classifier has its own model name.
        - alert: LiteLLMRouterClassifierFailingOpen
          annotations:
            description: >-
              The auto-router's local classifier is erroring or timing out for a
              sustained share of routed requests, so requests are failing OPEN to
              the local default tier without being classified. Traffic is still
              served (that is the design), but complex work is silently getting
              the small model. Check vllm-app health and B70 contention first,
              then raise classifier_llm_config.timeout_ms if the GPU is merely
              slow rather than broken.
            summary: LiteLLM auto-router classifier is failing open to the local tier.
          expr: |-
            sum(rate(litellm_deployment_failure_responses_total{requested_model="qwen3.6-35b-a3b-classifier"}[15m]))
              /
            clamp_min(sum(rate(litellm_deployment_total_requests_total{requested_model="qwen3.6-35b-a3b-classifier"}[15m])), 0.001)
              > 0.2
          for: 15m
          labels:
            severity: warning
        - alert: LiteLLMRouterClassifierSlow
          annotations:
            description: >-
              Mean auto-router classifier latency is above 6s over 30m. That
              latency rides EVERY routed request before any tokens are produced,
              and it is close enough to the 8s classifier timeout that requests
              are about to start failing open. Measured healthy baseline on the
              B70 is p50 3.0s / p95 4.6s.
            summary: LiteLLM auto-router classifier is slow enough to threaten the timeout.
          expr: |-
            sum(rate(litellm_llm_api_latency_metric_sum{requested_model="qwen3.6-35b-a3b-classifier"}[30m]))
              /
            clamp_min(sum(rate(litellm_llm_api_latency_metric_count{requested_model="qwen3.6-35b-a3b-classifier"}[30m])), 0.001)
              > 6
          for: 30m
          labels:
            severity: warning
        - alert: LiteLLMRouterCloudTierShare
          annotations:
            description: >-
              More than half of auto-router traffic is being classified into a
              cloud tier over the last hour. The router exists to keep cheap work
              local, so a sustained majority landing on Anthropic means either the
              traffic really did get harder, or the classifier/rubric has drifted.
              Tuning guidance: skill litellm-proxy, .agents/skills/litellm-proxy/references/auto-router.md (Tuning).
            summary: LiteLLM auto-router is sending most traffic to the cloud tier.
          expr: |-
            sum(rate(litellm_deployment_success_responses_total{requested_model="auto", litellm_model_name=~"claude-.*"}[1h]))
              /
            clamp_min(sum(rate(litellm_deployment_success_responses_total{requested_model="auto"}[1h])), 0.001)
              > 0.5
          for: 1h
          labels:
            severity: warning
        # That key has no budget or limits; any new spend means a $0 price field regressed.
        - alert: LiteLLMClaudeCodeSubscriptionSpendRegression
          annotations:
            description: >-
              The claude-code-subscription virtual key is recording NONZERO
              spend again. All four models it may call (claude-sonnet-5 and
              claude-opus-5, renamed from claude-code-subscription/-opus on
              2026-08-31; claude-haiku-4-5-20251001 and claude-fable-5-1, added
              2026-09-27) are priced at an explicit $0 on every field,
              including the five prompt-cache fields, specifically
              BECAUSE this key carries no maxBudget and no rate limits - a
              nonzero reading here means the pricing has regressed (a cache
              field un-zeroed, a new unpriced model added to the key's
              allow-list, etc), exactly as happened before 2026-08-31 when this
              key accrued $54.31 of fictional spend from unpriced prompt-cache
              tokens. No real money moves either way - the caller's own OAuth
              subscription pays Anthropic, never this cluster's metered key -
              but recorded spend climbing again means the accounting bug is
              back, and with no budget on this key, this counter is the only
              thing that will ever notice.
            summary: Claude Code subscription key spend is nonzero again - the cache-pricing zero-fix may have regressed.
          expr: |-
            increase(litellm_spend_metric_total{api_key_alias="claude-code-subscription"}[1h]) > 0
          for: 5m
          labels:
            severity: warning
