---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-consumer-keys
spec:
  refreshInterval: 5m
  secretStoreRefs:
    - name: onepassword
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-consumer-keys
  # One match block per entry in resources/consumers.json - add a block here
  # (secretKey == the consumer's `name`) whenever a consumer is added there.
  data:
    - match:
        secretKey: demo
        remoteRef:
          remoteKey: litellm-consumer-demo
          property: key
