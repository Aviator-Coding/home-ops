---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        # postgres-17-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        DATABASE_URL: "postgresql://{{ .POSTGRES_DB_USER_NAME }}:{{ .POSTGRES_DB_USER_PASSWORD }}@postgres-17-rw.database.svc.cluster.local:5432/{{ .POSTGRES_DB_NAME }}"

        # Postgres Init
        INIT_POSTGRES_DBNAME: "{{ .POSTGRES_DB_NAME }}"
        INIT_POSTGRES_HOST: "postgres-17-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_DB_USER_NAME }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Cloud tier of the D3 auto-router. LiteLLM reads ANTHROPIC_API_KEY
        # straight from the environment for `anthropic/*` deployments, which is
        # what models/claude-*.yaml's `os.environ/ANTHROPIC_API_KEY` resolves
        # against. This is the SAME already-existing 1Password `ai-keys` item
        # every agentgateway backend in this namespace already extracts (see
        # agentgateway/app/backends/anthropic.yaml) - no new 1Password item is
        # introduced. To turn the cloud tier off, point all four tiers in
        # models/auto.yaml at qwen3.6-35b-a3b; this key then goes unused.
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"

        # The other three provider credentials of the 2026-08-27
        # `indydevdan-model-stack` batch, resolved by models/*.yaml's
        # `apiKey: os.environ/...`. Same `ai-keys` extract as ANTHROPIC_API_KEY
        # above, and the SAME field names the agentgateway backends already
        # consume (agentgateway/app/backends/{xai,zai,openrouter}.yaml) - no new
        # 1Password item and no new field is introduced by this batch.
        #
        # Load-bearing at PROXY STARTUP, not only at call time: an `os.environ/`
        # reference the pod cannot resolve is a broken deployment entry, so
        # removing one of these without also removing every model that names it
        # takes the proxy down for ALL consumers, not just that model's callers.
        XAI_API_KEY: "{{ .XAI_API_KEY }}"
        ZAI_API_KEY: "{{ .ZAI_API_KEY }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: cloudnative-pg
    - extract:
        key: ai-keys
