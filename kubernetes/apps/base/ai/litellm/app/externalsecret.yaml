---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"
        # postgres-17-rw pinned by per-manifest hardcode (explicit GitOps, not OnePassword).
        DATABASE_URL: "postgresql://{{ .POSTGRES_DB_USER_NAME }}:{{ .POSTGRES_DB_USER_PASSWORD }}@postgres-17-rw.database.svc.cluster.local:5432/{{ .POSTGRES_DB_NAME }}"

        INIT_POSTGRES_DBNAME: "{{ .POSTGRES_DB_NAME }}"
        INIT_POSTGRES_HOST: "postgres-17-rw.database.svc.cluster.local"
        INIT_POSTGRES_USER: "{{ .POSTGRES_DB_USER_NAME }}"
        INIT_POSTGRES_PASS: "{{ .POSTGRES_DB_USER_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"

        # Provider keys from the shared `ai-keys` item. Resolved by models' os.environ/ refs AT STARTUP:
        # remove every model naming one before removing it here, or the whole proxy goes down.
        ANTHROPIC_API_KEY: "{{ .ANTHROPIC_API_KEY }}"
        XAI_API_KEY: "{{ .XAI_API_KEY }}"
        ZAI_API_KEY: "{{ .ZAI_API_KEY }}"
        OPENROUTER_API_KEY: "{{ .OPENROUTER_API_KEY }}"

        # SSO credential generated by OpenTofu (litellm.tofu) via pushsecret-sso.yaml.
        GENERIC_CLIENT_ID: "{{ .LITELLM_SSO_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LITELLM_SSO_CLIENT_SECRET }}"

        # Vector-store bearer key (pushsecret-pgvector.yaml). Never named PG_VECTOR_API_KEY.
        # Absent at startup is not fatal: only that store's searches fail.
        LITELLM_PGVECTOR_API_KEY: "{{ .LITELLM_PGVECTOR_SERVER_API_KEY }}"
  dataFrom:
    - extract:
        key: litellm
    - extract:
        key: cloudnative-pg
    - extract:
        key: ai-keys
    - extract:
        key: litellm-sso
    - extract:
        key: litellm-pgvector
