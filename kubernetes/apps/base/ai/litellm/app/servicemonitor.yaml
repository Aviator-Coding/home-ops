---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: litellm
spec:
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
      # Reuses the master key (deliberate): Prometheus holds the full admin credential,
      # which can also read logged prompts. Revisit before any broader exposure.
      authorization:
        credentials:
          name: litellm-secret
          key: LITELLM_MASTER_KEY
  # The operator labels its Service app.kubernetes.io/name=litellm; job="litellm" comes from its name.
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
  namespaceSelector:
    matchNames:
      - ai
