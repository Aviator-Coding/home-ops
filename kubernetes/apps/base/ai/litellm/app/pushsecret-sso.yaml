---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-sso-credentials
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-automation
      kind: SecretStore
  selector:
    secret:
      name: litellm-sso-credentials
  # Source Secret is created ONCE by the operator, from `tofu output` after the
  # approved apply that creates the Authentik provider. It is deliberately not
  # committed: it holds the OAuth2 client secret. See
  # docs/authentik/terraform.md section 8 for the exact hop.
  #
  # This is the seam between the two halves of this change. OpenTofu owns the
  # Authentik provider and generates the credential; it has no way to write into
  # the cluster. This carries that credential to 1Password, from where the
  # ExternalSecret next to it syncs it into litellm-secret. Push once, read
  # forever - and if the cluster is ever rebuilt, the credential is in 1Password
  # rather than only in tofu state.
  data:
    - match:
        secretKey: LITELLM_SSO_CLIENT_ID
        remoteRef:
          remoteKey: litellm-sso
          property: LITELLM_SSO_CLIENT_ID
    - match:
        secretKey: LITELLM_SSO_CLIENT_SECRET
        remoteRef:
          remoteKey: litellm-sso
          property: LITELLM_SSO_CLIENT_SECRET
