---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: litellm-sso-credentials
spec:
  refreshInterval: 1h
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: litellm-sso-credentials
  # Source Secret is created once by hand from `tofu output` (never committed); this carries the
  # OpenTofu-generated OIDC credential to 1Password. .agents/skills/authentik-terraform/references/apply-runbook.md.
  data:
    - match:
        secretKey: LITELLM_SSO_CLIENT_ID
        remoteRef:
          remoteKey: litellm-sso
          property: LITELLM_SSO_CLIENT_ID
    - match:
        secretKey: LITELLM_SSO_CLIENT_SECRET
        remoteRef:
          remoteKey: litellm-sso
          property: LITELLM_SSO_CLIENT_SECRET
