---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # `file`: the operator renders every adopted LiteLLMModel into config.yaml
  # and rolls the Deployment on change. The alternative (`api`) pushes models
  # to the proxy's DB-backed admin API live and turns store_model_in_db on,
  # which would make the running DB - not Git - the source of truth for the
  # model list. Deliberately not that (same reason the pre-operator
  # config.yaml refused store_model_in_db); see generalSettings below.
  applyMode: file
  image: ghcr.io/berriai/litellm-non_root:v1.102.1
  # ^ v1.93.0 is the FLOOR for the D3 auto-router: `classifier_type: llm` and
  # classifier_llm_config first exist there. Below it ComplexityRouterConfig is
  # `extra="allow"`, so those keys parse clean and are then IGNORED - the
  # router silently runs the rule-based scorer the reference repo measured at
  # 25-35% tier accuracy. The floor is machine-enforced by
  # .renovate/overrides.json5 (allowedVersions ">=1.93.0" on this exact package
  # name). Renovate's helm-values manager extracts this image (the kubernetes
  # manager's dashboard section is empty for the whole repo). Tag-only, matching
  # this line's existing pin: most single-line image refs in this repo are tags,
  # not tag@digest.
  # Upstream also dropped the `main-vX.Y.Z-stable` tag scheme after v1.81.x;
  # current releases are plain `vX.Y.Z`.
  replicas: 1

  service:
    type: ClusterIP
    port: 4000

  # NO spec.route - still deliberate, but the reason changed on 2026-08-26.
  # The captain approved an INTERNAL route (public listener remains forbidden),
  # and it is shipped as a hand-written httproute-internal.yaml next to this file rather
  # than through spec.route. Reason: the operator's route schema is exactly
  # {hostnames, parentRefs, filters} - no annotations field - so an
  # operator-owned route cannot carry the external-dns / Gatus / Homepage
  # annotations this repo puts on every app route. Setting spec.route here
  # would create a SECOND, competing HTTPRoute for the same Service; don't.
  # In-cluster consumers are unaffected and still use
  # http://litellm.ai.svc.cluster.local:4000.

  envFrom:
    # DATABASE_URL / LITELLM_MASTER_KEY / LITELLM_SALT_KEY plus the four
    # provider keys (ANTHROPIC/XAI/ZAI/OPENROUTER_API_KEY) and
    # GENERIC_CLIENT_ID / GENERIC_CLIENT_SECRET for the SSO login below.
    # LiteLLM picks the first three up from the environment automatically - do
    # not duplicate them into config; see docs/ai-system/litellm/README.md.
    # Models resolve the provider keys via `apiKey: os.environ/<VAR>` (see
    # README model-catalog).
    - secretRef:
        name: litellm-secret

  # --- UI single sign-on through Authentik ---------------------------------
  # Only the two credential halves are secret; everything here is public
  # configuration and stays in Git rather than being buried in a Secret.
  #
  # The Authentik side is managed by OpenTofu, not by Flux:
  # terraform/authentik/litellm.tofu. These endpoints must keep matching the
  # provider that file creates, and the redirect URI Authentik allows is derived
  # from PROXY_BASE_URL below - LiteLLM builds it as
  # get_custom_url(PROXY_BASE_URL) + "/sso/callback" (ui_sso.py). Change
  # PROXY_BASE_URL and the allowed redirect URI in litellm.tofu must change with
  # it, or every login fails at the provider with an opaque redirect_uri error.
  env:
    # `store_prompts_in_spend_logs` alone does NOT give you the full prompt.
    # Both the request body and the response are run through
    # `_sanitize_request_body_for_spend_logs_payload`
    # (proxy/spend_tracking/spend_tracking_utils.py:657), which truncates EVERY
    # string longer than MAX_STRING_LENGTH_PROMPT_IN_DB - default 2048 chars,
    # ~500 tokens (litellm/constants.py:375) - keeping 35% of the head and 65%
    # of the tail with a `litellm_truncated` marker in between. At the default,
    # any repo-wiki page context or pasted file is cut mid-prompt and the
    # captain sees a stitched fragment, not what was sent.
    #
    # The cap is per STRING, not per row, so an ordinary many-turn chat is
    # already captured whole at 2048; it is single long strings that lose
    # content. 1,000,000 chars covers the largest call measured on this proxy
    # (132,929 prompt tokens, ~0.5 MB of text) with ~2x headroom, while still
    # keeping the safeguard the limit exists for - a runaway base64 image data
    # URI cannot write an unbounded row.
    #
    # This is read at request time via os.getenv (that file:42), not import
    # time, so it can also be raised without a config rebuild - but keep it
    # declared here so Git stays the source of truth.
    - name: MAX_STRING_LENGTH_PROMPT_IN_DB
      value: "1000000"
    # authorize/token/userinfo are instance-global in Authentik, not per
    # application - only the issuer and jwks URLs carry the app slug. Taken from
    # the live .well-known/openid-configuration, not from documentation.
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/userinfo/
    # Drives the callback URL LiteLLM registers and the post-login redirect.
    # Without it LiteLLM falls back to the request base URL, which behind a
    # gateway is the in-cluster Service address and produces a redirect the
    # browser cannot follow.
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
    # Must match the provider's property_mappings in
    # terraform/authentik/litellm.tofu (openid/email/profile + litellm_role).
    # LiteLLM defaults GENERIC_SCOPE to "openid email profile", so without this
    # the custom litellm_role scope is never requested and Authentik never emits
    # the claim - first login then lands as INTERNAL_USER_VIEW_ONLY.
    - name: GENERIC_SCOPE
      value: openid email profile litellm_role
    # Claim name Authentik puts on the token/userinfo payload. LiteLLM defaults
    # this to "role"; the image reads it via get_nested_value (ui_sso.py).
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    # Send the UI straight to Authentik instead of showing the master-key form
    # first. Master-key browser login moves to /fallback/login once this is on;
    # API callers using the master key are unaffected.
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    # Pair with auto-redirect: LiteLLM logout only clears the local UI session,
    # so without an end-session hop the next /ui hit immediately re-authenticates
    # against the still-live Authentik SSO cookie. Slug matches
    # authentik_application.litellm.
    - name: PROXY_LOGOUT_URL
      value: https://auth.${SECRET_DOMAIN}/application/o/litellm/end-session/

  # Required for LiteLLMVirtualKey: the operator mints and syncs keys through
  # the proxy's admin API, authenticating with this master key. Endpoint
  # defaults to http://litellm.ai.svc:4000, which is exactly where we want it.
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    # Explicitly false: config.yaml (rendered from the LiteLLMModel CRs in
    # models/) stays the only source of truth for models, never UI-driven DB
    # edits. Carried forward from the pre-operator config.yaml, where the same
    # decision was made against this app's pre-2026-06-07 incarnation. It is
    # also the guard on applyMode above: `api` mode sets this to true.
    store_model_in_db: false

    # --- Full prompt/response capture (captain request, 2026-08-27) ---------
    # DEFAULT IS FALSE. Without this the Postgres spend log stores usage, cost,
    # latency and attribution only: `messages`, `response` and
    # `proxy_server_request` are all literally the string "{}" on every row
    # (measured on the live DB before this change - 134/134 rows empty in all
    # three columns). This flag is the ONLY gate. On v1.102.1 it is
    # `should_store_prompts_and_responses_in_spend_logs()`
    # (proxy/spend_tracking/spend_tracking_utils.py:1402; v1.98.0 named the
    # same body `_should_store_prompts_and_responses_in_spend_logs` at :1162).
    # It reads exactly general_settings["store_prompts_in_spend_logs"] or the
    # STORE_PROMPTS_IN_SPEND_LOGS env var, and every content-bearing column is
    # written behind it.
    #
    # WHERE THE PROMPT ACTUALLY LANDS - not the column you would guess. The
    # `messages` column stays "{}" for ordinary chat/completions traffic even
    # with this on: `_get_messages_for_spend_logs_payload` (same file:867 on
    # v1.102.1) populates it only when `call_type == "_arealtime"`, i.e. the
    # realtime API. The prompt for everything else lives in
    # `proxy_server_request` (:1270, the raw request body incl. `messages`),
    # and the completion in `response` (:1348). Read both, never `messages`.
    # Retrieval runbook:
    # docs/ai-system/litellm/request-logs.md
    #
    # CONFIDENTIALITY - primary store is the litellm DB on shared postgres-17;
    # that DOES leave the k8s cluster via the cluster's existing Barman path.
    # postgres-17 continuously archives WAL + daily base backups to
    # s3://home-ops-postgres-cluster/ at https://nas.${SECRET_DOMAIN}:9000 with
    # retentionPolicy 30d (kubernetes/apps/base/database/cloudnative-pg/cluster-17/
    # cluster-17.yaml backup.retentionPolicy / barmanObjectStore.destinationPath
    # / .endpointURL, plus its @daily ScheduledBackup). That endpoint is the
    # LAN TrueNAS MinIO appliance (same one kubernetes/components/volsync/minio/
    # externalsecret.yaml already uses for VolSync) - NOT a third-party or
    # internet service, and the postgres bucket is NOT replicated onward to
    # Cloudflare R2 (R2 is VolSync-only; kubernetes/components/volsync/Readme.md).
    # So: leaves the k8s cluster, stays on-premises, no third-party path.
    # Captain decision litellm-log-backup-export (2026-08-27, option C)
    # explicitly accepted this LAN-only exposure as an allowed sink for
    # full-content spend logs, paired with the 30d retention bound below.
    #
    # LiteLLM's OWN export paths remain closed (verified, still true):
    # `litellm.cold_storage_custom_logger` defaults to None (litellm/__init__.py:166)
    # and is not set here, so `_generate_cold_storage_object_key`
    # (litellm_core_utils/litellm_logging.py:5089) returns None and no S3/GCS
    # copy is ever written; `callbacks` is `["prometheus"]` only, which emits
    # labels, never content. Caller credentials do NOT land in the row either:
    # `proxy_server_request.headers` is built through `redact_credential_headers`
    # (proxy/litellm_pre_call_utils.py:835, applied at :1614) which masks
    # authorization / x-api-key / x-litellm-api-key / cookie to
    # "***REDACTED***" - so the Claude Code Max OAuth token this proxy
    # deliberately passes through (docs/ai-system/litellm/claude-code-subscription.md)
    # is not persisted - and the body snapshot excludes `secret_fields`
    # (:1792), which is where raw headers would otherwise be. Route stays
    # internal-only.
    #
    # WHO CAN NOW READ IT. Content is served by GET /spend/logs/ui/{request_id}
    # behind the master key, and the master key is also held by Prometheus for
    # the /metrics scrape (see the deliberate tradeoff recorded in
    # servicemonitor.yaml). That credential's blast radius therefore now
    # includes full prompt/response bodies, not just usage counters.
    #
    # DOES NOT NEED `store_model_in_db`. The Admin UI's hint for this setting
    # bundles the two; do not follow it - that would hand the UI authority over
    # GitOps-declared models and keys, which `applyMode: file` and the line
    # above exist to prevent. Tested with store_model_in_db false throughout:
    # content was written, `GET /spend/logs/ui/{request_id}` read it back, and
    # the UI's own log list endpoint returned rows. `grep -r store_model_in_db
    # litellm/proxy/spend_tracking/` matches nothing. The UI bundles them only
    # because ITS way of changing this writes general_settings to the DB, and
    # that writer (`ProxyConfig.save_config`, proxy/proxy_server.py:4188)
    # early-returns unless store_model_in_db is true; declaring it in
    # config.yaml, as the operator does from this CR, needs no DB write.
    #
    # RETENTION IS SET TO 30d - matches Barman retentionPolicy 30d exactly so
    # logged prompt/response content does not outlive what already rolls off
    # that backup target. Prefer "30d" over "1mo": "30d" is always 2592000s;
    # "1mo" is calendar-month-clamped (28-31d) and not a safe stand-in - full
    # rationale in docs/ai-system/litellm/request-logs.md#retention. This key
    # is the gate for the whole built-in pruner: while it is
    # null, no spend_log_cleanup_job is scheduled at all (proxy/proxy_server.py:8937).
    # Setting it schedules the job on the default 1d interval
    # (maximum_spend_logs_retention_interval). TRADEOFF: the pruner deletes
    # whole LiteLLM_SpendLogs rows, so per-request COST HISTORY is deleted
    # along with the content; v1.98.0 has no option to strip content while
    # keeping the cost row. Durable per-day/per-model/per-consumer cost history
    # is unaffected because it lives in the separate LiteLLM_Daily*Spend
    # rollup tables, which the pruner does not touch (it prunes
    # LiteLLM_SpendLogs and its tool-index table only -
    # db/db_transaction_queue/spend_log_cleanup.py:480). Full runbook:
    # docs/ai-system/litellm/request-logs.md#retention
    store_prompts_in_spend_logs: true
    maximum_spend_logs_retention_period: "30d"

    # --- /openrouter pass-through lockdown (2026-09-27) ---------------------
    # The image's BUILT-IN `/openrouter/{endpoint:path}` route (llm_passthrough_
    # endpoints.py, BerriAI/litellm#42301 backported in #42595) forwards
    # anything under /openrouter/ to https://openrouter.ai/api/ on the shared
    # OPENROUTER_API_KEY for ANY valid LiteLLM key. A key's `models` allow-list
    # applies only incidentally, when the JSON body happens to carry a `model`
    # field, so it is not a guard: measured live 2026-09-27 with the `demo` key
    # (allow-listed to qwen3.6-35b-a3b only), a chat body naming OpenRouter's
    # `models` array was forwarded to OpenRouter (it answered the 400 for a bogus
    # id itself, i.e. a real id would have been billed), and `GET
    # /openrouter/v1/key` returned the account's usage and limit.
    #
    # This block makes that route admin-only without touching the native
    # handler. The two entries do different jobs:
    # - `auth: true` puts a path in LiteLLM's pass-through registry as
    #   auth-enforced, and for every NON-admin key
    #   RouteChecks.non_proxy_admin_allowed_routes_check then demands a match on
    #   the key's or team's `allowed_passthrough_routes` BEFORE any other route
    #   rule (proxy/auth/route_checks.py). No key here carries one, so every
    #   virtual key gets 403. The master key (and SSO proxy-admin users) skip
    #   that check. That default-deny is the whole point: a NEW key is denied
    #   too, without anyone remembering to scope it.
    # - The native handler still wins FastAPI dispatch (registered first), but
    #   it reads its target and headers from the FIRST registry entry matching
    #   the request path and method (create_pass_through_route's url branch,
    #   proxy/pass_through_endpoints/pass_through_endpoints.py) and does not
    #   append the subpath. So the ORDER below is load-bearing. The exact
    #   decisions entry must come first and carry the real target and
    #   credential, or typesafe/jev-1.13 breaks for the master key too. The
    #   catch-all must come last and point at a dead loopback port with no
    #   headers, so any other /openrouter/... path fails closed (500 connection
    #   refused, no credential sent) even for an admin.
    #
    # A virtual key CANNOT be granted this route declaratively today:
    # `allowed_passthrough_routes` must be a list, the operator's
    # LiteLLMVirtualKey/LiteLLMTeam `metadata` is map[string]string (a string
    # value iterates as characters and fails closed - verified), and the
    # top-level /key/generate field is Enterprise-gated on this OSS image.
    # Access rule and evidence: ../README.md#model-catalog (the Jev section).
    # CI: scripts/ci/litellm-passthrough-lockdown-test.py drives LiteLLM's own
    # RouteChecks against these entries.
    #
    # --- /anthropic pass-through lockdown (2026-09-27) ----------------------
    # Same shape, same mechanism, for the BUILT-IN `/anthropic/{endpoint:path}`
    # route (llm_passthrough_endpoints.py anthropic_proxy_route). It forwards
    # to https://api.anthropic.com on the household METERED ANTHROPIC_API_KEY
    # for any valid LiteLLM key, with no `models` allow-list check. The
    # envoy-internal HTTPRouteFilter in httproute-internal.yaml has 404'd the
    # hostname path since 2026-08-31, but the in-cluster Service DNS path
    # (http://litellm.ai.svc.cluster.local:4000/anthropic/...) stayed open
    # until these entries. Zero legitimate callers: no /anthropic row in
    # LiteLLM_SpendLogs over the proxy's whole life (2026-08-26 on) and no
    # /anthropic route in litellm_proxy_total_requests_metric_total; every
    # consumer, the Claude Code subscription clients included, uses /v1/*.
    # - The master key keeps POST /anthropic/v1/messages and its free
    #   count_tokens sibling, on the same metered credential it can already
    #   spend through the claude-*-metered models.
    # - Those two entries deliberately leave `forward_headers` unset. The
    #   native handler forwards EVERY client header (including the caller's own
    #   LiteLLM key in Authorization/x-litellm-api-key) to api.anthropic.com;
    #   a registry entry replaces that with exactly the headers below. A
    #   client can still pass `x-pass-anthropic-beta` (LiteLLM strips the
    #   prefix and never lets it name a credential header).
    # - Everything else under /anthropic hits the dead catch-all, admin or not.
    # Evidence and re-open procedure:
    # docs/ai-system/litellm/README.md#anthropic-pass-through-route-closed-2026-08-31
    pass_through_endpoints:
      - path: /openrouter/alpha/decisions
        target: https://openrouter.ai/api/alpha/decisions
        methods: ["POST"]
        auth: true
        headers:
          Authorization: "Bearer os.environ/OPENROUTER_API_KEY"
          Content-Type: application/json
      - path: /openrouter
        target: http://127.0.0.1:9/openrouter-pass-through-locked
        include_subpath: true
        auth: true
      - path: /anthropic/v1/messages
        target: https://api.anthropic.com/v1/messages
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic/v1/messages/count_tokens
        target: https://api.anthropic.com/v1/messages/count_tokens
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic
        target: http://127.0.0.1:9/anthropic-pass-through-locked
        include_subpath: true
        auth: true

  litellmSettings:
    callbacks: ["prometheus"] # exposes /metrics on the proxy port (4000)
    # Response cache, mirrored from the reference repo's pattern (joryirving
    # litellm/litellmproxy.yaml @ 3d3b700): exact-match request/response pairs
    # only (no semantic cache), 300s TTL. Same litellm-dragonfly store as
    # routerSettings.redis_host below - see the redis_host comment for why
    # this store exists at all.
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly.ai.svc.cluster.local
      port: 6379
      ttl: 300
    # AI HUB PUBLICATION (captain decision `hub-public-set`, 2026-09-27,
    # option A). This list is the ONLY way a model reaches the Hub
    # (/public/model_hub, the UI's public Model Hub page): the Admin UI "make
    # public" button calls /model_group/make_public, which returns HTTP 500 on
    # this proxy because store_model_in_db is false (see generalSettings), so
    # there is no UI/API path and therefore no out-of-Git drift. A NEW model is
    # NOT published until its modelName is added here.
    #
    # Publication is discovery only - it grants nothing; entitlement stays on
    # each LiteLLMVirtualKey's `models` allow-list. /public/* is
    # unauthenticated, and this proxy has only the internal HTTPRoute, so the
    # audience is the LAN. Deliberately OMITTED, as internal plumbing no human
    # should pick: qwen3.6-35b-a3b-classifier (the auto router's own sub-call),
    # pr-review-local (the CI reviewer's alias) and qwen3.6-35b-a3b (the `demo`
    # budget smoke test, whose synthetic governance price would display as a
    # real $50/$100 per 1M tokens). What the Hub shows per model comes from
    # each LiteLLMModel's `info` (local models) or LiteLLM's cost map (cloud).
    public_model_groups:
      - auto
      - chat-ha
      - chat-local
      - claude-fable-5
      - claude-fable-5-1
      - claude-haiku-4-5-20251001
      - claude-opus-4-8
      - claude-opus-5
      - claude-opus-5-metered
      - claude-sonnet-5
      - claude-sonnet-5-metered
      - deepseek-v4-flash
      - deepseek-v4-flash-0731
      - deepseek-v4-pro
      - deepseek-v4-pro-0813
      - embedding-local
      - gemini-3.1-pro
      - gemini-3.5-flash-lite
      - gemini-3.6-flash
      - gemini-3.7-flash
      - gemma-4-31b
      - glm-5.2
      - glm-5.3
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-6-astra
      - gpt-6-astra-pro
      - gpt-oss-20b
      - grok-4.5
      - grok-4.6
      - kimi-k3
      - minimax-m3
      - muse-glimmer-30b
      - nemotron-3.5-lightning
      - qwen/qwen3-embedding-8b
      - qwen3.6-27b
      - qwen3.8-2.4t-a95b
      - qwen3.8-27b

  # --- Phase 5 fallback chains ---------------------------------------------
  # Maps verbatim to config.yaml's router_settings (the CRD field is a
  # free-form passthrough - `x-kubernetes-preserve-unknown-fields: true`, no
  # typed schema, so nothing here is validated by the API server; a typo lands
  # in the rendered config silently). Design, measurements and the post-merge
  # failover runbook: docs/ai-system/litellm/fallbacks.md
  routerSettings:
    # litellm-dragonfly (this repo's kubernetes/components/dragonfly, wired on
    # the overlay Kustomization kubernetes/apps/main/ai/litellm.yaml) shares
    # rate-limit counters, budget spend, and router state across LiteLLM's app
    # workers. Without it every one of that single Deployment replica's
    # workers enforces D4 budgets/rpm limits independently, so the proxy's own
    # live banner (BerriAI/litellm ui NoRedisWarningBanner.tsx) reads: "This
    # proxy is running more than one worker (or the worker count could not be
    # verified). Without Redis, rate limits, budgets, router state, and cache
    # invalidation are per worker, so limits are enforced once per worker and
    # spend can overshoot." replicas: 1 does not avoid this - the warning
    # triggers on worker count, not pod/replica count, and LiteLLM's own
    # uvicorn/gunicorn layer runs multiple workers inside that one pod. No
    # password: the dragonfly component ships with no auth mechanism (see
    # kubernetes/components/dragonfly/cluster.yaml), matching every other
    # consumer in this repo (searxng, authentik, paperless-ngx, rsshub) -
    # all plain host:port, same-namespace network boundary only.
    redis_host: litellm-dragonfly.ai.svc.cluster.local
    redis_port: 6379

    # Every model group here has exactly ONE deployment, so this is close to a
    # no-op today and is set for a different reason than the reference repo's:
    # it pins the safe default explicitly so `least-busy` cannot be introduced
    # later without someone deleting this line and its rationale. `least-busy`
    # updates its in-flight counters AFTER the routing decision, so a
    # synchronized burst piles onto the same deployment - wrong for small
    # deployment groups, which is all of ours.
    routing_strategy: simple-shuffle

    # -- Axis 1: AVAILABILITY (backend down or erroring) --
    # Fires on connection errors, 5xx and other retryable provider failures.
    #
    # ONLY cloud-entitled aliases appear here. This list is the cloud
    # entitlement boundary, because a config-declared fallback is NOT checked
    # against the calling key's allow-list (measured 2026-08-26; evidence in
    # fallbacks.md#1). Neither terminal local alias - `qwen3.6-35b-a3b` nor
    # `chat-local` - may appear here (or in context_window_fallbacks below):
    # adding either would hand every local-only key a paid Anthropic model the
    # first time the B70 hiccupped. `chat-local` is the one that matters in
    # practice - it is what repo-wiki's unattended cron and auto's SIMPLE/MEDIUM
    # tiers actually run on, so adding it would silently make them cloud
    # spenders. Do not.
    #
    # Target is SONNET, not Opus. An availability fallback fires on
    # INFRASTRUCTURE failure, not on task difficulty: the traffic it catches is
    # whatever the 35B local model was already handling, so it must not be
    # repriced as frontier work. Sonnet is 2.5x cheaper on input ($2/M vs
    # $5/M) and 2.5x cheaper on output ($10/M vs $25/M) than Opus, and its
    # 1,000,000-token input window is ~3.8x the local model's 262,144, so there
    # is no capability regression in the swap. Opus stays reserved for the D3
    # router's REASONING tier, where difficulty - not an outage - is what
    # selects it.
    # RENAMED 2026-08-31 (captain decision, Alternative B of
    # data/homeops-claude-code-passthrough-design/report.md): fallback targets
    # must name the METERED `claude-sonnet-5-metered` CR, never the natural
    # `claude-sonnet-5` name, which now belongs to the Claude Code subscription
    # pass-through and holds no credential of its own - a config-declared
    # fallback there would 401 every failed-over request instead of serving it.
    fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      # The D3 routed alias. Without this, a B70 outage takes `auto` down
      # completely: the classifier call fails, the router fails OPEN to
      # `complexity_router_default_model` (chat-local, the zero-priced production
      # local alias) - which is the very backend that is down - and the request
      # dies. `auto` is already a cloud-entitled alias by construction (its
      # COMPLEX/REASONING tiers are Anthropic), so a cloud fallback here
      # breaches no entitlement. Do not add chat-local itself to this list -
      # its absence is the D4 boundary (CI: chat_local_has_no_cloud_fallback).
      - auto: ["claude-sonnet-5-metered"]

    # -- Axis 2: CONTEXT WINDOW (prompt too big for this model) --
    # A SEPARATE key on purpose: "the backend is down" and "the prompt does not
    # fit" are different failures with different correct targets, and LiteLLM
    # dispatches them from different exception types
    # (ContextWindowExceededError vs the retryable provider errors above).
    #
    # DIRECTION VERIFIED, and it is the opposite of what was assumed. Measured
    # 2026-08-26: the local model serves n_ctx=262,144 (llama.cpp /props, per
    # slot, unified KV), while LiteLLM v1.98.0's cost map gives BOTH
    # claude-sonnet-5 and claude-opus-5 max_input_tokens=1,000,000. Cloud is a
    # ~3.8x SUPERSET, not a smaller cap, so local -> cloud is the correct
    # direction and covers a real ~738k-token band. (Cross-check that this is
    # the standard window and not a beta tier: the same map gives
    # claude-sonnet-4-5 max_input=200,000 WITH premium
    # input_cost_per_token_above_200k_tokens pricing, i.e. it models the
    # gated-long-context concept explicitly - and the 5-generation entries
    # carry no such premium.)
    #
    # There is deliberately no reverse (cloud -> local) entry: a prompt that
    # overflows a 1M window cannot fit 262k, so it would be a chain that is
    # guaranteed to fail on its second leg.
    context_window_fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      - auto: ["claude-sonnet-5-metered"]

  # --- Vector stores (pgvector, embedded by qwen/qwen3-embedding-8b) --------
  # Why extraConfig and not the CRD's dedicated `vectorStoreRegistry` field:
  # that field is validated as `type: object` (litellm-operator 0.0.19
  # api/v1alpha1/litellmproxy_types.go), but LiteLLM's vector_store_registry
  # is a LIST - load_vector_stores_from_config iterates it and reads
  # vector_store_name/litellm_params off each entry. The API server rejects a
  # list there, and an object would render one entry per KEY and fail proxy
  # startup. extraConfig is merged into the top level of config.yaml as-is,
  # and the typed field only overrides it when set (render.go
  # buildBaseConfig), so leave `vectorStoreRegistry` unset.
  #
  # The store itself is served by ai/litellm-pgvector (BerriAI/litellm-pgvector
  # on the shared postgres-17 cluster); its schema seeds the `default` row this
  # entry names, so the id is stable across rebuilds. Usage, the ingest path
  # and what LiteLLM does NOT support for this provider: README.md
  # "Vector store (pgvector)".
  extraConfig:
    vector_store_registry:
      - vector_store_name: default
        litellm_params:
          vector_store_id: default
          custom_llm_provider: pg_vector
          vector_store_description: >-
            Household pgvector store. Chunks are embedded with
            qwen/qwen3-embedding-8b (OpenRouter) at 2000 dimensions.
          api_base: http://litellm-pgvector.ai.svc.cluster.local:8000
          # NOT PG_VECTOR_API_KEY. That is the name PGVectorStoreConfig falls
          # back to for a store with no registered key, so exporting it would
          # let any virtual key reach any store id on this server by passing
          # `custom_llm_provider: pg_vector` in a search or create body.
          # Under a private name only this registered store gets the key, and
          # an unregistered id fails closed ("PG Vector API key is required")
          # - verified against v1.102.1. Sourced from litellm-secret
          # (externalsecret.yaml, 1Password item `litellm-pgvector`).
          api_key: os.environ/LITELLM_PGVECTOR_API_KEY

  # The CRD has no startupProbe field, so the old startup probe (30 x 10s =
  # 300s of boot budget before liveness could kill the pod) is emulated by
  # holding liveness off for 240s and then keeping the SAME steady-state
  # detection window as before (30s period x 3 = 90s). Net effect: kill
  # deadline for a pod that never boots moves 300s -> 330s, and a pod that
  # boots fast is unguarded by liveness for its first 240s - which is what a
  # startupProbe does anyway. Readiness is unaffected and still pulls a sick
  # pod out of the Service endpoints on its own schedule.
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 4000
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      # Checks the DB connection too - a real readiness signal, not just "the
      # process is up" (see docs/ai-system/litellm/).
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  podAnnotations:
    # The operator already rolls the pod on a rendered-config change via its own
    # config-hash annotation, but that does not cover litellm-secret rotating
    # (master key, DB password, provider API keys). The CRD exposes no
    # Deployment-level annotations, and reloader normally reads its annotation
    # off the workload - but it falls back to the POD TEMPLATE annotations when
    # the workload carries none (verified in stakater/Reloader v1.4.21, the
    # version running here: pkg/common/common.go ShouldReload). So this lands
    # in the right place despite only being settable on the pod template.
    reloader.stakater.com/auto: "true"

  resources:
    requests:
      cpu: 10m
      memory: 1280Mi
    limits:
      memory: 4Gi
