---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
# The LiteLLM proxy, rendered by litellm-operator. Tripwires and rationale for
# every block below: skill litellm-proxy (references/platform.md).
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # `file` keeps Git the source of truth; `api` would turn store_model_in_db on.
  applyMode: file
  image: ghcr.io/berriai/litellm-non_root:v1.103.1
  # ^ Floor v1.93.0 (auto-router LLM classifier; below it the config is silently
  # ignored). Enforced by .renovate/overrides.json5 - references/auto-router.md.
  replicas: 1

  service:
    type: ClusterIP
    port: 4000

  # NO spec.route, ever: httproute-internal.yaml is the route, and the operator
  # would create a second one (references/platform.md).

  envFrom:
    # Master/salt key, DATABASE_URL, the four provider keys and SSO client
    # credentials. Models resolve provider keys via `apiKey: os.environ/<VAR>`.
    - secretRef:
        name: litellm-secret

  # UI SSO through Authentik (terraform/authentik/litellm.tofu). Only the two
  # credential halves are secret; these must keep matching that provider.
  env:
    # Per-string cap on stored prompt/response bodies (default 2048 chars).
    - name: MAX_STRING_LENGTH_PROMPT_IN_DB
      value: "1000000"
    - name: GENERIC_AUTHORIZATION_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/authorize/
    - name: GENERIC_TOKEN_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/token/
    - name: GENERIC_USERINFO_ENDPOINT
      value: https://auth.${SECRET_DOMAIN}/application/o/userinfo/
    # Redirect URI is <PROXY_BASE_URL>/sso/callback: change it only together
    # with allowed_redirect_uris in litellm.tofu.
    - name: PROXY_BASE_URL
      value: https://litellm.${SECRET_DOMAIN}
    # Must include litellm_role (litellm.tofu property mapping), or first login
    # lands as INTERNAL_USER_VIEW_ONLY.
    - name: GENERIC_SCOPE
      value: openid email profile litellm_role
    - name: GENERIC_USER_ROLE_ATTRIBUTE
      value: litellm_role
    # Master-key browser login moves to /fallback/login.
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
    - name: PROXY_LOGOUT_URL
      value: https://auth.${SECRET_DOMAIN}/application/o/litellm/end-session/

  # The operator mints and syncs virtual keys through the admin API with this.
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    # Git stays the only source of truth for models and keys (never UI edits).
    store_model_in_db: false

    # Full prompt/response capture into the Postgres spend log; the prompt lands
    # in proxy_server_request, not messages. 30d matches the postgres-17 Barman
    # window ("30d", never "1mo"). references/spend-logs.md.
    store_prompts_in_spend_logs: true
    maximum_spend_logs_retention_period: "30d"

    # INVARIANT: provider pass-throughs are admin-only (no virtual key may reach
    # a shared credential). ORDER IS LOAD-BEARING: each exact entry above its
    # dead-loopback catch-all; never set forward_headers. Only jev-decisions holds
    # a hand-applied grant. references/passthrough-lockdown.md.
    pass_through_endpoints:
      - path: /openrouter/alpha/decisions
        target: https://openrouter.ai/api/alpha/decisions
        methods: ["POST"]
        auth: true
        headers:
          Authorization: "Bearer os.environ/OPENROUTER_API_KEY"
          Content-Type: application/json
      - path: /openrouter
        target: http://127.0.0.1:9/openrouter-pass-through-locked
        include_subpath: true
        auth: true
      - path: /anthropic/v1/messages
        target: https://api.anthropic.com/v1/messages
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic/v1/messages/count_tokens
        target: https://api.anthropic.com/v1/messages/count_tokens
        methods: ["POST"]
        auth: true
        headers:
          x-api-key: os.environ/ANTHROPIC_API_KEY
          anthropic-version: "2023-06-01"
          Content-Type: application/json
      - path: /anthropic
        target: http://127.0.0.1:9/anthropic-pass-through-locked
        include_subpath: true
        auth: true

  litellmSettings:
    callbacks: ["prometheus"] # labels only, never content; exposes /metrics
    # Exact-match response cache on litellm-dragonfly, 300s TTL.
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly.ai.svc.cluster.local
      port: 6379
      ttl: 300
    # The ONLY way a model reaches the AI Hub (UI "make public" 500s here). A new
    # model is unpublished until added; discovery only, grants nothing.
    # references/model-catalog.md.
    public_model_groups:
      - auto
      - chat-ha
      - chat-local
      - claude-fable-5
      - claude-fable-5-1
      - claude-haiku-4-5-20251001
      - claude-opus-4-8
      - claude-opus-5
      - claude-opus-5-metered
      - claude-sonnet-5
      - claude-sonnet-5-metered
      - deepseek-v4-flash
      - deepseek-v4-flash-0731
      - deepseek-v4-pro
      - deepseek-v4-pro-0813
      - embedding-local
      - gemini-3.1-pro
      - gemini-3.5-flash-lite
      - gemini-3.6-flash
      - gemini-3.7-flash
      - gemma-4-31b
      - glm-5.2
      - glm-5.3
      - gpt-5.6-luna
      - gpt-5.6-sol
      - gpt-5.6-terra
      - gpt-6-astra
      - gpt-6-astra-pro
      - gpt-oss-20b
      - grok-4.5
      - grok-4.6
      - kimi-k3
      - minimax-m3
      - muse-glimmer-30b
      - nemotron-3.5-lightning
      - qwen/qwen3-embedding-8b
      - qwen3.6-27b
      - qwen3.8-2.4t-a95b
      - qwen3.8-27b

  # Free-form passthrough to router_settings: the API server validates nothing.
  routerSettings:
    # Shared counters across LiteLLM's workers; without it D4 limits and budgets
    # are per worker and overshoot (replicas: 1 does not help).
    redis_host: litellm-dragonfly.ai.svc.cluster.local
    redis_port: 6379
    # Pinned so least-busy cannot creep in.
    routing_strategy: simple-shuffle
    # INVARIANT: a config fallback bypasses the caller's allow-list, so only
    # cloud-entitled aliases may appear here, targeting the -metered CR (never a
    # terminal local alias). references/fallbacks.md.
    fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      - auto: ["claude-sonnet-5-metered"]
    # Retry-only for the vector store's embedding model: OpenRouter returns
    # transient HTTP 400 (code 20015) and the router never retries a 400 unless a
    # policy names it. NEVER add a fallback embedding model: a second model writes
    # vectors incompatible with the pgvector index. references/vector-store.md.
    model_group_retry_policy:
      qwen/qwen3-embedding-8b:
        BadRequestErrorRetries: 3
        InternalServerErrorRetries: 3
        TimeoutErrorRetries: 3
        RateLimitErrorRetries: 3
    # Separate axis: local 262k window -> cloud 1M; no reverse entry.
    context_window_fallbacks:
      - chat-ha: ["claude-sonnet-5-metered"]
      - auto: ["claude-sonnet-5-metered"]

  # Vector store under extraConfig, never the CRD's vectorStoreRegistry (object vs
  # list). Open to every key: non-sensitive content only. references/vector-store.md.
  extraConfig:
    vector_store_registry:
      - vector_store_name: default
        litellm_params:
          vector_store_id: default
          custom_llm_provider: pg_vector
          vector_store_description: >-
            Household pgvector store. Non-sensitive content only (never
            personal documents or credentials) - open to every virtual key.
            Chunks are embedded with qwen/qwen3-embedding-8b (OpenRouter) at
            2000 dimensions.
          api_base: http://litellm-pgvector.ai.svc.cluster.local:8000
          # NEVER PG_VECTOR_API_KEY: that fallback name would open every store id to every key.
          api_key: os.environ/LITELLM_PGVECTOR_API_KEY

  # No startupProbe field: a 240s delay emulates the old 300s boot budget.
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 4000
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      # Also checks the DB connection.
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  podAnnotations:
    # Reloader falls back to pod-template annotations, covering secret rotation.
    reloader.stakater.com/auto: "true"

  resources:
    requests:
      cpu: 10m
      memory: 1280Mi
    limits:
      # A bare GET /spend/logs OOM-killed the proxy at 2Gi (references/spend-logs.md).
      memory: 4Gi
