---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # `file`: the operator renders every adopted LiteLLMModel into config.yaml
  # and rolls the Deployment on change. The alternative (`api`) pushes models
  # to the proxy's DB-backed admin API live and turns store_model_in_db on,
  # which would make the running DB - not Git - the source of truth for the
  # model list. Deliberately not that (same reason the pre-operator
  # config.yaml refused store_model_in_db); see generalSettings below.
  applyMode: file
  image: ghcr.io/berriai/litellm-non_root:v1.98.0
  # ^ v1.93.0 is the FLOOR for the D3 auto-router: `classifier_type: llm` and
  # classifier_llm_config first exist there. Below it ComplexityRouterConfig is
  # `extra="allow"`, so those keys parse clean and are then IGNORED - the
  # router silently runs the rule-based scorer the reference repo measured at
  # 25-35% tier accuracy. The floor is machine-enforced by
  # .renovate/overrides.json5 (allowedVersions ">=1.93.0" on this exact package
  # name), which applies to this line because Renovate's `kubernetes` manager
  # scans every image: field in kubernetes/**.yaml - including inside a CR.
  # Upstream also dropped the `main-vX.Y.Z-stable` tag scheme after v1.81.x;
  # current releases are plain `vX.Y.Z`.
  replicas: 1

  service:
    type: ClusterIP
    port: 4000

  # NO spec.route - still deliberate, but the reason changed on 2026-08-26.
  # The captain approved an INTERNAL route (public listener remains forbidden),
  # and it is shipped as a hand-written httproute-internal.yaml next to this file rather
  # than through spec.route. Reason: the operator's route schema is exactly
  # {hostnames, parentRefs, filters} - no annotations field - so an
  # operator-owned route cannot carry the external-dns / Gatus / Homepage
  # annotations this repo puts on every app route. Setting spec.route here
  # would create a SECOND, competing HTTPRoute for the same Service; don't.
  # In-cluster consumers are unaffected and still use
  # http://litellm.ai.svc.cluster.local:4000.

  envFrom:
    # DATABASE_URL / LITELLM_MASTER_KEY / LITELLM_SALT_KEY plus the four
    # provider keys (ANTHROPIC/XAI/ZAI/OPENROUTER_API_KEY). LiteLLM picks the
    # first three up from the environment automatically - do not duplicate
    # them into config; see docs/ai-system/litellm/README.md. Models resolve
    # the provider keys via `apiKey: os.environ/<VAR>` (see README model-catalog).
    - secretRef:
        name: litellm-secret

  env:
    # `store_prompts_in_spend_logs` alone does NOT give you the full prompt.
    # Both the request body and the response are run through
    # `_sanitize_request_body_for_spend_logs_payload`
    # (proxy/spend_tracking/spend_tracking_utils.py:657), which truncates EVERY
    # string longer than MAX_STRING_LENGTH_PROMPT_IN_DB - default 2048 chars,
    # ~500 tokens (litellm/constants.py:375) - keeping 35% of the head and 65%
    # of the tail with a `litellm_truncated` marker in between. At the default,
    # any repo-wiki page context or pasted file is cut mid-prompt and the
    # captain sees a stitched fragment, not what was sent.
    #
    # The cap is per STRING, not per row, so an ordinary many-turn chat is
    # already captured whole at 2048; it is single long strings that lose
    # content. 1,000,000 chars covers the largest call measured on this proxy
    # (132,929 prompt tokens, ~0.5 MB of text) with ~2x headroom, while still
    # keeping the safeguard the limit exists for - a runaway base64 image data
    # URI cannot write an unbounded row.
    #
    # This is read at request time via os.getenv (that file:42), not import
    # time, so it can also be raised without a config rebuild - but keep it
    # declared here so Git stays the source of truth.
    - name: MAX_STRING_LENGTH_PROMPT_IN_DB
      value: "1000000"

  # Required for LiteLLMVirtualKey: the operator mints and syncs keys through
  # the proxy's admin API, authenticating with this master key. Endpoint
  # defaults to http://litellm.ai.svc:4000, which is exactly where we want it.
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY

  generalSettings:
    # Explicitly false: config.yaml (rendered from the LiteLLMModel CRs in
    # models/) stays the only source of truth for models, never UI-driven DB
    # edits. Carried forward from the pre-operator config.yaml, where the same
    # decision was made against this app's pre-2026-06-07 incarnation. It is
    # also the guard on applyMode above: `api` mode sets this to true.
    store_model_in_db: false

    # --- Full prompt/response capture (captain request, 2026-08-27) ---------
    # DEFAULT IS FALSE. Without this the Postgres spend log stores usage, cost,
    # latency and attribution only: `messages`, `response` and
    # `proxy_server_request` are all literally the string "{}" on every row
    # (measured on the live DB before this change - 134/134 rows empty in all
    # three columns). This flag is the ONLY gate; on v1.98.0
    # `_should_store_prompts_and_responses_in_spend_logs()`
    # (proxy/spend_tracking/spend_tracking_utils.py:1162) reads exactly
    # general_settings["store_prompts_in_spend_logs"] or the
    # STORE_PROMPTS_IN_SPEND_LOGS env var, and every content-bearing column is
    # written behind it.
    #
    # WHERE THE PROMPT ACTUALLY LANDS - not the column you would guess. The
    # `messages` column stays "{}" for ordinary chat/completions traffic even
    # with this on: `_get_messages_for_spend_logs_payload` (same file:637)
    # populates it only when `call_type == "_arealtime"`, i.e. the realtime
    # API. The prompt for everything else lives in `proxy_server_request`
    # (:1034, the raw request body incl. `messages`), and the completion in
    # `response` (:1108). Read both, never `messages`. Retrieval runbook:
    # docs/ai-system/litellm/request-logs.md
    #
    # CONFIDENTIALITY - primary store is the litellm DB on shared postgres-17;
    # that DOES leave the k8s cluster via the cluster's existing Barman path.
    # postgres-17 continuously archives WAL + daily base backups to
    # s3://home-ops-postgres-cluster/ at https://nas.${SECRET_DOMAIN}:9000 with
    # retentionPolicy 30d (kubernetes/apps/base/database/cloudnative-pg/cluster-17/
    # cluster-17.yaml backup.retentionPolicy / barmanObjectStore.destinationPath
    # / .endpointURL, plus its @daily ScheduledBackup). That endpoint is the
    # LAN TrueNAS MinIO appliance (same one kubernetes/components/volsync/minio/
    # externalsecret.yaml already uses for VolSync) - NOT a third-party or
    # internet service, and the postgres bucket is NOT replicated onward to
    # Cloudflare R2 (R2 is VolSync-only; kubernetes/components/volsync/Readme.md).
    # So: leaves the k8s cluster, stays on-premises, no third-party path.
    # Captain decision litellm-log-backup-export (2026-08-27, option C)
    # explicitly accepted this LAN-only exposure as an allowed sink for
    # full-content spend logs, paired with the 30d retention bound below.
    #
    # LiteLLM's OWN export paths remain closed (verified, still true):
    # `litellm.cold_storage_custom_logger` defaults to None (litellm/__init__.py:166)
    # and is not set here, so `_generate_cold_storage_object_key`
    # (litellm_core_utils/litellm_logging.py:5089) returns None and no S3/GCS
    # copy is ever written; `callbacks` is `["prometheus"]` only, which emits
    # labels, never content. Caller credentials do NOT land in the row either:
    # `proxy_server_request.headers` is built through `redact_credential_headers`
    # (proxy/litellm_pre_call_utils.py:835, applied at :1614) which masks
    # authorization / x-api-key / x-litellm-api-key / cookie to
    # "***REDACTED***" - so the Claude Code Max OAuth token this proxy
    # deliberately passes through (docs/ai-system/litellm/claude-code-subscription.md)
    # is not persisted - and the body snapshot excludes `secret_fields`
    # (:1792), which is where raw headers would otherwise be. Route stays
    # internal-only.
    #
    # WHO CAN NOW READ IT. Content is served by GET /spend/logs/ui/{request_id}
    # behind the master key, and the master key is also held by Prometheus for
    # the /metrics scrape (see the deliberate tradeoff recorded in
    # servicemonitor.yaml). That credential's blast radius therefore now
    # includes full prompt/response bodies, not just usage counters.
    #
    # DOES NOT NEED `store_model_in_db`. The Admin UI's hint for this setting
    # bundles the two; do not follow it - that would hand the UI authority over
    # GitOps-declared models and keys, which `applyMode: file` and the line
    # above exist to prevent. Tested with store_model_in_db false throughout:
    # content was written, `GET /spend/logs/ui/{request_id}` read it back, and
    # the UI's own log list endpoint returned rows. `grep -r store_model_in_db
    # litellm/proxy/spend_tracking/` matches nothing. The UI bundles them only
    # because ITS way of changing this writes general_settings to the DB, and
    # that writer (`ProxyConfig.save_config`, proxy/proxy_server.py:4188)
    # early-returns unless store_model_in_db is true; declaring it in
    # config.yaml, as the operator does from this CR, needs no DB write.
    #
    # RETENTION IS SET TO 30d - matches Barman retentionPolicy 30d exactly so
    # logged prompt/response content does not outlive what already rolls off
    # that backup target. Verified on the pinned v1.98.0 image that
    # duration_in_seconds("30d") == 2592000 (exactly 30 days); "1mo" parses to
    # 31 days and would outlive the backup window, which is why it was not
    # used. This key is the gate for the whole built-in pruner: while it is
    # null, no spend_log_cleanup_job is scheduled at all (proxy/proxy_server.py:8937).
    # Setting it schedules the job on the default 1d interval
    # (maximum_spend_logs_retention_interval). TRADEOFF: the pruner deletes
    # whole LiteLLM_SpendLogs rows, so per-request COST HISTORY is deleted
    # along with the content; v1.98.0 has no option to strip content while
    # keeping the cost row. Durable per-day/per-model/per-consumer cost history
    # is unaffected because it lives in the separate LiteLLM_Daily*Spend
    # rollup tables, which the pruner does not touch (it prunes
    # LiteLLM_SpendLogs and its tool-index table only -
    # db/db_transaction_queue/spend_log_cleanup.py:480). Full runbook:
    # docs/ai-system/litellm/request-logs.md#retention
    store_prompts_in_spend_logs: true
    maximum_spend_logs_retention_period: "30d"

  litellmSettings:
    callbacks: ["prometheus"] # exposes /metrics on the proxy port (4000)
    # Response cache, mirrored from the reference repo's pattern (joryirving
    # litellm/litellmproxy.yaml @ 3d3b700): exact-match request/response pairs
    # only (no semantic cache), 300s TTL. Same litellm-dragonfly store as
    # routerSettings.redis_host below - see the redis_host comment for why
    # this store exists at all.
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly.ai.svc.cluster.local
      port: 6379
      ttl: 300

  # --- Phase 5 fallback chains ---------------------------------------------
  # Maps verbatim to config.yaml's router_settings (the CRD field is a
  # free-form passthrough - `x-kubernetes-preserve-unknown-fields: true`, no
  # typed schema, so nothing here is validated by the API server; a typo lands
  # in the rendered config silently). Design, measurements and the post-merge
  # failover runbook: docs/ai-system/litellm/fallbacks.md
  routerSettings:
    # litellm-dragonfly (this repo's kubernetes/components/dragonfly, wired on
    # the overlay Kustomization kubernetes/apps/main/ai/litellm.yaml) shares
    # rate-limit counters, budget spend, and router state across LiteLLM's app
    # workers. Without it every one of that single Deployment replica's
    # workers enforces D4 budgets/rpm limits independently, so the proxy's own
    # live banner (BerriAI/litellm ui NoRedisWarningBanner.tsx) reads: "This
    # proxy is running more than one worker (or the worker count could not be
    # verified). Without Redis, rate limits, budgets, router state, and cache
    # invalidation are per worker, so limits are enforced once per worker and
    # spend can overshoot." replicas: 1 does not avoid this - the warning
    # triggers on worker count, not pod/replica count, and LiteLLM's own
    # uvicorn/gunicorn layer runs multiple workers inside that one pod. No
    # password: the dragonfly component ships with no auth mechanism (see
    # kubernetes/components/dragonfly/cluster.yaml), matching every other
    # consumer in this repo (searxng, immich, authentik, paperless-ngx,
    # rsshub) - all plain host:port, same-namespace network boundary only.
    redis_host: litellm-dragonfly.ai.svc.cluster.local
    redis_port: 6379

    # Every model group here has exactly ONE deployment, so this is close to a
    # no-op today and is set for a different reason than the reference repo's:
    # it pins the safe default explicitly so `least-busy` cannot be introduced
    # later without someone deleting this line and its rationale. `least-busy`
    # updates its in-flight counters AFTER the routing decision, so a
    # synchronized burst piles onto the same deployment - wrong for small
    # deployment groups, which is all of ours.
    routing_strategy: simple-shuffle

    # -- Axis 1: AVAILABILITY (backend down or erroring) --
    # Fires on connection errors, 5xx and other retryable provider failures.
    #
    # ONLY cloud-entitled aliases appear here. This list is the cloud
    # entitlement boundary, because a config-declared fallback is NOT checked
    # against the calling key's allow-list (measured 2026-08-26; evidence in
    # fallbacks.md#1). Adding `qwen3.6-35b-a3b` to this list would hand every
    # local-only key - including `demo` - a paid Anthropic model the first time
    # the B70 hiccupped. Do not.
    #
    # Target is SONNET, not Opus. An availability fallback fires on
    # INFRASTRUCTURE failure, not on task difficulty: the traffic it catches is
    # whatever the 35B local model was already handling, so it must not be
    # repriced as frontier work. Sonnet is 2.5x cheaper on input ($2/M vs
    # $5/M) and 2.5x cheaper on output ($10/M vs $25/M) than Opus, and its
    # 1,000,000-token input window is ~3.8x the local model's 262,144, so there
    # is no capability regression in the swap. Opus stays reserved for the D3
    # router's REASONING tier, where difficulty - not an outage - is what
    # selects it.
    fallbacks:
      - chat-ha: ["claude-sonnet-5"]
      # The D3 routed alias. Without this, a B70 outage takes `auto` down
      # completely: the classifier call fails, the router fails OPEN to
      # `complexity_router_default_model` (qwen3.6-35b-a3b) - which is the very
      # backend that is down - and the request dies. `auto` is already a
      # cloud-entitled alias by construction (its COMPLEX/REASONING tiers are
      # Anthropic), so a cloud fallback here breaches no entitlement.
      - auto: ["claude-sonnet-5"]

    # -- Axis 2: CONTEXT WINDOW (prompt too big for this model) --
    # A SEPARATE key on purpose: "the backend is down" and "the prompt does not
    # fit" are different failures with different correct targets, and LiteLLM
    # dispatches them from different exception types
    # (ContextWindowExceededError vs the retryable provider errors above).
    #
    # DIRECTION VERIFIED, and it is the opposite of what was assumed. Measured
    # 2026-08-26: the local model serves n_ctx=262,144 (llama.cpp /props, per
    # slot, unified KV), while LiteLLM v1.98.0's cost map gives BOTH
    # claude-sonnet-5 and claude-opus-5 max_input_tokens=1,000,000. Cloud is a
    # ~3.8x SUPERSET, not a smaller cap, so local -> cloud is the correct
    # direction and covers a real ~738k-token band. (Cross-check that this is
    # the standard window and not a beta tier: the same map gives
    # claude-sonnet-4-5 max_input=200,000 WITH premium
    # input_cost_per_token_above_200k_tokens pricing, i.e. it models the
    # gated-long-context concept explicitly - and the 5-generation entries
    # carry no such premium.)
    #
    # There is deliberately no reverse (cloud -> local) entry: a prompt that
    # overflows a 1M window cannot fit 262k, so it would be a chain that is
    # guaranteed to fail on its second leg.
    context_window_fallbacks:
      - chat-ha: ["claude-sonnet-5"]
      - auto: ["claude-sonnet-5"]

  # The CRD has no startupProbe field, so the old startup probe (30 x 10s =
  # 300s of boot budget before liveness could kill the pod) is emulated by
  # holding liveness off for 240s and then keeping the SAME steady-state
  # detection window as before (30s period x 3 = 90s). Net effect: kill
  # deadline for a pod that never boots moves 300s -> 330s, and a pod that
  # boots fast is unguarded by liveness for its first 240s - which is what a
  # startupProbe does anyway. Readiness is unaffected and still pulls a sick
  # pod out of the Service endpoints on its own schedule.
  livenessProbe:
    httpGet:
      path: /health/liveness
      port: 4000
    initialDelaySeconds: 240
    periodSeconds: 30
    timeoutSeconds: 10
    failureThreshold: 3
  readinessProbe:
    httpGet:
      # Checks the DB connection too - a real readiness signal, not just "the
      # process is up" (see docs/ai-system/litellm/).
      path: /health/readiness
      port: 4000
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

  podAnnotations:
    # The operator already rolls the pod on a rendered-config change via its own
    # config-hash annotation, but that does not cover litellm-secret rotating
    # (master key, DB password, provider API keys). The CRD exposes no
    # Deployment-level annotations, and reloader normally reads its annotation
    # off the workload - but it falls back to the POD TEMPLATE annotations when
    # the workload carries none (verified in stakater/Reloader v1.4.21, the
    # version running here: pkg/common/common.go ShouldReload). So this lands
    # in the right place despite only being settable on the pod template.
    reloader.stakater.com/auto: "true"

  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 2Gi
