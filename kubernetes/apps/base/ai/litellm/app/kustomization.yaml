---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
# Delivered by the home-operations litellm-operator's CRDs (captain decision
# O1, 2026-08-26) rather than a bjw-s app-template HelmRelease. The proxy
# Deployment, Service and rendered config.yaml ConfigMap are all created by the
# operator from litellmproxy.yaml + models/, so none of them appear here.
# Ordering and the operator itself: kubernetes/apps/main/ai/litellm-operator.yaml.
resources:
  - ./externalsecret.yaml
  - ./dbinit.yaml
  - ./litellmproxy.yaml
  - ./httproute-internal.yaml
  - ./models
  - ./virtualkeys
  - ./servicemonitor.yaml
  - ./prometheusrule.yaml
