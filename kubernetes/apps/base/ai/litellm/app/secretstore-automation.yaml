---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-automation
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local:8080
      auth:
        secretRef:
          connectTokenSecretRef:
            key: token
            name: onepassword-secret
            namespace: security
      # Single vault ON PURPOSE, and namespaced because a SecretStore is. The
      # shared `onepassword` ClusterSecretStore lists Homelab/Automation/Services
      # with priorities, so a WRITE through it resolves by that ordering rather
      # than to a vault you named. Reads keep using the shared store; this exists
      # only for the push below. Mirrors the identical store in the `security`
      # namespace used by the Authentik terraform credential.
      vaults:
        Automation: 1
