---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# INTERNAL-ONLY route (captain decision B4): never an envoy-external parentRef.
# Hand-written instead of the operator's spec.route, which cannot carry annotations.
# See skill litellm-proxy (references/platform.md).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  # NEVER `litellm`: the operator deletes a route named after the proxy CR on a later reconcile.
  name: litellm-internal
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: LiteLLM
    gethomepage.dev/description: "LLM governance proxy - virtual keys, budgets, fallback chains"
    gethomepage.dev/icon: litellm.png
    external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
    # /health/readiness also covers the Postgres dependency.
    gatus.home-operations.com/endpoint: |-
      group: ${GATUS_GROUP}
      conditions: ["[STATUS] == 200", "[BODY].status == healthy"]
      url: "https://litellm.${SECRET_DOMAIN}/health/readiness"
spec:
  hostnames:
    - "litellm.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    # Outer layer closing the built-in /anthropic pass-through on the hostname path (the proxy's
    # pass_through_endpoints close the Service path). Most-specific path wins regardless of order.
    - matches:
        - path:
            type: PathPrefix
            value: /anthropic
      filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: litellm-anthropic-passthrough-block
    - backendRefs:
        - name: litellm
          namespace: ai
          port: 4000
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.envoyproxy.io/httproutefilter_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: litellm-anthropic-passthrough-block
spec:
  directResponse:
    statusCode: 404
    contentType: text/plain
    body:
      type: Inline
      inline: "not found\n"
