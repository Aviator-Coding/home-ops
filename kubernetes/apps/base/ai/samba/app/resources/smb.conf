# Samba configuration for the two LAN shares this server exports.
#
# ghcr.io/dockur/samba uses this file verbatim when /etc/samba/smb.conf is present
# and non-empty and skips its own env-driven template, so everything below,
# including the force user/group block that is the point of this app, is
# authoritative.
#
# THE OWNERSHIP CONTRACT is stated in full in [xml]; [files] repeats it and BOTH
# shares depend on it.
#
#   [xml]   -> /shared (claim shared-xml)
#   [files] -> /files  (claim shared-files)
#
# One server, one account, one identity: both shares authenticate the `hermes`
# account and force all I/O to uid/gid 10000. Adding a share is a [section] plus a
# volume on the samba and hermes HelmReleases, never a second Samba app. The
# entrypoint's own `share` variable is hardcoded to /shared, so its mkdir/chmod/
# chown never touch another share path (see the setgid comments on the samba
# HelmRelease).

[global]
   workgroup = WORKGROUP
   server string = homelab shares
   server role = standalone server
   security = user
   # Explicit and <= 15 chars: smbd otherwise derives it from the pod hostname
   # (~21 chars) and logs a "netbios name is too long" warning on every start. Kept
   # as HOMELAB-XML: NetBIOS is off so the name never goes on the wire, and renaming
   # would churn the Mac's saved mounts.
   netbios name = HOMELAB-XML
   # Reject anonymous enumeration; every session must authenticate.
   map to guest = never
   restrict anonymous = 2

   # macOS mounts SMB3 on 445 directly and this image only ever starts smbd
   # (never nmbd), so NetBIOS name service could not answer anyway - turning it
   # off keeps the LoadBalancer down to a single port.
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   client min protocol = SMB3

   # No printing stack in this image. Without these, smbd probes for CUPS on
   # every connection and publishes a phantom [printers] share.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Required by streams_xattr below.
   ea support = yes

   # --- macOS interop (vfs_fruit). The module order is mandatory: catia, then
   # fruit, then streams_xattr. ---
   vfs objects = catia fruit streams_xattr
   # Keep AppleDouble metadata in a real xattr instead of a ._ sidecar file (a
   # sidecar per file would double the inode count on a ~300k-file tree).
   fruit:metadata = stream
   # fruit:resource = file is deliberate: the corpus is plain XML with no resource
   # forks, and `xattr` would bound each fork by the CephFS xattr size limit for
   # nothing this data needs. `file` is also Samba's default and best-tested path.
   fruit:resource = file
   fruit:model = MacSamba
   # LOAD-BEARING for the ownership contract: with nfs_aces on (the default),
   # Finder's Get Info can write UNIX mode and owner through NFS ACEs, which is
   # exactly what would undo the forced 10000:10000 identity below.
   fruit:nfs_aces = no
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # --- Bulk small-file tuning ---
   # vfs_fruit's readdir_attr returns per-entry metadata inside the directory
   # listing, saving Finder a round trip per file. The two sub-options below drop the
   # parts that cost an extra stat per entry (resource-fork sizes, per-entry
   # effective access).
   readdir_attr:aapl_rsize = no
   readdir_attr:aapl_max_access = no
   # Hand large reads/writes straight to the kernel rather than copying through
   # smbd. Safe here because the share is unsigned and unencrypted (LAN only).
   use sendfile = yes
   min receivefile size = 16384
   aio read size = 1
   aio write size = 1
   getwd cache = yes

[xml]
   comment = XML corpus shared with the hermes agent
   path = /shared
   browseable = yes
   read only = no
   writable = yes
   guest ok = no
   valid users = hermes

   # === THE OWNERSHIP CONTRACT ===
   # smbd performs every read and write as uid/gid 10000, the identity the hermes
   # agent runs as (HERMES_UID/HERMES_GID in the hermes HelmRelease, pod fsGroup
   # 10000), so a file the Mac creates is indistinguishable from one hermes created.
   #
   # `hermes` and `smb` are container-local account names the dockur entrypoint
   # creates from the USER and UID/GID env; the numeric ids are the contract. A wrong
   # id fails silently and looks healthy: a backup mover at the wrong uid could not
   # read the hermes volume, hence KOPIUR_PUID pinned to 10000 in
   # kubernetes/apps/main/ai/hermes.yaml.
   force user = hermes
   force group = smb
   # Belt and braces on top of force user: pin the mode of everything created
   # through SMB, so group 10000 keeps write access even when a client asks for
   # something more restrictive.
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775
   # Do not copy the parent directory's mode onto new entries - the forced modes
   # above are the entire contract.
   inherit permissions = no

   # Finder scatters these through every directory it opens; keeping them out of
   # the tree the agent walks costs nothing and saves it work.
   veto files = /.DS_Store/._.DS_Store/.TemporaryItems/.Trashes/.fseventsd/.Spotlight-V100/
   delete veto files = yes

[files]
   comment = General-purpose folder shared with the hermes agent
   path = /files
   browseable = yes
   read only = no
   writable = yes
   guest ok = no
   valid users = hermes

   # === THE OWNERSHIP CONTRACT (identical to [xml] - read it there) ===
   # Repeated verbatim: smbd has no share-level include. It matters MORE here: this
   # is a general drop folder whose claim is not backed up (skill `hermes-agent`,
   # references/shared-storage.md), so a file hermes cannot read is a silent failure
   # on data that may exist nowhere else.
   force user = hermes
   force group = smb
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775
   # Do not copy the parent directory's mode onto new entries - the forced modes
   # above are the entire contract.
   inherit permissions = no

   # Finder scatters these through every directory it opens; keeping them out of
   # the tree the agent walks costs nothing and saves it work.
   veto files = /.DS_Store/._.DS_Store/.TemporaryItems/.Trashes/.fseventsd/.Spotlight-V100/
   delete veto files = yes
