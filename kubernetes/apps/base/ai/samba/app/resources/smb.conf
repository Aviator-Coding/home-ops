# Samba configuration for the shared XML corpus.
#
# ghcr.io/dockur/samba's entrypoint uses this file verbatim when /etc/samba/smb.conf
# is present and non-empty ("Using provided configuration file"), and skips its own
# env-driven template entirely - so everything below, including the force user/group
# block that is the whole point of this app, is authoritative.
#
# THE OWNERSHIP CONTRACT lives in the [xml] section. Read that first.

[global]
   workgroup = WORKGROUP
   server string = homelab xml share
   server role = standalone server
   security = user
   # Explicit and <= 15 chars. smbd otherwise derives it from the pod hostname
   # (`samba-<replicaset>-<suffix>`, ~21 chars) and logs a "netbios name is too
   # long" warning on every start - harmless with NetBIOS off, but it reads like
   # a real fault to whoever next opens these logs.
   netbios name = HOMELAB-XML
   # Reject anonymous enumeration; every session must authenticate.
   map to guest = never
   restrict anonymous = 2

   # macOS mounts SMB3 on 445 directly and this image only ever starts smbd
   # (never nmbd), so NetBIOS name service could not answer anyway - turning it
   # off keeps the LoadBalancer down to a single port.
   disable netbios = yes
   smb ports = 445
   server min protocol = SMB3
   client min protocol = SMB3

   # No printing stack in this image. Without these, smbd probes for CUPS on
   # every connection and publishes a phantom [printers] share.
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

   # Required by streams_xattr below.
   ea support = yes

   # --- macOS interop (vfs_fruit). The module order is mandatory: catia, then
   # fruit, then streams_xattr. ---
   vfs objects = catia fruit streams_xattr
   # Keep AppleDouble metadata in a real xattr instead of a ._sidecar file. At
   # ~300,000 files a sidecar per file would double the inode count and the
   # traversal cost the captain is already accepting.
   fruit:metadata = stream
   fruit:resource = file
   fruit:model = MacSamba
   # LOAD-BEARING for the ownership contract: with nfs_aces on (the default),
   # Finder's Get Info can write UNIX mode and owner through NFS ACEs, which is
   # exactly what would undo the forced 10000:10000 identity below.
   fruit:nfs_aces = no
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:wipe_intentionally_left_blank_rfork = yes
   fruit:delete_empty_adfiles = yes

   # --- Bulk small-file tuning ---
   # vfs_fruit's readdir_attr returns per-entry metadata inside the directory
   # listing itself, so Finder does not spend a round trip per file. That is the
   # one setting that materially helps a 300k-file tree; the two sub-options
   # below drop the parts of it that cost an extra stat per entry and that the
   # captain does not need (resource-fork sizes, per-entry effective access).
   readdir_attr:aapl_rsize = no
   readdir_attr:aapl_max_access = no
   # Hand large reads/writes straight to the kernel rather than copying through
   # smbd. Safe here because the share is unsigned and unencrypted (LAN only).
   use sendfile = yes
   min receivefile size = 16384
   aio read size = 1
   aio write size = 1
   getwd cache = yes

[xml]
   comment = XML corpus shared with the hermes agent
   path = /shared
   browseable = yes
   read only = no
   writable = yes
   guest ok = no
   valid users = hermes

   # === THE OWNERSHIP CONTRACT ===
   # smbd performs every read and write as uid 10000 / gid 10000 - the identity
   # the hermes agent process runs as (HERMES_UID/HERMES_GID in the hermes
   # HelmRelease, pod fsGroup 10000). So a file the Mac creates over SMB is
   # indistinguishable from one hermes created, in both directions.
   #
   # `hermes` and `smb` are the container-local account names the dockur
   # entrypoint creates from the USER env plus UID/GID env (both 10000) - the
   # names are cosmetic, the numeric ids are the contract.
   #
   # This is not theoretical hygiene: on the hermes /opt/data volume a mover
   # running at the wrong uid could not read 1,948 files or traverse 310
   # directories, which is why KOPIUR_PUID is pinned to 10000 in
   # kubernetes/apps/main/ai/hermes.yaml. Getting it wrong here fails the same
   # way and looks healthy while doing it.
   force user = hermes
   force group = smb
   # Belt and braces on top of force user: pin the mode of everything created
   # through SMB, so group 10000 keeps write access even when a client asks for
   # something more restrictive.
   create mask = 0664
   force create mode = 0664
   directory mask = 0775
   force directory mode = 0775
   # Do not copy the parent directory's mode onto new entries - the forced modes
   # above are the entire contract.
   inherit permissions = no

   # Finder scatters these through every directory it opens; keeping them out of
   # the tree the agent walks costs nothing and saves it work.
   veto files = /.DS_Store/._.DS_Store/.TemporaryItems/.Trashes/.fseventsd/.Spotlight-V100/
   delete veto files = yes
