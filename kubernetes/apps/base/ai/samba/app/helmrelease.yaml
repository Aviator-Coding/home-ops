---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app samba
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      samba:
        # One writer identity, and smbd holds per-file locks in its own
        # process - a second replica would not share that state across either of
        # the two RWX volumes it serves.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          # Non-recursive. setgid 2770 is load-bearing: OnRootMismatch walks the volume without it.
          # The entrypoint resets empty /shared to 0770; postStart puts 2770 back.
          # See skill hermes-agent references/shared-storage.md.
          chown-share:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - sh
              - -c
              - |
                set -eu
                chown 10000:10000 /shared
                chmod 2770 /shared
                chown 10000:10000 /files
                chmod 2770 /files
            securityContext:
              runAsUser: 0
              runAsGroup: 0
        containers:
          app:
            image:
              repository: ghcr.io/dockur/samba
              tag: "4.23.10"
            env:
              # The entrypoint creates this container-local account and its `smb`
              # group at exactly these ids, which is what `force user`/`force
              # group` in smb.conf then resolve to. Both must stay 10000: that is
              # the uid/gid the hermes agent process runs as.
              USER: hermes
              UID: "10000"
              GID: "10000"
              TZ: ${CONFIG_TIMEZONE}
              # Password arrives as a file at /run/secrets/pass (see persistence
              # below), which the entrypoint prefers over the PASS env.
            # Re-assert 2770 after smbd is up. The entrypoint strips setgid on an empty /shared.
            # See skill hermes-agent references/shared-storage.md.
            lifecycle:
              postStart:
                exec:
                  command:
                    - sh
                    - -c
                    - |
                      for i in $(seq 1 60); do
                        if pgrep -x smbd >/dev/null 2>&1; then
                          chmod 2770 /shared || true
                          chmod 2770 /files || true
                          break
                        fi
                        sleep 1
                      done
                      exit 0
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &smb 445
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probes
              startup:
                enabled: false
            securityContext:
              # smbd must start as root: it creates the uid-10000 account at boot
              # and then setuids per session to honour `force user`. Neither is
              # possible from an unprivileged container, so this app is a
              # deliberate exception to the repo's non-root convention rather
              # than an oversight. It is reachable only from the LAN (no
              # HTTPRoute, no envoy listener) and serves exactly two LAN
              # shares, both to the same single account.
              runAsUser: 0
              runAsGroup: 0
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        # Matches the hermes pod, so the share root converges to gid 10000
        # whichever pod happens to mount the fresh volume first.
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: samba
        # LAN-only, Cilium BGP pool address. Never behind envoy: SMB is not HTTP and
        # must not be publicly reachable. One IP serves every share section.
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.50.0.55
        ports:
          smb:
            port: *smb
            protocol: TCP
    persistence:
      # [xml] share, same claim hermes mounts at /opt/xml. /shared is fixed by the
      # dockur/samba entrypoint.
      shared-xml:
        existingClaim: shared-xml
        advancedMounts:
          samba:
            chown-share:
              - path: /shared
            app:
              - path: /shared
      # [files] share, mounted by hermes at /opt/files. A second section on this
      # server, not a second Samba app. chown-share needs the mount to pin the root.
      shared-files:
        existingClaim: shared-files
        advancedMounts:
          samba:
            chown-share:
              - path: /files
            app:
              - path: /files
      # smb.conf is the whole app - the entrypoint uses it verbatim instead of
      # generating one from env. Mounted read-only; reloader restarts the pod
      # when the ConfigMap content changes.
      smb-config:
        type: configMap
        name: samba-configmap
        advancedMounts:
          samba:
            app:
              - path: /etc/samba/smb.conf
                subPath: smb.conf
                readOnly: true
      # SMB account password, read by the entrypoint and handed to smbpasswd.
      smb-password:
        type: secret
        name: *app
        advancedMounts:
          samba:
            app:
              - path: /run/secrets/pass
                subPath: pass
                readOnly: true
