---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Password for the single SMB account (`hermes`, uid/gid 10000) on the LAN share.
#
# Rendered as a FILE, not env: ghcr.io/dockur/samba reads /run/secrets/pass when
# that path is non-empty and only falls back to the PASS env otherwise, so the
# credential never enters the container environment.
#
# 1Password item `samba` (vault Homelab - priority 1 on the `onepassword`
# ClusterSecretStore) field:
#   SMB_PASSWORD - password for the `hermes` SMB account
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name samba
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        # Mounted at /run/secrets/pass; the entrypoint feeds it to smbpasswd.
        pass: "{{ .SMB_PASSWORD }}"
  dataFrom:
    - extract:
        key: samba
