---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
configMapGenerator:
  - name: repo-wiki-config
    files:
      - repos.txt=./resources/repos.txt
      - mkdocs.yml=./resources/mkdocs.yml
      - generate.py=./resources/generate.py
generatorOptions:
  disableNameSuffixHash: true
