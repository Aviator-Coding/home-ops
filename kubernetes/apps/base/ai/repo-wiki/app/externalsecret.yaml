---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item `repo-wiki` field `GITHUB_TOKEN`: see this app's README.md
# prerequisite table. Item `litellm-consumer-repo-wiki` field `key` is NOT a
# captain prerequisite - it is auto-created by the PushSecret paired with the
# LiteLLMVirtualKey CR (kubernetes/apps/base/ai/litellm/app/virtualkeys/repo-wiki.yaml),
# the same continuity pattern as litellm's demo/router-demo consumers.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name repo-wiki
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        OPENAI_API_KEY: "{{ .key }}"
        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: litellm-consumer-repo-wiki
    - extract:
        key: repo-wiki
