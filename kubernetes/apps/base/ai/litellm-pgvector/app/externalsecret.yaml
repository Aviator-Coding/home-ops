---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The long-running server's credentials only. The Postgres SUPERUSER password
# is deliberately not in here - it lives in the separate db-init Secret below,
# so the always-on pod never holds it.
#
# Items (neither is a captain prerequisite; both are written by PushSecrets in
# kubernetes/apps/base/ai/litellm/app/):
#   litellm-pgvector                   <- pushsecret-pgvector.yaml (seeded once by hand)
#   litellm-consumer-litellm-pgvector  <- virtualkeys/litellm-pgvector.yaml
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pgvector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-pgvector-secret
    template:
      data:
        # Hex password (see pushsecret-pgvector.yaml), so no URL escaping.
        # connection_limit caps Prisma's pool, which otherwise sizes itself
        # from the node's CPU count (2n+1) against the shared cluster's 300.
        DATABASE_URL: "postgresql://litellm_pgvector:{{ .LITELLM_PGVECTOR_DB_PASSWORD }}@postgres-17-rw.database.svc.cluster.local:5432/litellm_pgvector?schema=public&connection_limit=5"
        # Bearer key every caller of this server must send. The proxy holds the
        # same value as LITELLM_PGVECTOR_API_KEY.
        SERVER_API_KEY: "{{ .LITELLM_PGVECTOR_SERVER_API_KEY }}"
        # The server's own LiteLLM virtual key, used to embed search queries.
        EMBEDDING__API_KEY: "{{ .key }}"
  dataFrom:
    - extract:
        key: litellm-pgvector
    - extract:
        key: litellm-consumer-litellm-pgvector
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# postgres-init's INIT_POSTGRES_* contract, identical to every other
# Postgres-backed app here, and NOTHING else. Never add libpq's PG* variables
# (PGDATABASE above all): the postgres-init container loads this Secret too, and
# its script passes no --dbname to psql, so an inherited PGDATABASE points every
# one of its checks at the app database before it exists. Measured on the first
# deploy (2026-09-28): "database litellm_pgvector does not exist" on the
# user-exists check AND on `ALTER USER ... PASSWORD`, while createuser/createdb
# (which use the maintenance DB) succeeded - the role came out with LOGIN and a
# NULL password, and the Job still reported Completed because postgres-init has
# no `set -e`. The schema container derives its PG* in its own `env`
# (dbinit.yaml). Pinned by scripts/ci/litellm-pgvector-test.py.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pgvector-db-init
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-pgvector-db-init
    template:
      data:
        INIT_POSTGRES_HOST: postgres-17-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: litellm_pgvector
        INIT_POSTGRES_USER: litellm_pgvector
        INIT_POSTGRES_PASS: "{{ .LITELLM_PGVECTOR_DB_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: litellm-pgvector
    - extract:
        key: cloudnative-pg
