---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The long-running server's credentials only; the Postgres superuser password stays in the
# separate db-init Secret. Both items are written by PushSecrets in ../../litellm/app/.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pgvector
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-pgvector-secret
    template:
      data:
        # Hex password (no URL escaping); connection_limit caps Prisma's pool on the shared cluster.
        DATABASE_URL: "postgresql://litellm_pgvector:{{ .LITELLM_PGVECTOR_DB_PASSWORD }}@postgres-17-rw.database.svc.cluster.local:5432/litellm_pgvector?schema=public&connection_limit=5"
        # Bearer key every caller of this server sends; the proxy holds it as LITELLM_PGVECTOR_API_KEY.
        SERVER_API_KEY: "{{ .LITELLM_PGVECTOR_SERVER_API_KEY }}"
        # The server's own LiteLLM key, used to embed search queries.
        EMBEDDING__API_KEY: "{{ .key }}"
  dataFrom:
    - extract:
        key: litellm-pgvector
    - extract:
        key: litellm-consumer-litellm-pgvector
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# postgres-init's INIT_POSTGRES_* contract and NOTHING else. Never add libpq PG* variables
# (PGDATABASE above all): postgres-init loads this Secret too and would silently leave the role
# with a NULL password while reporting Completed. Pinned by scripts/ci/litellm-pgvector-test.py.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-pgvector-db-init
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: litellm-pgvector-db-init
    template:
      data:
        INIT_POSTGRES_HOST: postgres-17-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: litellm_pgvector
        INIT_POSTGRES_USER: litellm_pgvector
        INIT_POSTGRES_PASS: "{{ .LITELLM_PGVECTOR_DB_PASSWORD }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: litellm-pgvector
    - extract:
        key: cloudnative-pg
