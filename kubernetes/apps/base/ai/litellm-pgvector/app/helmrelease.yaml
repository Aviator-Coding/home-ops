---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
# BerriAI/litellm-pgvector: the stateless server behind LiteLLM's pg_vector store (data lives in
# postgres-17). ClusterIP only, no HTTPRoute. See skill litellm-proxy (references/vector-store.md).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app litellm-pgvector
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: -1
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        # The image's own USER; no fsGroup (no owned volume).
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    controllers:
      litellm-pgvector:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              # Content-addressed tag: after ANY edit in .github/docker/litellm-pgvector set it to
              # `python3 scripts/ci/litellm-pgvector-test.py --print-tag` (the test asserts it).
              repository: ghcr.io/aviator-coding/litellm-pgvector
              tag: b553f84-3c129ca9b802
            env:
              # INVARIANT: model, EMBEDDING__DIMENSIONS, schema.sql's vector(N) and the litellm-pgvector
              # key's one-model allow-list move together (CI-enforced); 2000 is pgvector's HNSW limit.
              EMBEDDING__MODEL: openai/qwen/qwen3-embedding-8b
              EMBEDDING__BASE_URL: http://litellm.ai.svc.cluster.local:4000
              EMBEDDING__DIMENSIONS: "2000"
              # No cost-map fetch from GitHub at import; nothing here prices anything.
              LITELLM_LOCAL_MODEL_COST_MAP: "True"
            envFrom:
              - secretRef:
                  name: litellm-pgvector-secret
            # /health is static (process up, not DB up); a DB outage shows as 500s on search.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 320Mi
              limits:
                memory: 768Mi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # Prisma's query engine and Python want a writable /tmp.
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
