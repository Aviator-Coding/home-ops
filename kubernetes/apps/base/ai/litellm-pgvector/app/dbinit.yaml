---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/batch/job_v1.json
# Creates the `litellm_pgvector` role and database in the shared postgres-17
# CNPG cluster, then applies resources/schema.sql. Same shape and reasoning as
# ../../litellm/app/dbinit.yaml (a Job with ghcr.io/home-operations/postgres-init
# rather than a CNPG `Database` CR, which would need `spec.managed.roles` edits
# on the shared Cluster).
#
# The pgvector `vector` extension (0.8.0) is already present in the shared
# cluster's image (ghcr.io/tensorchord/cloudnative-pgvecto.rs:17.5-v0.4.0 ships
# pgvector next to pgvecto.rs - verified live 2026-09-27 via
# pg_available_extensions), so no image change is involved. It is not a trusted
# extension, so only a superuser can CREATE it; that is why the schema step
# connects as the superuser and then SET ROLEs to the app role (schema.sql).
#
# Two steps, not postgres-init's own /initdb/<db>.sql hook: that hook runs only
# on the run that CREATES the database, so a later schema change (a new index,
# a re-seeded store) would never be applied. schema.sql is idempotent and runs
# on every Job run instead.
#
# Re-runs: the schema ConfigMap keeps its content-hash name suffix, so a
# schema.sql edit renames it, changes this Job's spec, and the force annotation
# lets Flux delete-and-recreate the (immutable) Job - i.e. editing the SQL is
# enough to re-apply it. Otherwise:
#   kubectl -n ai delete job litellm-pgvector-db-init   # Flux recreates it
apiVersion: batch/v1
kind: Job
metadata:
  name: litellm-pgvector-db-init
  annotations:
    kustomize.toolkit.fluxcd.io/force: "true"
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          envFrom:
            - secretRef:
                name: litellm-pgvector-db-init
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      containers:
        - name: init-schema
          # Same image for its psql client. Its libpq PG* variables are set
          # HERE, derived from the INIT_POSTGRES_* contract, and never put in
          # the shared Secret: the init-db container above loads that Secret
          # too, and an inherited PGDATABASE breaks postgres-init (see
          # externalsecret.yaml).
          image: ghcr.io/home-operations/postgres-init:18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
          command: ["psql"]
          args:
            - --no-psqlrc
            - --set=owner=$(INIT_POSTGRES_USER)
            - --file=/sql/schema.sql
          envFrom:
            - secretRef:
                name: litellm-pgvector-db-init
          env:
            - name: PGHOST
              value: $(INIT_POSTGRES_HOST)
            - name: PGDATABASE
              value: $(INIT_POSTGRES_DBNAME)
            # postgres-init's own default superuser name.
            - name: PGUSER
              value: postgres
            - name: PGPASSWORD
              value: $(INIT_POSTGRES_SUPER_PASS)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: schema
              mountPath: /sql
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
      volumes:
        - name: schema
          configMap:
            name: litellm-pgvector-schema
