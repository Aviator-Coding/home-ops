# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Reads the `hermes` 1Password item's HOMELAB_GH_READ_TOKEN: a fine-grained, READ-ONLY PAT (verified: issue
# and file writes answer 403). Not HOMELAB_GH_TOKEN, which can write to home-ops. Use a different read-only
# token here if the MCP needs more read access; never a write-capable one (Hermes reaches this MCP).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-github
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        token: "{{ .HOMELAB_GH_READ_TOKEN }}"
  dataFrom:
    - extract:
        key: hermes
