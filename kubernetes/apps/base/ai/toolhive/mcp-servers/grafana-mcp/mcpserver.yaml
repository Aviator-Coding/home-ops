# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1alpha1.json
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: MCPServer
metadata:
  name: grafana-mcp
spec:
  image: docker.io/grafana/mcp-grafana:1.5.1@sha256:07c6614a8f8b6477e572444874c8c07baf145473977f014497cb59262af1944c
  transport: streamable-http
  proxyMode: streamable-http
  proxyPort: 8080
  mcpPort: 8000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podTemplateSpec:
    # Reloader on the pod template, not resourceOverrides.proxyDeployment:
    # GRAFANA_SERVICE_ACCOUNT_TOKEN is injected into the MCP StatefulSet, and
    # this CRD has no StatefulSet override hook. Reloader falls back to
    # spec.template.metadata.annotations when the workload metadata lacks the
    # reload key, so this is the attachment point that actually rolls the
    # consumer after toolhive-grafana rotates.
    metadata:
      annotations:
        secret.reloader.stakater.com/reload: toolhive-grafana
    spec:
      containers:
        - name: mcp
          args:
            - -t
            - streamable-http
            - --allowed-hosts
            - "*"
            # A6: Viewer-scoped service account token already enforces
            # read-only at the Grafana API layer; --disable-write is
            # belt-and-suspenders in case the token is ever widened.
            - --disable-write
          env:
            - name: GRAFANA_URL
              value: http://grafana.monitoring.svc.cluster.local
  secrets:
    - name: toolhive-grafana
      key: GRAFANA_SERVICE_ACCOUNT_TOKEN
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  groupRef:
    name: mcp-tools
