# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Captain (A6): token must be a Grafana service account with the Viewer role
# only — never Editor/Admin. Create 1Password item `grafana-mcp` with field
# `GRAFANA_SERVICE_ACCOUNT_TOKEN` set to that Viewer-scoped token.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .GRAFANA_SERVICE_ACCOUNT_TOKEN }}"
  dataFrom:
    - extract:
        key: grafana-mcp
