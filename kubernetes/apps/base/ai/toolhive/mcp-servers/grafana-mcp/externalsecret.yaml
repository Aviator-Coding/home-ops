# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Captain (A6): token must be a Grafana service account with the Viewer role
# only — never Editor/Admin. Reuses the exact 1Password item/field the
# original grafana-mcp deployment referenced (item `grafana-mcp`, field
# `GRAFANA_SERVICE_ACCOUNT_TOKEN` — see git history at f4406607, archived and
# later deleted from Git in #1402, but 1Password items are not deleted by a
# Git commit). No new item was invented for this restore. If that item still
# exists with a Viewer-scoped token, this needs no captain action; only
# recreate it with these exact names if it was also removed from the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-grafana
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .GRAFANA_SERVICE_ACCOUNT_TOKEN }}"
  dataFrom:
    - extract:
        key: grafana-mcp
