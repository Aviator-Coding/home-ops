# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Captain (A6): token must be a Grafana service account with the Viewer role
# only - never Editor/Admin. Uses 1Password item `grafana-mcp`, field
# `GRAFANA_SERVICE_ACCOUNT_TOKEN`; recreate it with these exact names if it is
# missing from the vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-grafana
spec:
  # 5m, not the 1h default: grafana-sa-provisioner (monitoring namespace)
  # rotates this token on the same cadence when it self-heals after a
  # Grafana restart - a 1h refresh here would leave the token dead for up
  # to an hour after a fresh one is already sitting in 1Password.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        GRAFANA_SERVICE_ACCOUNT_TOKEN: "{{ .GRAFANA_SERVICE_ACCOUNT_TOKEN }}"
  dataFrom:
    - extract:
        key: grafana-mcp
