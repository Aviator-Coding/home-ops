---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The key is generated in media/seerr (password.yaml), adopted by Seerr through API_KEY and pushed to the 1Password
# item `seerr-api` (vault Automation) by pushsecret-api-key.yaml. Nothing is added by hand.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-seerr
spec:
  # Short interval: the first sync races the PushSecret that creates the item.
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-automation
  target:
    name: *name
    template:
      data:
        SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
  dataFrom:
    - extract:
        key: seerr-api
