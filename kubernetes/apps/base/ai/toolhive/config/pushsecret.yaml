---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
# Records the generated gateway token in 1Password (vault Automation, item mcp-gateway), where
# consumers' ExternalSecrets read it back. Skill ai-stack references/toolhive.md.
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: mcp-gateway-token
spec:
  refreshInterval: 1h
  # Pruning this PushSecret must never delete the item consumers read.
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-automation
      kind: ClusterSecretStore
  selector:
    secret:
      name: mcp-gateway-token
  data:
    - match:
        secretKey: MCP_GATEWAY_TOKEN
        remoteRef:
          remoteKey: mcp-gateway
          property: MCP_GATEWAY_TOKEN
