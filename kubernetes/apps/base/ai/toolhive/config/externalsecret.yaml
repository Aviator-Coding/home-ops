---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
# Bearer token for the mcp-gateway HTTPRoute. Alphanumeric only: it travels in an HTTP header.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-gateway-token
spec:
  length: 64
  digits: 16
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - MCP_GATEWAY_TOKEN
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Generated once and never refreshed. Deleting this ExternalSecret deletes the Secret and mints a
# new token, which pushsecret.yaml then writes over the 1Password field. Skill ai-stack references/toolhive.md.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name mcp-gateway-token
spec:
  refreshPolicy: CreatedOnce
  target:
    name: *name
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: *name
