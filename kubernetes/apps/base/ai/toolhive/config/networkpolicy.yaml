---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
# vmcp has no static-token mode, so this policy is the only thing keeping the bearer token on the
# `mcp` route from being bypassed through the Service. Only envoy-internal and Prometheus (for
# /metrics) reach 4483. Skill ai-stack references/toolhive.md.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-gateway-internal
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
      app.kubernetes.io/instance: mcp-gateway-internal
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: network
          podSelector:
            matchLabels:
              gateway.envoyproxy.io/owning-gateway-name: envoy-internal
              gateway.envoyproxy.io/owning-gateway-namespace: network
      ports:
        - port: 4483
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 4483
          protocol: TCP
