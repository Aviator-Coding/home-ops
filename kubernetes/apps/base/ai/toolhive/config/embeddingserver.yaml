# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/embeddingserver_v1alpha1.json
#
# Tool-selection index for vmcp only. Keep BAAI/bge-small-en-v1.5: Qwen3-Embedding-0.6B
# takes about 487s per session and the handshake budget is 30s. Do not point this at the B70.
# See skill ai-stack references/toolhive.md.
apiVersion: toolhive.stacklok.dev/v1alpha1
kind: EmbeddingServer
metadata:
  name: mcp-tools-embedding
spec:
  model: BAAI/bge-small-en-v1.5
  image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest@sha256:1bd34a7178b00f822b951bb29944e696edcbc83cbf198ef36e3683571c71e9d4
  env:
    - name: HOSTNAME
      value: "::"
  # No --max-batch-tokens. bge-small's warmup buffer is about 12 MiB. Request 1 CPU so a
  # saturated node still finishes inside 30s; the 4 CPU limit is the burst. See skill ai-stack references/toolhive.md.
  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "4"
      memory: 2Gi
