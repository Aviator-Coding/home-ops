apiVersion: toolhive.stacklok.dev/v1alpha1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  groupRef:
    name: mcp-tools
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}_"
  embeddingServerRef:
    name: mcp-tools-embedding
  # vmcp accepts only anonymous, local or OIDC JWTs, no static token. The bearer token is
  # enforced on the route (securitypolicy.yaml); the in-cluster Service is unauthenticated.
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  # Shared MCPTelemetryConfig (mcp-telemetry.yaml): serves /metrics on the main port 4483.
  telemetryConfigRef:
    name: prometheus
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # The optimizer (find_tool) builds a SQLite FTS5 index per session; the root
        # filesystem is read-only, so without this it fails with "disk I/O error".
        - name: tmp
          emptyDir: {}
