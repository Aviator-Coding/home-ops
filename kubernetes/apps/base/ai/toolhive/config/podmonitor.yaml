# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway-internal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
      app.kubernetes.io/instance: mcp-gateway-internal
  namespaceSelector:
    matchNames:
      - ai
  podMetricsEndpoints:
    # The vmcp container declares exactly one named port ("http", 4483) -
    # there is no port named "8080", so `port: "8080"` (a name lookup)
    # resolved to zero targets. `targetPort` addresses the container port by
    # number directly and needs no matching named port.
    - targetPort: 8080
      path: /metrics
      interval: 15s
