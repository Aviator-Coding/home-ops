# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/podmonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: mcp-gateway-internal
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
      app.kubernetes.io/instance: mcp-gateway-internal
  namespaceSelector:
    matchNames:
      - ai
  podMetricsEndpoints:
    # vmcp serves /metrics on its main transport port 4483 (declared as the
    # named container port "http"); nothing listens on 8080.
    - port: http
      path: /metrics
      interval: 15s
