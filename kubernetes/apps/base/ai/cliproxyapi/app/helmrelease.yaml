---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cliproxyapi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cliproxyapi:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica with an RWO auth PVC: Recreate avoids a Multi-Attach deadlock.
        strategy: Recreate
        initContainers:
          # Copies each locally-created OAuth file onto the PVC only if that name is missing. After that
          # the app owns the file (it rewrites refreshed tokens), so the seed never overwrites it.
          seed:
            image: &image
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.59@sha256:40dda818164c1012154e18999d35d9cf14d936bd74eabdd62e22284e8898d50d
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /data/auths
                for f in /seed/*.json; do
                  dest=/data/auths/$(basename "$f")
                  [ -e "$dest" ] && continue
                  cp "$f" "$dest"
                  chmod 600 "$dest"
                done
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              TZ: America/New_York
              # /config is a read-only Secret mount; the management panel assets download here.
              WRITABLE_PATH: /tmp
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8317
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 24
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: cliproxyapi
        ports:
          http:
            port: *port
    persistence:
      data:
        # Created here (app-template names it after the release) and backed up by components/kopiur.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        # helm.sh/resource-policy: keep, so a HelmRelease uninstall or rename does not
        # delete the only live copy of this born-kopiur claim. Skill `kopiur-backups`.
        retain: true
        globalMounts:
          - path: /data
      config:
        type: secret
        name: cliproxyapi-config
        advancedMounts:
          cliproxyapi:
            app:
              - path: /config
                readOnly: true
      seed:
        type: secret
        name: cliproxyapi-seed
        advancedMounts:
          cliproxyapi:
            seed:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
