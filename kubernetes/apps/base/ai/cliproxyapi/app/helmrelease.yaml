---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app cliproxyapi
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    controllers:
      cliproxyapi:
        annotations:
          reloader.stakater.com/auto: "true"
        # Single replica with an RWO auth PVC: Recreate avoids a Multi-Attach deadlock.
        strategy: Recreate
        initContainers:
          # First start only: copies the locally-created OAuth file onto the PVC. After that the
          # app owns the file (it rewrites refreshed tokens), so the seed never overwrites it.
          seed:
            image: &image
              repository: docker.io/eceasy/cli-proxy-api
              tag: v8.0.46@sha256:72b7b6d8348205e1ae36bfdebb63df1b7da0316f583739760e6fcfca312c83f9
            command: ["/bin/sh", "-c"]
            args:
              - |
                mkdir -p /data/auths
                if ls /data/auths/*.json >/dev/null 2>&1; then exit 0; fi
                cp /seed/claude.json /data/auths/claude.json
                chmod 600 /data/auths/claude.json
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
        containers:
          app:
            image: *image
            command: ["/CLIProxyAPI/CLIProxyAPI"]
            args: ["--config", "/config/config.yaml"]
            env:
              TZ: America/New_York
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8317
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            securityContext: *securityContext
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: cliproxyapi
        ports:
          http:
            port: *port
    persistence:
      data:
        # Created here (app-template names it after the release) and backed up by components/kopiur.
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 1Gi
        storageClass: ceph-block
        globalMounts:
          - path: /data
      config:
        type: secret
        name: cliproxyapi-config
        advancedMounts:
          cliproxyapi:
            app:
              - path: /config
                readOnly: true
      seed:
        type: secret
        name: cliproxyapi-seed
        advancedMounts:
          cliproxyapi:
            seed:
              - path: /seed
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
