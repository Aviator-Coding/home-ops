---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# 1Password item `cliproxyapi` fields: CLIPROXYAPI_API_KEY (LiteLLM's bearer key, also read by
# litellm/app/externalsecret.yaml), CLIPROXYAPI_DIRECT_KEY (laptop clients), CLIPROXYAPI_MANAGEMENT_KEY
# (management UI login), CLAUDE_AUTH_JSON / XAI_AUTH_JSON (files from local `--claude-login` / `-xai-login`,
# each seeded into /data/auths once).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-config
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-config
    template:
      data:
        config.yaml: |
          host: ""
          port: 8317
          auth-dir: /data/auths
          api-keys:
            - "{{ .CLIPROXYAPI_API_KEY }}"
            - "{{ .CLIPROXYAPI_DIRECT_KEY }}"
          remote-management:
            allow-remote: true
            secret-key: "{{ .CLIPROXYAPI_MANAGEMENT_KEY }}"
          request-retry: 2
  dataFrom:
    - extract:
        key: cliproxyapi
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cliproxyapi-seed
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: cliproxyapi-seed
    template:
      data:
        claude.json: "{{ .CLAUDE_AUTH_JSON }}"
        xai.json: "{{ .XAI_AUTH_JSON }}"
  dataFrom:
    - extract:
        key: cliproxyapi
