---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/gateway.networking.k8s.io/httproute_v1.json
# Internal only. No Authentik policy: API clients send bearer keys and the management UI
# (/management.html) has its own secret-key.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cliproxyapi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/group: AI
    gethomepage.dev/name: CLIProxyAPI
    gethomepage.dev/description: "Subscription OAuth to OpenAI-compatible API proxy"
    gethomepage.dev/pod-selector: app.kubernetes.io/name=cliproxyapi
    external-dns.alpha.kubernetes.io/target: "internal.${SECRET_DOMAIN}"
    gatus.home-operations.com/endpoint: |-
      url: https://cliproxyapi.${SECRET_DOMAIN}/healthz
      conditions:
        - "[STATUS] == 200"
      group: ai
spec:
  hostnames:
    - "cliproxyapi.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: cliproxyapi
          namespace: ai
          port: 8317
