---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pvc-mover-readable-check
  namespace: system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/base/system/pvc-mover-readable-check/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # No targetNamespace. Flux would rewrite metadata.namespace and collapse every RoleBinding into system.
  # Skill `pvc-integrity-checks`.
  timeout: 5m
  wait: false
