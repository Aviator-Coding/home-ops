---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pvc-writable-check
  namespace: system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  path: ./kubernetes/apps/base/system/pvc-writable-check/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Deliberately no targetNamespace: Flux would overwrite metadata.namespace
  # on every namespaced resource in the build - including the per-namespace
  # RoleBindings in rbac.yaml - collapsing them all onto one namespace and
  # failing with a namespace-transformation ID conflict. ServiceAccount,
  # CronJob, and PrometheusRule declare namespace: system explicitly instead.
  timeout: 5m
  wait: false
