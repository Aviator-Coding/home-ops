---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
  namespace: &namespace system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # ClusterRepository credentials come from 1Password through ESO.
    - name: onepassword-store
      namespace: security
    # copyMethod: Snapshot backups take CSI VolumeSnapshots (Stage 1 onward).
    - name: snapshot-controller
      namespace: kube-system
  healthChecks:
    # The WORKLOADS, never the HelmRelease: a HelmRelease Ready only reports
    # that the last helm action succeeded and stays True through a crashloop.
    # Paired with wait: false (below), because Flux ignores spec.healthChecks
    # entirely when wait is true.
    - apiVersion: apps/v1
      kind: Deployment
      name: kopiur-controller
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: kopiur-webhook
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/system/kopiur/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-repository
  namespace: &namespace system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # Separate Kustomization on purpose. The admission webhook is
    # failurePolicy: Fail, so the API server REJECTS these CRs outright (rather
    # than leaving them unreconciled) until the operator is up - and the CRDs
    # have to exist first regardless.
    - name: kopiur
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/system/kopiur/repository
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
      # Written by the kopiur-substitutions ExternalSecret in the `kopiur`
      # Kustomization above, which is why this one dependsOn it.
      - name: kopiur-substitutions
        kind: Secret
  timeout: 5m
  wait: false
