---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr
spec:
  targetNamespace: system-upgrade
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: tuppr
    namespace: system-upgrade
  interval: 1h
  path: ./kubernetes/apps/base/system-upgrade/tuppr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tuppr-upgrades
spec:
  targetNamespace: system-upgrade
  dependsOn:
  - name: tuppr
    namespace: system-upgrade
  interval: 1h
  path: ./kubernetes/apps/base/system-upgrade/tuppr/upgrades
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
