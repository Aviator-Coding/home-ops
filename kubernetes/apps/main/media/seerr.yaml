---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seerr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Proof: proof-ledger.md row 20.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: seerr-db
      namespace: media
    - name: onepassword-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/seerr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 2Gi
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database on the shared postgres-18 Cluster (retain: removing this never
# drops data). Skill `databases`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: seerr-db
  namespace: media
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: seerr
  interval: 30m
  timeout: 5m
  path: ./kubernetes/components/cnpg-database
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  postBuild:
    substitute:
      APP: seerr
      CNPG_ROLE: seerr
      CNPG_DATABASE: seerr
