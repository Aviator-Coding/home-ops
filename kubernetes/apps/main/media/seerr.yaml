---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seerr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-01 - migration Stage 5, pilot volume 4 of 4.
    # kopiur is now the ONLY backup engine on this claim.
    #
    # Authorising evidence, per volume and per destination:
    # docs/backups/kopiur-restore-proof-2026-09-01.md (row 20, `media/seerr`:
    # 75/75 files restored from ceph AND r2, byte-identical to each other).
    # Why this volume was chosen, and the post-retirement re-proof:
    # docs/backups/kopiur-stage5-pilot-retirement-2026-09-01.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # The `volsync` (system) dependency went with the volsync Component above -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/seerr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default. The live claim is 2Gi (holding ~3.4 MB), and under the pvc
      # Component's `ssa: IfNotPresent` this value is create-time-only for the
      # existing claim but is exactly what a REBUILD would provision. Dropping
      # it would silently make a rebuilt seerr claim 2.5x the size of the one
      # it replaced.
      KOPIUR_CAPACITY: 2Gi
      # Matched to the workload: the pod runs 2000:2000:2000 and owns 79 of 80
      # entries as 2000:2000. Measured 2026-08-30 the default of 1000 reads
      # this volume today, but the mover is matched to the workload so a
      # restore reproduces the ownership seerr expects.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 15 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
