---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app seerr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 20. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
    # `kopiur-backups`.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/seerr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Create-time only under ssa IfNotPresent. A rebuild provisions this size, not the component default.
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 2Gi
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
