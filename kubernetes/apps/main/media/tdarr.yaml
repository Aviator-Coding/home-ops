---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3. volsync's entry is unchanged and
    # stays that way until a restore has been demonstrated from kopiur for this
    # volume (Stage 5).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  dependsOn:
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/tdarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_CLAIM: tdarr-config
      VOLSYNC_SCHEDULE_CEPH: "50 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "20 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "50 3 * * *"
      KOPIUR_CLAIM: tdarr-config
      # Matched to the file ownership, measured 2026-08-30: 23992 of 23993
      # entries are owned 2000:2000 (the pod's own runAsUser is 0 with fsGroup
      # 2000). The default of 1000 reads this volume today, but with 17,233
      # files the odds of one eventually landing without a world-read bit are
      # not worth taking - that is exactly how sabnzbd-config failed.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 15 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
