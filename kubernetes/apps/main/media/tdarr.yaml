---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 21 - 17278/17278 files restored from BOTH destinations into a scratch
    # PVC with an identical per-file manifest digest (`b29eb20847d8`), the
    # largest file count of any tier-A claim. This is ALSO the one claim in the
    # wave whose restore cache has been r2-proven end to end at its standing
    # value: 17,281 files / 1,820,653,922 bytes restored from r2 at exactly the
    # 10Gi below, matching the snapshot's filesNew/sizeBytes, 0 mode or
    # ownership differences across 24,054 entries
    # (docs/backups/kopiur-populator-drift-2026-09-02.md).
    #
    # The hand-authored transcode flows are versioned in docs/tdarr/flow-nodes/
    # and are therefore reconstructible, which is what puts this claim in tier
    # A despite its size. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # This Kustomization never carried a `volsync` (system) dependency, unlike
    # its siblings - retirement therefore removes nothing here. kopiur is the
    # sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/tdarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `tdarr-config` while the app is `tdarr` (and `tdarr-temp`,
      # the 200Gi RWX transcode scratch in the base app, is deliberately backed
      # up by neither engine). This drove the retired VOLSYNC_CLAIM and now
      # also drives the pvc Component's PVC name, so it is load-bearing in a
      # second place after retirement.
      KOPIUR_CLAIM: tdarr-config
      # Inherited from the retired VOLSYNC_CAPACITY and matched to the LIVE
      # claim (5Gi, holding 1.72 GiB - measured 2026-09-04). Under the pvc
      # Component's `ssa: IfNotPresent` this is create-time-only for the claim
      # that already exists, but it is exactly what a REBUILD would provision -
      # so it is stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # Matched to the file ownership, measured 2026-08-30: 23992 of 23993
      # entries are owned 2000:2000 (the pod's own runAsUser is 0 with fsGroup
      # 2000). The default of 1000 reads this volume today, but with 17,233
      # files the odds of one eventually landing without a world-read bit are
      # not worth taking - that is exactly how sabnzbd-config failed.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # RESTORE-SIZED, not backup-sized. Measured 2026-09-02
      # (docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md finding 1):
      # during a restore the kopia cache grows ~1:1 with the bytes written into
      # the target until it reaches kopia's own internal budget - observed as a
      # ~6.2 GiB plateau - so the cache a restore needs is
      # min(snapshot sizeBytes, ~6.2 GiB).
      #
      # This is a CLIFF, not a slope, and that is why 2Gi had to go. This claim's
      # r2 snapshot is 1.70 GiB against 1.95 GiB usable at 2Gi = 87%, the tightest
      # margin in the fleet. While the snapshot stays under the cache the limit is
      # never reached and any value works; the first time this growing volume
      # crosses 1.95 GiB the requirement does not rise to 2.1 GiB, it jumps
      # straight to the full ~6.2 GiB plateau and the restore fails TERMINALLY -
      # a failed kopiur Restore never retries, recovery means creating a new one.
      # So the failure would only ever be discovered during an actual disaster.
      #
      # 10Gi (9.74 GiB usable) covers the plateau with ~57% headroom and matches
      # plex and sabnzbd in the same size class. Cost is not a reason to
      # under-size: `mode: Ephemeral` renders a generic ephemeral PVC on
      # ceph-block, thin-provisioned and deleted with the mover pod, so it costs
      # only what a run actually writes.
      #
      # Proven end-to-end from r2 at exactly this value on 2026-09-02, with the
      # restored tree verified by file count and per-tree sha256 rather than by
      # a success status. Evidence:
      # docs/backups/kopiur-populator-drift-2026-09-02.md.
      #
      # One variable feeds both SnapshotPolicies and the standing Restore.
      # Raising it reaches the policies on the next Flux reconcile but NOT the
      # standing populator tdarr-kopiur-dst (ssa: IfNotPresent, create-once) -
      # that needs a one-time delete so Flux recreates it at the new value.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 15 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
