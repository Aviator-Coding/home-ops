---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tdarr
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 21. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/tdarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Claim name differs from the app. The pvc component names the PVC from this. Skill `kopiur-backups`.
      KOPIUR_CLAIM: tdarr-config
      # Create-time only under ssa IfNotPresent. A rebuild provisions this size, not the component default.
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 5Gi
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Sized for the restore cliff: min(snapshot sizeBytes, ~6.2 GiB). A raise does not update the standing
      # Restore. Skill `kopiur-backups`.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
