---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  dependsOn:
    # kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
    # `kopiur-backups`.
    - name: kopiur-repository
      namespace: system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/media/calibre/calibre-web-automated
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 18. Skill `kopiur-backups`.
    - ../../../../../components/kopiur/pvc
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 3m
  # Workload health signal only. wait:false is required for Flux to honour healthChecks at all (wait:true assesses the whole inventory instead).
  # Skill `kopiur-backups`.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: calibre-web-automated
      namespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Claim name matches the app, so KOPIUR_CLAIM is omitted. Capacity is create-time only (ssa IfNotPresent).
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 20Gi
      # The retired VOLSYNC_PUID/PGID of 2000:2000 are gone with the Component
      # that read them. The identity itself is NOT lost: KOPIUR_PUID/PGID on
      # the `calibre-web-automated-kopiur` Kustomization below carry the same
      # measured 2000:2000, and that is now the only mover identity this claim
      # has. Do not restore the VOLSYNC_ pair - nothing reads it.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-downloader
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/media/calibre/calibre-downloader
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 10m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
# `kopiur-backups`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calibre-web-automated-kopiur
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: calibre-web-automated
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    # Deliberately no dependsOn calibre-web-automated - see header GREENFIELD
    # ORDERING. kopiur-repository is the dependency that actually matters.
    - name: kopiur-repository
      namespace: system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: calibre-web-automated
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. Hour 15 carries no remaining dual-engine volsync
      # destination collision for this claim and no kopiur ceph slot
      # (01/05/09/13/17/21).
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
