---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-web-automated
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  dependsOn:
    # The `volsync` (system) dependency went with the volsync Component below.
    # `kopiur-repository` (system) replaces it: this Kustomization now renders a
    # claim whose dataSourceRef names a kopiur `Restore`, so the kopiur CRDs and
    # repositories have to exist before it is applied. The backup objects live
    # on `calibre-web-automated-kopiur` below and do NOT dependsOn this claim
    # Kustomization - that reverse edge was the greenfield deadlock (Restore
    # needed for PVC bind, claim wait needed for backup KS eligibility).
    - name: kopiur-repository
      namespace: system
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/media/calibre/calibre-web-automated
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier B (the
    # large claims). kopiur is now the ONLY backup engine on this claim; its
    # backup half lives in the `calibre-web-automated-kopiur` Kustomization
    # below.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 18 - 23/23 files restored from BOTH destinations into a scratch PVC
    # with an identical per-file manifest digest (`d06f7d879f11`). Its
    # `CACHEDIR.TAG` marker is ADJUDICATED, not outstanding: the 14 omitted
    # files are the contents of `.cache/fontconfig`, a regenerable font cache,
    # and snapshot `filesNew` equals the restored count exactly - the signal
    # that the omission is deliberate rather than lossy.
    #
    # "Large" here is the CLAIM (20Gi), not its contents: this volume holds
    # 0.29 GiB in 23 files, ~15% of its 2Gi restore cache. It is tiered with
    # the large claims because a 20Gi claim can grow into one - and if it ever
    # does, KOPIUR_CACHE_CAPACITY on the kopiur Kustomization below is the
    # value to raise. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # THIS ENTRY IS THE ONE THAT KEEPS THE PVC ALIVE, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # Kustomization runs prune: true - so removing it without a replacement
    # makes Flux DELETE the app's data volume for a change that was only ever
    # meant to remove a backup engine. components/kopiur/pvc/pvc.yaml also
    # explains why that file must carry `ssa: IfNotPresent`.
    #
    # Only the CLAIM moves here; the kopiur BACKUP half stays on
    # `calibre-web-automated-kopiur` below. That split is retained deliberately
    # to keep this change minimal; it is no longer required by a claim-side
    # wait:true (dropped below), and collapsing the kopiur half back inline is
    # a possible follow-up rather than something this change does.
    # database/cloudnative-pg.yaml carries the same retained split.
    - ../../../../../components/kopiur/pvc
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  interval: 30m
  timeout: 3m
  # Workload health signal only. wait:false is required for Flux to honour
  # healthChecks at all (wait:true assesses the whole inventory instead). The
  # PVC must NOT appear here: putting it back in the assessment set would re-
  # arm the Pending-PVC block on greenfield. The Deployment mounts the claim,
  # so it is still transitively gated by PVC bind - that is a health signal,
  # not the deadlock fix (see calibre-web-automated-kopiur header).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: calibre-web-automated
      namespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}.
      #
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim at a quarter of the live
      # one. Matched to the LIVE claim (20Gi, holding 0.29 GiB - measured
      # 2026-09-04). Under the pvc Component's `ssa: IfNotPresent` this is
      # create-time-only for the claim that already exists, but it is exactly
      # what a REBUILD would provision.
      KOPIUR_CAPACITY: 20Gi
      # The retired VOLSYNC_PUID/PGID of 2000:2000 are gone with the Component
      # that read them. The identity itself is NOT lost: KOPIUR_PUID/PGID on
      # the `calibre-web-automated-kopiur` Kustomization below carry the same
      # measured 2000:2000, and that is now the only mover identity this claim
      # has. Do not restore the VOLSYNC_ pair - nothing reads it.
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calibre-downloader
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/media/calibre/calibre-downloader
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  interval: 30m
  timeout: 10m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# kopiur-only backup for `calibre-web-automated` (Stage 5 complete 2026-09-04).
# VolSync is retired from this claim; this Kustomization is the sole backup
# engine.
#
# WHY THIS IS A SEPARATE KUSTOMIZATION rather than a `components:` entry on the
# calibre-web-automated Kustomization above (the fleet's normal shape): the
# split was introduced when that Kustomization still set wait:true, because the
# kopiur standing Restore is Ready=False by design (AwaitingPvcDataSourceRef)
# and wait:true would have assessed it forever. That wait:true is gone now
# (workload healthChecks instead), so the split is no longer REQUIRED - it is
# retained deliberately to keep this change minimal. Collapsing the kopiur half
# back inline is a possible follow-up, not something this change does.
# database/cloudnative-pg.yaml carries the same retained split.
#
# GREENFIELD ORDERING (review fix): this Kustomization deliberately does NOT
# dependsOn calibre-web-automated. The cycle edge is that dependsOn, not
# wait:true - both the Deployment and a wait:true inventory gate are
# transitively blocked by the same Pending PVC until ${APP}-kopiur-dst exists,
# and that Restore is created here. Removing the reverse edge lets the Restore
# apply independently so the PVC can bind. Inverting the dependency (claim
# dependsOn this KS) was considered and declined: a claim should not depend on
# its own backup config. Risk of applying this first: policies name a PVC that
# is not there yet and have nothing to snapshot until it appears. dependsOn
# kopiur-repository stays - the admission webhook is failurePolicy: Fail.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: calibre-web-automated-kopiur
  namespace: &namespace media
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: calibre-web-automated
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    # Deliberately no dependsOn calibre-web-automated - see header GREENFIELD
    # ORDERING. kopiur-repository is the dependency that actually matters.
    - name: kopiur-repository
      namespace: system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: calibre-web-automated
      # Matched to the file ownership, measured live 2026-08-30: all 50 entries
      # on this volume are owned 2000:2000 (the pod's own runAsUser is 0 with
      # fsGroup 2000, so it is the measured file ownership that decides here,
      # not the pod uid). This is now the sole mover identity on this claim.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. Hour 15 carries no remaining dual-engine volsync
      # destination collision for this claim and no kopiur ceph slot
      # (01/05/09/13/17/21).
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
