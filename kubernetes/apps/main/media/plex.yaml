---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3. volsync's entry is unchanged and
    # stays that way until a restore has been demonstrated from kopiur for this
    # volume (Stage 5).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/plex/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CAPACITY: 20Gi
      VOLSYNC_CACHE_CAPACITY: 10Gi
      VOLSYNC_SCHEDULE_CEPH: "35 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "50 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "35 3 * * *"
      # LOAD-BEARING, measured live 2026-08-30: 8 files are unreadable at the
      # component default of 1000, and kopia treats an unreadable file as
      # fatal, so BOTH destinations would fail closed. 32863 of 32865 entries
      # are owned 2000:2000. Note the pod's own runAsUser is 0 with fsGroup
      # 2000 - it is the FILE ownership, measured, that determines the mover
      # identity here, not the pod's uid.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Carried across from VOLSYNC_CACHE_CAPACITY above: this is the largest
      # file count in `media` (20,089 files / 4.06 GiB). The cache is Ephemeral,
      # so this sizes an emptyDir for the run and adds no PVC.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 15 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
