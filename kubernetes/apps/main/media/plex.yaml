---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
  namespace: &namespace media
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier B (the
    # large claims). kopiur is now the ONLY backup engine on this claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 19 - 21251/21251 files restored from BOTH destinations into a scratch
    # PVC with an identical per-file manifest digest (`9b8b4a197241`), no
    # markers and no caveats.
    #
    # RESTORE CACHE: PROVEN, no longer predicted. This claim is the reason
    # finding 2 of that proof exists at all: it restored from ceph at the old
    # 2Gi and FAILED from r2 at the same size. The 10Gi below was originally
    # sized from the 2026-09-02 measurement and carried as a PREDICTION; it was
    # exercised end to end on 2026-09-12 and passed - an r2 restore at exactly
    # 10Gi completed in 7m36s and reproduced the snapshot byte-exactly (24,726
    # files / 4,948,787,362 bytes, matching filesNew and sizeBytes), with 0 mode
    # and 0 file-type differences across 37,201 entries, and the restored Plex
    # database opened and returned real library content.
    # docs/backups/kopiur-plex-r2-restore-proof-2026-09-12.md.
    # Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: intel-device-plugin-gpu
      namespace: system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # This Kustomization never carried a `volsync` (system) dependency - the
    # volsync Component it used to include is gone, and nothing here renders a
    # VolSync object any more. kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/media/plex/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}.
      #
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim too small to hold this
      # volume's 4.27 GiB plus its headroom. Matched to the LIVE claim (20Gi -
      # measured 2026-09-04). Under the pvc Component's `ssa: IfNotPresent`
      # this is create-time-only for the claim that already exists, but it is
      # exactly what a REBUILD would provision.
      KOPIUR_CAPACITY: 20Gi
      # LOAD-BEARING, measured live 2026-08-30: 8 files are unreadable at the
      # component default of 1000, and kopia treats an unreadable file as
      # fatal, so BOTH destinations would fail closed. 32863 of 32865 entries
      # are owned 2000:2000. Note the pod's own runAsUser is 0 with fsGroup
      # 2000 - it is the FILE ownership, measured, that determines the mover
      # identity here, not the pod's uid.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Raised from the 2Gi default after restore-proof finding 2 (r2 failed at
      # 2Gi on this claim). mode: Ephemeral is a generic ephemeral PVC on
      # ceph-block (not an emptyDir), discarded with the mover pod - size for
      # the restore. R2-PROVEN at exactly this value 2026-09-12: peak cache
      # ~4.62 GiB against 9.745 GiB usable (47%).
      #
      # DO NOT lower this toward that 4.62 GiB peak. The peak tracks TODAY's
      # snapshot, and the claim is growing (4.27 -> 4.61 GiB in the 8 days after
      # this value was chosen). The figure that must be cleared is the ~6.2 GiB
      # eviction plateau - the ceiling for ANY snapshot size, so growth alone
      # can never push a 20Gi claim past it - which 10Gi (9.745 GiB usable)
      # clears by 57%. That plateau is an UNPINNED kopia default, so the thing
      # that could invalidate this value is a kopia version bump, not the
      # calendar.
      # docs/backups/kopiur-plex-r2-restore-proof-2026-09-12.md
      # docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 15 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 15 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
