---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph
  namespace: &namespace rook-ceph
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: onepassword-store
      namespace: security
  interval: 30m
  timeout: 15m
  path: "./kubernetes/apps/base/rook-ceph/rook-ceph/operator"
  # prune: false only stops removal of objects dropped from Git. Deleting this
  # Kustomization still deletes its resources (cluster-apps sets
  # deletionPolicy: WaitForTermination). The real guard is the
  # kustomize.toolkit.fluxcd.io/prune: disabled annotation on the HelmRelease/CR.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-ceph-cluster
  namespace: &namespace rook-ceph
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 15m
  path: "./kubernetes/apps/base/rook-ceph/rook-ceph/cluster"
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  dependsOn:
    - name: onepassword-store
      namespace: security
    # Operator owns the ceph.rook.io CRDs the cluster chart renders.
    - name: rook-ceph
    # ceph-backup-pvc (../backup) is an openebs-hostpath claim.
    - name: openebs-hostpath
      namespace: system
  # Same as the operator: prune: false does not survive a Kustomization delete
  # under deletionPolicy: WaitForTermination. The guard is the
  # kustomize.toolkit.fluxcd.io/prune: disabled annotation on the HelmRelease/CR.
  prune: false
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # Stays false: wait:true would ignore healthChecks and assess the inventory.
  wait: false
  # rook-ceph-cluster's chart only renders the toolbox Deployment directly -
  # mons/OSDs/mgr are created dynamically by the operator from the CephCluster
  # CR, not by this Helm template, so they can't be named here. The CephCluster
  # itself is the cluster-level signal.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: rook-ceph-tools
      namespace: rook-ceph
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      name: rook-ceph
      namespace: rook-ceph
  healthCheckExprs:
    - apiVersion: ceph.rook.io/v1
      kind: CephCluster
      # has() guard: status.ceph is absent until the operator's first health poll.
      failed: has(status.ceph) && status.ceph.health == 'HEALTH_ERR'
      current: status.phase == 'Ready'
