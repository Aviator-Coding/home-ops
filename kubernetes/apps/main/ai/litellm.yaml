---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The operator-rendered workload, named after the LiteLLMProxy CR. Never the
  # HelmRelease or the LiteLLMProxy CR itself (house rule): only the Deployment
  # reflects a pod-level failure.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    # CRDs + the controller must be Ready first. This is stronger than an
    # ordinary ordering edge: the operator's ValidatingWebhookConfiguration
    # has failurePolicy: Fail for every LiteLLM kind, so with the operator
    # down the API server REJECTS this Kustomization's CRs at admission.
    - name: litellm-operator
      namespace: ai
    - name: cloudnative-pg
      namespace: database
    # Points at vllm-app as a backend. Flux dependsOn waits for the vllm
    # Kustomization Ready condition (including its Deployment healthCheck),
    # so a first-boot ~21GB GGUF download delays this app until vllm is Ready.
    # litellm's own probes do not call the backend; this coupling is only
    # ordering, not a runtime health dependency.
    - name: vllm
      namespace: ai
  interval: 1h
  path: "./kubernetes/apps/base/ai/litellm/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      GATUS_GROUP: ai
