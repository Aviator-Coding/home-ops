---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/dragonfly
  # The operator-rendered Deployment, never the LiteLLMProxy CR (skill flux-gitops).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  # Dragonfly readiness is status.phase; only evaluated for objects in the assessment set.
  healthCheckExprs:
    - apiVersion: dragonflydb.io/v1alpha1
      kind: Dragonfly
      failed: status.phase != 'ready'
      current: status.phase == 'ready'
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: dragonfly-operator
      namespace: database
    # Hard requirement: its webhook rejects LiteLLM CRs at admission while it is down.
    - name: litellm-operator
      namespace: ai
    - name: cloudnative-pg
      namespace: database
    # Ordering only: vllm-app is a backend, not a runtime health dependency.
    - name: vllm
      namespace: ai
  interval: 1h
  path: "./kubernetes/apps/base/ai/litellm/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      GATUS_GROUP: ai
