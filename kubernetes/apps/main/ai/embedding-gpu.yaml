---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app embedding-gpu
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # healthChecks targets the Deployment, not the HelmRelease: a HelmRelease
  # healthCheck only reports that `helm upgrade` succeeded and stays Ready
  # through a crashloop (AGENTS.md / verified live 2026-08-22 on ai/hermes).
  # wait stays false so this list is actually consulted.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/ai/embedding-gpu/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 15m
  wait: false
