---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-crds
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/crds"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/app"
  prune: true
  wait: true
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: toolhive-operator
      namespace: *namespace
  dependsOn:
    - name: toolhive-crds
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-config
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/config"
  prune: true
  # mcp-gateway-internal (Deployment) and mcp-tools-embedding (StatefulSet)
  # are the workloads the VirtualMCPServer/EmbeddingServer CRs in this path
  # render to; verified live against the running cluster.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: mcp-gateway-internal
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: mcp-tools-embedding
      namespace: *namespace
  dependsOn:
    - name: toolhive
      namespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app toolhive-mcp-servers
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  path: "./kubernetes/apps/base/ai/toolhive/mcp-servers"
  prune: true
  # One Deployment (toolhive's HTTP proxyrunner) + one StatefulSet (the
  # actual stdio MCP server process) per active MCPServer CR - both must be
  # checked, since the proxy's own /health only reflects the proxy listener,
  # not its stdio backend. Only the 6 currently-active servers (see this
  # path's kustomization.yaml); garmin-connect/ha/seerr/talos are deactivated
  # and correctly absent here.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: arr
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: arr
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: comfyui-mcp
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: comfyui-mcp
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: flux
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: flux
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: github
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: github
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: kubectl
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: kubectl
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: memory
      namespace: *namespace
    - apiVersion: apps/v1
      kind: StatefulSet
      name: memory
      namespace: *namespace
  dependsOn:
    - name: toolhive-config
      namespace: *namespace
    - name: onepassword-store
      namespace: security
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
