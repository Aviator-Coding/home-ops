---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app opencode
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 2. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: litellm
      namespace: *namespace
    # This Kustomization never carried a `volsync` (system) dependency - the
    # volsync Component it used to include is gone, and nothing here renders a
    # VolSync object any more. kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/base/ai/opencode/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Claim name matches the app, so KOPIUR_CLAIM is omitted. Capacity is create-time only (ssa IfNotPresent).
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 20Gi
      # Sized for the restore cliff: min(snapshot sizeBytes, ~6.2 GiB). A raise does not update the standing
      # Restore. Skill `kopiur-backups`.
      KOPIUR_CACHE_CAPACITY: 5Gi
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
