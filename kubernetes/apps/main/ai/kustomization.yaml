---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../../components/common
  - ../../../components/alerts

# Retired 2026-08-22: kokoro, miso-gallery, open-notebook, open-webui,
# perplexica, qdrant. Flux prunes their workloads and PVCs; the retained
# out-of-band data and the revival path for each are in
# docs/ai-system/retired-2026-08-22.md.
#
# Retired 2026-08-31: agentmemory. Manifest-only retirement (Flux prunes the
# PVC on merge); the retained backups and revival path are in
# docs/ai-system/agentmemory-retirement-2026-08-31.md.

resources:
  - ./agentgateway.yaml
  - ./agentgateway-dashboards.yaml
  - ./comfyui.yaml
  - ./gpu-node-dashboard.yaml
  - ./hermes.yaml
  - ./litellm-operator.yaml
  - ./litellm.yaml
  - ./opencode.yaml
  - ./pvc.yaml
  - ./repo-wiki.yaml
  - ./samba.yaml
  - ./searxng.yaml
  - ./toolhive.yaml
  - ./vllm.yaml

# The live Namespace object is produced by components/common (metadata.name:
# not-used, then this overlay's `namespace:` field renames it), NOT by a
# namespace.yaml (there isn't one in this directory). The patch target is
# therefore `not-used`, the name kustomize still has when patches run.
# cluster-apps SSA-applies the result; kustomize.toolkit.fluxcd.io/prune:
# disabled only prevents DELETE of the Namespace, it does not freeze
# annotations. Same pattern as kubernetes/apps/main/home-automation/kustomization.yaml.
#
# BLAST RADIUS: this annotation is namespace-wide. It permits a root/privileged
# kopiur mover for every claim in `ai`, not just the three comfyui volumes
# added 2026-09-12 - every other `ai` claim keeps its existing non-root
# KOPIUR_PUID/PGID (the annotation is an admission gate, not an identity
# change). Without it kopiur admits a SnapshotPolicy with runAsUser: 0 but then
# refuses the Snapshot at MoverPermitted=False / PrivilegedMoverNotPermitted
# (measured behaviour recorded against home-automation/matter-server,
# kubernetes/components/kopiur/Readme.md "Root movers").
patches:
  - target:
      kind: Namespace
      name: not-used
    patch: |-
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
