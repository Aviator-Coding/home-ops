---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai

components:
  - ../../../components/common
  - ../../../components/alerts

# Retired: kokoro, miso-gallery, open-notebook, open-webui, perplexica, qdrant
# (2026-08-22), agentmemory (2026-08-31), comfyui and comfyui-mcp (2026-09-15).
# Flux prunes their workloads and PVCs; comfyui's five PVCs are deleted with
# their RBD images. Retained data and revival: skill ai-stack, references/retirement.md.

resources:
  - ./agentgateway.yaml
  - ./agentgateway-dashboards.yaml
  - ./embedding-gpu.yaml
  - ./gpu-node-dashboard.yaml
  - ./hermes.yaml
  - ./litellm-operator.yaml
  - ./litellm.yaml
  - ./litellm-pgvector.yaml
  - ./opencode.yaml
  - ./pvc.yaml
  - ./repo-wiki.yaml
  - ./samba.yaml
  - ./searxng.yaml
  - ./toolhive.yaml
  - ./vllm.yaml
