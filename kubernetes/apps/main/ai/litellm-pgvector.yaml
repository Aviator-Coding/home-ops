---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-pgvector
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The rendered workload, never the HelmRelease.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: cloudnative-pg
      namespace: database
    # litellm owns the PushSecrets that create the 1Password items this app reads.
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/base/ai/litellm-pgvector/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
