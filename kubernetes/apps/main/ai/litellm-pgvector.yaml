---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app litellm-pgvector
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # The rendered workload, never the HelmRelease.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: litellm-pgvector-db
      namespace: ai
    - name: onepassword-store
      namespace: security
    - name: cloudnative-pg
      namespace: database
    # litellm owns the PushSecrets that create the 1Password items this app reads.
    - name: litellm
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/base/ai/litellm-pgvector/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Role and database on the shared postgres-18 Cluster (retain: removing this never
# drops data). Skill `databases`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: litellm-pgvector-db
  namespace: ai
spec:
  targetNamespace: database
  commonMetadata:
    labels:
      app.kubernetes.io/name: litellm-pgvector
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/base/ai/litellm-pgvector/db
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: postgres-cluster-18
      namespace: database
    - name: onepassword-store
      namespace: security
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: DatabaseRole
      current: status.applied == true
    - apiVersion: postgresql.cnpg.io/v1
      kind: Database
      current: status.applied == true
  wait: true
  postBuild:
    substitute:
      APP: litellm-pgvector
      CNPG_ROLE: litellm_pgvector
      CNPG_DATABASE: litellm_pgvector
      CNPG_PASSWORD_KEY: LITELLM_PGVECTOR_DB_PASSWORD
