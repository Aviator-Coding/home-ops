---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cliproxyapi
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # kopiur ONLY: the app's own persistence block creates the claim.
    - ../../../../../components/kopiur
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/base/ai/cliproxyapi/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      KOPIUR_CACHE_CAPACITY: 2Gi
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
      KOPIUR_PUID: "1000"
      KOPIUR_PGID: "1000"
