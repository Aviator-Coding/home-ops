---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app samba
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No `components: [../../../../../components/kopiur]`. NEITHER claim this app
  # serves is backed up, and for two different reasons: shared-xml because the
  # captain's Mac holds the authoritative copy of the corpus, shared-files
  # because it is an explicitly-scratch drop folder. Both decisions are recorded
  # on the PVCs themselves (kubernetes/apps/base/ai/pvc/app/). Note the claims
  # are created by the ai-pvc Kustomization, so attaching a backup engine here
  # would be the wrong place regardless - it belongs on ai/pvc.yaml.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    # The share is nothing without its volume.
    - name: ai-pvc
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/ai/samba/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      CONFIG_TIMEZONE: America/New_York
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
