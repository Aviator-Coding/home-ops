---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app repo-wiki
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 3. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  healthChecks:
    # app-template names multi-controller Deployments <release>-<controller>,
    # so the mkdocs workload is repo-wiki-mkdocs (not repo-wiki).
    - apiVersion: apps/v1
      kind: Deployment
      name: repo-wiki-mkdocs
      namespace: *namespace
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: litellm
      namespace: *namespace
    # kopiur is the sole backup engine on this claim since 2026-09-01. See the
    # components block. There is no `volsync` dependency to drop here - this
    # overlay never carried one.
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: "./kubernetes/apps/base/ai/repo-wiki/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Create-time only under ssa IfNotPresent. A rebuild provisions this size, not the component default.
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 5Gi
      # Sized for the restore cliff: min(snapshot sizeBytes, ~6.2 GiB). A raise does not update the standing
      # Restore. Skill `kopiur-backups`.
      KOPIUR_CACHE_CAPACITY: 2Gi
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
