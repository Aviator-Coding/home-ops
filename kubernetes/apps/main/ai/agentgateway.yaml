---
# The agentgateway app is retired (LiteLLM is the only LLM gateway). Only the CRDs stay for one
# more reconcile so the controller can finish cleaning up its own custom resources; a follow-up
# change removes this Kustomization and the crds/ directory. Skill ai-stack, references/retirement.md.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentgateway-crds
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: "./kubernetes/apps/base/ai/agentgateway/crds"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
