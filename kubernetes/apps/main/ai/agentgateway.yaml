---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentgateway
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  # Raised from 3m: with wait:false (before this change) this timeout only bounded the manifest-apply step, which finishes in seconds regardless of pod readiness.
  # Skill `ai-stack`.
  timeout: 5m
  path: "./kubernetes/apps/base/ai/agentgateway/app"
  prune: true
  # Deployment-level, not HelmRelease: HelmRelease.
  # Skill `ai-stack`.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: internal
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: internal-noauth
      namespace: *namespace
    - apiVersion: apps/v1
      kind: Deployment
      name: public
      namespace: *namespace
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: agentgateway-crds
      namespace: *namespace
    - name: onepassword-store
      namespace: security
    - name: certificates-import
      namespace: network
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentgateway-crds
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 30m
  retryInterval: 1m
  timeout: 3m
  path: "./kubernetes/apps/base/ai/agentgateway/crds"
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
