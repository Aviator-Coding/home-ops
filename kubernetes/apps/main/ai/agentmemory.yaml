---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app agentmemory
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3. volsync's entry is unchanged and
    # stays that way until a restore has been demonstrated from kopiur for this
    # volume (Stage 5).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  dependsOn:
    - name: onepassword-store
      namespace: security
    # Embeddings + consolidation LLM are served by the local models on the B70
    # via the agentgateway's no-auth internal listener (root /v1/* routes).
    - name: vllm
      namespace: *namespace
    - name: agentgateway
      namespace: *namespace
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  interval: 1h
  path: ./kubernetes/apps/base/ai/agentmemory/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      CONFIG_TIMEZONE: America/New_York
      VOLSYNC_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE_CEPH: "20 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "20 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "40 2 * * *"
      # Identity left at the component default of 1000:1000, and that is a
      # MEASURED result rather than an assumption: live measurement 2026-08-30
      # found every entry owned 1000:1000 (pod securityContext 1000:1000:1000)
      # and nothing unreadable at 1000.
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 19 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
