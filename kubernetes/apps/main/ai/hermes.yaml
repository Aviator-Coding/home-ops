---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier B (the
    # large claims). kopiur is now the ONLY backup engine on this claim.
    #
    # This is the largest object in the fleet - 104,223 live entries, 10.05 GiB
    # - and it is the ONE volume whose single-engine restore path has been
    # demonstrated end to end at its exact standing configuration:
    # 65,978 files / 10,419,954,664 bytes restored from R2 at exactly the 16Gi
    # KOPIUR_CACHE_CAPACITY below, matching the snapshot's own filesNew and
    # sizeBytes, with ZERO mode differences across 77,776 entries
    # (docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md). That run is
    # what closed restore-proof finding 2, the last prerequisite standing
    # between this claim and retirement, and it is why hermes leads tier B.
    #
    # Also proof-row 1 of docs/backups/kopiur-restore-proof-2026-09-01.md:
    # 65921/65921 from BOTH destinations, identical digest (`f37eb3217b51`).
    # Its `CACHEDIR.TAG` caveat is ADJUDICATED, not outstanding: the 23,467
    # omitted files are all under validly-signed tags - uv caches, four stock
    # venvs and a pytest cache - no user-authored file sits inside any of them,
    # and the largest venv rebuilds from `wiki/{pyproject.toml,uv.lock}` which
    # ARE in the backup. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # That adjudication predates `plc_code_graph/.venv` (mtime 2026-09-09), a
    # fifth venv on this claim with NO CACHEDIR.TAG - it hardlinks the same uv
    # cache wheels and is not excluded, so it alone added ~6 GB to every
    # snapshot since. Restore completeness above is unaffected; this is a
    # separate, not-yet-closed snapshot-size finding. Fix proposal
    # (SnapshotPolicy ignoreRules) deliberately left to its own PR:
    # docs/ai-system/hermes-state-db-growth.md section 7.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    # hermes mounts the shared-xml claim at /opt/xml and the shared-files
    # claim at /opt/files; ai-pvc is what creates both.
    - name: ai-pvc
      namespace: *namespace
    - name: onepassword-store
      namespace: security
    # Hermes routes all LLM traffic through the internal agentgateway.
    - name: agentgateway
      namespace: *namespace
    # This Kustomization never carried a `volsync` (system) dependency - the
    # volsync Component it used to include is gone, and nothing here renders a
    # VolSync object any more. kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/base/ai/hermes/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      CONFIG_TIMEZONE: America/New_York
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}.
      #
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim at a fifth of the live
      # one and could not hold this volume at all. Matched to the LIVE claim.
      # Under the pvc Component's `ssa: IfNotPresent` this is create-time-only
      # for the claim that already exists, but it is exactly what a REBUILD
      # would provision.
      #
      # GROWN 25Gi -> 40Gi, 2026-09-20. Measured that morning: 24.50 GiB usable
      # ext4, 20.27 GiB used, 4.21 GiB free - 83% - with `state.db` alone at
      # 9.7 GiB and `/opt/data/home` up 1.3 GB in three days. This is step 2 of
      # the plan already written down in docs/ai-system/hermes-state-db-growth.md
      # section 6 ("Or grow the claim ... 25Gi -> 40Gi leaves room for both a
      # VACUUM temp copy and the WAL"), chosen over narrowing retention further
      # and over an offline reclaim window. Growing the claim does NOT authorise
      # `sessions.vacuum_after_prune` - that key stays false for a reason that
      # has nothing to do with free space (section 5, and
      # scripts/ci/hermes-state-db-retention-test.py).
      #
      # THIS EDIT DOES NOT RESIZE THE LIVE CLAIM. components/kopiur/pvc/pvc.yaml
      # carries `ssa: IfNotPresent`, so Flux skips the apply entirely while the
      # claim exists; that file's header says so outright - "growing one is
      # `kubectl patch pvc` ... rather than a git edit". The expansion is a
      # one-time operator action, and this value's job is to stay in step with
      # it (scripts/ci/kopiur-stage5-test.py asserts the pair).
      KOPIUR_CAPACITY: 40Gi
      # LOAD-BEARING, and the single most consequential identity in Stage 3.
      # hermes is the largest object in the fleet - 104,062 entries, 10.05 GiB,
      # including one 7 GB file - and its pod pins NO runAsUser at all, only
      # fsGroup: 10000, so the identity is NOT inferable from the manifest and
      # had to be measured. Live measurement 2026-08-30: 104,060 of 104,062
      # entries are owned 10000:10000, the volume root is 10000:10000 mode 0700,
      # and at the component default of 1000 the mover cannot read 1,948 files
      # or traverse 310 directories. kopia treats an unreadable file as fatal,
      # so BOTH destinations would fail closed on the largest volume we have.
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      # RESTORE-SIZED, not backup-sized, and measured rather than guessed.
      # The old 5Gi was carried across from VOLSYNC_CACHE_CAPACITY above - a
      # restic-heritage number ("20-50% of the PVC") that has nothing to do with
      # how kopia uses a cache - and it could not restore this claim from r2:
      # docs/backups/kopiur-restore-proof-2026-09-01.md finding 2 recorded a
      # terminal `no space left on device` on /var/cache/kopia, and a failed
      # Restore never retries.
      #
      # Measured 2026-09-02 (docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md):
      # during a restore the kopia cache grows ~1:1 with the bytes written into
      # the target until it reaches kopia's own internal budget, observed here as
      # a ~6.2 GiB plateau, and only then holds flat. So the cache a restore needs
      # is min(snapshot size, ~6.2 GiB) - and at 5Gi (4.87 GiB usable) this claim's
      # 9.7 GiB snapshot ran out of cache at roughly 45% restored, every time.
      #
      # The value is sized to survive BOTH regimes, because the plateau is a kopia
      # soft limit that this repo has never configured (kopiur sends `"cache":{}`,
      # so kopia's built-in defaults govern eviction) and must not be leaned on.
      #
      # RAISED 16Gi -> 48Gi, 2026-09-20, in the same change that grew the claim.
      # This is CONSERVATISM AGAINST AN UNPINNED DEFAULT, not the repair of a
      # live defect - state that accurately, because the overstated version of
      # this reasoning was written once and had to be retracted.
      #
      # 16Gi was NOT inadequate and this claim was NOT near the cliff. Under the
      # measured model the requirement is min(snapshot, ~6.2 GiB), so at today's
      # 19.44 GiB snapshot (20,877,393,555 B, `hermes-ceph-20260920092420`) the
      # requirement is the 6.21 GiB plateau, which 16Gi's 15.58 GiB usable clears
      # by 2.5x. 16Gi is also r2-PROVEN (65,978 files / 10,419,954,664 bytes,
      # byte-for-byte the snapshot's own sizeBytes). The cliff bites a claim whose
      # snapshot is still BELOW its cache and then crosses it; hermes crossed long
      # ago and sits on the safe side, where the plateau is the whole requirement.
      #
      # What the raise actually buys is the SECOND regime the original sizing
      # deliberately covered and quietly stopped covering as the volume grew:
      # "eviction never fires, so the cache must hold the whole snapshot". kopiur
      # sends `"cache":{}` and neither ClusterRepository sets `cacheDefaults`, so
      # the ~6.2 GiB plateau is kopia's own UNPINNED default - this repo does not
      # configure it, does not pin it, and would not be told if a version bump
      # moved it (finding 2, docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md).
      # 16Gi covered a 9.70 GiB snapshot that way; it does not cover 19.44 GiB.
      #
      # 48Gi is sized off the CLAIM, not off today's snapshot, so that second
      # regime cannot silently lapse again for the life of a 40Gi claim:
      #   - the grown claim yields ~39.2 GiB usable ext4 (40Gi x 0.980, the ratio
      #     measured on this very claim: 26,309,095,424 B of 26,843,545,600 B),
      #     and that is the HARD CEILING on any snapshot it can ever produce
      #   - 48Gi yields ~46.7 GiB usable at 0.974, the conservative ratio the
      #     restore proof measured on its own 16Gi volume
      #   - if eviction never fires: 46.7 / 39.2 = 1.19x the worst case the claim
      #     is physically capable of, and 2.40x today's 19.44 GiB snapshot
      #   - if eviction holds:       46.7 / 6.21 = 7.5x the measured plateau
      #
      # It is cheap conservatism, which is the other half of the argument: the
      # cache is a thin-provisioned ephemeral PVC discarded with the mover pod, so
      # a 48Gi request costs only what a run actually writes (~6.2 GiB observed).
      #
      # The exact-capacity r2 proof no longer covers this number - it was run at
      # 16Gi - but the direction is the safe one: the cliff is reached by having
      # too LITTLE cache, never too much. kubernetes/components/kopiur/Readme.md's
      # proven-vs-sized table records hermes as sized-above-proven from this date.
      #
      # Note this is a PVC, not an emptyDir (the previous comment here was wrong):
      # `mode: Ephemeral` renders a generic ephemeral volumeClaimTemplate on the
      # default StorageClass (ceph-block), thin-provisioned and deleted with the
      # mover pod, so the raised figure costs only what a run actually writes.
      # One variable feeds both SnapshotPolicies and the standing Restore
      # *template*; the restore is the demanding direction, so it sets the value.
      #
      # Raising this value reaches the two SnapshotPolicies on the next Flux
      # reconcile, but NOT the standing ceph populator hermes-kopiur-dst
      # (ssa: IfNotPresent, create-once), which stays frozen at its create-time
      # value - today 16Gi, from the 2026-09-02 recreate. Closing that gap needs
      # a one-time post-merge delete of that Restore so Flux recreates it at
      # 48Gi (safe: no finalizers, owns no backup data - Stage 5
      # sabnzbd-kopiur-dst precedent). Scratch r2 Restores set capacity in their
      # own spec and are unaffected. See the proof doc's post-merge subsection.
      KOPIUR_CACHE_CAPACITY: 48Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot. Hour 19 carries no volsync destination and
      # no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on the component
      # default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
