---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app hermes
  namespace: &namespace ai
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Proof: proof-ledger.md row 1.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  dependsOn:
    # hermes mounts the shared-xml claim at /opt/xml and the shared-files
    # claim at /opt/files; ai-pvc is what creates both.
    - name: ai-pvc
      namespace: *namespace
    - name: onepassword-store
      namespace: security
    # Hermes routes all LLM traffic through the internal agentgateway.
    - name: agentgateway
      namespace: *namespace
    - name: kopiur-repository
      namespace: system
  interval: 1h
  path: ./kubernetes/apps/base/ai/hermes/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      CONFIG_TIMEZONE: America/New_York
      # Claim name matches the app. Capacity is create-time only; growing the live claim is kubectl patch.
      # Do not set sessions.vacuum_after_prune. Skill `hermes-agent`. Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 40Gi
      # Files are 10000:10000. Component default 1000 fails closed. Skill `kopiur-backups`.
      KOPIUR_PUID: "10000"
      KOPIUR_PGID: "10000"
      KOPIUR_CACHE_CAPACITY: 48Gi
      KOPIUR_SCHEDULE_R2: "H 19 * * *"
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
