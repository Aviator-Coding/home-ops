---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app recyclarr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/recyclarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-01 - migration Stage 5, pilot volume 2 of 4.
    # kopiur is now the ONLY backup engine on this claim.
    #
    # Authorising evidence, per volume and per destination:
    # docs/backups/kopiur-restore-proof-2026-09-01.md (row 11,
    # `downloads/recyclarr-config`: 2913/2913 files restored from ceph AND r2,
    # byte-identical to each other). Why this volume was chosen, and the
    # post-retirement re-proof:
    # docs/backups/kopiur-stage5-pilot-retirement-2026-09-01.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CLAIM: recyclarr-config
      # Inherited from the retired VOLSYNC_CAPACITY default and matched to the
      # live claim (5Gi; the volume holds ~79 MB). Under the pvc Component's
      # `ssa: IfNotPresent` this is create-time-only for the claim that already
      # exists, but it is exactly what a REBUILD would provision - so it is
      # stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # 2000:2000 matches the pod securityContext DECLARED in
      # kubernetes/apps/base/downloads/recyclarr/app/helmrelease.yaml
      # (runAsUser/runAsGroup/fsGroup 2000). Live-pod exec could not measure
      # this claim during Stage 3 (CronJob, ~18 s/day), so the pair was first
      # taken from that declaration. Readability for this identity was later
      # proven 2026-08-31 via a CSI snapshot-restore probe of the claim
      # (2913/2913 files, 607/607 dirs; mover 2000:2000):
      # docs/backups/recyclarr-config-readable-check-2026-08-31.md
      # That is readability only - not Stage 5 restore-fidelity. If the pair
      # is wrong kopiur fails closed and loudly, and volsync keeps protecting
      # the claim throughout. Check .status.stats on the first run.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
