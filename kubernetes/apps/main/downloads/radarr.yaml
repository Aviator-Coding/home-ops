---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/radarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 9 - 6086/6086 files restored from BOTH destinations into a scratch
    # PVC with an identical per-file manifest digest (`6fb28da0d1cf`), no
    # markers and no caveats. This is also the larger of the two claims whose
    # restore cache was raised to 10Gi on 2026-09-02, so the size class it sits
    # in is r2-proven (on media/tdarr, the tighter of the pair) at exactly the
    # value below. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # NOTE the movie-to-quality-profile assignment this app holds is Radarr
    # DATABASE state, not GitOps - recyclarr only creates and scores profiles
    # (docs/media-stack.md#recyclarr---declarative-quality-config). That state
    # lives on this claim, which is why it is retired on a byte-identical
    # restore proof rather than on a "reconstructible from Git" argument.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `radarr-config` while the app is `radarr`. This drove the
      # retired VOLSYNC_CLAIM and now also drives the pvc Component's PVC name,
      # so it is load-bearing in a second place after retirement.
      KOPIUR_CLAIM: radarr-config
      # Inherited from the retired VOLSYNC_CAPACITY default and matched to the
      # LIVE claim (5Gi, holding 1.33 GiB - measured 2026-09-04). Under the pvc
      # Component's `ssa: IfNotPresent` this is create-time-only for the claim
      # that already exists, but it is exactly what a REBUILD would provision -
      # so it is stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # LOAD-BEARING, measured 2026-08-30: 3 files are unreadable at the
      # component default of 1000 - fatal to kopia, so BOTH destinations would
      # fail closed. The pod runs 2000:2000:2000; 6876 of 7151 entries are
      # owned 2000:2000.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # RESTORE-SIZED, not backup-sized. Same reasoning as media/tdarr.yaml,
      # measured 2026-09-02 (docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md
      # finding 1): a restore's kopia cache grows ~1:1 with the bytes written
      # into the target until it hits kopia's own budget - a ~6.2 GiB plateau -
      # so required cache = min(snapshot sizeBytes, ~6.2 GiB).
      #
      # This claim's r2 snapshot is 1.36 GiB against 1.95 GiB usable at 2Gi =
      # 70%. That is the same cliff shape as tdarr with more runway, not a
      # different situation: crossing 1.95 GiB jumps the requirement straight to
      # the ~6.2 GiB plateau and the restore then fails TERMINALLY, discoverable
      # only during an actual disaster. 10Gi (9.74 GiB usable) clears the
      # plateau outright, so this claim can never reach the cliff again.
      #
      # Sized rather than proven: the r2 restore demonstration for this size
      # class was run on media/tdarr, the tighter of the two, at this same 10Gi.
      # See docs/backups/kopiur-populator-drift-2026-09-02.md.
      #
      # Reaches both SnapshotPolicies on the next Flux reconcile but NOT the
      # standing populator radarr-kopiur-dst (ssa: IfNotPresent, create-once),
      # which needs a one-time delete so Flux recreates it at the new value.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
