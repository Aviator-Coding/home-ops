---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app radarr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/radarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3, the same shape as downloads/sabnzbd
    # which see for the full rationale. volsync's entry is unchanged.
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: radarr-config
      VOLSYNC_SCHEDULE_CEPH: "5 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "45 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "5 3 * * *"
      KOPIUR_CLAIM: radarr-config
      # LOAD-BEARING, measured 2026-08-30: 3 files are unreadable at the
      # component default of 1000 - fatal to kopia, so BOTH destinations would
      # fail closed. The pod runs 2000:2000:2000; 6876 of 7151 entries are
      # owned 2000:2000.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # RESTORE-SIZED, not backup-sized. Same reasoning as media/tdarr.yaml,
      # measured 2026-09-02 (docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md
      # finding 1): a restore's kopia cache grows ~1:1 with the bytes written
      # into the target until it hits kopia's own budget - a ~6.2 GiB plateau -
      # so required cache = min(snapshot sizeBytes, ~6.2 GiB).
      #
      # This claim's r2 snapshot is 1.36 GiB against 1.95 GiB usable at 2Gi =
      # 70%. That is the same cliff shape as tdarr with more runway, not a
      # different situation: crossing 1.95 GiB jumps the requirement straight to
      # the ~6.2 GiB plateau and the restore then fails TERMINALLY, discoverable
      # only during an actual disaster. 10Gi (9.74 GiB usable) clears the
      # plateau outright, so this claim can never reach the cliff again.
      #
      # Sized rather than proven: the r2 restore demonstration for this size
      # class was run on media/tdarr, the tighter of the two, at this same 10Gi.
      # See docs/backups/kopiur-populator-drift-2026-09-02.md.
      #
      # Reaches both SnapshotPolicies on the next Flux reconcile but NOT the
      # standing populator radarr-kopiur-dst (ssa: IfNotPresent, create-once),
      # which needs a one-time delete so Flux recreates it at the new value.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
