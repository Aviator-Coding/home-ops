---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/sabnzbd/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-01 - migration Stage 5, pilot volume 3 of 4.
    # kopiur is now the ONLY backup engine on this claim.
    #
    # This claim was the Stage 2 fidelity subject (captain decision
    # `kopiur-stage2-empty-pilot`, 2026-08-30) after autobrr - the original
    # Stage 1 pilot - turned out to hold ZERO files. It is the most-proven
    # volume in the fleet: a byte-identical restore from BOTH destinations in
    # docs/backups/kopiur-restore-drill-2026-08-30.md, again in
    # docs/backups/kopiur-restore-proof-2026-09-01.md (row 12,
    # `downloads/sabnzbd-config`: 2064/2064 files, ceph and r2 identical), and
    # once more after this retirement. That is why it leads the pilot.
    #
    # Post-retirement proof and selection rationale:
    # docs/backups/kopiur-stage5-pilot-retirement-2026-09-01.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `sabnzbd-config` while the app is `sabnzbd`. This is the
      # common case for real apps, and autobrr (claim name == app name) never
      # exercised it. It now also drives the pvc Component's PVC name.
      KOPIUR_CLAIM: sabnzbd-config
      # Inherited from the retired VOLSYNC_CAPACITY default and matched to the
      # live claim (5Gi, holding 2.06 GiB). Under the pvc Component's
      # `ssa: IfNotPresent` this is create-time-only for the claim that already
      # exists, but it is exactly what a REBUILD would provision - so it is
      # stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # RAISED from the 2Gi component default on retirement, and this is the
      # one place in the pilot where restore-proof finding 2 actually bites.
      # kopia needs materially more cache to restore from r2 than from ceph:
      # `media/plex` (4.4 GB) restored from ceph on 2Gi and FAILED from r2 on
      # that same 2Gi with `no space left on device`, needing 20Gi. A failed
      # Restore is TERMINAL and never retries, so the discovery would land in
      # the middle of a real disaster.
      #
      # This is the only pilot volume of comparable size (2.06 GiB against a
      # 2Gi cache - the Stage 2 drill did restore it from r2 at 2Gi, but with
      # no margin at all, and the volume grows). 10Gi is ~4.5x the data, the
      # ratio plex actually needed. The cache is Ephemeral, so this costs
      # nothing standing and only sizes a per-run volume.
      #
      # NOTE this also raises the BACKUP movers' cache, which is intended.
      # Changing it does NOT reach the existing `sabnzbd-kopiur-dst` Restore -
      # that object carries `ssa: IfNotPresent`, so it must be deleted and let
      # Flux recreate it. See the pilot document; the same delete was required
      # anyway to pick up `credentialProjection`, which this Restore predates.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # LOAD-BEARING, and NOT cosmetic parity with the app's securityContext.
      # sabnzbd runs as 2000:2000 and owns its files as 2000:2000. The kopiur
      # component defaults to 1000 (mirroring volsync's own default, which
      # this app also does not override). At 1000 the ceph and r2 snapshots
      # BOTH FAIL: 7 of sabnzbd-config's files carry no world-read bit
      # (five 0600, two 0660 group 2000) and kopia cannot open them ->
      # `snapshot create failed (class PermissionDenied) ... Found 7 fatal
      # error(s)`. Measured 2026-08-30; the admission webhook warns about it at
      # apply time too.
      #
      # volsync survives the same mismatch only because it mounts the staged
      # clone read-write, so kubelet's fsGroup walk rewrites group ownership
      # and permissions before restic reads it. kopiur mounts the staged source
      # readOnly (sources[].readOnly defaults true), and kubelet does not apply
      # fsGroup to a read-only mount - so the mover's gid never gains access.
      # Matching the workload is the fix that needs no such rewrite, and it is
      # what makes a kopiur restore reproduce the ORIGINAL modes.
      #
      # Any future app whose pod securityContext is not 1000 needs this pair.
      # See docs/backups/kopiur-restore-drill-2026-08-30.md.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Ceph stays on the component default, which offsets kopiur onto the ODD
      # 4-hour slots and hashes the minute, keeping it clear of the volsync
      # lines above. Do not hand-assign minutes.
      #
      # r2 moves off the component default in Stage 3: `H 4 * * *` would put
      # every kopiur r2 policy in the fleet into the single 04:00 hour, already
      # the busiest of the day. Hour 11 carries no volsync destination and no
      # kopiur ceph slot, and every claim in `downloads` now shares it.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
