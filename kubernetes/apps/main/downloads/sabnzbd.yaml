---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app sabnzbd
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/sabnzbd/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    # kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
    # `kopiur-backups`.
    - name: kopiur-repository
      namespace: system
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 12. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `sabnzbd-config` while the app is `sabnzbd`. This is the
      # common case for real apps, and autobrr (claim name == app name) never
      # exercised it. It now also drives the pvc Component's PVC name.
      KOPIUR_CLAIM: sabnzbd-config
      # Create-time only under ssa IfNotPresent. A rebuild provisions this size, not the component default.
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 5Gi
      # 2Gi component default clears this snapshot. A raise does not update the standing Restore. Skill
      # `kopiur-backups`.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
