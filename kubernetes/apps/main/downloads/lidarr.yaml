---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lidarr
  namespace: &namespace downloads
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 7 - 478/478 files restored from BOTH destinations into a scratch PVC
    # with an identical per-file manifest digest (`7b727e6495b0`), no markers
    # and no caveats. Content class: *arr music-library configuration, backed
    # by an indexer/download-client setup that is re-enterable and by metadata
    # that Lidarr refetches. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component above -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  interval: 30m
  path: ./kubernetes/apps/base/downloads/lidarr/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `lidarr-config` while the app is `lidarr`. This drove the
      # retired VOLSYNC_CLAIM and now also drives the pvc Component's PVC name,
      # so it is load-bearing in a second place after retirement.
      KOPIUR_CLAIM: lidarr-config
      # Inherited from the retired VOLSYNC_CAPACITY (8Gi, not the component's
      # 5Gi default) and matched to the LIVE claim (8Gi, holding 130 MiB -
      # measured 2026-09-04). Under the pvc Component's `ssa: IfNotPresent`
      # this is create-time-only for the claim that already exists, but it is
      # exactly what a REBUILD would provision, which is why an inherited
      # non-default value has to be carried across rather than dropped.
      KOPIUR_CAPACITY: 8Gi
      # KOPIUR_CACHE_CAPACITY deliberately left at the 2Gi component default.
      # Measured 2026-09-04: 0.13 GiB snapshot against ~1.95 GiB of usable
      # cache (6%) - see docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md.
      # LOAD-BEARING, measured 2026-08-30: 4 files are unreadable at the
      # component default of 1000, and kopia treats an unreadable file as
      # fatal, so BOTH destinations would fail closed. The pod runs
      # 2000:2000:2000 and owns 828 of 829 entries as 2000:2000.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
