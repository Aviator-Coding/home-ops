---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app autobrr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/autobrr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim (migration Stage 1 pilot).
    # kopiur-repository, not kopiur: it is the Kustomization that applies the
    # `ceph` and `r2` ClusterRepository objects the policies below reference,
    # and it already dependsOn the operator itself. The admission webhook is
    # failurePolicy: Fail, so with the operator down the API server REJECTS
    # these CRs outright rather than leaving them unreconciled.
    - name: kopiur-repository
      namespace: system
    - name: postgres-cluster-17
      namespace: database
  components:
    # BOTH backup systems, deliberately and simultaneously. This is the whole
    # safety property of migration Stage 1: autobrr is the pilot volume and it
    # has two independent, working backups, not one being swapped for another.
    # volsync's entry is unchanged and must stay that way until a restore has
    # been demonstrated from kopiur for this volume (Stage 2).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_SCHEDULE_CEPH: "45 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "30 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "45 3 * * *"
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed.
      #
      # Identity CORRECTED in Stage 3. This was left at the component default
      # of 1000 during Stage 1, on the reasoning that autobrr's only file is
      # written 0644 and a uid-1000 mover can therefore read it. That is still
      # true and no backup was ever failing - but the pod runs 2000:2000:2000
      # and owns its files as 2000:2000, and leaving the mover at 1000 means a
      # kopiur restore would not reproduce the ownership the app expects, and
      # the first 0600 file autobrr ever writes would fail the backup closed.
      # Live measurement 2026-08-30 confirms the pod securityContext and the
      # file ownership; this aligns the mover with the workload, which is the
      # rule every other volume in Stage 3 follows.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour, moved off the component default in Stage 3. The
      # default (`H 4 * * *`) would put every kopiur r2 policy in the fleet
      # into the single 04:00 hour, already the busiest. Hour 11 carries no
      # volsync destination and no kopiur ceph slot (01/05/09/13/17/21), and
      # every claim in `downloads` now shares it. Ceph stays on the component
      # default, which is already structurally offset onto the odd 4-hour slots
      # (01/05/09/13/17/21 against volsync's 00/04/08/12/16/20).
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
