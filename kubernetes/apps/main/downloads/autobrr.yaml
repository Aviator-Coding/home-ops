---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app autobrr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/autobrr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim (migration Stage 1 pilot).
    # kopiur-repository, not kopiur: it is the Kustomization that applies the
    # `ceph` and `r2` ClusterRepository objects the policies below reference,
    # and it already dependsOn the operator itself. The admission webhook is
    # failurePolicy: Fail, so with the operator down the API server REJECTS
    # these CRs outright rather than leaving them unreconciled.
    - name: kopiur-repository
      namespace: system
    # Materialises kopiur's repository credentials inside `downloads`. The
    # mover Job loads them with namespace-local envFrom, so without this the
    # backup fails at run time even though every CR reconciles clean.
    - name: kopiur-credentials
      namespace: downloads
    - name: postgres-cluster-17
      namespace: database
  components:
    # BOTH backup systems, deliberately and simultaneously. This is the whole
    # safety property of migration Stage 1: autobrr is the pilot volume and it
    # has two independent, working backups, not one being swapped for another.
    # volsync's entry is unchanged and must stay that way until a restore has
    # been demonstrated from kopiur for this volume (Stage 2).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_SCHEDULE_CEPH: "45 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "30 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "45 3 * * *"
      # kopiur takes no schedule overrides on purpose: the component's
      # defaults hash the minute (`H`) and offset the HOUR away from the
      # volsync lines above (ceph 01/05/09/13/17/21 vs volsync's 00/04/08/...,
      # r2 04:xx vs volsync's 03:45), so the two systems cannot land on the
      # same minute for this claim.
      #
      # The claim name (== app name) and the 5Gi PVC do match the KOPIUR_*
      # defaults. The uid/gid pair does NOT: this pod runs as 2000/2000, while
      # KOPIUR_PUID/PGID default to 1000. An earlier revision of this comment
      # claimed 1000 and was simply wrong.
      #
      # Left at 1000 deliberately, and it does not break the backup. The
      # mismatch is only fatal when the mover cannot READ a file (the
      # sabnzbd-config case: uid 2000 writing mode 0600). autobrr's write mode
      # was unknown while the volume was unwritable; with the fsGroup fix in
      # place it was measured directly - autobrr writes config.toml as
      # `-rw-r--r--` (0644), inside a 2775 directory whose `other` bits allow
      # traverse, so the uid-1000 mover can read it and the snapshot succeeds.
      # Aligning these to 2000 is still the more correct end state for restore
      # fidelity and is an open Stage 3 question, not a fix this change needs.
