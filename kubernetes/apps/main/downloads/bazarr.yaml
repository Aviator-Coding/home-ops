---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app bazarr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/bazarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: downloads-pvc
      namespace: downloads
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3, the same shape as downloads/sabnzbd
    # which see for the full rationale. volsync's entry is unchanged.
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: bazarr-config
      VOLSYNC_SCHEDULE_CEPH: "20 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "0 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "20 3 * * *"
      KOPIUR_CLAIM: bazarr-config
      # Matched to the workload: the pod runs 2000:2000:2000 and owns 13 of the
      # 24 entries as 2000:2000 (the rest 1000:2000, group-readable). Measured
      # 2026-08-30 the default of 1000 would also read this volume today, but
      # the *arr apps write 0600 config files eventually - exactly what broke
      # sabnzbd-config at the default - so the identity is matched to the
      # workload rather than left to chance.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
