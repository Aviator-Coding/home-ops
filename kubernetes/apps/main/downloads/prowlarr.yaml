---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prowlarr
  namespace: &namespace downloads
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/downloads/prowlarr/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3, the same shape as downloads/sabnzbd
    # which see for the full rationale. volsync's entry is unchanged.
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: prowlarr-config
      VOLSYNC_SCHEDULE_CEPH: "25 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "0 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "25 3 * * *"
      KOPIUR_CLAIM: prowlarr-config
      # LOAD-BEARING and the only 3002:3000 pair in the fleet. The pod runs
      # 3002:3000:3000; the volume mixes 1000:3000 (526 entries) with
      # 3002:3000 (188). Measured 2026-08-30 the default of 1000 reads it
      # today, but the mover is matched to the workload so a restore
      # reproduces the ownership prowlarr expects.
      KOPIUR_PUID: "3002"
      KOPIUR_PGID: "3000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, already the
      # busiest. Hour 11 carries no volsync destination and no kopiur ceph slot
      # (01/05/09/13/17/21). Ceph stays on the component default, which is
      # already structurally offset onto the odd 4-hour slots.
      KOPIUR_SCHEDULE_R2: "H 11 * * *"
