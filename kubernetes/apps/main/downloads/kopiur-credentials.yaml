---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# PILOT SCAFFOLDING, deliberately its own Kustomization so it is one line to
# delete. Materialises kopiur's repository credentials inside `downloads`,
# which a kopiur mover Job needs because it loads them with namespace-local
# `envFrom`. Captain decision 2026-08-30 (`kopiur-workload-ns-credentials`):
# per-namespace copy for the PILOT ONLY, credential projection deferred.
#
# Namespace-scoped, not app-scoped, because the Secret names are fixed by the
# ClusterRepository specs and one copy serves the namespace - which is also
# exactly why it must not quietly become the fleet-wide design. The Stage 3
# decision is open; see kubernetes/components/kopiur/Readme.md "Credentials".
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-credentials
  namespace: &namespace downloads
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    # The 1Password-backed store, for the two kopia passwords.
    - name: onepassword-store
      namespace: security
    # The kubernetes-provider store that reads `system`, for the OBC-generated
    # Ceph S3 keys.
    - name: kopiur-system-secrets
      namespace: security
  interval: 1h
  path: ./kubernetes/apps/base/downloads/kopiur-credentials/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  timeout: 5m
  wait: false
