---
# yaml-language-server: $schema=https://homelab-schemas-epg.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app changedetection
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  path: ./kubernetes/apps/base/selfhosted/changedetection/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  dependsOn:
    - name: onepassword-store
      namespace: security
    # kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
    # `kopiur-backups`.
    - name: kopiur-repository
      namespace: system
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 22. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Claim name differs from the app. The pvc component names the PVC from this. Skill `kopiur-backups`.
      KOPIUR_CLAIM: changedetection-config
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim at 5x the live one.
      # Matched to the LIVE claim (1Gi, holding 36 MiB - measured 2026-09-04).
      KOPIUR_CAPACITY: 1Gi
      # 2Gi default clears this snapshot. Namespace r2 hour; ceph stays on the component default.
      # Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
  prune: true
  wait: false
  interval: 30m
  timeout: 5m
