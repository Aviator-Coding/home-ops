---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app syncthing
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/selfhosted/syncthing/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in THIS Kustomization renders a VolSync object any more. Note the
    # `syncthing-data` Kustomization further down still needs it and keeps it:
    # that second claim was assessed in wave two and found NOT ready, so it
    # stays dual-engine.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier C (real
    # user-authored state). kopiur is now the ONLY backup engine on the
    # `syncthing` CONFIG claim.
    #
    # READ THE CLAIM NAME CAREFULLY. This retires `syncthing` (1Gi, the config
    # volume holding the device ID, the folder definitions and the trust
    # relationships with every paired peer). It does NOT retire
    # `syncthing-data` (15Gi, the synced files), which has its own
    # Kustomizations below and stays dual-engine: wave two measured it at 5
    # files / 531 B - a bare scaffold of `.stfolder` markers with no synced
    # content - so its restore proof covers nothing meaningful, and 15Gi of
    # intended capacity sits behind a 5Gi cache it would cross the first time
    # it holds real data. Re-measured 2026-09-04: still 5 files / 531 B. That
    # verdict stands and this change does not touch it.
    #
    # Authorising evidence for the config claim:
    # docs/backups/kopiur-restore-proof-2026-09-01.md row 29 - 21/21 files
    # restored from BOTH destinations into a scratch PVC with an IDENTICAL
    # per-file manifest digest (`05d36861232d`), no markers and no caveats.
    # Losing this volume would not lose file content (the peers still have it)
    # but would lose the node identity, forcing a re-pair with every device.
    #
    # Restore cache stays at the 2Gi component default, and here that is
    # STRUCTURAL rather than a judgement call: a 1Gi claim cannot hold more
    # than the 2Gi cache covers, so this volume can never reach the
    # restore-cache cliff - the same argument that authorised selfhosted/ntfy
    # and obsidian-livesync in wave two, and the exact argument that
    # `syncthing-data` fails. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}. The HelmRelease's
      # own `existingClaim` was renamed to ${KOPIUR_CLAIM:-syncthing}, which
      # also defuses the `${VOLSYNC_CLAIM:-*app}` dangling-alias trap - see
      # linkwarden.yaml for the full mechanism.
      #
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim at 5x the live one.
      # Matched to the LIVE claim (1Gi, holding 2 MiB - measured 2026-09-04).
      # Under the pvc Component's `ssa: IfNotPresent` this is create-time-only
      # for the claim that already exists, but it is exactly what a REBUILD
      # would provision.
      #
      # This is the CONFIG claim. `syncthing-data`'s own VOLSYNC_CAPACITY of
      # 15Gi lives on its separate Kustomization below and is untouched.
      KOPIUR_CAPACITY: 1Gi
      # APP_UID/APP_GID deliberately absent - see changedetection.yaml for the
      # precedent. No manifest in this repo reads either variable, so a second,
      # unenforced identity declaration is a liability, not documentation.
      # Identity left at the component default of 1000:1000, and that is a
      # MEASURED result rather than an assumption: live measurement 2026-08-30
      # (reconfirmed 2026-08-31, workload `id`, mover moverSecurityContext/
      # podSecurityContext) found every entry owned 1000:1000 (pod
      # securityContext 1000:1000:1000) and nothing unreadable at 1000.
      # Namespace r2 hour. The component default (`H 4 * * *`) is especially
      # wrong for `selfhosted`: EVERY claim in this namespace already runs its
      # volsync r2 job in the 04:00 hour, so the default would stack both
      # systems into one hour for every one of them. Hour 14 carries no volsync
      # destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on
      # the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Second volume: the volsync component above only protects the single ${VOLSYNC_CLAIM}
# (`syncthing`, the config PVC). `syncthing-data` holds the synced files and needs its
# own Kustomization, because Flux allows exactly one postBuild.substitute map each.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app syncthing-data
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: syncthing
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/volsync/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: volsync
      namespace: system
    - name: syncthing
      namespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: *app
      # Matches the syncthing-data PVC's real size (kubernetes/apps/base/selfhosted/syncthing/app/pvc.yaml).
      # Right-sized 2026-08-31 from 100Gi (28 KB actually used) down to 15Gi -
      # see that file for the per-folder sizing reasoning. This value sizes the
      # ReplicationDestination's restic destination volume, so it must track
      # the claim size for a future restore to have room.
      VOLSYNC_CAPACITY: 15Gi
      VOLSYNC_CACHE_CAPACITY: 5Gi
      VOLSYNC_SCHEDULE_CEPH: "40 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "15 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "45 4 * * *"
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# kopiur backup for the SECOND volume, `syncthing-data` (the synced files).
# Needs its own Kustomization for the same reason the volsync one above does:
# Flux allows one postBuild.substitute map per Kustomization and every kopiur
# object is named from ${APP}. The volsync Kustomization above is untouched,
# and syncthing's own folder configuration is not touched at all.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: syncthing-data-kopiur
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: syncthing
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: syncthing
      namespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: syncthing-data
      KOPIUR_CLAIM: syncthing-data
      # Identity left at the component default of 1000:1000, measured rather
      # than assumed: entries present are owned 1000:1000 and the pod runs
      # 1000:1000:1000, with nothing unreadable at 1000.
      #
      # syncthing-data was recreated at 15Gi on 2026-08-31 (previously 100Gi
      # holding 28 KB, right-sized alongside the new four-folder layout - see
      # kubernetes/apps/base/selfhosted/syncthing/app/pvc.yaml). A manual
      # syncthing-data-ceph-resize-verify Snapshot proved a non-empty, non-zero
      # backup against the recreated claim same day.
      KOPIUR_CACHE_CAPACITY: 5Gi
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
