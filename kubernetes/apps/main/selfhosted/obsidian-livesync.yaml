---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app obsidian-livesync
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/selfhosted/obsidian-livesync/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3. volsync's entry is unchanged and
    # stays that way until a restore has been demonstrated from kopiur for this
    # volume (Stage 5).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: obsidian-livesync
      VOLSYNC_CAPACITY: 2Gi
      VOLSYNC_SCHEDULE_CEPH: "10 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "45 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "15 4 * * *"
      # APP_UID/APP_GID deliberately absent - see changedetection.yaml for the
      # precedent. No manifest in this repo reads either variable.
      #
      # LOAD-BEARING. CouchDB runs as 5984:5984 (pod securityContext
      # 5984:5984:5984, reconfirmed live 2026-08-31) and owns all 8 files on
      # this volume as 5984:5984. Both movers are now pinned to 5984:5984,
      # matching KOPIUR_PUID/PGID below. VOLSYNC_PUID/PGID were added
      # 2026-08-31: the 2026-08-30 audit had already found and documented that
      # the VolSync mover ran at the unmatched 1000:1000 component default and
      # only "happens to read this volume" - every file is mode 644/755, so a
      # uid-1000 mover can read them despite not owning them, purely by luck of
      # permissive modes. That is the identical shape of latent trap that
      # caused the changedetection defect (a declared/enforced split nobody
      # closed), so it is fixed here rather than left as documented-but-live
      # drift. Verified safe before applying: 5984:5984 already owns 100% of
      # the volume's files (VolSync's own backup log independently confirms
      # "processed 8 files" against the live claim), so this mover identity
      # change can only gain read access, never lose it.
      VOLSYNC_PUID: "5984"
      VOLSYNC_PGID: "5984"
      KOPIUR_PUID: "5984"
      KOPIUR_PGID: "5984"
      # Namespace r2 hour. The component default (`H 4 * * *`) is especially
      # wrong for `selfhosted`: EVERY claim in this namespace already runs its
      # volsync r2 job in the 04:00 hour, so the default would stack both
      # systems into one hour for every one of them. Hour 14 carries no volsync
      # destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on
      # the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
