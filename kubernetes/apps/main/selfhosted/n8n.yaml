---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/selfhosted/n8n/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier C (real
    # user-authored state). kopiur is now the ONLY backup engine on this claim.
    #
    # The claim holds n8n's own data directory - the SQLite workflow database
    # and, critically, the encryption key that every stored credential is
    # sealed with. Losing it does not just lose the workflows; it makes any
    # other copy of them undecryptable.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 24 - 7725/7725 files restored from BOTH destinations into a scratch
    # PVC with an IDENTICAL per-file manifest digest (`cd0fae1c2aff`), no
    # markers and no caveats. The kopiur restore is additionally MODE-faithful
    # where a VolSync one is not: kopiur stages its source read-only, so it
    # reproduces original modes, while a VolSync restore relaxes every file by
    # a group-write bit - which on a 0600 encryption key is the difference
    # worth having. Restore cache stays at the 2Gi component default: 0.47 GiB
    # against ~1.95 GiB usable is 24%, the highest of the four tier-C claims
    # and still comfortably clear. Captain decision 2026-09-04; retirement
    # record: docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}. The HelmRelease's
      # own `existingClaim` was renamed to ${KOPIUR_CLAIM:-n8n}, which also
      # defuses the `${VOLSYNC_CLAIM:-*app}` dangling-alias trap - see
      # linkwarden.yaml for the full mechanism.
      #
      # Inherited from the retired VOLSYNC_CAPACITY (8Gi, not the component's
      # 5Gi default) and matched to the LIVE claim (8Gi, holding 0.47 GiB -
      # measured 2026-09-04). Under the pvc Component's `ssa: IfNotPresent`
      # this is create-time-only for the claim that already exists, but it is
      # exactly what a REBUILD would provision, which is why an inherited
      # non-default value has to be carried across rather than dropped.
      KOPIUR_CAPACITY: 8Gi
      # APP_UID/APP_GID deliberately absent - see changedetection.yaml for the
      # precedent. No manifest in this repo reads either variable, so a second,
      # unenforced identity declaration is a liability, not documentation.
      # Identity left at the component default of 1000:1000, and that is a
      # MEASURED result rather than an assumption: live measurement 2026-08-30
      # (reconfirmed 2026-08-31, workload `id`, mover moverSecurityContext/
      # podSecurityContext) found every entry owned 1000:1000 (pod
      # securityContext 1000:1000:1000) and nothing unreadable at 1000.
      # Namespace r2 hour. The component default (`H 4 * * *`) is especially
      # wrong for `selfhosted`: EVERY claim in this namespace already runs its
      # volsync r2 job in the 04:00 hour, so the default would stack both
      # systems into one hour for every one of them. Hour 14 carries no volsync
      # destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph stays on
      # the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
