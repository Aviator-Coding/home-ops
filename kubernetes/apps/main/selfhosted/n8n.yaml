---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app n8n
  namespace: &namespace selfhosted
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/selfhosted/n8n/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: onepassword-store
      namespace: security
    # kopiur is the only engine on this claim. Do not depend on the VolSync operator. Skill
    # `kopiur-backups`.
    - name: kopiur-repository
      namespace: system
  components:
    # VolSync is retired. The pvc component keeps the claim: ssa IfNotPresent, never force: enabled.
    # Proof: proof-ledger.md row 24. Skill `kopiur-backups`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # Claim name matches the app, so KOPIUR_CLAIM is omitted. Capacity is create-time only (ssa IfNotPresent).
      # Skill `kopiur-backups`.
      KOPIUR_CAPACITY: 8Gi
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 14 * * *"
