---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/home-automation/zigbee2mqtt/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: onepassword-store
      namespace: security
    - name: emqx-cluster
      namespace: database
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 17 - 37/37 files restored from BOTH destinations into a scratch PVC
    # with an identical per-file manifest digest (`1a3f40e9218d`), no markers
    # and no caveats. Content class: the Zigbee coordinator database and
    # device pairings - not regenerable, but completely proven. Captain
    # decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `zigbee2mqtt-data` while the app is `zigbee2mqtt`. This
      # drove the retired VOLSYNC_CLAIM and now also drives the pvc Component's
      # PVC name, so it is load-bearing in a second place after retirement.
      KOPIUR_CLAIM: zigbee2mqtt-data
      # Inherited from the retired VOLSYNC_CAPACITY default and matched to the
      # LIVE claim (5Gi, holding 824 KiB - measured 2026-09-04). Under the pvc
      # Component's `ssa: IfNotPresent` this is create-time-only for the claim
      # that already exists, but it is exactly what a REBUILD would provision -
      # so it is stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # KOPIUR_CACHE_CAPACITY deliberately left at the 2Gi component default.
      # Measured 2026-09-04: 824 KiB snapshot against ~1.95 GiB of usable cache
      # (0.04%) - docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md.
      # The pod runs 2000:2000:2000 and the volume mixes 1000:2000 (60 entries)
      # with 2000:2000 (8). Measured 2026-08-30, the default of 1000 would also
      # read this volume today - every file is group-readable by gid 2000 - but
      # the mover identity is set to match the WORKLOAD that owns the files, so
      # a kopiur restore reproduces the ownership the app expects and a future
      # file written 0600 by uid 2000 cannot silently break the backup.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot plus 13 volsync r2 runs. Hour 10 carries no
      # volsync destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph
      # stays on the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 10 * * *"
