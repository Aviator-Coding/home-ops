---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app zigbee2mqtt
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/home-automation/zigbee2mqtt/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: onepassword-store
      namespace: security
    - name: emqx-cluster
      namespace: database
    - name: volsync
      namespace: system
    # kopiur runs ALONGSIDE volsync on this claim. See the components block.
    - name: kopiur-repository
      namespace: system
  components:
    # BOTH backup systems, deliberately and simultaneously - the parallel-run
    # safety property of migration Stage 3. volsync's entry is unchanged and
    # stays that way until a restore has been demonstrated from kopiur for this
    # volume (Stage 5).
    - ../../../../../components/volsync
    - ../../../../../components/kopiur
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      VOLSYNC_CLAIM: zigbee2mqtt-data
      VOLSYNC_SCHEDULE_CEPH: "10 */4 * * *"
      VOLSYNC_SCHEDULE_MINIO: "15 */6 * * *"
      VOLSYNC_SCHEDULE_R2: "10 1 * * *"
      KOPIUR_CLAIM: zigbee2mqtt-data
      # The pod runs 2000:2000:2000 and the volume mixes 1000:2000 (60 entries)
      # with 2000:2000 (8). Measured 2026-08-30, the default of 1000 would also
      # read this volume today - every file is group-readable by gid 2000 - but
      # the mover identity is set to match the WORKLOAD that owns the files, so
      # a kopiur restore reproduces the ownership the app expects and a future
      # file written 0600 by uid 2000 cannot silently break the backup.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot plus 13 volsync r2 runs. Hour 10 carries no
      # volsync destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph
      # stays on the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 10 * * *"
