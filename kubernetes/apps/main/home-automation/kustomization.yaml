---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-automation

components:
  - ../../../components/common
  - ../../../components/alerts

resources:
  - ./esphome.yaml
  - ./home-assistant.yaml
  - ./matter-server.yaml
  - ./zigbee2mqtt.yaml

# Patch target is not-used. The annotation admits a root mover for the whole namespace; it does not change any other claim's uid.
# Skill `kopiur-backups`.
patches:
  - target:
      kind: Namespace
      name: not-used
    patch: |-
      - op: add
        path: /metadata/annotations/kopiur.home-operations.com~1privileged-movers
        value: "true"
