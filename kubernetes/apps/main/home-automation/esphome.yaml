---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app esphome
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: "./kubernetes/apps/base/home-automation/esphome/app"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: onepassword-store
      namespace: security
    # The `volsync` (system) dependency went with the volsync Component below -
    # nothing in this Kustomization renders a VolSync object any more, so
    # waiting on the VolSync operator would be a dependency on an unrelated app.
    # kopiur is the sole backup engine on this claim.
    - name: kopiur-repository
      namespace: system
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 14 - 46/46 files restored from BOTH destinations into a scratch PVC
    # with an identical per-file manifest digest (`baa6b55032b5`). This claim
    # is also the subject of that proof's finding 3: `/config/secrets.yaml` is
    # an ESO Secret volume mounted OVER the claim path, so the claim itself
    # holds a zero-byte placeholder there - which is what kopiur correctly
    # backed up and restored, and why an app-pod file census scores a false
    # FAIL on this volume. Captain decision 2026-09-04; retirement record:
    # docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # The second include is what keeps the PVC alive, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # overlay runs prune: true - so removing it without a replacement makes
    # Flux DELETE the app's data volume for a change that was only ever meant
    # to remove a backup engine. components/kopiur/pvc/pvc.yaml also explains
    # why that file must carry `ssa: IfNotPresent`.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim is `esphome-config` while the app is `esphome`. This drove
      # the retired VOLSYNC_CLAIM and now also drives the pvc Component's PVC
      # name, so it is load-bearing in a second place after retirement.
      KOPIUR_CLAIM: esphome-config
      # Inherited from the retired VOLSYNC_CAPACITY and matched to the LIVE
      # claim (5Gi, holding 1.4 MiB - measured 2026-09-04). Under the pvc
      # Component's `ssa: IfNotPresent` this is create-time-only for the claim
      # that already exists, but it is exactly what a REBUILD would provision -
      # so it is stated rather than left to the component default.
      KOPIUR_CAPACITY: 5Gi
      # KOPIUR_CACHE_CAPACITY deliberately left at the 2Gi component default.
      # Measured 2026-09-04: 1.4 MiB snapshot against ~1.95 GiB of usable cache
      # (0.07%) - docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md.
      # LOAD-BEARING, measured live 2026-08-30: 74 of 76 entries are owned
      # 2000:2000 and the pod runs 2000:2000:2000. At the component default of
      # 1000 the mover cannot read 2 files or traverse 5 directories, and kopia
      # treats an unreadable file as fatal - BOTH destinations would fail.
      KOPIUR_PUID: "2000"
      KOPIUR_PGID: "2000"
      # Namespace r2 hour. The component default (`H 4 * * *`) would put every
      # kopiur r2 policy in the fleet into the single 04:00 hour, which already
      # carries volsync's ceph slot plus 13 volsync r2 runs. Hour 10 carries no
      # volsync destination and no kopiur ceph slot (01/05/09/13/17/21). Ceph
      # stays on the component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 10 * * *"
