---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app matter-server
  namespace: &namespace home-automation
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # Proof: proof-ledger.md row 16.
    - ../../../../../components/kopiur
    - ../../../../../components/kopiur/pvc
  interval: 10m
  path: "./kubernetes/apps/base/home-automation/matter-server/app"
  prune: true
  dependsOn:
    - name: multus-networks
      namespace: kube-system
    - name: kopiur-repository
      namespace: system
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false # no flux ks dependents; the standing kopiur Restore is Ready=False by design
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      KOPIUR_CAPACITY: 1Gi
      # 2Gi default clears this snapshot. Root mover needs privileged-movers. Skill `kopiur-backups`.
      KOPIUR_PUID: "0"
      KOPIUR_PGID: "0"
      KOPIUR_SCHEDULE_R2: "H 10 * * *"
