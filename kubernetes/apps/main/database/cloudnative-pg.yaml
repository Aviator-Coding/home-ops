---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app postgres-cluster-17
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: rook-ceph
      namespace: rook-ceph
    - name: external-secrets
      namespace: security
  # Operational health gate: readyInstances + ContinuousArchiving (not the Ready
  # condition, which CNPG can latch False indefinitely even while the cluster
  # serves reads/writes). readyInstances >= 1 is a floor; cluster-17 runs 3
  # instances (talos-3 BIOS issue resolved 2026-04-26).
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: status.readyInstances >= 1 && status.conditions.filter(e, e.type == 'ContinuousArchiving').all(e, e.status == 'True')
      failed: status.readyInstances < 1
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/cluster-17
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg-dashboard
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  path: ./kubernetes/apps/base/database/cloudnative-pg/dashboard
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
  targetNamespace: *namespace
  wait: true
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app pgadmin
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    # VOLSYNC RETIRED 2026-09-04 - migration Stage 5, wave three, tier A
    # (ordinary config volumes). kopiur is now the ONLY backup engine on this
    # claim; its backup half lives in the `pgadmin-kopiur` Kustomization below.
    #
    # Authorising evidence: docs/backups/kopiur-restore-proof-2026-09-01.md
    # row 4 - 3/3 files restored from BOTH destinations into a scratch PVC with
    # an identical per-file manifest digest (`81937622ac41`). Content class:
    # pgAdmin's own UI state (server list, preferences); every database it
    # administers is CNPG-managed with its own continuous archiving, so nothing
    # unique to a cluster lives here. Captain decision 2026-09-04; retirement
    # record: docs/backups/kopiur-wave-three-retirement-2026-09-04.md.
    #
    # THIS ENTRY IS THE ONE THAT KEEPS THE PVC ALIVE, and it is not optional.
    # The volsync Component was the only manifest emitting this claim, and this
    # Kustomization runs prune: true - so removing it without a replacement
    # makes Flux DELETE the app's data volume for a change that was only ever
    # meant to remove a backup engine. components/kopiur/pvc/pvc.yaml also
    # explains why that file must carry `ssa: IfNotPresent`.
    #
    # Note the SHAPE here differs from the fleet's other retired overlays,
    # which carry `[components/kopiur, components/kopiur/pvc]` together: only
    # the claim moves here, and the kopiur BACKUP half stays on `pgadmin-kopiur`
    # below. That split is retained deliberately to keep this change minimal;
    # it is no longer required by a claim-side wait:true (dropped below), and
    # collapsing the kopiur half back inline is a possible follow-up rather than
    # something this change does. media/calibre.yaml carries the same split.
    - ../../../../../components/kopiur/pvc
  interval: 30m
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: rook-ceph
      namespace: rook-ceph
    # The `volsync` (system) dependency went with the volsync Component above.
    # `kopiur-repository` (system) replaces it: this Kustomization now renders a
    # claim whose dataSourceRef names a kopiur `Restore`, so the kopiur CRDs and
    # repositories have to exist before it is applied. The backup objects live
    # on `pgadmin-kopiur` below and do NOT dependsOn this claim Kustomization -
    # that reverse edge was the greenfield deadlock (Restore needed for PVC
    # bind, claim wait needed for backup KS eligibility).
    - name: kopiur-repository
      namespace: system
    - name: external-secrets
      namespace: security
  # Workload health signal only. wait:false is required for Flux to honour
  # healthChecks at all (wait:true assesses the whole inventory instead). The
  # PVC must NOT appear here: putting it back in the assessment set would re-
  # arm the Pending-PVC block on greenfield. The Deployment mounts the claim,
  # so it is still transitively gated by PVC bind - that is a health signal,
  # not the deadlock fix (see pgadmin-kopiur header).
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: pgadmin
      namespace: *namespace
  path: ./kubernetes/apps/base/database/cloudnative-pg/pgadmin
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # The claim name matches the app name, so KOPIUR_CLAIM is not needed -
      # components/kopiur/pvc renders ${KOPIUR_CLAIM:-${APP}}.
      #
      # Inherited from the retired VOLSYNC_CAPACITY - NOT the component's 5Gi
      # default, which would provision a rebuilt claim at 2.5x the live one.
      # Matched to the LIVE claim (2Gi, holding 0.93 GiB - measured
      # 2026-09-04). Under the pvc Component's `ssa: IfNotPresent` this is
      # create-time-only for the claim that already exists, but it is exactly
      # what a REBUILD would provision.
      KOPIUR_CAPACITY: 2Gi
      # KOPIUR_CACHE_CAPACITY belongs on the `pgadmin-kopiur` Kustomization
      # below, not here - this Kustomization renders only the claim. It is
      # deliberately left at the 2Gi component default there. That is the
      # highest utilisation of any 2Gi-default claim in the fleet (0.93 GiB
      # against ~1.95 GiB usable = 48%), adjudicated "ok" by the fleet audit in
      # docs/backups/kopiur-r2-restore-cache-gate-2026-09-02.md and re-measured
      # unchanged on 2026-09-04. It is also bounded: a 2Gi claim cannot grow
      # far past the cache. Watch it if the claim is ever expanded.
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: *namespace
  wait: false
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
#
# kopiur-only backup for `pgadmin` (Stage 5 complete 2026-09-04). VolSync is
# retired from this claim; this Kustomization is the sole backup engine.
#
# WHY THIS IS A SEPARATE KUSTOMIZATION rather than a `components:` entry on the
# pgadmin Kustomization above (the fleet's normal shape - see
# kubernetes/apps/main/downloads/sabnzbd.yaml): the split was introduced when that
# Kustomization still set wait:true, because the kopiur standing Restore is
# Ready=False by design (AwaitingPvcDataSourceRef) and wait:true would have
# assessed it forever. That wait:true is gone now (workload healthChecks
# instead), so the split is no longer REQUIRED - it is retained deliberately to
# keep this change minimal. Collapsing the kopiur half back inline is a
# possible follow-up, not something this change does. media/calibre.yaml has
# the same retained split.
#
# GREENFIELD ORDERING (review fix): this Kustomization deliberately does NOT
# dependsOn pgadmin. The cycle edge is that dependsOn, not wait:true - both the
# Deployment and a wait:true inventory gate are transitively blocked by the
# same Pending PVC until ${APP}-kopiur-dst exists, and that Restore is created
# here. Removing the reverse edge lets the Restore apply independently so the
# PVC can bind. Inverting the dependency (claim dependsOn this KS) was
# considered and declined: a claim should not depend on its own backup config.
# Risk of applying this first: policies name a PVC that is not there yet and
# have nothing to snapshot until it appears. dependsOn kopiur-repository stays
# - the admission webhook is failurePolicy: Fail.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pgadmin-kopiur
  namespace: &namespace database
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: pgadmin
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    # kopiur-repository, not kopiur: it applies the `ceph` and `r2`
    # ClusterRepository objects these policies reference, and it already
    # dependsOn the operator. The admission webhook is failurePolicy: Fail, so
    # with the operator down the API server REJECTS these CRs outright.
    # Deliberately no dependsOn pgadmin - see header GREENFIELD ORDERING.
    - name: kopiur-repository
      namespace: system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: pgadmin
      # LOAD-BEARING. Measured live 2026-08-30 against the running pod: every
      # one of the 10 entries on this volume is owned `5050:5050`, and the pod
      # itself runs `5050:5050:5050`. At the component default of 1000 the
      # mover cannot read 1 file or traverse 3 directories, and kopia treats an
      # unreadable file as fatal - BOTH destinations would fail. This is the
      # first non-1000, non-2000 identity in the migration.
      KOPIUR_PUID: "5050"
      KOPIUR_PGID: "5050"
      # Namespace r2 hour. The component default is `H 4 * * *`, which would
      # put all 35 kopiur r2 policies into the single 04:00 hour - already the
      # hour carrying volsync's ceph slot plus 13 volsync r2 runs, taking it to
      # 83 mover runs and making it the busiest hour of the day. Hour 07 is
      # free of every volsync destination and of kopiur's own ceph slots
      # (01/05/09/13/17/21). One hour per namespace; ceph stays on the
      # component default, which is already structurally offset.
      KOPIUR_SCHEDULE_R2: "H 7 * * *"
