---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ducklake
  namespace: &namespace database
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 10m
  path: ./kubernetes/apps/base/database/ducklake/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # The db-init Job completing is the gate; the CronJob is suspended and has no Ready condition.
  wait: true
  dependsOn:
    - name: postgres-cluster-17
      namespace: *namespace
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: onepassword-store
      namespace: security
    - name: external-secrets
      namespace: security
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
