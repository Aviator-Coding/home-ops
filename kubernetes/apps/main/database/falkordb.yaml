---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app falkordb
  namespace: &namespace database
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  targetNamespace: *namespace
  interval: 1h
  retryInterval: 2m
  timeout: 5m
  path: ./kubernetes/apps/base/database/falkordb/app
  prune: true
  # healthChecks target the rendered workload, not the HelmRelease - a HelmRelease-kind check reads Ready straight through a live crashloop (AGENTS.
  # Skill `databases`.
  healthChecks:
    - apiVersion: apps/v1
      kind: Deployment
      name: *app
      namespace: *namespace
  wait: false
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
    # The app is password-protected and takes that password from 1Password via
    # the ExternalSecret in the base directory.
    - name: onepassword-store
      namespace: security
    # kopiur-repository, not kopiur: it applies the `ceph` and `r2`
    # ClusterRepository objects the policies below reference, and the kopiur
    # admission webhook is failurePolicy: Fail - with the operator down the API
    # server rejects these CRs outright.
    - name: kopiur-repository
      namespace: system
  components:
    # kopiur ONLY. components/volsync is not added: the fleet migrated to kopiur and VolSync is not wired onto new claims.
    # Skill `databases`.
    - ../../../../../components/kopiur
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: *app
      # KOPIUR_CLAIM and KOPIUR_PUID are omitted: the claim is the app, and the files are 1000:1000.
      # 10Gi clears the ~6.2 GiB restore plateau. The 2Gi default does not. Skill `kopiur-backups`.
      KOPIUR_CACHE_CAPACITY: 10Gi
      # Namespace r2 hour. The H 4 default would pile every r2 policy into 04:00. Ceph stays on the
      # component default. Skill `kopiur-backups`.
      KOPIUR_SCHEDULE_R2: "H 7 * * *"
