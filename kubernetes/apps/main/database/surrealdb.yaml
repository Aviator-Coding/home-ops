---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app surrealdb
  namespace: &namespace database
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 30m
  timeout: 5m
  path: ./kubernetes/apps/base/database/surrealdb/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
  dependsOn:
    - name: external-secrets
      namespace: security
  healthCheckExprs:
    - apiVersion: apps/v1
      kind: Deployment
      current: status.availableReplicas == status.replicas
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Own Kustomization: the parent uses wait:true, and the standing Restore stays Ready=False until a rebuild.
# Skill `kopiur-backups`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: surrealdb-kopiur
  namespace: &namespace database
spec:
  targetNamespace: *namespace
  commonMetadata:
    labels:
      app.kubernetes.io/name: surrealdb
  interval: 30m
  timeout: 5m
  path: "./kubernetes/components/kopiur/backup"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  dependsOn:
    - name: kopiur-repository
      namespace: system
    - name: surrealdb
      namespace: *namespace
  # No `name:` on either patch target: both SnapshotPolicy objects this
  # Kustomization renders (surrealdb-ceph, surrealdb-r2) need the identical
  # hook, and an unqualified kind selector applies the same patch to both
  # rather than duplicating the block twice.
  patches:
    - target:
        kind: SnapshotPolicy
      patch: |
        - op: add
          path: /spec/hooks
          value:
            beforeSnapshot:
              # The real data. No continueOnFailure: if this export fails, the
              # whole snapshot fails rather than silently falling back to a
              # bare crash-consistent one.
              - workloadExec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: surrealdb
                  command:
                    - /surreal
                    - export
                    - --endpoint
                    - http://localhost:8000
                    - --namespace
                    - open_notebook
                    - --database
                    - production
                    - /data/kopiur-hook-open_notebook-production.surql
                  timeout: 2m
              # The throw-away namespace. continueOnFailure: true so a deleted
              # or renamed `test` database can never abort the production
              # export above.
              - workloadExec:
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: surrealdb
                  command:
                    - /surreal
                    - export
                    - --endpoint
                    - http://localhost:8000
                    - --namespace
                    - test
                    - --database
                    - test
                    - /data/kopiur-hook-test-test.surql
                  timeout: 2m
                  continueOnFailure: true
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret
    substitute:
      APP: surrealdb
      # Mover identity is measured from the files. Component default 1000 fails closed when it does not
      # match. Skill `kopiur-backups`.
      KOPIUR_PUID: "65532"
      KOPIUR_PGID: "65532"
      # Namespace r2 hour (kubernetes/components/kopiur/Readme.md schedule
      # table) - same hour database/falkordb already uses.
      KOPIUR_SCHEDULE_R2: "H 7 * * *"
