---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencodeai-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: opencodeai-secret
    template:
      data:
        Authorization: "{{ .OPENCODEAI_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# OpenCode Zen AgentgatewayBackend (OpenAI-compatible, PAYG, serves under
# /zen). DORMANT: no model in use, so the unified /v1 router
# (../httproute-unified.yaml) has no rule for it — re-enabling is one routing
# rule there (careful: several Zen ids collide with direct-provider ids, see
# the pricing note in ../rules/cost.yaml). Backend + secret kept so the
# credential path stays wired.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: opencodeai
  namespace: ai
spec:
  ai:
    provider:
      openai: {}
      host: opencode.ai
      port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: opencodeai-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
