---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openrouter-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: openrouter-secret
    template:
      data:
        Authorization: "{{ .OPENROUTER_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# OpenRouter AgentgatewayBackend (OpenAI-compatible, serves under /api).
# Reached ONLY via the unified /v1 router (../httproute-unified.yaml): any
# vendor-slug model id (x-ai/..., openai/gpt-oss-*, qwen/..., deepseek/...)
# not claimed by a more specific rule routes here (chat + embeddings; the
# unified rules prepend /api). No per-provider path route exists anymore.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: openrouter
spec:
  ai:
    provider:
      openai: {}
      host: openrouter.ai
      port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: openrouter-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
