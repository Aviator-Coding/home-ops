---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: anthropic-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: anthropic-secret
    template:
      data:
        Authorization: "{{ .ANTHROPIC_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# Reached ONLY via the unified /v1 router (../httproute-unified.yaml) by model
# name (claude-*); `Completions` translates OpenAI Chat Completions -> Anthropic
# Messages, and the unified /v1/messages rule keeps the native protocol for
# Anthropic-SDK clients. No per-provider path route exists anymore.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: anthropic
spec:
  ai:
    provider:
      anthropic: {}
  policies:
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/messages": Messages
        "/v1/models": Passthrough
        "*": Passthrough
    auth:
      secretRef:
        name: anthropic-secret
