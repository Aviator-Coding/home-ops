---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: zai-secret
  namespace: ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: zai-secret
    template:
      data:
        Authorization: "{{ .ZAI_API_KEY }}"
  dataFrom:
    - extract:
        key: ai-keys
---
# Z.AI AgentgatewayBackend (OpenAI-compatible, serves under /api/paas/v4).
# DORMANT: no model in use (glm-* ids deliberately route to OpenCode Go), so
# the unified /v1 router (../httproute-unified.yaml) has no rule for it —
# re-enabling is one routing rule there. Backend + secret kept so the
# credential path stays wired.
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayBackend
metadata:
  name: zai
  namespace: ai
spec:
  ai:
    provider:
      openai: {}
      host: api.z.ai
      port: 443
  policies:
    tls: {}
    auth:
      secretRef:
        name: zai-secret
    ai:
      routes:
        "/v1/chat/completions": Completions
        "/v1/embeddings": Passthrough
        "/v1/models": Passthrough
        "*": Passthrough
