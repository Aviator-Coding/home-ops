# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Reuses the `agentmemory` 1Password item — the shim authenticates against the
# central agentmemory service with the same shared bearer secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name toolhive-agentmemory
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: *name
    template:
      data:
        AGENTMEMORY_SECRET: "{{ .AGENTMEMORY_SECRET }}"
  dataFrom:
    - extract:
        key: agentmemory
