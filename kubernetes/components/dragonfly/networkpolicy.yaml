---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/networking.k8s.io/networkpolicy_v1.json
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ${APP}-dragonfly-allow-prometheus
spec:
  # Operator-managed NetworkPolicy on the same pods only allows :9999 from
  # the operator controller-manager and peer replicas, which blocks Prometheus
  # scraping. Additive policy: K8s OR-combines all NPs targeting the same pods.
  podSelector:
    matchLabels:
      app: ${APP}-dragonfly
      app.kubernetes.io/part-of: dragonfly
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
      ports:
        - port: 9999
          protocol: TCP
    # Allow DNS replies from CoreDNS in kube-system. No ports restriction here
    # on purpose: NetworkPolicy `ports` matches the DESTINATION port on this
    # pod, and a DNS reply arrives on the dragonfly pod's ephemeral source
    # port, never 53 - a port:53 restriction (as added in #1800) can never
    # match a reply and silently drops every DNS response. See loki-ingress
    # and AGENTS.md for the full mechanism (Cilium reply-conntrack fails to
    # correlate a DNS reply back to its request when the client pod's node
    # also hosts a CoreDNS replica). This one shared component covers all 5
    # Dragonfly instances (litellm, searxng, authentik, paperless-ngx, rsshub).
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
