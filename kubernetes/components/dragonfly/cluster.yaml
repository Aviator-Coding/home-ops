---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0
  replicas: 2
  args:
    # 256 MiB floor per proactor thread, so 2 threads need at least 512Mi. Skill `databases` references/dragonfly.md.
    - --maxmemory=512Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    - --cache_mode=true
    - --default_lua_flags=allow-undeclared-keys
  resources:
    # requests == limits keeps Guaranteed QoS; the memory limit is 128Mi above --maxmemory for runtime headroom.
    requests:
      cpu: 250m
      memory: 640Mi
    limits:
      cpu: 250m
      memory: 640Mi
  # Master and replica must not share a node. The spread constraint below does not guarantee that (it balances the whole namespace), so this required anti-affinity does.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: ${APP}-dragonfly
  # Required anti-affinity separates an instance's replicas. nodeTaintsPolicy Honor: the default Ignore still counts a tainted node, and DoNotSchedule can then strand pods. Skill `node-scheduling`.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
