---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/dragonflydb.io/dragonfly_v1alpha1.json
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: ${APP}-dragonfly
spec:
  # renovate: datasource=docker depName=ghcr.io/dragonflydb/dragonfly
  image: ghcr.io/dragonflydb/dragonfly:v2.0.0
  replicas: 2
  args:
    # Dragonfly v1.38.0 enforces a 256 MiB-per-proactor-thread floor, so with
    # --proactor_threads=2 the minimum --maxmemory is 512Mi. limits.memory
    # below is sized 128Mi above that to leave runtime headroom (internal
    # structures, fork-on-snapshot, allocator slack).
    - --maxmemory=512Mi
    - --proactor_threads=2
    - --cluster_mode=emulated
    # Cache-only policy: LRU-evict at maxmemory instead of returning OOM to clients.
    - --cache_mode=true
    - --default_lua_flags=allow-undeclared-keys
  resources:
    # All four resource fields set with requests == limits so the pod gets
    # Guaranteed QoS (last-evicted tier, immune to node-pressure eviction).
    # CPU limit may cause throttling under spike load; for cache workloads
    # at this scale, the eviction protection matters more than burst CPU.
    requests:
      cpu: 250m
      memory: 640Mi
    limits:
      cpu: 250m
      memory: 640Mi
  # A Dragonfly's own master and replica must never share a node - otherwise
  # the replica buys nothing when that node is lost. The spread constraint
  # below does NOT guarantee this: topologySpreadConstraints.labelSelector is
  # evaluated only against pods in the SAME namespace, so it balances all of a
  # namespace's dragonfly pods collectively rather than each instance's two
  # replicas. Measured 2026-09-14: selfhosted/rsshub-dragonfly-0 AND -1 were
  # both on talos-3 while every per-namespace skew was still a legal 1.
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app: ${APP}-dragonfly
  # Best-effort balance of a namespace's dragonfly pods across nodes. Kept for
  # that broader spread; the anti-affinity above is what actually separates an
  # instance's own two replicas.
  # nodeTaintsPolicy: Honor - dragonfly gets no toleration for the talos-3
  # home-operations.com/dedicated taint, but nodeTaintsPolicy defaults to
  # Ignore, so without this the tainted node still counts as a spread domain
  # and DoNotSchedule can refuse to place a pod anywhere at all. Live
  # 2026-09-26: exactly this stranded ai/searxng-dragonfly-0,
  # selfhosted/paperless-ngx-dragonfly-0 and selfhosted/rsshub-dragonfly-1
  # with 0/3 nodes available during the talos-1.14.1 roll. Confirmed the
  # installed Dragonfly CRD (dragonflies.dragonflydb.io) passes
  # topologySpreadConstraints through as a plain core TopologySpreadConstraint,
  # nodeTaintsPolicy included. See docs/talos-3-scheduling-truth.md.
  topologySpreadConstraints:
    - maxSkew: 1
      topologyKey: "kubernetes.io/hostname"
      whenUnsatisfiable: "DoNotSchedule"
      nodeTaintsPolicy: Honor
      labelSelector:
        matchLabels:
          app.kubernetes.io/part-of: dragonfly
