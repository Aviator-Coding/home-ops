---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/restore_v1alpha1.json
# kopiur's counterpart to ../../volsync/ceph/replicationdestination.
# Skill `kopiur-backups`.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: "${APP}-kopiur-dst"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  repository:
    kind: ClusterRepository
    name: ceph
  # Consumer half of the credential-projection gate.
  # Skill `kopiur-backups`.
  credentialProjection:
    enabled: true
  source:
    fromPolicy:
      name: "${APP}-ceph"
      # 0 = the newest snapshot.
      offset: 0
  target:
    populator: {}
  policy:
    # INVARIANT: fail-closed. A restore that finds no snapshot must fail loudly (Restore Failed, claim unbound, KopiurRestoreFailed), never provision an empty volume.
    # Skill `kopiur-backups`.
    onMissingSnapshot: Fail
  mover:
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:-1000}
      runAsGroup: ${KOPIUR_PGID:-1000}
      fsGroup: ${KOPIUR_PGID:-1000}
    cache:
      mode: Ephemeral
      capacity: "${KOPIUR_CACHE_CAPACITY:-2Gi}"
