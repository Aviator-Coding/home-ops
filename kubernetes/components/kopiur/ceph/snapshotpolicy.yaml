---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# The CEPH (local, in-cluster RGW) destination for ${KOPIUR_CLAIM:-${APP}}.
# Skill `kopiur-backups`.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-ceph"
spec:
  # Pinned though it is the CRD default. Skill `kopiur-backups` references/onboarding.md.
  copyMethod: Snapshot
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-csi-ceph-blockpool}"
  repository:
    kind: ClusterRepository
    name: ceph
  # Consumer half of credential projection. enabled stays true.
  # Skill `kopiur-backups`.
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  mover:
    cache:
      # Ephemeral is load-bearing: Persistent would add standing cache PVCs.
      mode: Ephemeral
      capacity: "${KOPIUR_CACHE_CAPACITY:-2Gi}"
    # Same identity as VolSync's moverSecurityContext.
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:-1000}
      runAsGroup: ${KOPIUR_PGID:-1000}
      fsGroup: ${KOPIUR_PGID:-1000}
  # Matches ../../volsync/ceph/replicationsource.yaml's retain block.
  retention:
    keepHourly: 6
    keepDaily: 14
    keepWeekly: 10
    keepMonthly: 6
  # onPolicyDelete Retain. Prune drops the CRs and keeps the kopia data.
  # Skill `kopiur-backups`.
  deletion:
    onPolicyDelete: Retain
