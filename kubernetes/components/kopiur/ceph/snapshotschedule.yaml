---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotschedule_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotSchedule
metadata:
  name: "${APP}-ceph"
spec:
  policyRef:
    name: "${APP}-ceph"
  schedule:
    # Odd hours 01,05,09,13,17,21 so VolSync's even-hour ceph jobs stay one hour away. Do not hand-assign the H minute.
    # Skill `kopiur-backups`.
    cron: "${KOPIUR_SCHEDULE_CEPH:-H 1-23/4 * * *}"
    jitter: 5m
    # kopiur evaluates cron as UTC unless timezone is set, and the odd/even stagger then collides at EST.
    # Skill `kopiur-backups`.
    timezone: "${KOPIUR_SCHEDULE_TIMEZONE:-America/New_York}"
  deletion:
    onScheduleDelete: Retain
