---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kopiur.home-operations.com/snapshotpolicy_v1alpha1.json
# The R2 (offsite, Cloudflare) destination for ${KOPIUR_CLAIM:-${APP}}.
# Skill `kopiur-backups`.
apiVersion: kopiur.home-operations.com/v1alpha1
kind: SnapshotPolicy
metadata:
  name: "${APP}-r2"
spec:
  copyMethod: Snapshot
  volumeSnapshotClassName: "${KOPIUR_SNAPSHOTCLASS:-csi-ceph-blockpool}"
  repository:
    kind: ClusterRepository
    name: r2
  # Consumer half of credential projection. Skill `kopiur-backups`.
  credentialProjection:
    enabled: true
  sources:
    - pvc:
        name: "${KOPIUR_CLAIM:-${APP}}"
  mover:
    cache:
      mode: Ephemeral
      capacity: "${KOPIUR_CACHE_CAPACITY:-2Gi}"
    podSecurityContext:
      runAsUser: ${KOPIUR_PUID:-1000}
      runAsGroup: ${KOPIUR_PGID:-1000}
      fsGroup: ${KOPIUR_PGID:-1000}
  # Matches ../../volsync/r2/replicationsource.yaml. No keepHourly on purpose: one snapshot a day.
  retention:
    keepDaily: 30
    keepWeekly: 12
    keepMonthly: 12
  deletion:
    onPolicyDelete: Retain
