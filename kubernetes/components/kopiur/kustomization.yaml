---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Deliberate sibling of ../volsync/kustomization.yaml, one level shallower:
# that Component adds ./backup PLUS ./pvc.yaml, because VolSync's component
# owns the app's claim (the PVC's dataSourceRef points at its
# ReplicationDestination, which is how a restore seeds a fresh deploy).
#
# kopiur's does NOT create a PVC. During the parallel run VolSync still owns
# every claim, and two components creating the same PersistentVolumeClaim from
# the same ${APP} would be a straight kustomize resource collision. The kopiur
# Restore below is therefore declared in passive populator mode and simply sits
# unclaimed until VolSync's PVC is retired (migration Stage 5), at which point
# the claim's dataSourceRef moves to it and ./pvc.yaml lands here.
resources:
  - ./backup
