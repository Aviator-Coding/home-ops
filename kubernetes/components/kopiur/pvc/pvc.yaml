---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/_definitions.json#/definitions/io.k8s.api.core.v1.PersistentVolumeClaim
# Keeps the claim in the Flux inventory so prune does not delete the volume. ssa IfNotPresent; never force: enabled.
# Skill `kopiur-backups`.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: "${KOPIUR_CLAIM:-${APP}}"
  labels:
    kustomize.toolkit.fluxcd.io/ssa: IfNotPresent
spec:
  accessModes: ["${KOPIUR_ACCESSMODES:-ReadWriteOnce}"]
  dataSourceRef:
    kind: Restore
    apiGroup: kopiur.home-operations.com
    name: "${APP}-kopiur-dst"
  resources:
    requests:
      storage: "${KOPIUR_CAPACITY:-5Gi}"
  storageClassName: "${KOPIUR_STORAGECLASS:-ceph-block}"
