---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# The role's password, from the same 1Password field the app connects with. The
# username is the role name, which CNPG requires to match. cnpg.io/reload makes CNPG
# re-apply the password when 1Password changes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ${APP}-pg-role
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: ${APP}-pg-role
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: ${CNPG_ROLE}
        password: "{{ .${CNPG_PASSWORD_KEY:=POSTGRES_DB_USER_PASSWORD} }}"
  dataFrom:
    - extract:
        key: ${CNPG_OP_ITEM:-${APP}}
