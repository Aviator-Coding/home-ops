---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/_definitions.json#/definitions/io.k8s.api.core.v1.Namespace
apiVersion: v1
kind: Namespace
metadata:
  name: not-used
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    # WARN + AUDIT only - never add an enforce label here (194/266 pods have
    # no seccomp profile and would be rejected). Version pinned to the live
    # control-plane minor (v1.36) so the evaluated policy does not silently
    # shift on a Kubernetes upgrade; bump alongside a deliberate cluster
    # upgrade, not automatically.
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.36
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.36
