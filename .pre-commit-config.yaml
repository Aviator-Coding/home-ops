---
repos:
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        name: Check commit message
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/config-conventional"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        name: Check large files
        args: [--maxkb=800]
      - id: check-symlinks
        name: Check symlinks
      - id: destroyed-symlinks
        name: Detect destroyed symlinks
      - id: fix-byte-order-marker
        name: Fix BOM
      - id: end-of-file-fixer
        name: Fix EOF
      - id: mixed-line-ending
        name: Check mixed line endings
      # - id: check-case-conflict
      #   name: Check case conflicts
      - id: check-executables-have-shebangs
        name: Check executable shebangs
      - id: check-shebang-scripts-are-executable
        name: Check files with shebangs being executable
      - id: trailing-whitespace
        name: Fix trailing whitespace
        # A unified diff's blank context line is a single space; stripping it
        # makes the patch stop applying (.github/docker/*/NNNN-*.patch).
        exclude: \.patch$
      - id: pretty-format-json
        name: Format JSON
        args: [--autofix, --no-sort-keys]
      - id: check-json
        name: Check JSON
      - id: check-toml
        name: Check TOML
      - id: check-xml
        name: Check XML
      - id: check-yaml
        name: Check YAML
        args: [--allow-multiple-documents, --unsafe]
      - id: detect-private-key
        name: Detect private keys
      - id: check-merge-conflict
        name: Check merge conflicts

  # Standard linters, resolved through mise (`mise exec`) so hooks use the .mise.toml pins
  # and match the validate.yaml `lint` job. `language: system` keeps them out of pre-commit's
  # own env management. yamlfmt stays manual until the repo-wide format PR merges.
  - repo: local
    hooks:
      - id: yamllint
        name: Lint YAML
        entry: mise exec -- yamllint -s
        language: system
        types: [yaml]
      - id: actionlint
        name: Lint GitHub workflows
        entry: mise exec -- actionlint
        language: system
        types: [yaml]
        files: ^\.github/workflows/
      - id: zizmor
        name: Audit GitHub workflows
        entry: mise exec -- zizmor --offline --min-severity medium .github/workflows
        language: system
        files: ^\.github/(workflows|zizmor\.yml)
        pass_filenames: false
      - id: shellcheck
        name: Lint shell scripts
        entry: mise exec -- shellcheck
        language: system
        types: [shell]
      - id: yamlfmt
        name: Format YAML
        entry: mise exec -- yamlfmt
        language: system
        types: [yaml]
