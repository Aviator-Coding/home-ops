    - sonarr
    # ceph: 3308871 B / 103 obj, r2: 2775236 B / 65 obj, minio: 2501451 B / 65 obj; last write 2026-09-04
    - syncthing
    # ceph: 1436033617 B / 279 obj, r2: 1547858304 B / 268 obj, minio: 1359737709 B / 230 obj; last write 2026-09-04
    - tdarr
    # ceph: 1495538 B / 208 obj, r2: 887816 B / 93 obj, minio: 556263 B / 57 obj; last write 2026-09-04
