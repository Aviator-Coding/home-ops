    - readarr
    # ceph: 121245350 B / 190 obj, r2: 142989722 B / 96 obj, minio: 104994988 B / 135 obj; last write 2026-09-01
    - recyclarr
    # ceph: 1602664 B / 88 obj, r2: 694854 B / 22 obj, minio: 1268297 B / 66 obj; last write 2026-09-01
