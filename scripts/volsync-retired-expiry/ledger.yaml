  sole_copy:
    # The app or volume is gone from the cluster entirely - no PVC, no
    # ReplicationSource, no kopiur SnapshotSchedule. This restic repository is
    # the ONLY remaining copy of that data anywhere.
    expires: "2027-09-30"
    # ~12.5 months out: deliberately double the redundant tier. 12 months is not
    # an arbitrary round number - it is the retention this repo already chose for
    # data it cares about, in `retain.monthly: 12` on the r2 ReplicationSource
    # (kubernetes/components/volsync/r2/replicationsource.yaml). Applying the
    # captain's own existing answer to "how far back is worth keeping" is the
    # defensible floor for data with no second copy, and a full year covers a
    # complete seasonal cycle of "actually, bring that app back".
    reason: no other copy exists anywhere - app and volume are both gone
    prefixes:
    # ceph: 259673311 B / 297 obj, r2: 240224703 B / 154 obj, minio: 232857904 B / 208 obj; last write 2026-08-31
