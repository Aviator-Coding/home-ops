---
# Approved apply only. AUTHENTIK_APPLY_TOKEN stays absent until go-ahead, so a stray plan-out fails closed. Never copy that token into AUTHENTIK_TOKEN.
# vals exec -i -f secrets-apply.vals.yaml -- tofu plan -out=authentik.tfplan, then apply that file. Skill `authentik-terraform` references/apply-runbook.md.

# --- Authentik API ---------------------------------------------------------
# Write-capable token, present only for the duration of an approved apply.
TF_VAR_authentik_token: ref+op://Automation/authentik-terraform/AUTHENTIK_APPLY_TOKEN

# --- Existing OAuth2 client IDs -------------------------------------------
# These are the client IDs already configured in each application. They are read,
# never generated: the values here must match what the app-side config uses, or
# adopting the provider changes it and logins break.
TF_VAR_coder_client_id: ref+op://Automation/authentik-terraform/CODER_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+op://Automation/authentik-terraform/PGADMIN_CLIENT_ID

# --- State backend (Ceph RGW, S3-compatible) ------------------------------
# Keys for the dedicated `terraform` RGW user. The bucket is private; these keys
# are the only way into the state, and the state holds every adopted client
# secret in plaintext.
AWS_ACCESS_KEY_ID: ref+op://Automation/authentik-terraform/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/authentik-terraform/TF_STATE_SECRET_ACCESS_KEY
# Same local port-forward endpoint as secrets.vals.yaml. See backend.tofu.
AWS_ENDPOINT_URL_S3: http://127.0.0.1:18081
