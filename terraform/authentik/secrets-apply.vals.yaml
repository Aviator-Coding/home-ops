---
# Environment for captain-approved `tofu apply` only. Plan/init/state stay on
# secrets.vals.yaml.
#
# Identical to secrets.vals.yaml except TF_VAR_authentik_token resolves
# AUTHENTIK_APPLY_TOKEN, a field that is deliberately ABSENT in 1Password until
# an apply is approved. A stray `vals exec -i -f secrets-apply.vals.yaml -- tofu
# plan -out=...` therefore fails closed on an unresolvable ref instead of baking
# the read-only token into a saved plan. Plan-with-out and apply must use this
# same file so TF_VAR_authentik_token matches what OpenTofu baked into the plan.
#
# At approval time: mint a write-capable Authentik token, write it into
# Automation/authentik-terraform/AUTHENTIK_APPLY_TOKEN for the duration of the
# approved apply, then remove the field afterwards. NEVER write that token into
# AUTHENTIK_TOKEN - that field stays read-only so a stray apply through
# secrets.vals.yaml cannot succeed.
#
# Usage (never run bare `tofu apply`). `-i` keeps PATH/mise and the op session:
#
#   vals exec -i -f secrets-apply.vals.yaml -- tofu plan -out=authentik.tfplan
#   vals exec -i -f secrets-apply.vals.yaml -- tofu apply authentik.tfplan
#
# File keys always win over parent env; do not try to override TF_VAR_* with an
# export. The rendered values are passed to the child process only; nothing is
# written to disk. See ../../docs/authentik/terraform.md section 7.

# --- Authentik API ---------------------------------------------------------
# Write-capable token, present only for the duration of an approved apply.
TF_VAR_authentik_token: ref+op://Automation/authentik-terraform/AUTHENTIK_APPLY_TOKEN

# --- Existing OAuth2 client IDs -------------------------------------------
# These are the client IDs already configured in each application. They are read,
# never generated: the values here must match what the app-side config uses, or
# adopting the provider changes it and logins break.
TF_VAR_coder_client_id: ref+op://Automation/authentik-terraform/CODER_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+op://Automation/authentik-terraform/PGADMIN_CLIENT_ID

# --- State backend (Ceph RGW, S3-compatible) ------------------------------
# Keys for the dedicated `terraform` RGW user. The bucket is private; these keys
# are the only way into the state, and the state holds every adopted client
# secret in plaintext.
AWS_ACCESS_KEY_ID: ref+op://Automation/authentik-terraform/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/authentik-terraform/TF_STATE_SECRET_ACCESS_KEY
# Same local port-forward endpoint as secrets.vals.yaml. See backend.tofu.
AWS_ENDPOINT_URL_S3: http://127.0.0.1:18081
