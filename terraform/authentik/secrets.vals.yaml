---
# Read-only plan/init. Apply uses secrets-apply.vals.yaml. Only ref+op:// plus the plain AWS_ENDPOINT_URL_S3. Vault is Automation, not Home-Lab.
# vals exec -i -f secrets.vals.yaml -- tofu plan. File keys win over the parent env. Skill `authentik-terraform` references/state-and-credentials.md.

# Read-only, so a stray apply through this file cannot mutate live SSO. Permissions: Skill `authentik-terraform`.
TF_VAR_authentik_token: ref+op://Automation/authentik-terraform/AUTHENTIK_TOKEN

# Existing client IDs: read, never generated. They must match the app-side config or logins break.
TF_VAR_coder_client_id: ref+op://Automation/authentik-terraform/CODER_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+op://Automation/authentik-terraform/PGADMIN_CLIENT_ID

# Keys for the dedicated `terraform` RGW user. The state holds every adopted client secret in plaintext.
AWS_ACCESS_KEY_ID: ref+op://Automation/authentik-terraform/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/authentik-terraform/TF_STATE_SECRET_ACCESS_KEY
# Local port-forward. CI uses Service DNS in secrets-ci.vals.yaml. backend.tofu omits endpoints so this env var is what OpenTofu dials. Never s3.sklab.dev. Skill `authentik-terraform` references/state-and-credentials.md.
AWS_ENDPOINT_URL_S3: http://127.0.0.1:18081
