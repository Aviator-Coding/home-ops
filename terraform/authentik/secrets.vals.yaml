---
# Environment for read-only `tofu` invocations in this directory (plan, init,
# state list). Apply uses secrets-apply.vals.yaml instead.
#
# This file holds ONLY `ref+op://` references - the same idiom `bootstrap/` and
# the `just talos` render path already use.
#
# Vault is `Automation`, not the `Home-Lab` vault the rest of the repo's vals
# references use. That is deliberate: the item is written by the PushSecret in
# kubernetes/apps/base/security/authentik/app/pushsecret.yaml, and 1Password
# Connect - which every in-cluster write goes through - can only reach
# Homelab/Automation/Services. `Home-Lab` (hyphenated) is a different vault that
# Connect cannot see at all, so an item there could never be machine-maintained.
#
# Usage (never run bare `tofu` here). `-i` keeps PATH/mise and the op session:
#
#   vals exec -i -f secrets.vals.yaml -- tofu plan
#
# File keys always win over parent env; do not try to override TF_VAR_* with an
# export. The rendered values are passed to the child process only; nothing is
# written to disk. See ../../docs/authentik/terraform.md for the full runbook.

# --- Authentik API ---------------------------------------------------------
# Read-only token for a dedicated Authentik service account. See the runbook for
# the exact permissions it needs and how it was created. Stays read-only so a
# stray apply through this file cannot mutate live SSO.
TF_VAR_authentik_token: ref+op://Automation/authentik-terraform/AUTHENTIK_TOKEN

# --- Existing OAuth2 client IDs -------------------------------------------
# These are the client IDs already configured in each application. They are read,
# never generated: the values here must match what the app-side config uses, or
# adopting the provider changes it and logins break.
TF_VAR_coder_client_id: ref+op://Automation/authentik-terraform/CODER_CLIENT_ID
TF_VAR_open_webui_client_id: ref+op://Automation/authentik-terraform/OPEN_WEBUI_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+op://Automation/authentik-terraform/PGADMIN_CLIENT_ID

# --- State backend (Ceph RGW, S3-compatible) ------------------------------
# Keys for the dedicated `terraform` RGW user. The bucket is private; these keys
# are the only way into the state, and the state holds every adopted client
# secret in plaintext.
AWS_ACCESS_KEY_ID: ref+op://Automation/authentik-terraform/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Automation/authentik-terraform/TF_STATE_SECRET_ACCESS_KEY
