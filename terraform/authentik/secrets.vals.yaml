---
# Environment for every `tofu` invocation in this directory.
#
# This file holds ONLY `ref+op://` references - the same idiom `bootstrap/` and
# the `just talos` render path already use. It resolves against the `Home-Lab`
# 1Password vault, which is the vault `vals` is wired to in this repo.
#
# Usage (never run bare `tofu` here):
#
#   vals exec -f secrets.vals.yaml -- tofu plan
#
# The rendered values are passed to the child process only; nothing is written to
# disk. See ../../docs/authentik/terraform.md for the full runbook.

# --- Authentik API ---------------------------------------------------------
# Token for a dedicated Authentik service account. See the runbook for the exact
# permissions it needs and how it was created.
TF_VAR_authentik_token: ref+op://Home-Lab/authentik-terraform/AUTHENTIK_TOKEN

# --- Existing OAuth2 client IDs -------------------------------------------
# These are the client IDs already configured in each application. They are read,
# never generated: the values here must match what the app-side config uses, or
# adopting the provider changes it and logins break.
TF_VAR_coder_client_id: ref+op://Home-Lab/authentik-terraform/CODER_CLIENT_ID
TF_VAR_open_webui_client_id: ref+op://Home-Lab/authentik-terraform/OPEN_WEBUI_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+op://Home-Lab/authentik-terraform/PGADMIN_CLIENT_ID

# --- State backend (Ceph RGW, S3-compatible) ------------------------------
# Keys for the dedicated `terraform` RGW user. The bucket is private; these keys
# are the only way into the state, and the state holds every adopted client
# secret in plaintext.
AWS_ACCESS_KEY_ID: ref+op://Home-Lab/authentik-terraform/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+op://Home-Lab/authentik-terraform/TF_STATE_SECRET_ACCESS_KEY
