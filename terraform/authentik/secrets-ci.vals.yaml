---
# CI mirror of secrets.vals.yaml through 1Password Connect (ref+onepasswordconnect://). Read-only AUTHENTIK_TOKEN. This file does not apply.
# OP_CONNECT_TOKEN reads the whole Automation vault. Absent file or unset token means schema-only CI. Skill `authentik-terraform` references/ci-plan.md.

TF_VAR_authentik_token: ref+onepasswordconnect://Automation/authentik-terraform#/AUTHENTIK_TOKEN

TF_VAR_coder_client_id: ref+onepasswordconnect://Automation/authentik-terraform#/CODER_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+onepasswordconnect://Automation/authentik-terraform#/PGADMIN_CLIENT_ID

AWS_ACCESS_KEY_ID: ref+onepasswordconnect://Automation/authentik-terraform#/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+onepasswordconnect://Automation/authentik-terraform#/TF_STATE_SECRET_ACCESS_KEY
# In-cluster ARC runner reaches RGW via Service DNS. It has no ServiceAccount
# token, so it cannot kubectl port-forward to 127.0.0.1:18081 the way a local
# operator does (secrets.vals.yaml). backend.tofu omits `endpoints` so this is
# the URL OpenTofu dials. NEVER s3.sklab.dev - SignatureDoesNotMatch through
# Envoy (see backend.tofu).
AWS_ENDPOINT_URL_S3: http://rook-ceph-rgw-ceph-objectstore.rook-ceph.svc.cluster.local
