---
# CI-only mirror of secrets.vals.yaml: same 1Password item, same fields, same
# read-only guarantee - resolved through 1Password Connect instead of the
# interactive `op` CLI session secrets.vals.yaml expects.
#
# terraform-diff.yaml (PR-triggered, unattended) has no interactive `op` session
# to authenticate with. It already runs on the local ARC runner for state-bucket
# reachability (see that workflow's header), so it can reach the same in-cluster
# Connect server ESO already uses for the PushSecret that keeps this item
# current. `vals` treats `op://` (secrets.vals.yaml, CLI/service-account) and
# `onepasswordconnect://` (this file) as two different provider backends for the
# same kind of ref - see https://github.com/helmfile/vals#1password-connect.
# This file adds no new secret material; it reads the existing
# Automation/authentik-terraform item a different way, for a consumer that
# cannot use the CLI path.
#
# Same read-only guarantee as secrets.vals.yaml: AUTHENTIK_TOKEN here is the
# durable read-only field, never AUTHENTIK_APPLY_TOKEN. There is no CI-facing
# apply path - `tofu apply` still requires the explicit captain-approval
# sequence in ../../docs/authentik/terraform.md section 7, which this file does
# not touch and terraform-diff.yaml never runs.
#
# Requires OP_CONNECT_HOST and OP_CONNECT_TOKEN in the environment (set by
# terraform-diff.yaml; OP_CONNECT_HOST is the in-cluster Connect service, not a
# secret). Usage, matching secrets.vals.yaml's local invocation shape:
#
#   OP_CONNECT_HOST=http://onepassword-connect.security.svc.cluster.local:8080 \
#   OP_CONNECT_TOKEN=... \
#   vals exec -i -f secrets-ci.vals.yaml -- tofu plan -lock=false
#
# File keys always win over parent env; do not try to override TF_VAR_* with an
# export. The rendered values are passed to the child process only; nothing is
# written to disk. See ../../docs/authentik/terraform.md section 8 for the full
# writeup, including the one new GitHub Actions secret this requires and its
# vault-wide read scope.

# --- Authentik API ---------------------------------------------------------
TF_VAR_authentik_token: ref+onepasswordconnect://Automation/authentik-terraform#/AUTHENTIK_TOKEN

# --- Existing OAuth2 client IDs -------------------------------------------
TF_VAR_coder_client_id: ref+onepasswordconnect://Automation/authentik-terraform#/CODER_CLIENT_ID
TF_VAR_open_webui_client_id: ref+onepasswordconnect://Automation/authentik-terraform#/OPEN_WEBUI_CLIENT_ID
TF_VAR_pgadmin_client_id: ref+onepasswordconnect://Automation/authentik-terraform#/PGADMIN_CLIENT_ID

# --- State backend (Ceph RGW, S3-compatible) ------------------------------
AWS_ACCESS_KEY_ID: ref+onepasswordconnect://Automation/authentik-terraform#/TF_STATE_ACCESS_KEY_ID
AWS_SECRET_ACCESS_KEY: ref+onepasswordconnect://Automation/authentik-terraform#/TF_STATE_SECRET_ACCESS_KEY
