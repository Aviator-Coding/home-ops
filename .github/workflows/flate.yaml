---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned exactly: the action's SHA-ref lookup falls back to "latest" when the tags API
  # call fails, so the `version:` input is what makes the binary reproducible.
  # Keep in step with the action pin on the `uses:` lines.
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: 0.6.5

jobs:
  filter:
    # Fork guard, mirrors labeler.yaml: every job here runs on the self-hosted runner.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Flate - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Test
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # Headroom is for CPU contention on the shared runner pool, not render time.
    timeout-minutes: 15
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # Empty base: otherwise the action exports FLATE_BASE and `flate test all` goes changed-only.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # No retry loop: flate retries source fetches itself, so a failure here is real.
      - name: Run flate test
        run: |
          flate test all \
            --path kubernetes/clusters/main \
            --no-progress

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Diff
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - hr
          - ks
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # fetch-depth: 0 makes origin/<default> resolvable for --base.
      - name: Checkout Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # --strip-attr is omitted on purpose: passing any value REPLACES flate's default set.
      - name: Run flate diff
        run: |
          flate diff ${{ matrix.resource }} \
            --path kubernetes/clusters/main \
            --base "origin/${{ github.event.repository.default_branch }}" \
            --no-progress \
            --output diff > diff.patch

      # 60000 bytes stays under GitHub's 65536-character comment limit. `head -c`, not `truncate`: the ARC image lacks full coreutils.
      - name: Truncate Diff
        id: diff
        run: |-
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            head -c 60000 diff.patch > diff.patch.tmp
            mv diff.patch.tmp diff.patch
          fi
          if [ -s diff.patch ]; then
            echo 'has-diff=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.diff.outputs.has-diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          path: diff.patch
          message: |-
            ```diff
            {{{content}}}
            ```

  success:
    # `!cancelled()` alone would still schedule this job onto the self-hosted runner
    # for a fork PR whose upstream jobs all skipped, so the fork guard is repeated here.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - test
      - diff
    name: Flate - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
