---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flate

# Called by ci.yaml, which owns the trigger and concurrency; its `CI Success` is the required check.
on:
  workflow_call:
    # Explicit, not `secrets: inherit`: the caller (ci.yaml) passes only these two.
    secrets:
      BOT_APP_ID:
        required: true
      BOT_APP_PRIVATE_KEY:
        required: true

permissions:
  contents: read

env:
  # Pinned exactly: the action's SHA-ref lookup falls back to "latest" when the tags API
  # call fails, so the `version:` input is what makes the binary reproducible.
  # Keep in step with the action pin on the `uses:` lines.
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: 0.6.5

jobs:
  filter:
    # Fork guard, mirrors labeler.yaml: fork PRs skip Flate (the diff job needs the bot app secret).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Flate - Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Test
    runs-on: ubuntu-latest
    # Headroom sized on the old ARC pool (CPU contention), kept on ubuntu-latest.
    timeout-minutes: 15
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Only used as the checkout token below, which reads repository contents.
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      # Empty base: otherwise the action exports FLATE_BASE and `flate test all` goes changed-only.
      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # No retry loop: flate retries source fetches itself, so a failure here is real.
      - name: Run flate test
        run: |
          flate test all \
            --path kubernetes/clusters/main \
            --no-progress

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flate - Diff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - hr
          - ks
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Checkout reads contents; the sticky comment step posts the diff on the PR.
          permission-contents: read
          permission-pull-requests: write

      # fetch-depth: 0 makes origin/<default> resolvable for --base.
      - name: Checkout Pull Request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # --strip-attr is omitted on purpose: passing any value REPLACES flate's default set.
      - name: Run flate diff
        env:
          RESOURCE: ${{ matrix.resource }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          flate diff "${RESOURCE}" \
            --path kubernetes/clusters/main \
            --base "origin/${DEFAULT_BRANCH}" \
            --no-progress \
            --output diff > diff.patch

      # 60000 bytes stays under GitHub's 65536-character comment limit. `head -c` (portable).
      - name: Truncate Diff
        id: diff
        run: |-
          if [ "$(wc -c < diff.patch)" -gt 60000 ]; then
            head -c 60000 diff.patch > diff.patch.tmp
            mv diff.patch.tmp diff.patch
          fi
          if [ -s diff.patch ]; then
            echo 'has-diff=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.diff.outputs.has-diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          path: diff.patch
          message: |-
            ```diff
            {{{content}}}
            ```

  success:
    # The fork guard is repeated so a fork PR whose upstream jobs all skipped does not run this.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    # Need filter too: when it fails, test and diff are skipped, and a Success job
    # without it would see only "skipped" and green-check a red run.
    needs:
      - filter
      - test
      - diff
    name: Flate - Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
