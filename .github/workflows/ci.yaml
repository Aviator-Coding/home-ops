---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# The one required PR check: `CI Success` (goal D1). It calls Flate and Validate on
# GitHub-hosted runners, so it reports while the cluster and its ARC runners are down.
# Image Pull and the AI review stay on ARC and stay advisory. Pin:
# scripts/ci/ci-success-workflow-test.py. Skill `github-ci`.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ci-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flate:
    uses: ./.github/workflows/flate.yaml
    # Only the flate diff job comments on the PR; a called workflow cannot exceed the caller's grant.
    permissions:
      contents: read
      pull-requests: write
    secrets:
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_PRIVATE_KEY: ${{ secrets.BOT_APP_PRIVATE_KEY }}

  # validate.yaml reads no secret, so it gets none.
  validate:
    uses: ./.github/workflows/validate.yaml

  success:
    # always(), not !cancelled(): GitHub counts a skipped required check as passing, so a
    # cancelled or superseded run must post red here, never skip. A skipped workflow (path
    # filters found nothing) passes; failed or cancelled fails.
    if: ${{ always() }}
    needs:
      - flate
      - validate
    name: CI Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Fork PRs skip every job (fork guard), so a green result would mean nothing ran.
      # Re-run the change from a same-repo branch (skill `github-ci`).
      - name: Fork PR?
        if: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          echo "Fork PRs are not tested here; push the branch to this repo to run CI."
          exit 1

      - name: Any workflow failed or cancelled?
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs.*.result) }}'
          exit 1

      - name: All workflows passed or skipped
        if: ${{ !(contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
        run: echo '${{ toJSON(needs.*.result) }}'
