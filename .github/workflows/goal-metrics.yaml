---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Daily D2/D3 evidence for docs/goals/2026-10-30-agent-maintainable-home-ops.md: appends
# one row to the issue "Goal metrics: agent-maintainable home-ops" (the owner pins it).
# Script: scripts/ci/goal_metrics.py, tested by scripts/ci/goal-metrics-test.py.
name: Goal Metrics

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

jobs:
  metrics:
    name: Goal metrics
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record today's row
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/ci/goal_metrics.py
