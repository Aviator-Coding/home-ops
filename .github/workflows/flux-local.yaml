---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Flux Local

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    # Fork guard. This job and `success` below run on the self-hosted runner, which
    # holds node-level Talos credentials. The `test` and `diff` jobs are ubuntu-latest
    # but hang off `needs: filter`, so a fork PR skips the whole workflow rather than
    # running any of it here. Mirrors labeler.yaml; same-repo PRs are unaffected.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Flux Local - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  test:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Test
    # Not migrated to the local runner: this job uses `docker://...` container actions
    # (flux-local), which need a Docker daemon. The local ARC runner pod has none (no
    # docker.sock, no DinD sidecar) - confirmed by a live PR run failing with "failed to
    # connect to the docker API at unix:///var/run/docker.sock". See
    # kubernetes/apps/actions-runner-system/TROUBLESHOOTING.md.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Run flux-local test
        uses: docker://ghcr.io/allenporter/flux-local:v8.2.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          HELM_TIMEOUT: "300"
        with:
          args: >-
            test
            --all-namespaces
            --enable-helm
            --path /github/workspace/kubernetes/flux/cluster
            --verbose

  diff:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Flux Local - Diff
    # Not migrated: same docker:// container-action / no-Docker-daemon gap as the Test job above.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        resource:
          - helmrelease
          - kustomization
      fail-fast: false
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout Pull Request Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: pull
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Checkout Default Branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: default
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Run flux-local diff
        uses: docker://ghcr.io/allenporter/flux-local:v8.2.0
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          HELM_TIMEOUT: "300"
        with:
          args: >-
            diff ${{ matrix.resource }}
            --unified 6
            --path /github/workspace/pull/kubernetes/flux/cluster
            --path-orig /github/workspace/default/kubernetes/flux/cluster
            --strip-attrs "helm.sh/chart,checksum/config,app.kubernetes.io/version,chart"
            --limit-bytes 10000
            --all-namespaces
            --sources "flux-system"
            --output-file diff.patch

      - name: Truncate Diff
        id: diff
        run: |-
          truncate --size='<60000' diff.patch
          if [ -s diff.patch ]; then
            echo 'has-diff=true' >> "$GITHUB_OUTPUT"
          fi

      - if: ${{ steps.diff.outputs.has-diff == 'true' }}
        name: Add Comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          header: ${{ github.event.pull_request.number }}/kubernetes/${{ matrix.resource }}
          path: diff.patch
          message: |-
            ```diff
            {{{content}}}
            ```

  success:
    # `!cancelled()` alone would still schedule this job onto the self-hosted runner
    # for a fork PR whose upstream jobs all skipped, so the fork guard is repeated here.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - test
      - diff
    name: Flux Local - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
