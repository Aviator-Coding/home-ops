---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# The non-blocking scripts/ci tests: every file with neither `# ci: gate` nor `# ci: nightly`.
# Its own workflow because ci.yaml calls validate.yaml as a reusable workflow, and CI Success
# cannot report until every job in a called workflow ends: as a validate.yaml job this one held
# CI Success for its whole run although it never gated. Never a required check.
# Pins: scripts/ci/ci-test-gate-test.py, scripts/ci/validate-contention-test.py. Skill `github-ci`.
name: Advisory Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  filter:
    # Fork guard, same as validate.yaml: a fork PR skips this job and, through `needs`, the tests.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Advisory Tests - Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      pythontests: ${{ steps.pythontests.outputs.changed_files }}
    steps:
      # The pythontests list from validate.yaml, plus this file.
      - name: Python Regression Test Changes
        id: pythontests
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            scripts/ci/**
            AGENTS.md
            docs/**
            .agents/skills/**
            .claude/skills
            .claude/skills/**
            .claude/hooks/**
            .claude/settings.json
            .github/*.md
            kubernetes/components/**
            kubernetes/apps/base/**
            kubernetes/apps/main/**
            .github/workflows/validate.yaml
            .github/workflows/ci.yaml
            .github/workflows/flate.yaml
            .mise.toml
            .github/workflows/advisory-tests.yaml

  python-tests-advisory:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.pythontests != '[]' }}
    needs: filter
    name: python-tests-advisory
    # Advisory: never blocks a PR. Owner decision 2026-10-31
    # (docs/goals/2026-10-30-agent-maintainable-home-ops.md). P3 keeps or deletes each test.
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node runs docs/tdarr/flow-nodes/behavior-test.js via scripts/ci/tdarr-flow-nodes-test.py
      # (Tdarr safe-transcode recovery harness) and drives renovate for talos-renovate-pin-test.py.
      # Same setup-node pin as validate.yaml renovate-config; pinned rather than the runner image's Node.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"

      # kubectl/kustomize/helm/opentofu are what the tests shell out to (kubectl kustomize,
      # helm template) to render the real manifests they assert on; python/uv provision the
      # interpreter and the extra libraries these tests need beyond the stdlib.
      # promtool (from aqua:prometheus/prometheus) runs real PromQL rule-evaluation for
      # grafana-sa-provisioner-test.py - this runner has no podman/container runtime.
      # minijinja-cli renders talos/schematic.yaml.j2 the same way the talos job / just recipes do.
      # Versions come from .mise.toml, same pattern as the validate.yaml talos/terraform jobs.
      # Do not add @version here: mise-action then installs a different copy than
      # the shim looks up (Renovate PR #1601: prometheus 3.14.0 vs leftover @3.2.1,
      # which failed python-tests on every PR with "No version is set for shim:
      # promtool"). Pinned by scripts/ci/mise-install-args-test.py.
      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv kubectl opentofu aqua:helm/helm aqua:kubernetes-sigs/kustomize aqua:prometheus/prometheus aqua:mitsuhiko/minijinja
          # Off: PR caches land per refs/pull/*/merge, are never shared, none exist on main; measured no speedup.
          cache: false

      # talos-renovate-pin-test.py drives renovate@44.52.1's own
      # getRegexPredicate/filterVersions/isStable/applyPackageRules (not a source grep).
      # The package is pinned to the version that test was verified against so CI does not
      # drift onto a different compiled API.
      - name: Install renovate for pin tests
        run: |
          mkdir -p /tmp/renovate-ci
          npm install --prefix /tmp/renovate-ci --no-save --no-package-lock renovate@44.52.1
          echo "RENOVATE_NODE_PATH=/tmp/renovate-ci/node_modules/renovate" >> "${GITHUB_ENV}"

      # litellm[proxy] matches the pinned cluster image
      # (ghcr.io/berriai/litellm-non_root, see
      # kubernetes/apps/base/ai/litellm/app/litellmproxy.yaml) so the auto-router and
      # request-logs tests exercise the real library the proxy runs, not a stub. This makes
      # the job slower than the others on purpose - do not soft-skip it to save time.
      #
      # The customManager regex only captures a value on the line after a
      # `datasource=` comment when that line contains `: ` or `=`, and this
      # package's docker versioning regex requires a vX.Y.Z tag. A pip
      # `litellm[proxy]==<version>` line cannot be that capture (no `v`, and the
      # quotes stick to the value), so the tracked tag lives in LITELLM_VERSION
      # and the install strips the leading v. Do not edit the customManager to
      # special-case this line.
      - name: Install Python Test Dependencies
        env:
          # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root
          LITELLM_VERSION: v1.106.6
        run: |
          uv pip install --system python-hcl2 "litellm[proxy]==${LITELLM_VERSION#v}"

      # Each file is a standalone script, not a pytest module: main() calls its own
      # test_* functions and prints [PASS]/[FAIL] lines itself. See scripts/ci/README.md.
      # MINIJINJA_CONFIG_FILE is set by .mise.toml via mise-action env; schematic render
      # needs it the same way just talos / talos-validate.sh do.
      # `# ci: nightly` files call the network; they run in nightly-tests.yaml, not on PRs (goal D2).
      # The three docs guards are excluded: validate.yaml's docs-guards job owns them.
      # mapfile + count check, as in python-tests: a process substitution's exit status is
      # ignored, so an empty or failed grep would otherwise run zero tests and pass.
      - name: Run advisory scripts/ci tests
        run: |
          mapfile -t tests < <(grep -LxE '# ci: (gate|nightly)' scripts/ci/*-test.py \
            | grep -vE '/(docs-budget|doc-links|functional-comments-guard)-test\.py$')
          if (( ${#tests[@]} == 0 )); then
            echo "FAILED: no advisory scripts/ci tests selected"
            exit 1
          fi
          fail=0
          for f in "${tests[@]}"; do
            echo "::group::${f}"
            if ! python3 "${f}" </dev/null; then
              echo "FAILED: ${f}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"
