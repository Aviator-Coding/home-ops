---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# CI for talos/, bootstrap/, .renovate/ and terraform/. No trigger-level paths filter, so Validate - Success always posts. talosctl validate and the terraform job are schema-only; live read-only plans are terraform-diff.yaml.
# Runs on GitHub-hosted ubuntu-latest through ci.yaml (since 2026-10-31), so it works while the cluster and its ARC runners are down. Pin: scripts/ci/ci-success-workflow-test.py.
# Skill `github-ci` references/workflows.md. Apply stays behind an explicit go-ahead. Skill `authentik-terraform` references/apply-runbook.md.
name: Validate

# Called by ci.yaml, which owns the trigger and concurrency; its `CI Success` is the required check.
on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  # Per-job path filtering: each `filter` step below is now the *only* path
  # decision (no trigger-level `paths:` - see the header above), so without
  # this a `.renovate/`-only PR would also run the Talos jobs.
  # Same pattern as flate.yaml / image-pull.yaml.
  filter:
    # Fork guard: a fork PR skips this job and, through `needs: filter`, every job below it
    # that has no `always()`. Only `docs-guards` and `lint` (both pinned by tests), `python-tests`
    # (`always()`) and `success` (`!cancelled()`) carry their own copy. Same-repo PRs are unaffected. Mirrors labeler.yaml.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Validate - Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      talos: ${{ steps.talos.outputs.changed_files }}
      versions: ${{ steps.versions.outputs.changed_files }}
      bootstrap: ${{ steps.bootstrap.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
      terraform: ${{ steps.terraform.outputs.changed_files }}
      pythontests: ${{ steps.pythontests.outputs.changed_files }}
    steps:
      - name: Talos Changes
        id: talos
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            talos/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/talos-validate.sh

      - name: Version Pin Changes
        id: versions
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            talos/**
            kubernetes/apps/base/system-upgrade/**
            kubernetes/apps/main/system-upgrade/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/version-consistency.sh

      - name: Bootstrap Changes
        id: bootstrap
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            bootstrap/**
            .github/workflows/validate.yaml
            .mise.toml

      - name: Renovate Config Changes
        id: renovate
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            .renovaterc.json5
            .renovate/**
            .github/workflows/validate.yaml

      - name: Terraform Changes
        id: terraform
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            terraform/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/tofu-validate.sh

      - name: Python Regression Test Changes
        id: pythontests
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: |-
            scripts/ci/**
            AGENTS.md
            docs/**
            .agents/skills/**
            .claude/skills
            .claude/skills/**
            .claude/hooks/**
            .claude/settings.json
            .github/*.md
            kubernetes/components/**
            kubernetes/apps/base/**
            kubernetes/apps/main/**
            .github/workflows/validate.yaml
            .github/workflows/ci.yaml
            .github/workflows/flate.yaml
            .mise.toml

  talos:
    if: ${{ needs.filter.outputs.talos != '[]' }}
    needs: filter
    name: talos
    runs-on: ubuntu-latest
    # 25m: sized for ARC contention (Setup Tools stalled past 10m, PR #1481); kept as headroom.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # minijinja-cli and talosctl come from .mise.toml so CI renders with the same
      # versions `just talos render-config` uses locally.
      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: aqua:mitsuhiko/minijinja aqua:siderolabs/talos aqua:mikefarah/yq
          # Off: PR caches land per refs/pull/*/merge, are never shared, none exist on main; measured no speedup.
          cache: false

      - name: Render and Validate Talos Configs
        run: ./scripts/ci/talos-validate.sh

  versions:
    if: ${{ needs.filter.outputs.versions != '[]' }}
    needs: filter
    name: versions
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: aqua:mikefarah/yq
          cache: false

      - name: Check Machineconfig Versions Against tuppr CRs
        run: ./scripts/ci/version-consistency.sh

  bootstrap:
    if: ${{ needs.filter.outputs.bootstrap != '[]' }}
    needs: filter
    name: bootstrap
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform
          cache: false

      # Covers the kustomize half of bootstrap/ only. bootstrap/helmfile/ renders
      # through vals against 1Password, which CI has no credentials for, so it stays
      # unvalidated here. The value is that `just bootstrap cluster` is DR-only: a
      # broken kustomization would otherwise surface during a disaster, not before.
      - name: Validate Bootstrap Kustomize Output
        run: |
          kustomize build bootstrap/kustomize/apps \
            | kubeconform -strict -summary -schema-location default

  renovate-config:
    if: ${{ needs.filter.outputs.renovate != '[]' }}
    needs: filter
    name: renovate-config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24" # renovate requires node ^24; npx falls back to an old release on 26

      # Unpinned on purpose: renovate.yaml runs `renovate-version: latest`, so the
      # config has to be valid against whatever Renovate is current, not against a
      # version this workflow froze months ago.
      - name: Validate Renovate Config
        run: npx --yes --package renovate renovate-config-validator .renovaterc.json5 .renovate/*.json5

  terraform:
    if: ${{ needs.filter.outputs.terraform != '[]' }}
    needs: filter
    name: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # opentofu comes from .mise.toml so CI validates with the same version the
      # runbook tells an operator to plan with.
      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: opentofu
          cache: false

      # Credential-less schema check. Live read-only plans are terraform-diff.yaml. Skill `authentik-terraform` references/ci-plan.md.
      - name: Format and Validate OpenTofu Stacks
        run: ./scripts/ci/tofu-validate.sh

  # Repo-wide docs guards: absolute size budgets, doc/skill link checker, and the
  # yaml-language-server/renovate comment-line guard. They read the whole tree,
  # so unlike the jobs above this one has no path filter and runs on every
  # same-repo PR (stdlib only, no pip). Full history gives the comment guard
  # its merge base. advisory-tests.yaml skips them, so this is their only PR run.
  docs-guards:
    # Guard kept here: validate-contention-test.py pins it on this job.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: filter
    name: docs-guards
    runs-on: ubuntu-latest
    # Same mise-action Setup Tools class as talos (see the header).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv
          cache: false

      - name: Run Docs Guards
        env:
          DIFF_GUARD_BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          fail=0
          for f in scripts/ci/docs-budget-test.py scripts/ci/doc-links-test.py scripts/ci/functional-comments-guard-test.py; do
            echo "::group::${f}"
            python3 "${f}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"

  # Standard linters over the whole tree (no path filter, like docs-guards): yamllint,
  # actionlint, zizmor and shellcheck. Tool versions come from .mise.toml, so install_args
  # names the tools only (scripts/ci/mise-install-args-test.py). yamlfmt is pre-commit only.
  lint:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: filter
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv aqua:rhysd/actionlint pipx:zizmor aqua:koalaman/shellcheck pipx:yamllint
          cache: false

      - name: yamllint
        run: yamllint -s .

      - name: actionlint
        run: actionlint

      - name: zizmor
        run: zizmor --offline --min-severity medium .github/workflows

      # xargs -0 instead of `shellcheck $(git ls-files ...)`: unquoted expansion is itself SC2046.
      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 shellcheck

  python-tests:
    # The PR gate: only scripts/ci files marked `# ci: gate` (at most 15, each naming
    # the data loss or outage it prevents; scripts/ci/ci-test-gate-test.py enforces it).
    # Every other test runs in advisory-tests.yaml. always() keeps this job running
    # when a sibling is skipped or failed; filter must still have succeeded.
    if: ${{ always() && !cancelled() && needs.filter.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.pythontests != '[]' }}
    needs:
      - filter
    name: python-tests
    runs-on: ubuntu-latest
    # Same 25m floor as the other mise jobs (sized on ARC, PR #1481; kept as headroom).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Only what gate files call: kubectl/kustomize, promtool, jq (pvc-mover-readable-check
      # SKIPs its CronJob-script cases without jq). Versions from .mise.toml; do not add
      # @version here (scripts/ci/mise-install-args-test.py).
      - name: Setup Tools
        uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          install_args: python uv kubectl aqua:kubernetes-sigs/kustomize aqua:prometheus/prometheus aqua:jqlang/jq
          cache: false

      # Gate tests are offline; boto3 is for volsync-retired-expiry-test.py.
      - name: Install Python Test Dependencies
        run: uv pip install --system pyyaml boto3

      # mapfile + count check: a process substitution's exit status is ignored, so an
      # empty or failed grep would otherwise run zero tests and pass.
      - name: Run gate scripts/ci tests
        run: |
          mapfile -t gates < <(grep -lx '# ci: gate' scripts/ci/*-test.py)
          if (( ${#gates[@]} == 0 )); then
            echo "FAILED: no '# ci: gate' files found"
            exit 1
          fi
          fail=0
          for f in "${gates[@]}"; do
            echo "::group::${f}"
            if ! python3 "${f}" </dev/null; then
              echo "FAILED: ${f}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"

  success:
    # The fork guard is repeated so a fork PR whose upstream jobs all skipped does not run
    # this. ci.yaml's `CI Success` reads this job's result through the workflow call; it
    # always posts (success-via-skip when every per-job filter found nothing relevant).
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - filter
      - talos
      - versions
      - bootstrap
      - renovate-config
      - terraform
      - docs-guards
      - lint
      - python-tests
    name: Validate - Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
