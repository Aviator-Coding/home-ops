---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# CI gates for the parts of this repo Flux never sees. `talos/`, `bootstrap/` and
# `.renovate/` are outside the `kubernetes/**` paths that Flux Local and Image Pull
# filter on, so before this workflow a PR touching only `talos/` ran exactly one
# check: the labeler.
#
# Scope, honestly:
#   - `talosctl validate` is a *schema* check. It catches render breakage and
#     machine-config keys Talos does not know. It does NOT catch invalid enum
#     values, malformed or wrong CIDRs, or a missing install disk - all three were
#     tested directly and pass validation. A green run here is not permission to
#     apply a config to a node; the dry-run, one-node-at-a-time discipline in
#     talos/AGENTS.md is what covers that.
#   - The `bootstrap` job covers `bootstrap/kustomize/` only. `bootstrap/helmfile/`
#     renders through vals against 1Password, which CI has no credentials for.
#   - The `terraform` job below is `tofu fmt` + `tofu validate` with
#     `-backend=false`: a pure schema check, no credential of any kind. It
#     cannot tell you whether a plan is destructive.
#     A real, read-only `tofu plan` against the live backend (and, for
#     authentik, the live Authentik API) now runs separately and unattended on
#     every same-repo pull request, in terraform-diff.yaml - a deliberate,
#     captain-approved change (2026-08-27) from this job's original "CI can
#     never reach the live instance" design. `tofu apply` is unaffected: it
#     remains fully behind the explicit captain-approval gate in
#     docs/authentik/terraform.md section 7. See that doc's section 9 for the
#     full reasoning and the one credential involved.
#   - The `python-tests` job runs every `scripts/ci/*-test.py` regression test
#     (semantic pins of captain decisions/invariants). Inventory, local setup,
#     and the deliberate litellm pin live in scripts/ci/README.md - not here.
name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - .github/workflows/validate.yaml
      - .mise.toml
      - .renovate/**
      - .renovaterc.json5
      - bootstrap/**
      - kubernetes/apps/base/system-upgrade/**
      - kubernetes/apps/main/system-upgrade/**
      - scripts/ci/**
      - talos/**
      - terraform/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-job path filtering. The workflow-level `paths:` above is the union of every
  # gate, so without this a `.renovate/`-only PR would also run the Talos jobs.
  # Same pattern as flux-local.yaml / image-pull.yaml.
  filter:
    # Fork guard. Every job in this workflow lands on the self-hosted runner, which
    # holds node-level Talos credentials, so PR-authored code from a fork must never
    # execute here. Mirrors labeler.yaml. Same-repo PRs are unaffected; a fork PR
    # skips this job and, through `needs: filter`, every job below it.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Validate - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      talos: ${{ steps.talos.outputs.changed_files }}
      versions: ${{ steps.versions.outputs.changed_files }}
      bootstrap: ${{ steps.bootstrap.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
      terraform: ${{ steps.terraform.outputs.changed_files }}
      pythontests: ${{ steps.pythontests.outputs.changed_files }}
    steps:
      - name: Talos Changes
        id: talos
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            talos/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/talos-validate.sh

      - name: Version Pin Changes
        id: versions
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            talos/**
            kubernetes/apps/base/system-upgrade/**
            kubernetes/apps/main/system-upgrade/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/version-consistency.sh

      - name: Bootstrap Changes
        id: bootstrap
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            bootstrap/**
            .github/workflows/validate.yaml
            .mise.toml

      - name: Renovate Config Changes
        id: renovate
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            .renovaterc.json5
            .renovate/**
            .github/workflows/validate.yaml

      - name: Terraform Changes
        id: terraform
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            terraform/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/tofu-validate.sh

      - name: Python Regression Test Changes
        id: pythontests
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            scripts/ci/**
            .github/workflows/validate.yaml
            .mise.toml

  talos:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.talos != '[]' }}
    needs: filter
    name: talos
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # minijinja-cli and talosctl come from .mise.toml so CI renders with the same
      # versions `just talos render-config` uses locally.
      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: aqua:mitsuhiko/minijinja aqua:siderolabs/talos aqua:mikefarah/yq

      - name: Render and Validate Talos Configs
        run: ./scripts/ci/talos-validate.sh

  versions:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.versions != '[]' }}
    needs: filter
    name: versions
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: aqua:mikefarah/yq

      - name: Check Machineconfig Versions Against tuppr CRs
        run: ./scripts/ci/version-consistency.sh

  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.bootstrap != '[]' }}
    needs: filter
    name: bootstrap
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform

      # Covers the kustomize half of bootstrap/ only. bootstrap/helmfile/ renders
      # through vals against 1Password, which CI has no credentials for, so it stays
      # unvalidated here. The value is that `just bootstrap cluster` is DR-only: a
      # broken kustomization would otherwise surface during a disaster, not before.
      - name: Validate Bootstrap Kustomize Output
        run: |
          kustomize build bootstrap/kustomize/apps \
            | kubeconform -strict -summary -schema-location default

  renovate-config:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.renovate != '[]' }}
    needs: filter
    name: renovate-config
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Unpinned on purpose: renovate.yaml runs `renovate-version: latest`, so the
      # config has to be valid against whatever Renovate is current, not against a
      # version this workflow froze months ago.
      - name: Validate Renovate Config
        run: npx --yes --package renovate renovate-config-validator .renovaterc.json5 .renovate/*.json5

  terraform:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.terraform != '[]' }}
    needs: filter
    name: terraform
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # opentofu comes from .mise.toml so CI validates with the same version the
      # runbook tells an operator to plan with.
      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: opentofu

      # No credentials are set for this step, deliberately: it stays a pure
      # schema check (`-backend=false`, `tofu validate` never calls the
      # Authentik API). A real plan against the live backend runs separately, in
      # terraform-diff.yaml (read-only, gated only by that workflow's fork
      # guard) - see docs/authentik/terraform.md section 9 for why that is
      # considered safe and `tofu apply` is not.
      - name: Format and Validate OpenTofu Stacks
        run: ./scripts/ci/tofu-validate.sh

  python-tests:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.pythontests != '[]' }}
    needs: filter
    name: python-tests
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # kubectl/kustomize/helm/opentofu are what the tests shell out to (kubectl kustomize,
      # helm template) to render the real manifests they assert on; python/uv provision the
      # interpreter and the two extra libraries these tests need beyond the stdlib.
      # promtool (from aqua:prometheus/prometheus) runs real PromQL rule-evaluation for
      # grafana-sa-provisioner-test.py - this runner has no podman/container runtime.
      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: python uv kubectl opentofu aqua:helm/helm aqua:kubernetes-sigs/kustomize aqua:prometheus/prometheus@3.2.1

      # litellm[proxy]==1.98.0 matches the pinned cluster image
      # (ghcr.io/berriai/litellm-non_root:v1.98.0, see
      # kubernetes/apps/base/ai/litellm/app/litellmproxy.yaml) so the auto-router and
      # request-logs tests exercise the real library the proxy runs, not a stub. This makes
      # the job slower than the others here on purpose - do not soft-skip it to save time.
      - name: Install Python Test Dependencies
        run: uv pip install --system python-hcl2 "litellm[proxy]==1.98.0"

      # Each file is a standalone script, not a pytest module: main() calls its own
      # test_* functions and prints [PASS]/[FAIL] lines itself. See scripts/ci/README.md.
      - name: Run scripts/ci Python Regression Tests
        run: |
          fail=0
          for f in scripts/ci/*-test.py; do
            echo "::group::${f}"
            if ! python3 "${f}"; then
              echo "FAILED: ${f}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"
