---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# CI for talos/, bootstrap/, .renovate/ and terraform/. No trigger-level paths filter, so Validate - Success always posts. talosctl validate and the terraform job are schema-only; live read-only plans are terraform-diff.yaml.
# A red check that passes on rerun is runner contention (PR #1481), not a slot shortage. Do not raise maxRunners, drop this file from the per-job filters, or serialize the jobs. Pin: scripts/ci/validate-contention-test.py.
# Skill `github-ci` references/workflows.md. Apply stays behind an explicit go-ahead. Skill `authentik-terraform` references/apply-runbook.md.
name: Validate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Per-job path filtering: each `filter` step below is now the *only* path
  # decision (no trigger-level `paths:` - see the header above), so without
  # this a `.renovate/`-only PR would also run the Talos jobs.
  # Same pattern as flate.yaml / image-pull.yaml.
  filter:
    # Fork guard. Every job in this workflow lands on the self-hosted runner, which
    # holds node-level Talos credentials, so PR-authored code from a fork must never
    # execute here. Mirrors labeler.yaml. Same-repo PRs are unaffected; a fork PR
    # skips this job and, through `needs: filter`, every job below it.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Validate - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      talos: ${{ steps.talos.outputs.changed_files }}
      versions: ${{ steps.versions.outputs.changed_files }}
      bootstrap: ${{ steps.bootstrap.outputs.changed_files }}
      renovate: ${{ steps.renovate.outputs.changed_files }}
      terraform: ${{ steps.terraform.outputs.changed_files }}
      pythontests: ${{ steps.pythontests.outputs.changed_files }}
    steps:
      - name: Talos Changes
        id: talos
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            talos/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/talos-validate.sh

      - name: Version Pin Changes
        id: versions
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            talos/**
            kubernetes/apps/base/system-upgrade/**
            kubernetes/apps/main/system-upgrade/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/version-consistency.sh

      - name: Bootstrap Changes
        id: bootstrap
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            bootstrap/**
            .github/workflows/validate.yaml
            .mise.toml

      - name: Renovate Config Changes
        id: renovate
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            .renovaterc.json5
            .renovate/**
            .github/workflows/validate.yaml

      - name: Terraform Changes
        id: terraform
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            terraform/**
            .github/workflows/validate.yaml
            .mise.toml
            scripts/ci/tofu-validate.sh

      - name: Python Regression Test Changes
        id: pythontests
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: |-
            scripts/ci/**
            AGENTS.md
            docs/**
            .agents/skills/**
            .claude/skills
            .claude/skills/**
            .github/*.md
            kubernetes/components/**
            kubernetes/apps/base/ai/**
            kubernetes/apps/base/system/**
            kubernetes/apps/main/**
            .github/docker/litellm-pgvector/**
            .github/workflows/validate.yaml
            .mise.toml

  talos:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.talos != '[]' }}
    needs: filter
    name: talos
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # 25m: contention can stall Setup Tools past 10m. Skill `github-ci` references/workflows.md.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # minijinja-cli and talosctl come from .mise.toml so CI renders with the same
      # versions `just talos render-config` uses locally.
      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: aqua:mitsuhiko/minijinja aqua:siderolabs/talos aqua:mikefarah/yq

      - name: Render and Validate Talos Configs
        run: ./scripts/ci/talos-validate.sh

  versions:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.versions != '[]' }}
    needs: filter
    name: versions
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: aqua:mikefarah/yq

      - name: Check Machineconfig Versions Against tuppr CRs
        run: ./scripts/ci/version-consistency.sh

  bootstrap:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.bootstrap != '[]' }}
    needs: filter
    name: bootstrap
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: aqua:kubernetes-sigs/kustomize aqua:yannh/kubeconform

      # Covers the kustomize half of bootstrap/ only. bootstrap/helmfile/ renders
      # through vals against 1Password, which CI has no credentials for, so it stays
      # unvalidated here. The value is that `just bootstrap cluster` is DR-only: a
      # broken kustomization would otherwise surface during a disaster, not before.
      - name: Validate Bootstrap Kustomize Output
        run: |
          kustomize build bootstrap/kustomize/apps \
            | kubeconform -strict -summary -schema-location default

  renovate-config:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.renovate != '[]' }}
    needs: filter
    name: renovate-config
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # Unpinned on purpose: renovate.yaml runs `renovate-version: latest`, so the
      # config has to be valid against whatever Renovate is current, not against a
      # version this workflow froze months ago.
      - name: Validate Renovate Config
        run: npx --yes --package renovate renovate-config-validator .renovaterc.json5 .renovate/*.json5

  terraform:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.terraform != '[]' }}
    needs: filter
    name: terraform
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # opentofu comes from .mise.toml so CI validates with the same version the
      # runbook tells an operator to plan with.
      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: opentofu

      # Credential-less schema check. Live read-only plans are terraform-diff.yaml. Skill `authentik-terraform` references/ci-plan.md.
      - name: Format and Validate OpenTofu Stacks
        run: ./scripts/ci/tofu-validate.sh

  # Repo-wide docs guards: absolute size budgets, doc/skill link checker, and the
  # yaml-language-server/renovate comment-line guard. They read the whole tree,
  # so unlike the jobs above this one has no path filter and runs on every
  # same-repo PR (stdlib only, no pip). Full history gives the comment guard
  # its merge base. python-tests also runs them, but only on its own paths.
  docs-guards:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    needs: filter
    name: docs-guards
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # Same mise-action Setup Tools class as talos (see the header).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: python uv

      - name: Run Docs Guards
        env:
          DIFF_GUARD_BASE: origin/${{ github.event.repository.default_branch }}
        run: |
          fail=0
          for f in scripts/ci/docs-budget-test.py scripts/ci/doc-links-test.py scripts/ci/functional-comments-guard-test.py; do
            echo "::group::${f}"
            python3 "${f}" || fail=1
            echo "::endgroup::"
          done
          exit "${fail}"

  python-tests:
    # always() keeps this job running when a sibling is skipped (path-filter
    # miss) or failed; without it, needs: on skipped jobs would skip us too
    # and drop scripts/ci coverage. filter must still have succeeded. A
    # failed talos/versions/bootstrap/terraform/renovate-config must not hide
    # a python-tests failure. !cancelled() avoids work on a superseded run.
    if: ${{ always() && !cancelled() && needs.filter.result == 'success' && github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.pythontests != '[]' }}
    # After the light mise-action jobs so the litellm[proxy] pip install does not overlap their Setup Tools.
    needs:
      - filter
      - talos
      - versions
      - bootstrap
      - renovate-config
      - terraform
      - docs-guards
    name: python-tests
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # 20m is ~2.5x the contended success time (469s). Skill `github-ci` references/workflows.md.
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Node runs docs/tdarr/flow-nodes/behavior-test.js via
      # scripts/ci/tdarr-flow-nodes-test.py (Tdarr safe-transcode recovery harness).
      # Same setup-node pin as renovate-config; the ARC runner has no system Node.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      # kubectl/kustomize/helm/opentofu are what the tests shell out to (kubectl kustomize,
      # helm template) to render the real manifests they assert on; python/uv provision the
      # interpreter and the two extra libraries these tests need beyond the stdlib.
      # promtool (from aqua:prometheus/prometheus) runs real PromQL rule-evaluation for
      # grafana-sa-provisioner-test.py - this runner has no podman/container runtime.
      # minijinja-cli renders talos/schematic.yaml.j2 for schematic-pcie-port-pm-test.py the
      # same way the talos job / just recipes do (extraKernelArgs are Image Factory input).
      # Versions come from .mise.toml, same pattern as the talos/terraform jobs.
      # Do not add @version here: mise-action then installs a different copy than
      # the shim looks up (Renovate PR #1601: prometheus 3.14.0 vs leftover @3.2.1,
      # which failed python-tests on every PR with "No version is set for shim:
      # promtool"). Pinned by scripts/ci/mise-install-args-test.py.
      - name: Setup Tools
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: python uv kubectl opentofu aqua:helm/helm aqua:kubernetes-sigs/kustomize aqua:prometheus/prometheus aqua:mitsuhiko/minijinja

      # Node is required by talos-renovate-pin-test.py, which drives renovate@44.52.1's own
      # getRegexPredicate/filterVersions/isStable/applyPackageRules (not a source grep).
      # Same setup-node pin as renovate-config; the package is pinned to the version that
      # test was verified against so CI does not drift onto a different compiled API.
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Install renovate for pin tests
        run: |
          mkdir -p /tmp/renovate-ci
          npm install --prefix /tmp/renovate-ci --no-save --no-package-lock renovate@44.52.1
          echo "RENOVATE_NODE_PATH=/tmp/renovate-ci/node_modules/renovate" >> "${GITHUB_ENV}"

      # litellm[proxy] matches the pinned cluster image
      # (ghcr.io/berriai/litellm-non_root, see
      # kubernetes/apps/base/ai/litellm/app/litellmproxy.yaml) so the auto-router and
      # request-logs tests exercise the real library the proxy runs, not a stub. This makes
      # the job slower than the others here on purpose - do not soft-skip it to save time.
      #
      # The customManager regex only captures a value on the line after a
      # `datasource=` comment when that line contains `: ` or `=`, and this
      # package's docker versioning regex requires a vX.Y.Z tag. A pip
      # `litellm[proxy]==<version>` line cannot be that capture (no `v`, and the
      # quotes stick to the value), so the tracked tag lives in LITELLM_VERSION
      # and the install strips the leading v. Do not edit the customManager to
      # special-case this line.
      - name: Install Python Test Dependencies
        env:
          # renovate: datasource=docker depName=ghcr.io/berriai/litellm-non_root
          LITELLM_VERSION: v1.103.1
        run: |
          uv pip install --system python-hcl2 "litellm[proxy]==${LITELLM_VERSION#v}"

      # Each file is a standalone script, not a pytest module: main() calls its own
      # test_* functions and prints [PASS]/[FAIL] lines itself. See scripts/ci/README.md.
      # MINIJINJA_CONFIG_FILE is set by .mise.toml via mise-action env; schematic render
      # needs it the same way just talos / talos-validate.sh do.
      - name: Run scripts/ci Python Regression Tests
        run: |
          fail=0
          for f in scripts/ci/*-test.py; do
            echo "::group::${f}"
            if ! python3 "${f}"; then
              echo "FAILED: ${f}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "${fail}"

  success:
    # `!cancelled()` alone would still schedule this job onto the self-hosted runner
    # for a fork PR whose upstream jobs all skipped, so the fork guard is repeated here.
    # Same pattern as flate.yaml / image-pull.yaml `success` jobs: this is the single
    # check context safe to add to branch-protection required_status_checks, since it
    # always posts (success-via-skip when every per-job filter found nothing relevant).
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - filter
      - talos
      - versions
      - bootstrap
      - renovate-config
      - terraform
      - docs-guards
      - python-tests
    name: Validate - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
