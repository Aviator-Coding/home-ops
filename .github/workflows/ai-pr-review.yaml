---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Advisory AI PR review (misospace/pr-reviewer-action) on the in-cluster ARC runner against this
# cluster's LiteLLM proxy. INVARIANTS: advisory only (comment mode, no approve, never a required
# check); cannot spend money (zero-priced local pr-review-local, no routing escalation); fork PRs
# never run it. Key rotation has a second GitHub-secret step. See skill litellm-proxy
# (.agents/skills/litellm-proxy/references/pr-reviewer.md).
name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork guard plus draft skip (drafts are reviewed once marked ready).
  review:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft }}
    name: AI PR Review
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # Worst case ~385s per review (prefill + 2048 decode on the shared B70) plus one retry.
    timeout-minutes: 25
    permissions:
      contents: read
      # Only for the managed PR comment; nothing here submits a review.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the reviewer can diff against the base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Without the secret: one warning and a green skip, so this can merge inert.
      - name: Resolve Model Credential
        id: cred
        env:
          LITELLM_PR_REVIEW_KEY: ${{ secrets.LITELLM_PR_REVIEW_KEY }}
        run: |
          if [ -z "${LITELLM_PR_REVIEW_KEY}" ]; then
            echo "::warning::The LITELLM_PR_REVIEW_KEY repository secret is not set, so the AI review is being skipped. It holds the LiteLLM virtual key minted by kubernetes/apps/base/ai/litellm/app/virtualkeys/ai-pr-review.yaml and mirrored to the 1Password item litellm-consumer-ai-pr-review. See .agents/skills/litellm-proxy/references/pr-reviewer.md for the one-time setup and the two-step rotation."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=review" >> "$GITHUB_OUTPUT"

      - name: AI Review
        if: steps.cred.outputs.mode == 'review'
        uses: misospace/pr-reviewer-action@5b1839535748f3afd1bd3ef04e8009302cba9aa6 # v3.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Cluster-internal DNS; LiteLLM is never reached over the public listener. /v1 is required.
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: openai
          ai-model: pr-review-local
          ai-api-key: ${{ secrets.LITELLM_PR_REVIEW_KEY }}
          # Availability retry on the same free alias; the pinned action refuses to run if blank.
          ai-fallback-model: pr-review-local

          # Far below the served 262144 on purpose: bounds one review to ~6.5 min of shared GPU.
          model-context-tokens: "65536"
          ai-max-tokens: "2048"

          # Upstream advice for LiteLLM endpoints (json_schema makes some models emit one-line walls).
          ai-response-format: json_object

          # Homelab profile: fail fast on a dead B70, one retry for a blip.
          ai-connect-timeout-sec: "10"
          ai-request-timeout-sec: "600"
          ai-primary-retries: "1"
          ai-primary-retry-delay-sec: "10"
          # A GPU outage posts a notice comment instead of a red check.
          on-model-failure: notice

          # Explicit: the default picks AGENTS.md, which the action would truncate at 16000 bytes.
          standards-file: .github/ai-review-rules.md

          # Advisory only (see header).
          publish-review-comment: "true"
          publish-mode: comment
          approve-forks: "false"
          fail-on-request-changes: "false"
          inline-findings: "false"

          # Everything that could reach outward or escalate, pinned off against upstream default flips.
          review-routing-mode: "off"
          tool-mode: "off"
          evidence-providers-file: ""
          linear-api-key: ""
          search-url: ""
          tool-enable-for-forks: "false"
          evidence-enable-for-forks: "false"
          linear-enable-for-forks: "false"

          # Cost containment: unchanged diffs skip the model call (v3 reviews every changed push in full).
          skip-if-diff-unchanged: "true"
          force-review: "false"

          # v3 flipped these defaults; pinned back to the v2 advisory posture.
          verdict-policy: model
          deep-review: "false"
          ci-status-check: "false"
