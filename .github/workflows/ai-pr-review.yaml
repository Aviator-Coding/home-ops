---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Advisory AI PR review (misospace/pr-reviewer-action) on the in-cluster ARC runner against this
# cluster's LiteLLM proxy. INVARIANTS: advisory (comment mode, no approve, never a required check;
# its own check fails only when the Jev gate step finds a blocker); spend is bounded to Jev
# decisions (fractions of a cent per PR, key budget $5/30d); the review text cannot spend money (zero-priced local pr-review-local, no routing escalation); fork PRs
# never run it. Key rotation has a second GitHub-secret step. See skill litellm-proxy
# (.agents/skills/litellm-proxy/references/pr-reviewer.md).
name: AI PR Review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Fork guard plus draft skip (drafts are reviewed once marked ready). Renovate's own digest and
  # patch PRs are skipped too: they were most of the jobs holding ARC runners while they waited
  # for the single local model (2026-10-31: 106 Renovate runs in one hour, reviews up to 20 min),
  # and the risk tier and CI Success already gate them. Minor and major bumps are still reviewed.
  review:
    if: >-
      ${{ github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !(github.event.pull_request.user.login == 'mortyops[bot]'
           && (contains(github.event.pull_request.labels.*.name, 'type/digest')
               || contains(github.event.pull_request.labels.*.name, 'type/patch'))) }}
    name: AI PR Review
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    # Worst case ~385s per review (prefill + 2048 decode on the shared B70) plus one retry.
    timeout-minutes: 25
    permissions:
      contents: read
      # Only for the managed PR comment; nothing here submits a review.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the reviewer can diff against the base.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # Without the secret: one warning and a green skip, so this can merge inert.
      - name: Resolve Model Credential
        id: cred
        env:
          LITELLM_PR_REVIEW_KEY: ${{ secrets.LITELLM_PR_REVIEW_KEY }}
        run: |
          if [ -z "${LITELLM_PR_REVIEW_KEY}" ]; then
            echo "::warning::The LITELLM_PR_REVIEW_KEY repository secret is not set, so the AI review is being skipped. It holds the LiteLLM virtual key minted by kubernetes/apps/base/ai/litellm/app/virtualkeys/ai-pr-review.yaml and mirrored to the 1Password item litellm-consumer-ai-pr-review. See .agents/skills/litellm-proxy/references/pr-reviewer.md for the one-time setup and the two-step rotation."
            echo "mode=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "mode=review" >> "$GITHUB_OUTPUT"

      - name: AI Review
        if: steps.cred.outputs.mode == 'review'
        uses: misospace/pr-reviewer-action@5b1839535748f3afd1bd3ef04e8009302cba9aa6 # v3.7.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

          # Cluster-internal DNS; LiteLLM is never reached over the public listener. /v1 is required.
          ai-base-url: http://litellm.ai.svc.cluster.local:4000/v1
          ai-api-format: openai
          ai-model: pr-review-local
          ai-api-key: ${{ secrets.LITELLM_PR_REVIEW_KEY }}
          # Availability retry on the same free alias; the pinned action refuses to run if blank.
          ai-fallback-model: pr-review-local

          # Far below the served 262144 on purpose: bounds one review to ~6.5 min of shared GPU.
          model-context-tokens: "65536"
          ai-max-tokens: "2048"

          # Upstream advice for LiteLLM endpoints (json_schema makes some models emit one-line walls).
          ai-response-format: json_object

          # Homelab profile: fail fast on a dead B70, one retry for a blip.
          ai-connect-timeout-sec: "10"
          ai-request-timeout-sec: "600"
          ai-primary-retries: "1"
          ai-primary-retry-delay-sec: "10"
          # A GPU outage posts a notice comment instead of a red check.
          on-model-failure: notice

          # Explicit: the default picks AGENTS.md, which the action would truncate at 16000 bytes.
          standards-file: .github/ai-review-rules.md

          # Advisory only (see header).
          publish-review-comment: "true"
          publish-mode: comment
          approve-forks: "false"
          # The local model writes the review text only; the Jev gate step below decides
          # the check (goal task 2.4: the local model missed 3 of 5 seeded blockers).
          fail-on-request-changes: "false"
          inline-findings: "false"

          # Everything that could reach outward or escalate, pinned off against upstream default flips.
          review-routing-mode: "off"
          tool-mode: "off"
          evidence-providers-file: ""
          linear-api-key: ""
          search-url: ""
          tool-enable-for-forks: "false"
          evidence-enable-for-forks: "false"
          linear-enable-for-forks: "false"

          # Cost containment: unchanged diffs skip the model call (v3 reviews every changed push in full).
          skip-if-diff-unchanged: "true"
          force-review: "false"

          # v3 flipped these defaults; pinned back to the v2 advisory posture.
          verdict-policy: model
          deep-review: "false"
          ci-status-check: "false"

      # Blocking gate: Jev (decision model) answers one yes/no question per blocker rule. It runs
      # main's copy of the script, not the PR's (a PR can still edit this workflow file; the check
      # is advisory and .github/workflows/** is risk:high). Exit 2 (could not decide) passes with a
      # notice, like the local model's outage notice. Calibration: goal §8 (D6).
      - name: Blocking gate (Jev)
        if: ${{ !cancelled() && steps.cred.outputs.mode == 'review' }}
        env:
          LITELLM_KEY: ${{ secrets.LITELLM_PR_REVIEW_KEY }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if ! git show "origin/main:scripts/ci/ai_review_gate.py" > "${RUNNER_TEMP}/ai_review_gate.py" 2>/dev/null; then
            echo "::notice::main has no scripts/ci/ai_review_gate.py yet; the AI review passes without the gate."
            exit 0
          fi
          rc=0
          python3 "${RUNNER_TEMP}/ai_review_gate.py" --base "${BASE}" --head "${HEAD}" > gate.txt || rc=$?
          { echo '```'; cat gate.txt; echo '```'; } >> "${GITHUB_STEP_SUMMARY}"
          cat gate.txt
          if [ "${rc}" = 2 ]; then
            echo "::notice::The Jev gate could not decide; the AI review passes without it."
            exit 0
          fi
          exit "${rc}"
