---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # Keep in-flight runs: cancelling mid-`talosctl image pull` wastes node I/O and the 4-attempt retry budget.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with the action pin on the `uses:` line and with flate.yaml.
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: 0.6.1

jobs:
  filter:
    # Fork guard. The `pull` job below runs `talosctl image pull` against a real node
    # with credentials mounted by the cluster, so PR-authored code from a fork must
    # never reach this runner. Mirrors labeler.yaml. Same-repo PRs are unaffected.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Image Pull - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  images:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Resolve New Images
    # Runs on the local ARC runner: flate is a static Go binary, so the Docker
    # daemon flux-local's container action needed is no longer required. This one
    # job replaces the former `extract` (a 2-way branch matrix, each rendering the
    # whole cluster) plus `diff` (jq set subtraction) pair.
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 15
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      # Single checkout: flate's --base materializes the baseline tree from git,
      # replacing the former per-branch checkout matrix. fetch-depth: 0 is what
      # makes origin/<default> resolvable.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup flate
        uses: home-operations/flate/action@83b2308bc71043482a2f4e849a74b0a53cc1e014 # v0.6.1
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      # No retry loop, no `--network host`, no HOME/XDG_CACHE_HOME override, and no
      # embedded Python: those all existed to work around running flux-local as a
      # non-root Docker container (intermittent TLS resets through the docker
      # bridge, Helm 4 cache permissions, and reaching a flux-local ContextVar that
      # had no env var). flate has bounded source-fetch retry of its own.
      - name: Resolve New Images
        id: resolve
        run: |
          set -euo pipefail
          BASE="origin/${{ github.event.repository.default_branch }}"

          # Images this PR adds, as flate reports them.
          flate diff images \
            --path kubernetes/clusters/main \
            --base "${BASE}" \
            --no-progress \
            --output json > new-images.json

          # flate's image detector deliberately requires a "/" in the reference
          # (isImageRef in pkg/image/image.go, on the assumption that bare-name
          # references "aren't seen in production GitOps manifests"), so bare
          # Docker Hub official images are never reported. This cluster has four
          # -- e.g. `docker:29-dind` in the ai-k8s-sandbox runner -- and at least
          # one is Renovate-managed, so without this recovery a bump to it would
          # silently stop being pre-pulled. Read them off the changed-only render
          # instead. Scoped to a literal `image:` key, so it cannot pick up the
          # PromQL/RBAC strings flate's own general string walk is guarding
          # against. It may re-list an unchanged bare image that happens to sit in
          # the changed subtree; pulling an already-present image is cheap, and
          # the whole bare-image population here is four.
          flate build all \
            --path kubernetes/clusters/main \
            --base "${BASE}" \
            --no-progress \
            --output yaml > changed.yaml
          grep -oE '^[[:space:]]+image: [^/[:space:]]+:[^[:space:]]+$' changed.yaml \
            | awk '{print $2}' | sort -u > bare-images.txt || true

          images=$(jq --compact-output --rawfile bare bare-images.txt \
            '. + ($bare | split("\n") | map(select(length > 0))) | unique' \
            new-images.json)
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          echo '## New images to pull' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo "${images}" | jq >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  pull:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.images.outputs.images != '[]' }}
    needs: images
    name: Image Pull - Pull Images
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.images.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
      TALOSCTL_VERSION: "1.12.0"
    steps:
      - name: Verify talosctl (pre-installed via init container)
        run: |
          if command -v talosctl &> /dev/null; then
            echo "talosctl is pre-installed"
            talosctl version --client
          else
            echo "talosctl not found, installing..."
            curl -fsSL https://talos.dev/install | sh
            talosctl version --client
          fi

      # This retry is NOT a flux-local workaround: it absorbs transient failures
      # talking to a real Talos node, and stays.
      - name: Pull Image
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Attempt $attempt/4: talosctl image pull..."
            if talosctl --nodes $NODE image pull "${MATRIX_IMAGE}"; then
              echo "::endgroup::"
              echo "✓ Image pulled successfully"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 4 ]; then
              wait_time=$((20 * attempt))
              echo "✗ Attempt $attempt failed. Waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "::error::Failed to pull image after 4 attempts"
          exit 1

  success:
    # `!cancelled()` alone would still schedule this job onto the self-hosted runner
    # for a fork PR whose upstream jobs all skipped, so the fork guard is repeated here.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    # Need images as well as pull: when images fails, pull is skipped, and a
    # needs:pull-only Success job would see only "skipped" and green-check a red run.
    needs:
      - images
      - pull
    name: Image Pull - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
