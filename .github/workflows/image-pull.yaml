---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  # Keep in-flight runs: cancelling mid-`talosctl image pull` wastes node I/O and the 4-attempt retry budget.
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Keep in step with the action pin on the `uses:` line and with ci.yaml.
  # renovate: datasource=github-releases depName=home-operations/flate
  FLATE_VERSION: 0.6.5

jobs:
  filter:
    # Fork guard, mirrors labeler.yaml: `pull` runs `talosctl image pull` against a real node with cluster credentials.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Image Pull - Filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@147be9638332cf68fd60714a610509d7a9360d60 # v0.7.0
        with:
          patterns: kubernetes/**/*

  images:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Resolve New Images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      images: ${{ steps.resolve.outputs.images }}
    steps:
      # fetch-depth: 0 makes origin/<default> resolvable for --base.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup flate
        uses: home-operations/flate/action@631b76b69c4e58c6f4d1cb01e23616fa61aebafa # v0.6.5
        with:
          version: ${{ env.FLATE_VERSION }}
          base: ""

      - name: Resolve New Images
        id: resolve
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          BASE="origin/${DEFAULT_BRANCH}"

          # Images this PR adds, as flate reports them.
          flate diff images \
            --path kubernetes/clusters/main \
            --base "${BASE}" \
            --no-progress \
            --output json > new-images.json

          # flate skips bare Docker Hub references (no "/", e.g. `docker:29-dind`),
          # so recover them from a literal `image:` key in the changed-only render.
          # It may re-list an unchanged bare image; re-pulling one is cheap.
          flate build all \
            --path kubernetes/clusters/main \
            --base "${BASE}" \
            --no-progress \
            --output yaml > changed.yaml
          grep -oE '^[[:space:]]+image: [^/[:space:]]+:[^[:space:]]+$' changed.yaml \
            | awk '{print $2}' | sort -u > bare-images.txt || true

          images=$(jq --compact-output --rawfile bare bare-images.txt \
            '. + ($bare | split("\n") | map(select(length > 0))) | unique' \
            new-images.json)
          echo "images=${images}" >> "$GITHUB_OUTPUT"

          {
            echo '## New images to pull'
            echo '```json'
            echo "${images}" | jq
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  pull:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.images.outputs.images != '[]' }}
    needs: images
    name: Image Pull - Pull Images
    runs-on: gha-runner-scale-set-skrumbach-home-ops
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.images.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
    steps:
      # talosctl comes from the runner's talosctl-busybox init container (Renovate-tracked
      # in the home-ops scale set HelmRelease); no download fallback.
      - name: Check talosctl
        run: talosctl version --client

      # The retry absorbs transient failures talking to a real Talos node.
      - name: Pull Image
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Attempt $attempt/4: talosctl image pull..."
            if talosctl --nodes "$NODE" image pull "${MATRIX_IMAGE}"; then
              echo "::endgroup::"
              echo "✓ Image pulled successfully"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 4 ]; then
              wait_time=$((20 * attempt))
              echo "✗ Attempt $attempt failed. Waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "::error::Failed to pull image after 4 attempts"
          exit 1

  success:
    # `!cancelled()` alone would still run this job for a fork PR whose upstream jobs
    # all skipped (and post a green check), so the fork guard is repeated here.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    # Need filter and images as well as pull: when either fails, the jobs behind it are
    # skipped, and a pull-only Success job would see only "skipped" and green-check a red run.
    needs:
      - filter
      - images
      - pull
    name: Image Pull - Success
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
