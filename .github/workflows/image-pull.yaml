---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Image Pull

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - kubernetes/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  filter:
    # Fork guard. The `pull` job below runs `talosctl image pull` against a real node
    # with credentials mounted by the cluster, so PR-authored code from a fork must
    # never reach this runner. Mirrors labeler.yaml. Same-repo PRs are unaffected.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Image Pull - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-files: ${{ steps.changed-files.outputs.changed_files }}
    steps:
      - name: Get Changed Files
        id: changed-files
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: kubernetes/**/*

  extract:
    if: ${{ needs.filter.outputs.changed-files != '[]' }}
    needs: filter
    name: Image Pull - Extract Images
    # Not migrated: this job runs `docker run ... ghcr.io/allenporter/flux-local`, which needs
    # a Docker daemon. The local ARC runner pod has none - confirmed by a live PR run failing
    # with "failed to connect to the docker API at unix:///var/run/docker.sock". See
    # kubernetes/apps/base/actions-runner-system/TROUBLESHOOTING.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        branch:
          - default
          - pull
      fail-fast: false
    outputs:
      default: ${{ steps.extract.outputs.default }}
      pull: ${{ steps.extract.outputs.pull }}
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ matrix.branch == 'default' && github.event.repository.default_branch || '' }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Gather Images with Retry
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Persist helm's repository-cache across retries. flux-local defaults to a
          # TemporaryDirectory per invocation, so a fresh `docker run` otherwise
          # re-fetches every OCI chart and multiplies exposure to the intermittent
          # connection-reset flake below. HELM_CACHE_DIR is a flux-local ContextVar
          # (not an env var), so we enter via python3 and set it before main().
          CACHE_DIR="${RUNNER_TEMP:-/tmp}/flux-local-helm-cache"
          mkdir -p "$CACHE_DIR"
          # Non-root image user must be able to write chart blobs here.
          chmod 777 "$CACHE_DIR"

          cat > "${RUNNER_TEMP:-/tmp}/flux-local-get-images.py" <<'PY'
          import sys
          import time
          from pathlib import Path

          from flux_local.context import HELM_CACHE_DIR
          from flux_local.tool.flux_local import main

          HELM_CACHE_DIR.set(Path("/helm-cache"))

          argv = [
              "flux-local",
              "get",
              "cluster",
              "--all-namespaces",
              # Live Flux entry point (clusters/main -> apps/main).
              "--path",
              "/github/workspace/kubernetes/clusters/main",
              "--enable-images",
              "--only-images",
              "--output",
              "json",
              "--output-file",
              "/github/workspace/images.json",
          ]

          attempts = 6

          def _fail(attempt: int, code: int = 1) -> None:
              print("::endgroup::", flush=True)
              if attempt >= attempts:
                  print(
                      f"::error::Failed to gather images after {attempts} attempts",
                      flush=True,
                  )
                  raise SystemExit(code)
              # Capped at 60s: uncapped linear growth would burn the step
              # timeout sleeping instead of retrying transient resets.
              wait_time = min(20 * attempt, 60)
              print(
                  f"✗ Attempt {attempt} failed. Waiting {wait_time}s before retry...",
                  flush=True,
              )
              time.sleep(wait_time)

          for attempt in range(1, attempts + 1):
              print(f"::group::Attempt {attempt}/{attempts}: Gathering images...", flush=True)
              sys.argv = list(argv)
              try:
                  main()
              except SystemExit as exc:
                  code = 0 if exc.code is None else int(exc.code)
                  if code == 0:
                      print("::endgroup::", flush=True)
                      print("✓ Images gathered successfully", flush=True)
                      raise SystemExit(0)
                  _fail(attempt, code)
              except Exception as exc:  # noqa: BLE001 - retry transient helm fetch errors
                  print(f"flux-local raised: {exc!r}", flush=True)
                  _fail(attempt, 1)
              else:
                  # main() returns normally on success (only sys.exit on error).
                  print("::endgroup::", flush=True)
                  print("✓ Images gathered successfully", flush=True)
                  raise SystemExit(0)
          PY

          # --network host: the docker bridge/NAT path on this runner intermittently
          # resets outbound TLS connections mid-fetch (seen against unrelated hosts -
          # GitHub Pages, ghcr.io blob storage, GitHub release assets - ruling out the
          # remote end). Host networking skips that NAT layer for this outbound-only,
          # no-published-ports container.
          docker run --rm --network host \
            -v "$GITHUB_WORKSPACE:/github/workspace" \
            -v "$CACHE_DIR:/helm-cache" \
            -v "${RUNNER_TEMP:-/tmp}/flux-local-get-images.py:/flux-local-get-images.py:ro" \
            -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
            -e HELM_TIMEOUT=300 \
            -e HOME=/tmp \
            -e XDG_CACHE_HOME=/tmp/.cache \
            -e GITHUB_ACTIONS=true \
            --entrypoint python3 \
            ghcr.io/allenporter/flux-local:v8.2.0 \
            /flux-local-get-images.py

      - name: Extract Images
        id: extract
        run: |-
          echo "${{ matrix.branch }}=$(jq --compact-output '.' images.json)" >> $GITHUB_OUTPUT

          echo '## Branch ${{ matrix.branch }} images' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          jq '.' images.json >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  diff:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.extract.outputs.default != needs.extract.outputs.pull }}
    needs: extract
    name: Image Pull - Diff Images
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - name: Diff Images
        id: diff
        run: |-
          images=$(jq --compact-output --null-input \
              --argjson f1 '${{ needs.extract.outputs.default }}' \
              --argjson f2 '${{ needs.extract.outputs.pull }}' \
              '$f2 - $f1' \
          )
          echo "images=${images}" >> $GITHUB_OUTPUT

          echo '## New images to Pull' >> $GITHUB_STEP_SUMMARY
          echo '```json' >> $GITHUB_STEP_SUMMARY
          echo $images | jq >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  pull:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.diff.outputs.images != '[]' }}
    needs: diff
    name: Image Pull - Pull Images
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 15
    strategy:
      matrix:
        image: ${{ fromJSON(needs.diff.outputs.images) }}
      max-parallel: 4
      fail-fast: false
    env:
      MATRIX_IMAGE: ${{ matrix.image }}
      TALOSCTL_VERSION: "1.12.0"
    steps:
      - name: Verify talosctl (pre-installed via init container)
        run: |
          if command -v talosctl &> /dev/null; then
            echo "talosctl is pre-installed"
            talosctl version --client
          else
            echo "talosctl not found, installing..."
            curl -fsSL https://talos.dev/install | sh
            talosctl version --client
          fi

      - name: Pull Image
        run: |
          for attempt in 1 2 3 4; do
            echo "::group::Attempt $attempt/4: talosctl image pull..."
            if talosctl --nodes $NODE image pull "${MATRIX_IMAGE}"; then
              echo "::endgroup::"
              echo "✓ Image pulled successfully"
              exit 0
            fi
            echo "::endgroup::"
            if [ $attempt -lt 4 ]; then
              wait_time=$((20 * attempt))
              echo "✗ Attempt $attempt failed. Waiting ${wait_time}s before retry..."
              sleep $wait_time
            fi
          done
          echo "::error::Failed to pull image after 4 attempts"
          exit 1

  success:
    # `!cancelled()` alone would still schedule this job onto the self-hosted runner
    # for a fork PR whose upstream jobs all skipped, so the fork guard is repeated here.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    # Need extract as well as pull: when extract fails, pull is skipped, and a
    # needs:pull-only Success job would see only "skipped" and green-check a red run.
    needs:
      - extract
      - pull
    name: Image Pull - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
