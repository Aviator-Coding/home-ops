---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Publishes the terraform/ tree as an OCI artifact on every push to main that
# touches it, mirroring joryirving/home-ops's terraform-publish.yaml. This is
# read-only with respect to any live stack: it packages source files, it never
# runs `tofu` at all. No cluster or SSO credential is involved - GITHUB_TOKEN's
# packages:write scope is the only credential needed, so ubuntu-latest is fine.
#
# No fork guard: a push trigger to `main` only fires for commits landing on this
# repository's own default branch, which a fork cannot do directly.
name: Terraform Publish

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - terraform/**
      - .github/workflows/terraform-publish.yaml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish Terraform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # flux comes from .mise.toml so this publishes with the same CLI version
      # documented for local use.
      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: aqua:fluxcd/flux2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Tag
        id: tag
        run: |
          # Hardcoded lowercase owner segment, not `github.repository_owner`: ghcr.io
          # rejects uppercase image names and the org name is `Aviator-Coding`.
          # Mirrors build-talosctl-busybox.yaml's IMAGE_NAME convention.
          echo "artifact=ghcr.io/aviator-coding/manifests/terraform:$(git rev-parse --short HEAD)" >> "${GITHUB_OUTPUT}"

      - name: Publish OCI Artifact
        run: |
          flux push artifact "oci://${{ steps.tag.outputs.artifact }}" \
            --path="./terraform" \
            --source="$(git config --get remote.origin.url)" \
            --revision="${{ github.ref_name }}/$(git rev-parse HEAD)"

      - name: Tag OCI Artifact
        run: |
          flux tag artifact "oci://${{ steps.tag.outputs.artifact }}" --tag main
