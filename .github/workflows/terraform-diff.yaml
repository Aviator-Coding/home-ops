---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
#
# Per-stack OpenTofu checks for PRs touching terraform/**, matrixed on changed
# top-level stack directories (today just terraform/authentik/, but designed
# for any future terraform/* stack). Mirrors the shape of
# joryirving/home-ops's terraform-diff.yaml, adapted to this repo's runner and
# credential conventions.
#
# `tofu fmt`/`tofu init`/`tofu validate` always run, no credentials involved.
#
# WHEN A STACK PROVIDES ITS OWN `secrets-ci.vals.yaml` (today just
# terraform/authentik/): a real `tofu init` against the live state backend,
# `tofu plan -lock=false`, and posting the rendered plan as a PR comment
# (borchero/terraform-plan-comment) also run, unattended, on every same-repo
# pull request. This is a deliberate, captain-approved reversal (2026-08-27,
# option A of decision terraform-diff-live-plan-scope, "least amount of manual
# intervention") of the boundary validate.yaml's terraform job and
# docs/authentik/terraform.md previously stated: "a pull request can never
# reach the live SSO instance or the state bucket." Read
# docs/authentik/terraform.md section 8 before touching any of this - it has
# the full reasoning, the one new credential involved, and its exact blast
# radius (a token that reads every item in the `Automation` 1Password vault,
# not just authentik-terraform). `tofu apply` is NOT part of this and remains
# fully behind the explicit captain-approval sequence in that doc's section 7 -
# nothing here mints, reads, or references an apply-capable credential, and
# `.planfile` is a workflow-ephemeral artifact, never uploaded or applied from.
#
# A stack directory with no `secrets-ci.vals.yaml` gets schema-only checks
# (the same `-backend=false` posture as validate.yaml's terraform job) and
# nothing more - this is the fallback for any future terraform/* stack that
# has not opted into a live plan.
#
# Fork guard: every job here lands on the local ARC runner, because the live
# state backend (Ceph RGW) and 1Password Connect are in-cluster with no
# external ingress. Same reasoning and same pattern as
# validate.yaml/image-pull.yaml/labeler.yaml: a fork PR must never execute on
# this runner, so every job below checks
# `github.event.pull_request.head.repo.full_name == github.repository`. This
# repo is public, so fork PRs are the normal case, not an edge case. This guard
# is automatic and unconditional - it is not the "manual intervention" the
# captain's decision asked to minimize; only a human approval gate in front of
# the live-plan steps would have been that, and the captain explicitly chose
# not to add one.
name: Terraform Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - terraform/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # In-cluster 1Password Connect service. Not a secret - it has no external
  # ingress, so only a runner already inside the cluster network (this one)
  # can ever reach it. See docs/authentik/terraform.md section 8.
  OP_CONNECT_HOST: http://onepassword-connect.security.svc.cluster.local:8080

jobs:
  filter:
    # Fork guard - see header.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Terraform Diff - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-dirs: ${{ steps.changed-dirs.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Terraform Stack Directories
        id: changed-dirs
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: terraform/**/*
          include_only_directories: true
          max_depth: 2

  plan:
    # Fork guard - see header.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.changed-dirs != '[]' }}
    needs: filter
    name: Terraform Diff - Plan
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        stack: ${{ fromJSON(needs.filter.outputs.changed-dirs) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check For Live-Plan Opt-In
        id: ci-secrets
        working-directory: ${{ matrix.stack }}
        run: |
          if [ -f secrets-ci.vals.yaml ]; then
            echo "file=secrets-ci.vals.yaml" >> "$GITHUB_OUTPUT"
          else
            echo "file=" >> "$GITHUB_OUTPUT"
          fi

      # Fails loud and early, before installing anything, rather than half-
      # running into a confusing vals/tofu error. See docs/authentik/terraform.md
      # section 8 for exactly what this secret is and how to create it.
      - name: Require CI Credentials
        if: steps.ci-secrets.outputs.file != ''
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          if [ -z "${OP_CONNECT_TOKEN}" ]; then
            echo "::error::${{ matrix.stack }} opts into a live plan (secrets-ci.vals.yaml present) but the OP_CONNECT_TOKEN repository secret is not set. See docs/authentik/terraform.md section 8 for what to create and why."
            exit 1
          fi

      # opentofu and vals come from .mise.toml so this plans with the same
      # versions the runbook tells an operator to use locally.
      - name: Setup Tools
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install_args: opentofu vals

      - name: Tofu Format Check
        working-directory: ${{ matrix.stack }}
        run: tofu fmt -check -diff

      # Without an opt-in file, this stays a pure schema check, same posture as
      # validate.yaml's terraform job: `-backend=false` never contacts a live
      # backend. With one, `vals` resolves that stack's own read-only
      # credentials (state-backend keys and any TF_VAR_* it needs) through
      # 1Password Connect and `tofu init` runs for real.
      - name: Tofu Init
        working-directory: ${{ matrix.stack }}
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          if [ -n "${{ steps.ci-secrets.outputs.file }}" ]; then
            vals exec -i -f "${{ steps.ci-secrets.outputs.file }}" -- tofu init -input=false -no-color
          else
            tofu init -backend=false -input=false -no-color
          fi

      - name: Tofu Validate
        working-directory: ${{ matrix.stack }}
        run: tofu validate -no-color

      - name: Tofu Plan
        if: steps.ci-secrets.outputs.file != ''
        working-directory: ${{ matrix.stack }}
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: vals exec -i -f "${{ steps.ci-secrets.outputs.file }}" -- tofu plan -lock=false -no-color -out=.planfile

      - name: Generate Token
        if: steps.ci-secrets.outputs.file != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post Plan Comment
        if: steps.ci-secrets.outputs.file != ''
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          planfile: .planfile
          terraform-cmd: tofu
          working-directory: ${{ matrix.stack }}
          header: "📝 Terraform Plan for ${{ matrix.stack }}"
          skip-empty: true

  success:
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - filter
      - plan
    name: Terraform Diff - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
