---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
# Schema checks always run. secrets-ci.vals.yaml opts a stack into a read-only live plan; no file, or an unset OP_CONNECT_TOKEN, stays schema-only and warns instead of half-running vals. This workflow does not apply.
# Every job is fork-guarded. The runner has no ServiceAccount, so the state endpoint is in-cluster Service DNS, never s3.sklab.dev. OP_CONNECT_TOKEN reads the whole Automation vault.
# Skill `authentik-terraform` references/ci-plan.md.
name: Terraform Diff

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths:
      - terraform/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # In-cluster Connect. Not a secret. Skill `authentik-terraform` references/ci-plan.md.
  OP_CONNECT_HOST: http://onepassword-connect.security.svc.cluster.local:8080

jobs:
  filter:
    # Fork guard - see header.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    name: Terraform Diff - Filter
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    outputs:
      changed-dirs: ${{ steps.changed-dirs.outputs.changed_files }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Changed Terraform Stack Directories
        id: changed-dirs
        uses: bjw-s-labs/action-changed-files@a9a36fb08ce06db9b02fbd8026cc2c0945eb9841 # v0.6.0
        with:
          patterns: terraform/**/*
          include_only_directories: true
          max_depth: 2

  plan:
    # Fork guard - see header.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && needs.filter.outputs.changed-dirs != '[]' }}
    needs: filter
    name: Terraform Diff - Plan
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    strategy:
      matrix:
        stack: ${{ fromJSON(needs.filter.outputs.changed-dirs) }}
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No secrets-ci file, or an empty OP_CONNECT_TOKEN, stays schema-only. Never half-run vals. Skill `authentik-terraform` references/ci-plan.md.
      - name: Resolve Live-Plan Mode
        id: ci-secrets
        working-directory: ${{ matrix.stack }}
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          if [ ! -f secrets-ci.vals.yaml ]; then
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "mode=schema_only" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "${OP_CONNECT_TOKEN}" ]; then
            echo "::warning::${{ matrix.stack }} opts into a live plan (secrets-ci.vals.yaml present) but the OP_CONNECT_TOKEN repository secret is not set. Skipping live plan and falling back to schema-only checks rather than half-running vals/tofu without credentials. See .agents/skills/authentik-terraform/references/ci-plan.md for what to create and why."
            echo "file=" >> "$GITHUB_OUTPUT"
            echo "mode=schema_only_missing_secret" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "file=secrets-ci.vals.yaml" >> "$GITHUB_OUTPUT"
          echo "mode=live_plan" >> "$GITHUB_OUTPUT"

      # opentofu and vals come from .mise.toml so this plans with the same
      # versions the runbook tells an operator to use locally.
      - name: Setup Tools
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          install_args: opentofu vals

      - name: Tofu Format Check
        working-directory: ${{ matrix.stack }}
        run: tofu fmt -check -diff

      # Without an opt-in file, this stays a pure schema check, same posture as
      # validate.yaml's terraform job: `-backend=false` never contacts a live
      # backend. With one, `vals` resolves that stack's own read-only
      # credentials (state-backend keys and any TF_VAR_* it needs) through
      # 1Password Connect and `tofu init` runs for real.
      - name: Tofu Init
        working-directory: ${{ matrix.stack }}
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: |
          if [ -n "${{ steps.ci-secrets.outputs.file }}" ]; then
            vals exec -i -f "${{ steps.ci-secrets.outputs.file }}" -- tofu init -input=false -no-color
          else
            tofu init -backend=false -input=false -no-color
          fi

      - name: Tofu Validate
        working-directory: ${{ matrix.stack }}
        run: tofu validate -no-color

      - name: Tofu Plan
        if: steps.ci-secrets.outputs.file != ''
        working-directory: ${{ matrix.stack }}
        env:
          OP_CONNECT_TOKEN: ${{ secrets.OP_CONNECT_TOKEN }}
        run: vals exec -i -f "${{ steps.ci-secrets.outputs.file }}" -- tofu plan -lock=false -no-color -out=.planfile

      - name: Generate Token
        if: steps.ci-secrets.outputs.file != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Post Plan Comment
        if: steps.ci-secrets.outputs.file != ''
        uses: borchero/terraform-plan-comment@f585438eda2fa77c6f275994b92aeccd86ef3542 # v3.2.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          planfile: .planfile
          terraform-cmd: tofu
          working-directory: ${{ matrix.stack }}
          header: "📝 Terraform Plan for ${{ matrix.stack }}"
          skip-empty: true

  success:
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    needs:
      - filter
      - plan
    name: Terraform Diff - Success
    runs-on: gha-runner-scale-set-aviator-coding-home-ops
    timeout-minutes: 5
    steps:
      - name: Any jobs failed?
        if: ${{ contains(needs.*.result, 'failure') }}
        run: exit 1

      - name: All jobs passed or skipped?
        if: ${{ !(contains(needs.*.result, 'failure')) }}
        run: echo "All jobs passed or skipped" && echo "${{ toJSON(needs.*.result) }}"
