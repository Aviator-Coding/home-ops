---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Build talosctl-busybox

on:
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Talos version to build (overrides .mise.toml)"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - ".mise.toml"
      - ".github/docker/talosctl-busybox/**"
      - ".github/workflows/build-talosctl-busybox.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: aviator-coding/talosctl-busybox

jobs:
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Generate Token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          # Only used as the checkout token below, which reads repository contents.
          permission-contents: read

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          token: ${{ steps.app-token.outputs.token }}

      - name: Determine Talos Version
        id: version
        env:
          INPUT_TALOS_VERSION: ${{ inputs.talos_version }}
        run: |
          if [ -n "$INPUT_TALOS_VERSION" ]; then
            VERSION="$INPUT_TALOS_VERSION"
          else
            # Talos version is pinned in .mise.toml (tools."aqua:siderolabs/talos"); that value has
            # no "v" prefix, but ghcr.io/siderolabs/talosctl image tags do, so prepend one.
            VERSION="v$(python3 -c "import tomllib; print(tomllib.load(open('.mise.toml', 'rb'))['tools']['aqua:siderolabs/talos'])")"
          fi
          echo "talos_version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using Talos version: ${VERSION}"

      - name: Check if image already exists
        id: check
        env:
          TALOS_VERSION: ${{ steps.version.outputs.talos_version }}
        run: |
          if docker manifest inspect "${REGISTRY}/${IMAGE_NAME}:${TALOS_VERSION}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image ${REGISTRY}/${IMAGE_NAME}:${TALOS_VERSION} already exists"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Image does not exist, will build"
          fi

      - name: Set up QEMU
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        if: steps.check.outputs.exists != 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.check.outputs.exists != 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.check.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.version.outputs.talos_version }}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Build and push
        if: steps.check.outputs.exists != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .github/docker/talosctl-busybox
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TALOS_VERSION=${{ steps.version.outputs.talos_version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          TALOS_VERSION: ${{ steps.version.outputs.talos_version }}
          IMAGE_EXISTS: ${{ steps.check.outputs.exists }}
        run: |
          {
            echo "## Build Summary"
            echo ""
            echo "- **Talos Version:** ${TALOS_VERSION}"
            echo "- **Image:** \`${REGISTRY}/${IMAGE_NAME}:${TALOS_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${IMAGE_EXISTS}" == "true" ]; then
            echo "- **Status:** Skipped (image already exists)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- **Status:** Built and pushed" >> "$GITHUB_STEP_SUMMARY"
          fi
