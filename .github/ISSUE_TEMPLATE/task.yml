---
# yaml-language-server: $schema=https://json.schemastore.org/github-issue-forms.json
# One task for an agent or the owner.
name: Task
description: One change, one branch, one PR, with rollback and verification.
title: "<type>(<scope>): <what changes>"
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: paths
    attributes:
      label: Paths it will touch
      placeholder: kubernetes/apps/base/<ns>/<app>/...
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: How to undo it. Usually "revert the PR"; say what else is needed (state, data, a manual step).
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: Verification
      description: The commands that prove it worked, before merge (local gates) and after (Flux, workload health).
    validations:
      required: true
