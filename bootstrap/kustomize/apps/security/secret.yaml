---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/_definitions.json#/definitions/io.k8s.api.core.v1.Secret
apiVersion: v1
kind: Secret
metadata:
  name: onepassword-secret
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
data:
  1password-credentials.json: ref+op://Home-Lab/1password/OP_CREDENTIALS_JSON
  token: ref+op://Home-Lab/1password/OP_CONNECT_TOKEN
